ersonal finance application (Ruby on Rails). Basis: source at\n | TERM-103 | Entry | A dated ledger item on an account. Its entryable is a Transaction, a Valuation, or a Trade. | app:maybe |\n | TERM-104 | Valuation | An entry that records an account's absolute value on a date rather than a flow of money. | app:maybe |\n | TERM-105 | Holding | An investment account's position in a Security on a date, derived from Trades. | app:maybe |\n-| TERM-106 | Balance | A daily balance record for an account, computed by the forward or reverse balance calculator. | app:maybe |\n+| TERM-106 | Balance | A daily balance record for an account, computed by the forward or reverse balance calculator. It stores its components (start cash and non-cash balances, cash and non-cash inflows and outflows, net market flows, cash and non-cash adjustments, and flows factor). The start balance, end cash balance, end non-cash balance and end balance are stored generated columns derived from those components. The older `balance` and `cash_balance` columns remain and are still what most readers use. | app:maybe |\n | TERM-107 | Sync | A tracked synchronization operation on a syncable record such as a family, an account, or a Plaid item. Syncs can have a parent sync. | app:maybe |\n | TERM-108 | App mode | `Rails.application.config.app_mode`, either `managed` (the maybe team runs the servers) or `self_hosted` (users run the app themselves, usually with Docker Compose). | app:maybe |\n+| TERM-109 | Flows factor | The sign applied to a balance's inflows and outflows, stored as `balances.flows_factor` (integer, default 1). It is 1 for assets and -1 for liabilities, because inflows raise an asset balance but lower a liability balance, as a loan payment does. | app:maybe |\n+\n+## Evidence\n+\n+- TERM-106: maybe@275ba73 db/migrate/20261029130000_add_components_to_balances.rb; conversation 2b5f87f9-06c9-42a1-b94b-55394a11975a/ef434f19-6abe-4134-89dc-0553954168da\n+- TERM-109: maybe@275ba73 db/migrate/20261029130000_add_components_to_balances.rb; conversation 2b5f87f9-06c9-42a1-b94b-55394a11975a/ef434f19-6abe-4134-89dc-0553954168da\ndiff --git a/log.md b/log.md\nindex 4272ecc..a0bd9eb 100644\n--- a/log.md\n+++ b/log.md\n@@ -1,5 +1,10 @@\n # Knowledge Change History\n \n+## 2026-10-29\n+\n+- Updated TERM-106 (Balance) in core/terminology.md to describe stored components and generated end columns, and added TERM-109 (Flows factor).\n+- Updated STACK-105 in core/tech-stack-standards.md with mode-dependent rate limits and the no-op limiter on self-hosted, and STACK-103 with the approved `NoopApiRateLimiter` exception.\n+\n ## 2026-10-20\n \n - Added `init.md` as the run configuration and `runtime/`, a Python orchestrator on the Claude Agent SDK with a background pre-push hook. Experiment B runs as the `fresh-specialists` mode. The runtime has not yet been run.\n", "has_run": true}, "persona_turns": 4, "flags": []}]}, {"repo": "actual", "mode": "rewind", "baseline": [{"path": "index.md", "text": "# Knowledge Index\n\nShared team knowledge: terminology, stack standards, naming conventions, pitfalls, and product notes.\n\n## Core\n\n- [Terminology](core/terminology.md)\n- [Tech stack standards](core/tech-stack-standards.md)\n- [Naming conventions](core/naming-conventions.md)\n- [Pitfalls](core/pitfalls.md)\n\n## Products\n\n- [Firebase](products/firebase/README.md)\n- [Dataform](products/dataform/README.md)\n- [Recharts Knowledge](products/recharts/README.md)\n- [Bank Sync Knowledge](products/bank-sync/README.md)\n"}, {"path": "core/naming-conventions.md", "text": "# Naming Conventions\n\nScope: this knowledge repository. Status: initial foundation conventions, awaiting team review. These rules do not prescribe naming in an external application.\n\n| ID | Convention |\n| --- | --- |\n| NAME-001 | Use lowercase folder and document names with hyphens between words. Preserve conventional entry point names such as README.md, AGENTS.md, LICENSE, and SKILL.md. |\n| NAME-002 | Place product-specific knowledge under its lowercase product folder within products. |\n| NAME-003 | Give Markdown documents a descriptive first-level title and use relative links for documents in the bundle. |\n| NAME-004 | Preserve an existing knowledge ID when revising the same fact. New terminology uses the TERM prefix, naming rules the NAME prefix, stack standards the STACK prefix, and pitfalls the PIT prefix, each followed by a three-digit number. |\n| NAME-005 | Use no em dashes in authored project documents or GitHub tracking text. |\n\nApplication or company naming conventions need their own scope and supporting evidence before admission. Do not infer universal naming rules from a few identifiers or import the example repository's conventions without a decision.\n\nUse [core maintenance guidance](../maintenance/core.md) for changes and [the conventions maintainer](../agents/conventions-maintainer.md) for the specialist assignment.\n\n## Application: actual\n\nScope: naming inside the Actual Budget repository. Basis: source at commit `d9d15c12`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Convention | Scope |\n| --- | --- | --- |\n| NAME-101 | Refer to workspaces by their package aliases: `@actual-app/web` (desktop-client), `@actual-app/core` (loot-core), `@actual-app/components` (component-library), `@actual-app/sync-server`, `@actual-app/api`, and `@actual-app/crdt`. | app:actual |\n| NAME-102 | Name boolean variables with an auxiliary verb, such as `isLoaded` or `hasError`. | app:actual |\n| NAME-103 | React components are exported named functions in PascalCase files, for example `export function DonutGraph` in `DonutGraph.tsx`. | app:actual |\n"}, {"path": "core/pitfalls.md", "text": "# Pitfalls\n\nScope: non-obvious failures met while developing source applications, and how to avoid them. Status: initial entry point; no pitfalls have been admitted yet.\n\nEach entry names the situation in which it applies, what goes wrong, and what to do instead. Admit an entry only when both the failure and the fix are supported by evidence. Product-only pitfalls belong in the matching product folder.\n\n| ID | Trigger | What goes wrong | Do instead | Scope |\n| --- | --- | --- | --- | --- |\n\nUse [core maintenance guidance](../maintenance/core.md) for changes and [the pitfalls maintainer](../agents/pitfalls-maintainer.md) for the specialist assignment.\n\n## Application: actual\n\nScope: non-obvious failures in the Actual Budget repository. Basis: source at commit `d9d15c12`. Status: no pitfalls admitted yet.\n\n| ID | Trigger | What goes wrong | Do instead | Scope |\n| --- | --- | --- | --- | --- |\n"}, {"path": "core/tech-stack-standards.md", "text": "# Tech Stack Standards\n\nScope: approved technology choices and constraints that apply across source applications. Status: no mandatory application stack has been established in this bundle.\n\nFirebase and Dataform are knowledge categories, not mandatory dependencies for every application. An observed dependency or implementation choice does not by itself establish a shared standard.\n\n## Recording a standard\n\nFor each accepted standard, record a stable ID, its scope, the required or preferred behavior, the reason, and the developer decision or other evidence supporting it. Distinguish a preference from a requirement and identify approved exceptions explicitly.\n\nImplementation findings without an approved shared decision can be proposed as scoped product knowledge or deferred for review. Do not promote them into company-wide policy automatically.\n\nUse [core maintenance guidance](../maintenance/core.md) and the [stack maintainer definition](../agents/stack-maintainer.md). Product-specific patterns belong in the [Firebase](../products/firebase/README.md) or [Dataform](../products/dataform/README.md) area when relevant.\n\n## Application: actual\n\nScope: technology choices in the Actual Budget repository. Basis: source and package manifests at commit `d9d15c12`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Standard | Level | Scope |\n| --- | --- | --- | --- |\n| STACK-101 | TypeScript monorepo on Yarn 4 workspaces with lage as the task runner. Run yarn commands from the repository root and target a workspace with `yarn workspace <name> run <command>`. | requirement | app:actual |\n| STACK-102 | The UI (`@actual-app/web`) is React built with Vite and the React Compiler; `desktop-electron` wraps it for desktop. | requirement | app:actual |\n| STACK-103 | Unit tests use Vitest. End-to-end and visual regression tests use Playwright. | requirement | app:actual |\n| STACK-104 | The sync server runs on Express 5 and Node 22 or newer (`\"node\": \">=22\"` in its package manifest). It is mostly JavaScript and moving to TypeScript. | requirement | app:actual |\n| STACK-105 | Report graphs are built with Recharts. The \"Download Snapshot\" action on reports captures the report with html-to-image's `toPng`. | requirement | app:actual |\n| STACK-106 | User-facing text goes through i18n with the `Trans` component; regenerate translation files with `yarn generate:i18n`. | requirement | app:actual |\n"}, {"path": "core/terminology.md", "text": "# Terminology\n\nScope: vocabulary shared across this knowledge bundle. Basis: the team's project design discussion on 19 October 2026. These definitions describe the project design, not findings from a pilot application. Initial human review is pending.\n\n| ID | Term | Meaning |\n| --- | --- | --- |\n| TERM-001 | Context Ops | Maintaining useful shared knowledge as an application's implementation and development decisions evolve |\n| TERM-002 | Shared knowledge | Persistent terminology, standards, conventions, and product guidance that developers and agents can reuse |\n| TERM-003 | Source application | An external application repository inspected as evidence for knowledge maintenance |\n| TERM-004 | Product | A technology-specific knowledge area, such as Firebase or Dataform, under the products folder |\n| TERM-005 | Maintenance run | A documentation-only inspection of the source repository, its diff, and the developer-agent conversation that produces knowledge change proposals |\n| TERM-006 | Sweeper | The agent in experiment A that inspects all three evidence sources before handing its context to specialists |\n| TERM-007 | Specialist | An agent assigned a specific part of core or product knowledge to maintain |\n| TERM-008 | Knowledge baseline | The recorded starting revision of this knowledge bundle, shared by both experiments before their states diverge |\n| TERM-009 | Initializer | The deterministic first step of a maintenance run that reads init.md and decides which specialists start |\n| TERM-010 | Evidence pack | The frozen copy of a push's diff, developer-agent conversation, and memory that every agent in a run reads |\n| TERM-011 | Cartographer | The agent that proposes new core documents or product folders from findings no existing document owns |\n| TERM-012 | Writer | The only agent that edits knowledge files; it applies accepted change records on a branch for review |\n| TERM-013 | Unowned finding | A supported finding that no specialist's assigned document can hold; input for the cartographer |\n| TERM-014 | Pitfall | A non-obvious failure with its trigger and the way to avoid it |\n\nUse [core maintenance guidance](../maintenance/core.md) when changing definitions, adding synonyms, or introducing supported domain terms. Product-specific meanings belong in the appropriate product section unless they apply more broadly.\n\n## Application: actual\n\nScope: the Actual Budget application (TypeScript monorepo). Basis: source at commit `d9d15c12`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Term | Meaning | Scope |\n| --- | --- | --- | --- |\n| TERM-101 | loot-core | The platform-agnostic core package (`@actual-app/core`) holding business logic, database operations, and calculations for browser, desktop, and API builds. | app:actual |\n| TERM-102 | Amount | A currency amount stored as an integer without decimal places. Usually it is the value times 100, but the multiplier depends on the currency's decimal places. | app:actual |\n| TERM-103 | Sync server | The Express server (`@actual-app/sync-server`) that synchronizes budgets across devices and hosts bank sync providers. | app:actual |\n| TERM-104 | CRDT | The conflict-free replicated data type package (`@actual-app/crdt`) that serializes and merges sync messages between devices. | app:actual |\n| TERM-105 | Budget type | The budgeting mode stored in the `budgetType` preference: `envelope` (the default, money is assigned to categories) or `tracking` (spending is tracked against planned amounts). | app:actual |\n| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, or Yearly. Monthly is the default. | app:actual |\n"}, {"path": "products/bank-sync/README.md", "text": "---\ntype: Product\ntitle: Bank Sync Knowledge\nfileMatchPattern:\n  - \"packages/sync-server/src/app-simplefin/**\"\n  - \"packages/sync-server/src/app-gocardless/**\"\n  - \"packages/sync-server/src/app-enablebanking/**\"\n  - \"packages/sync-server/src/app-akahu/**\"\n  - \"packages/sync-server/src/app-pluggyai/**\"\nkeywords: [bank sync, simplefin, gocardless, enable banking, enablebanking, akahu, pluggy]\n---\n\n# Bank Sync Knowledge\n\nScope: bank sync providers hosted by the Actual Budget sync server. Basis: source at commit `d9d15c12`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Fact | Scope |\n| --- | --- | --- |\n| BANKSYNC-001 | Each provider is its own module under `packages/sync-server/src/app-<provider>/`: SimpleFIN, GoCardless, Enable Banking, Akahu, and Pluggy.ai. | app:actual |\n| BANKSYNC-002 | Provider API calls are made by these sync server modules; the client reaches a provider only through the sync server's routes. Provider secrets are stored by the sync server (`app-secrets.js`). | app:actual |\n\nUse [product maintenance guidance](../../maintenance/products.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/dataform/README.md", "text": "---\ntype: Product\ntitle: Dataform Knowledge\nfileMatchPattern:\n  - \"**/*.sqlx\"\n  - \"**/workflow_settings.yaml\"\n  - \"**/dataform.json\"\n  - \"**/includes/*.js\"\nkeywords: [dataform, sqlx]\n---\n\n# Dataform Knowledge\n\nScope: Dataform-specific guidance learned from supported source application evidence and accepted developer decisions. Status: initial entry point; no application-specific facts have been imported.\n\n## What belongs here\n\n- Scoped Dataform usage conventions and architecture decisions.\n- Reusable implementation patterns supported by inspected source code.\n- Product-specific terminology, limitations encountered, and approved exceptions.\n\nFor each admitted finding, retain a stable ID, its scope, and revision-specific source or conversation evidence. Add focused documents when supported content needs them, and link them from this entry point. Do not copy the example repository's standards as if they were already approved for this bundle.\n\nUse [product maintenance guidance](../../maintenance/products.md). The [product maintainer definition](../../agents/product-maintainer.md) is instantiated with the Dataform path for this assignment. Shared definitions and policies belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/firebase/README.md", "text": "---\ntype: Product\ntitle: Firebase Knowledge\nfileMatchPattern:\n  - \"**/firebase.json\"\n  - \"**/.firebaserc\"\n  - \"**/firestore.rules\"\n  - \"**/firestore.indexes.json\"\n  - \"**/storage.rules\"\n  - \"**/database.rules.json\"\n  - \"**/google-services.json\"\n  - \"**/GoogleService-Info.plist\"\n  - \"**/functions/**\"\nkeywords: [firebase, firestore, crashlytics, remote config, cloud messaging, fcm]\n---\n\n# Firebase Knowledge\n\nScope: Firebase-specific guidance learned from supported source application evidence and accepted developer decisions. Status: initial entry point; no application-specific facts have been imported.\n\n## What belongs here\n\n- Scoped Firebase usage conventions and architecture decisions.\n- Reusable implementation patterns supported by inspected source code.\n- Product-specific terminology, limitations encountered, and approved exceptions.\n\nFor each admitted finding, retain a stable ID, its scope, and revision-specific source or conversation evidence. Add focused documents when supported content needs them, and link them from this entry point. Do not infer a required application stack from this folder's existence.\n\nUse [product maintenance guidance](../../maintenance/products.md). The [product maintainer definition](../../agents/product-maintainer.md) is instantiated with the Firebase path for this assignment. Shared definitions and policies belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/recharts/README.md", "text": "---\ntype: Product\ntitle: Recharts Knowledge\nfileMatchPattern:\n  - \"packages/desktop-client/src/components/reports/**\"\nkeywords: [recharts, report, reports, graph, chart, donut, custom report]\n---\n\n# Recharts Knowledge\n\nScope: report graphs in the Actual Budget web client. Basis: source at commit `d9d15c12`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Fact | Scope |\n| --- | --- | --- |\n| RECHARTS-001 | Report graphs are React components in `packages/desktop-client/src/components/reports/graphs/`, built on Recharts 3 (for example `DonutGraph`, `BarGraph`, `LineGraph`). | app:actual |\n| RECHARTS-002 | Custom report settings such as the interval and its defaults are defined in `components/reports/ReportOptions.ts`. | app:actual |\n\nUse [product maintenance guidance](../../maintenance/products.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.\n"}], "pushes": [{"push": "P1", "task": "Yen and other zero-decimal currencies show up 100 times off in places, because some code scales stored amounts by the currency's own decimal places. Make every currency use the same stored scale and only use the currency's decimals for display.\n", "real_commits": ["fd08b56e"], "ground_truth": {"expected_result": "UPDATE", "expected": [{"id": "E1", "target": "core/terminology.md", "op": "UPDATE", "fact_id": "TERM-102", "gist": "Amount: stored integer with two implied decimals for every currency (value times 100; 1,500 yen is 150000); the currency's decimals only affect display; STORED_DECIMAL_PLACES names the scale", "owner": "terminology", "from": "M1", "required": true}, {"id": "E2", "target": "core/pitfalls.md", "op": "ADD", "fact_id": "new", "gist": "Using a currency's decimal places as the storage scale shows or saves zero-decimal currencies (yen, won, rial) at the wrong scale", "owner": "pitfalls", "from": "M2", "required": true}, {"id": "E3", "target": "core/naming-conventions.md", "op": "ADD", "fact_id": "new", "gist": "Each change adds a release note in upcoming-release-notes/ with a descriptive slug name (may also land as a STACK or PIT row)", "owner": "conventions", "from": "M3", "required": false}], "acceptable": ["ADD NAME for the [AI] commit and PR title prefix, if the conversation or commits support it"], "forbidden": [{"id": "F1", "gist": "The stored multiplier or scale depends on the currency's decimal places (the old TERM-102 wording kept or re-added)", "from": "D1 and stale baseline"}]}, "moments": [{"id": "M1", "kind": null, "fact": "Amounts are always stored as the value times 100, whatever the currency: 1,500 yen is stored as 150000. A currency's decimal places only decide how many digits are shown."}, {"id": "M2", "kind": null, "fact": "The bug class to watch for: any code that uses the currency's decimal places as the storage scale shows or saves zero-decimal currencies like yen, won, or rial at the wrong scale."}, {"id": "M3", "kind": null, "fact": "Every change adds a release note file in upcoming-release-notes/ with a short descriptive slug name and category and authors frontmatter."}], "decoys": [{"id": "D1", "fact": "Briefly float storing yen with zero implied decimals and special-casing display, then reject it yourself: one stored scale for every currency."}], "deviations": [], "delivered": ["D1", "M1", "M2", "M3"], "base": "b990737d0da4dad37c0fcbcaabfc94e66bdd6acc", "head": "58ce6320d13938cfb99333f36b63aac979dfd654", "commits": 1, "generated": true, "conversation": {"persona_turns": 5, "session_chars": 13827, "check_passed": true, "check_warnings": []}, "transcript": [{"role": "developer", "session": "953a8ecd", "text": "got a bug from a yen user: a 1,500 yen budget shows as 15 on some screens and 150,000 on others. looks like we scale stored amounts differently per currency. can you make the storage scale consistent across all currencies and only use the currency's decimals for display? start with loot-core shared/util and useFormat, then the amount inputs"}, {"role": "agent", "session": "953a8ecd", "text": "I've read the shared knowledge and the two core files. I'm now listing every place that passes a per-currency decimal count into the stored-amount conversions, so I can change them together."}, {"role": "agent", "session": "953a8ecd", "text": "Shell glob issue (zsh); using the Grep tool instead."}, {"role": "agent", "session": "953a8ecd", "text": "Now `useFormat`."}, {"role": "agent", "session": "953a8ecd", "text": "The type checker now lists the callers. I'll start with the amount inputs in the goal editors."}, {"role": "agent", "session": "953a8ecd", "text": "The remaining call sites follow a mechanical pattern, so I'll strip the scale argument with a script. After that I'll fix `budget/util.ts` by hand and run prettier."}, {"role": "agent", "session": "953a8ecd", "text": "The old test encoded the per-currency scale (yen stored 1:1). I'll update it to the new fixed scale."}, {"role": "agent", "session": "953a8ecd", "text": "The client typechecks. Now the loot-core server callers and the formula function."}, {"role": "agent", "session": "953a8ecd", "text": "Both typechecks pass. Vitest won't start because the active Node is too old for rolldown (`styleText`). I'll check for a newer Node."}, {"role": "agent", "session": "953a8ecd", "text": "The baseline passes, so these 8 failures are tests that encode the old yen scale. I'll update them to the fixed scale."}, {"role": "agent", "session": "953a8ecd", "text": "Stored amounts now always use two implied decimals for every currency, and the currency's decimals only affect display. A 1,500 yen budget is stored as 150000 on every screen.\n\nBoth packages typecheck, and the loot-core and desktop-client vitest suites pass except 2 `parse-file.test.ts` charset tests. Those 2 fail the same way on the untouched code. I ran vitest under Node 22 because the default Node 18 can't start it. I didn't run the app or the e2e tests.\n\n**What changed**\n- **`loot-core/shared/util.ts`:** I added a `STORAGE_DECIMAL_PLACES = 2` constant. `amountToInteger`, `integerToAmount` and `integerToCurrency` no longer take a `decimalPlaces` argument, so the type checker flagged every caller. `integerToCurrencyWithDecimal` still uses the currency's decimals for the formatter only. I removed `amountToCurrencyInteger`, which existed only to scale by currency.\n- **`useFormat`:** `forEdit` and `fromEdit` now convert at the fixed scale. `formatDisplay` still uses the currency's decimals, or 0 when `hideFraction` is on.\n- **Amount inputs:** All the goal editors (`goals/editor/*`) drop the per-currency scale. So do `FormulaResult` and `useFormulaExecution`.\n- **Other callers I had to touch to compile:** `budget/util.ts` (`getGoalDifference`, `makeBalanceAmountStyle`), `BalanceWithCarryover`, `Balance delivered": ["M1", "M2", "M3"], "base": "11093b503f8cad0e09391c22928e4f771d6abc3b", "head": "c4f5a4b094299af99f273469cb73ad72de169985", "commits": 2, "generated": true, "conversation": {"persona_turns": 7, "session_chars": 9500, "check_passed": true, "check_warnings": []}, "transcript": [{"role": "developer", "session": "a05212c1", "text": "custom reports can group by day, week, month or year. add a Quarterly interval too. add tests and a release note, and try yarn typecheck once."}, {"role": "agent", "session": "a05212c1", "text": "I'm mapping every place the interval is handled (options, queries, range helpers, spreadsheets, drilldown) before editing. Next I'm reading the date helpers and the spreadsheet code."}, {"role": "agent", "session": "a05212c1", "text": "Now the query, range validators, spreadsheets, and the remaining call sites."}, {"role": "agent", "session": "a05212c1", "text": "The repo formats with `oxfmt`, so I'll run that on just my 15 files to undo the Prettier noise."}, {"role": "agent", "session": "a05212c1", "text": "The shell is on Node 18 and the repo needs 22 or newer, which also explains the vitest failure. I'll switch to the installed Node 24."}, {"role": "agent", "session": "a05212c1", "text": "`v24.22.1` is the `.nvmrc` pin, not an installed version. Node 22.20.0 is installed and meets the requirement, so I'll use that."}, {"role": "agent", "session": "a05212c1", "text": "The diff is back to just my changes. Now the tests."}, {"role": "agent", "session": "a05212c1", "text": "The `test` script already passes `--run`, so I'll drop mine."}, {"role": "agent", "session": "a05212c1", "text": "The three failures are all in my new `reportRanges` tests. In test mode \"now\" is 2017-01, and `boundedRange` clamps to it, so my 2026 dates get clamped. I'll move them into 2016."}, {"role": "agent", "session": "a05212c1", "text": "That one was my arithmetic. 365 days after 2015-04-01 is 2016-03-31, and the code is right, so I'm fixing the expectation. Then I'll run the single typecheck."}, {"role": "agent", "session": "a05212c1", "text": "The single typecheck found two errors, both mine. `endDate` is optional in `showActivity`, so it needs a guard. The `sed` edit also failed on macOS, so I'll redo that edit in Python."}, {"role": "agent", "session": "a05212c1", "text": "My new test copied a call shape from elsewhere that doesn't match this file's helpers. I'll rewrite it to match the neighbouring tests."}, {"role": "agent", "session": "a05212c1", "text": "Custom reports now have a Quarterly interval, but the typecheck is not clean. I ran it once as you asked and it flagged two errors, both in my `showActivity.ts` change (`endDate` is optional there). I fixed them with a guard but did not rerun the typecheck. The 470 tests under `reports/` pass, including the new ones.\n\n**What a Quarterly report does**\n- **Buckets:** a quarter is keyed by its first month (e.g. `2026-04`) and labelled \"Q2 '26\". Transactions are queried by month and grouped into quarters in the spreadsheets, the same way Weekly groups days into weeks. Budgeted reports are bucketed into quarters too.\n- **Date ranges:** only quarter-friendly ranges are offered: Current/Previous quarter, Last 6/12 months, Year to date, Last year, Prior year to date and All time.\n- **Range handling:** start and end dates snap to quarter boundaries. The default range for a new Quarterly report is \"Last 12 months\".\n- **Drilldown:** clicking a quarter opens transactions for the whole quarter. The existing exact-match filter would only have matched its first month.\n\nThe code changes are in `months.ts` and the reports components under `desktop-client/src/components/reports/`.\n\n**Tests added**\n- **`months.test.ts`:** the new quarter helpers.\n- **`ReportOptions.test.ts`:** the option, its label format and its date ranges.\n- **`makeQuery.test.ts`:** the Quarterly query.\n- **`reportRanges.test.ts`:** range validation.\n- **`showActivity.test.ts`:** quarter drilldown.\n\nI added the release note in `upcoming-release-notes/quarterly-report-interval.md` (category Enhancements, author `context-ops-demo`, copied from your earlier note).\n\nI haven't tried it in the running app. Net Worth and the other non-custom reports keep their own interval lists, so they don't get Quarterly.\n\nI also ran the wrong formatter (Prettier) across `reports/` by mistake. I reverted every file I hadn't meant to touch and reformatted mine with the repo's `oxfmt`, so the diff is down to my 16 files."}, {"role": "developer", "session": "a05212c1", "text": "quarter key as first month and the Q3 '26 label is what we want, good. those two casts you widened in showActivity and CustomReport still use `as`, use satisfies there instead. then rerun yarn typecheck once."}, {"role": "agent", "session": "a05212c1", "text": "`satisfies Record<…, string>` widened the values to `string`. Constraining them to the literal union keeps the literal types, so the lookup can index `monthUtils` without any cast."}, {"role": "agent", "session": "a05212c1", "text": "`yarn typecheck` now passes in all six workspaces. I ran it twice: the first run, with `satisfies Record<…, string>`, failed with three `TS7053` errors because it widened the values to `string`.\n\nThe two `as` casts in `showActivity.ts` and `CustomReport.tsx` are gone. `satisfies` can't narrow a `string` built from `.toLowerCase() + 'FromDate'` to the literal union, so I replaced that string-building with one lookup table:\n- **New table:** `intervalFromDate` in `ReportOptions.ts` maps each interval name to its `monthUtils` helper. It uses `satisfies Record<…, 'dayFromDate' | 'monthFromDate' | 'quarterFromDate' | 'yearFromDate'>`, so the literals survive and no cast is needed.\n- **Call sites:** both call sites now read `intervalFromDate[ReportOptions.intervalMap.get(interval) || 'Day']`. The `Weekly` special-case went away because `Week` maps to `dayFromDate` in the table.\n\nI didn't rerun the tests after this refactor."}, {"role": "developer", "session": "a05212c1", "text": "you didn't rerun tests after the satisfies refactor, so run the reports tests again. there's also no test for the spreadsheet roll-up in custom-spreadsheet or grouped-spreadsheet. add one that checks months roll into quarters."}, {"role": "agent", "session": "a05212c1", "text": "The reports tests pass after the `satisfies` refactor: 35 files, 472 tests. That includes the two new roll-up tests.\n\n**New tests**\n- **`custom-spreadsheet.test.ts`:** a Quarterly case that feeds in monthly rows for 2026-01, 02, 03, 04 and 06 and checks they land in two quarters. The quarters start at `2026-01` and `2026-04`, with debts of -60 (-10, -20, -30) and -90 (-40, -50). The report total is -150.\n- **`grouped-spreadsheet.test.ts`:** a new file with the same scenario for the grouped spreadsheet. It checks the group's quarter totals and its nested category's totals.\n\nI didn't deliberately break the roll-up to confirm the tests would fail. They assert quarter-level totals that only come out right if months are bucketed into quarters.\n\nI also reran `yarn typecheck` so the new test files are covered. It reports no failures, but the run only covered 3 of the 10 tasks (7 skipped). So the new test files and the final workspace state were not fully typechecked. The earlier full run, before these tests, passed all six workspaces."}, {"role": "developer", "session": "a05212c1", "text": "looks good, commit it"}, {"role": "agent", "session": "a05212c1", "text": "I committed the Quarterly interval work on the `sim` branch as `[AI] Add a Quarterly interval to custom reports`. It covers 19 files: the feature, the tests and the release note. I haven't pushed it."}, {"role": "developer", "session": "b4eb247d", "text": "trying the quarterly report from yesterday and if i pick a To date in the same quarter as From the range flips around. fix it, and add a test for it. try the relevant yarn test once, ok if it won't run"}, {"role": "agent", "session": "b4eb247d", "text": "Checking `boundedRange`, where the From/To comparison seems to happen."}, {"role": "agent", "session": "b4eb247d", "text": "The flip is fixed in `reportRanges.ts`, and I added a regression test. The test run failed to start, so neither the fix nor the test has been run.\n\n**Cause:** `validateStart` returns the start as a full date (`2016-04-01`), but the To picker hands `validateEnd` the bare quarter key (`2016-04`). As strings, `'2016-04-01' > '2016-04'`, so a To in the same quarter as From looked like it was before the start and the range got flipped.\n\n**Fix:** `validateEnd` now checks the start against the snapped quarter end (`2016-06-30`) when the interval is Quarterly. I left the other intervals alone.\n\n**Test:** `reportRanges.test.ts` has a new case. With start `2016-04-01` and a To of `2016-04`, it expects `['2016-04-01', '2016-06-30', 'static']`.\n\n**Test run:** `yarn vitest run src/components/reports/reportRanges.test.ts` crashed at startup. Vitest's bundler (rolldown) needs `styleText` from `node:util`, and the Node version here doesn't provide it, so you'd need a newer Node to run it.\n\nMonthly and Yearly may have the same flip in `validateEnd`. Monthly looks affected, since its start is also stored as `YYYY-MM-01` while the picked end is `YYYY-MM`. I didn't change or test that."}, {"role": "developer", "session": "b4eb247d", "text": "good, that's the cause. compare the real dates, not the period key, and do it for every interval, not just quarterly. monthly and yearly have the same flip. add tests for those too."}, {"role": "agent", "session": "b4eb247d", "text": "Prettier reformatted the whole test file with the wrong config, so I'm reverting that and re-applying my additions by hand."}, {"role": "agent", "session": "b4eb247d", "text": "`validateEnd` now compares the start against the snapped end date (`dateEnd`) for every interval, and the tests pass. With Node 22 on the PATH, `yarn vitest run src/components/reports/reportRanges.test.ts` ran 27 tests, all green. The earlier startup crash was just Node 18 being the default here.\n\n- **Fix** (`reportRanges.ts`): the check is now `start > dateEnd` instead of comparing against the raw picked key. Monthly and yearly had the same flip, and this covers them. Daily, weekly and the default case are unchanged, because `dateEnd` equals the raw end there.\n- **Tests** (`reportRanges.test.ts`): I added same-period cases for Quarterly, Monthly and Yearly. For example, a monthly start of `2016-04-01` with a To of `2016-04` now gives `['2016-04-01', '2016-04-30', 'static']`.\n\nI did not confirm the new tests fail without the fix. I left `validateStart` alone. Its `end < start` check compares day-form dates against keys the other way round, and switching it to `dateStart` would break the case where the end is still a bare key."}, {"role": "developer", "session": "b4eb247d", "text": "looks good, commit it"}, {"role": "agent", "session": "b4eb247d", "text": "The repo adds a release note with each change, so I'll include one."}, {"role": "agent", "session": "b4eb247d", "text": "I committed the fix as `c4f5a4b0` on `sim`, and the working tree is clean.\n\nThe commit contains the `reportRanges.ts` change and the new tests. I also added a release note, `upcoming-release-notes/report-same-period-range-flip.md`, in the Bugfixes category. The quarterly commit added one for its change too."}], "diffstat": {"files": 20, "added": 447, "deleted": 27, "top": [["packages/desktop-client/src/components/reports/spreadsheets/grouped-spreadsheet.test.ts", 74, 0], ["packages/desktop-client/src/components/reports/reportRanges.test.ts", 70, 0], ["packages/desktop-client/src/components/reports/ReportOptions.ts", 41, 3], ["packages/desktop-client/src/components/reports/spreadsheets/custom-spreadsheet.test.ts", 44, 0], ["packages/desktop-client/src/components/reports/graphs/showActivity.test.ts", 30, 0], ["packages/desktop-client/src/components/reports/ReportOptions.test.ts", 26, 2], ["packages/desktop-client/src/components/reports/spreadsheets/makeQuery.test.ts", 21, 2], ["packages/desktop-client/src/components/reports/graphs/showActivity.ts", 15, 7]], "commits": [{"sha": "74779b95", "subject": "[AI] Add a Quarterly interval to custom reports"}, {"sha": "c4f5a4b0", "subject": "[AI] Fix report range flipping when To is in the same period as From"}]}, "acceptance": ["Quarterly appears with Daily, Weekly, Monthly and Yearly in the custom report interval options", "A quarter is keyed by its first month (Q3 2026 is '2026-07') and labelled like Q3 '26", "Transactions and budget data are queried by month and rolled up into quarters, the way Weekly rolls up days", "Picking a To date in the same month, quarter, or year as From no longer flips the range", "When one end of a Quarterly range passes the other, the fallback range spans four whole quarters", "Tests cover the month helpers, the spreadsheet roll-up, makeQuery, and the range logic; a release note is added"], "a": {"wall_seconds": 126.2, "exit_code": 0, "total_cost_usd": 1.7483080000000002, "agent_duration_ms": 158638, "agents": [{"label": "sweeper", "status": "success", "turns": 15, "cost_usd": 0.28686779999999995, "duration_ms": 49809, "tokens": {"inputTokens": 1629, "outputTokens": 6720, "cacheReadInputTokens": 108447, "cacheCreationInputTokens": 52223}}, {"label": "conventions-maintainer", "status": "success", "turns": 2, "cost_usd": 0.24252590000000002, "duration_ms": 5598, "tokens": {"inputTokens": 2, "outputTokens": 568, "cacheReadInputTokens": 10859, "cacheCreationInputTokens": 58939}}, {"label": "terminology-maintainer", "status": "success", "turns": 3, "cost_usd": 0.26406140000000006, "duration_ms": 9420, "tokens": {"inputTokens": 4, "outputTokens": 1020, "cacheReadInputTokens": 80654, "cacheCreationInputTokens": 61447}}, {"label": "stack-maintainer", "status": "success", "turns": 3, "cost_usd": 0.27181779999999994, "duration_ms": 15961, "tokens": {"inputTokens": 4, "outputTokens": 1716, "cacheReadInputTokens": 80658, "cacheCreationInputTokens": 61646}}, {"label": "pitfalls-maintainer", "status": "success", "turns": 2, "cost_usd": 0.24280949999999996, "duration_ms": 17337, "tokens": {"inputTokens": 2, "outputTokens": 2053, "cacheReadInputTokens": 14595, "cacheCreationInputTokens": 55204}}, {"label": "product-maintainer:recharts", "status": "success", "turns": 3, "cost_usd": 0.28613780000000005, "duration_ms": 27937, "tokens": {"inputTokens": 4, "outputTokens": 3749, "cacheReadInputTokens": 84398, "cacheCreationInputTokens": 60050}}, {"label": "writer", "status": "success", "turns": 14, "cost_usd": 0.1540878, "duration_ms": 32576, "tokens": {"inputTokens": 1350, "outputTokens": 5488, "cacheReadInputTokens": 124398, "cacheCreationInputTokens": 21701}}], "tokens": {"inputTokens": 2995, "outputTokens": 21314, "cacheReadInputTokens": 504009, "cacheCreationInputTokens": 371210}, "records": [{"bucket": "accepted", "agent": "terminology-maintainer", "target": "core/terminology.md", "op": "UPDATE", "fact_id": "TERM-106", "scope": "app:actual", "text": "| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, Quarterly, or Yearly. Monthly is the default. A Quarterly bucket is keyed by the first month of its quarter (for example `2026-04`) and labelled with the format `QQQ ''yy`. | app:actual |", "reason": "The push adds Quarterly to the interval set, so the existing definition listing four intervals is stale. The developer confirmed the first-month key and label. Source still shows Monthly as the default interval, so that part is unchanged.", "problem": null}, {"bucket": "accepted", "agent": "stack-maintainer", "target": "core/tech-stack-standards.md", "op": "ADD", "fact_id": "STACK-107", "scope": "app:actual", "text": "| STACK-107 | Formatting and linting use oxfmt and oxlint (`yarn lint`, `yarn lint:fix`), not Prettier. The repository requires Node 22.18 or newer (root `engines`); an older default Node, such as 18, makes Vitest crash at startup. | requirement | app:actual |", "reason": "Established by package.json at head (the same basis as existing STACK entries), and the agent hit both problems twice (Prettier reformatting whole files, Node 18 crashing Vitest). No developer statement declares it a standard, so it rests on the manifest and the agent-observed failures; the existing STACK-104 covers Node 22 only for the sync server. A reviewer may drop it if the manifest facts are judged too routine.", "problem": null}, {"bucket": "accepted", "agent": "pitfalls-maintainer", "target": "core/pitfalls.md", "op": "ADD", "fact_id": "PIT-101", "scope": "app:actual", "text": "| PIT-101 | Custom report range validation (`validateStart` and `validateEnd` in `components/reports/reportRanges.ts`) compares a full-date start (for example `2016-04-01`) with a To value picked as a bare period key (`2016-04`, or `2016` for Yearly). | As strings, `'2016-04-01' > '2016-04'`, so a To picked in the same month, quarter, or year as From looks earlier than the start and the range flips. | Compare against the real snapped date (`dateEnd`, for example `2016-06-30` for a Quarterly To of `2016-04`), never the period key. `validateEnd` now uses `start > dateEnd` for every interval. `validateStart` still compares `end < start` the other way and was deliberately left unchanged, because switching it to the snapped start would break a bare-key end. | app:actual |", "reason": "Failure and fix are both supported: the developer confirmed the cause ('good, that's the cause') and widened the fix to all intervals, and the code adopts it. The agent did not confirm the new tests fail without the fix, but the string comparison cause is evident from the code.", "problem": null}, {"bucket": "accepted", "agent": "pitfalls-maintainer", "target": "core/pitfalls.md", "op": "ADD", "fact_id": "PIT-102", "scope": "app:actual", "text": "| PIT-102 | Writing tests for `components/reports/reportRanges.ts` (`boundedRange`, `validateStart`, `validateEnd`) with dates near the real current date. | In test mode `monthUtils.currentMonth()` returns `2017-01` and `boundedRange` clamps ranges to it, so tests with 2026 dates fail with clamped results. | Use dates in 2016 or earlier in these tests. | app:actual |", "reason": "Observed when three new tests failed and then passed after moving to 2016; the committed test file documents it in a comment. Not a developer statement, but the code adopted the fix and the existing test file header already states the 2017-01 behavior.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:recharts", "target": "products/recharts/README.md", "op": "UPDATE", "fact_id": "RECHARTS-002", "scope": "app:actual", "text": "| RECHARTS-002 | Custom report settings such as the interval and its defaults are defined in `components/reports/ReportOptions.ts`. The intervals are Daily, Weekly, Monthly, Quarterly, and Yearly. Each interval has a key, an internal name (`Quarterly` maps to `Quarter`), a label format (Quarterly uses `QQQ ''yy`) and a range helper. The default range for a new Quarterly report is `Last 12 months` (`disabledList.ts`). | app:actual |", "reason": "Source at head defines the Quarterly interval and its default range. Extends the existing fact rather than adding a duplicate.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:recharts", "target": "products/recharts/README.md", "op": "ADD", "fact_id": "RECHARTS-003", "scope": "app:actual", "text": "| RECHARTS-003 | A quarter in custom reports is keyed by its first month (for example `2026-04`) and shown as a label like \"Q2 '26\". The developer confirmed this key and label. Transactions are queried by month and rolled up into quarters in the custom and grouped spreadsheets (budgeted reports are bucketed by quarter separately), the same way Weekly groups day rows. Helpers `quarterFromDate` and `quarterRangeInclusive` live in `loot-core/src/shared/months.ts`. | app:actual |", "reason": "Accepted design decision plus implemented behavior. Roll-up skipped for totalBudgeted, which goes through budgetDataQuery.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:recharts", "target": "products/recharts/README.md", "op": "ADD", "fact_id": "RECHARTS-004", "scope": "app:actual", "text": "| RECHARTS-004 | Quarterly reports only offer quarter-aligned date ranges (each entry in `dateRangeOptions` carries a `Quarterly` flag; for example `Current quarter` and `Last 12 months` are offered, `This month` is not). `validateStart` and `validateEnd` in `reportRanges.ts` snap the start to the first day of its quarter and the end to the last day of its quarter. Drilldown from a quarter (`showActivity`) filters by a date range (start to month end of the end date) instead of an exact match on the interval key, which would only match the first month. | app:actual |", "reason": "Implemented in the pushed diff and covered by tests.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:recharts", "target": "products/recharts/README.md", "op": "ADD", "fact_id": "RECHARTS-005", "scope": "app:actual", "text": "| RECHARTS-005 | `intervalFromDate` in `ReportOptions.ts` maps an interval name (`Day`, `Week`, `Month`, `Quarter`, `Year`) to the `monthUtils` helper that turns a date into that interval's key. Use it instead of building the helper name by string concatenation and casting; it is declared with `satisfies Record<..., 'dayFromDate' | 'monthFromDate' | 'quarterFromDate' | 'yearFromDate'>` so the literal types survive. `Week` maps to `dayFromDate` because the first-day-of-week preference is applied separately. | app:actual |", "reason": "Code adopted the table after the developer asked for `satisfies` instead of `as` casts. Described as how the table is used, not as a company standard.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:recharts", "target": "products/recharts/README.md", "op": "ADD", "fact_id": "RECHARTS-006", "scope": "app:actual", "text": "| RECHARTS-006 | `validateEnd` in `reportRanges.ts` decides whether to move the start by comparing the start date with the snapped end date (`dateEnd`), not with the picked period key. The start is a full date (`2016-04-01`) while the picked end is a bare key (`2016-04`), and `'2016-04-01' > '2016-04'` as strings, so comparing against the key flipped the range whenever To was in the same period as From. The fix applies to every interval (Quarterly, Monthly, Yearly). `validateStart` still compares its end against the raw key and was deliberately left unchanged. | app:actual |", "reason": "Developer accepted the cause and widened the fix to all intervals; the head source matches. The validateStart note is the agent's reasoning, so it is phrased as an observation about current code.", "problem": null}, {"bucket": "no_change", "agent": "conventions-maintainer", "target": "core/naming-conventions.md", "op": "NO_CHANGE", "fact_id": null, "scope": "app:actual", "text": "", "reason": "Inspected naming-conventions.md (NAME-001..005, NAME-101..103), the full diff and both conversations. New identifiers (Quarterly, Quarter, quarterFromDate, quarterRangeInclusive, intervalFromDate) follow existing camelCase/PascalCase patterns and no developer stated a naming rule. The only developer style instruction, 'use satisfies there instead' of `as`, is a typing practice, one-time review feedback, and does not belong in naming conventions. Release-note file naming (kebab-case slug in upcoming-release-notes) is agent-copied from existing notes, not a developer-stated rule.", "problem": null}, {"bucket": "no_change", "agent": "product-maintainer:recharts", "target": "products/recharts/README.md", "op": "NO_CHANGE", "fact_id": null, "scope": "app:actual", "text": "Do not add: Net Worth and other non-custom reports exclude Quarterly (agent claim, unverified); Node 22 and oxfmt tooling notes (belong to YYYY-MM-01`) and whose To is a picked period key (`YYYY-MM`) | Comparing the start with the raw picked key makes the range flip when To is in the same period as From (for example start `2016-04-01`, To `2016-04`). No error is raised. Monthly and Yearly intervals have the same flip, not only Quarterly. | In `validateEnd`, snap the picked end to a real end date (`dateEnd`) and compare `start > dateEnd`. Add tests for every interval. | app:actual |\n+| PIT-002 | Formatting changed files in the Actual repo | Running Prettier, which is not the repo formatter, reformats whole files and floods the diff with unrelated changes. This happened in both sessions, once across the whole `reports/` directory. | Format only the files you changed with `yarn oxfmt <files>`. If Prettier already ran, revert files you did not mean to touch with `git checkout`, then re-apply your edits. | app:actual |\n+| PIT-003 | Running `yarn vitest`, `yarn oxfmt` or other tooling in the Actual repo from a shell whose default Node is 18 | Vitest crashes at startup because its bundler (rolldown) needs `styleText` from `node:util`, which Node 18 lacks. | Put Node 22 or newer on PATH first. Check `node -v` and `.nvmrc`. The `.nvmrc` pin may not be installed locally, so use any installed Node 22 or newer. | app:actual |\n+\n+## Evidence\n+\n+- PIT-001: actual@c4f5a4b packages/desktop-client/src/components/reports/reportRanges.ts; conversation b4eb247d-9140-434b-b3ea-d97698e0c42e/0be7675f-34c8-4124-92ea-f5103c17e9c8\n+- PIT-002: conversation a05212c1-3c5a-447b-9507-417c306badb9/d0f216d1-be42-4cd3-b190-a1496fbcd4ce; conversation b4eb247d-9140-434b-b3ea-d97698e0c42e/2c425e75-f4cc-4833-be1e-3bc0dfba50f9\n+- PIT-003: conversation a05212c1-3c5a-447b-9507-417c306badb9/f6a62eab-9d49-485b-9128-e0cce09b7067; conversation b4eb247d-9140-434b-b3ea-d97698e0c42e/b07c3f0f-9a1c-45c6-9c0c-450477745b6f\ndiff --git a/core/terminology.md b/core/terminology.md\nindex 8249161..58a39d6 100644\n--- a/core/terminology.md\n+++ b/core/terminology.md\n@@ -32,4 +32,8 @@ Scope: the Actual Budget application (TypeScript monorepo). Basis: source at com\n | TERM-103 | Sync server | The Express server (`@actual-app/sync-server`) that synchronizes budgets across devices and hosts bank sync providers. | app:actual |\n | TERM-104 | CRDT | The conflict-free replicated data type package (`@actual-app/crdt`) that serializes and merges sync messages between devices. | app:actual |\n | TERM-105 | Budget type | The budgeting mode stored in the `budgetType` preference: `envelope` (the default, money is assigned to categories) or `tracking` (spending is tracked against planned amounts). | app:actual |\n-| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, or Yearly. Monthly is the default. | app:actual |\n+| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, Quarterly, or Yearly. Monthly is the default. A Quarterly bucket is keyed by its first month (for example `2026-04`) and labelled like \"Q2 '26\"; transactions are queried by month and rolled up into quarters, the way Weekly rolls days into weeks. | app:actual |\n+\n+## Evidence\n+\n+- TERM-106: actual@c4f5a4b packages/loot-core/src/shared/months.ts; conversation a05212c1-3c5a-447b-9507-417c306badb9/dece3b4f-3a2d-4ec6-98ab-695178b5e520\ndiff --git a/core/terminology.md.tmp b/core/terminology.md.tmp\nnew file mode 100644\nindex 0000000..587be6b\n--- /dev/null\n+++ b/core/terminology.md.tmp\n@@ -0,0 +1 @@\n+x\ndiff --git a/log.md b/log.md\nindex 4272ecc..da85101 100644\n--- a/log.md\n+++ b/log.md\n@@ -1,5 +1,10 @@\n # Knowledge Change History\n \n+## 2026-10-29\n+\n+- Updated TERM-106 in [Terminology](core/terminology.md) to include the Quarterly custom report interval and its first-month key and label format.\n+- Added PIT-001 (report range validation flip), PIT-002 (use oxfmt, not Prettier), and PIT-003 (Node 22+ needed for vitest) to the Actual section of [Pitfalls](core/pitfalls.md).\n+\n ## 2026-10-20\n \n - Added `init.md` as the run configuration and `runtime/`, a Python orchestrator on the Claude Agent SDK with a background pre-push hook. Experiment B runs as the `fresh-specialists` mode. The runtime has not yet been run.\n", "has_run": true}, "persona_turns": 7, "flags": []}]}, {"repo": "linkwarden", "mode": "build-on-top", "baseline": [{"path": "index.md", "text": "# Knowledge Index\n\nShared team knowledge: terminology, stack standards, naming conventions, pitfalls, and product notes.\n\n## Core\n\n- [Terminology](core/terminology.md)\n- [Tech stack standards](core/tech-stack-standards.md)\n- [Naming conventions](core/naming-conventions.md)\n- [Pitfalls](core/pitfalls.md)\n\n## Products\n\n- [Firebase](products/firebase/README.md)\n- [Dataform](products/dataform/README.md)\n- [Prisma Knowledge](products/prisma/README.md)\n- [Preservation Knowledge](products/preservation/README.md)\n"}, {"path": "core/naming-conventions.md", "text": "# Naming Conventions\n\nScope: this knowledge repository. Status: initial foundation conventions, awaiting team review. These rules do not prescribe naming in an external application.\n\n| ID | Convention |\n| --- | --- |\n| NAME-001 | Use lowercase folder and document names with hyphens between words. Preserve conventional entry point names such as README.md, AGENTS.md, LICENSE, and SKILL.md. |\n| NAME-002 | Place product-specific knowledge under its lowercase product folder within products. |\n| NAME-003 | Give Markdown documents a descriptive first-level title and use relative links for documents in the bundle. |\n| NAME-004 | Preserve an existing knowledge ID when revising the same fact. New terminology uses the TERM prefix, naming rules the NAME prefix, stack standards the STACK prefix, and pitfalls the PIT prefix, each followed by a three-digit number. |\n| NAME-005 | Use no em dashes in authored project documents or GitHub tracking text. |\n\nApplication or company naming conventions need their own scope and supporting evidence before admission. Do not infer universal naming rules from a few identifiers or import the example repository's conventions without a decision.\n\nUse [core maintenance guidance](../maintenance/core.md) for changes and [the conventions maintainer](../agents/conventions-maintainer.md) for the specialist assignment.\n\n## Application: linkwarden\n\nScope: naming inside the Linkwarden repository. Basis: source at commit `eff7c6b7`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Convention | Scope |\n| --- | --- | --- |\n| NAME-101 | Workspaces are named `@linkwarden/<name>`: apps `web`, `worker`, `mobile`, `extension`; packages `prisma`, `types`, `lib`, `filesystem`, `router`. | app:linkwarden |\n| NAME-102 | Data hooks in `packages/router` are named `use<Resource>`, for example `useLinks`, `useCollections`, `useTags`. | app:linkwarden |\n"}, {"path": "core/pitfalls.md", "text": "# Pitfalls\n\nScope: non-obvious failures met while developing source applications, and how to avoid them. Status: initial entry point; no pitfalls have been admitted yet.\n\nEach entry names the situation in which it applies, what goes wrong, and what to do instead. Admit an entry only when both the failure and the fix are supported by evidence. Product-only pitfalls belong in the matching product folder.\n\n| ID | Trigger | What goes wrong | Do instead | Scope |\n| --- | --- | --- | --- | --- |\n\nUse [core maintenance guidance](../maintenance/core.md) for changes and [the pitfalls maintainer](../agents/pitfalls-maintainer.md) for the specialist assignment.\n\n## Application: linkwarden\n\nScope: non-obvious failures in the Linkwarden repository. Basis: source at commit `eff7c6b7`. Status: no pitfalls admitted yet.\n\n| ID | Trigger | What goes wrong | Do instead | Scope |\n| --- | --- | --- | --- | --- |\n"}, {"path": "core/tech-stack-standards.md", "text": "# Tech Stack Standards\n\nScope: approved technology choices and constraints that apply across source applications. Status: no mandatory application stack has been established in this bundle.\n\nFirebase and Dataform are knowledge categories, not mandatory dependencies for every application. An observed dependency or implementation choice does not by itself establish a shared standard.\n\n## Recording a standard\n\nFor each accepted standard, record a stable ID, its scope, the required or preferred behavior, the reason, and the developer decision or other evidence supporting it. Distinguish a preference from a requirement and identify approved exceptions explicitly.\n\nImplementation findings without an approved shared decision can be proposed as scoped product knowledge or deferred for review. Do not promote them into company-wide policy automatically.\n\nUse [core maintenance guidance](../maintenance/core.md) and the [stack maintainer definition](../agents/stack-maintainer.md). Product-specific patterns belong in the [Firebase](../products/firebase/README.md) or [Dataform](../products/dataform/README.md) area when relevant.\n\n## Application: linkwarden\n\nScope: technology choices in the Linkwarden repository. Basis: source and `AGENTS.md` at commit `eff7c6b7`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Standard | Level | Scope |\n| --- | --- | --- | --- |\n| STACK-101 | TypeScript monorepo on Yarn 4 workspaces (`apps/*`, `packages/*`) with plain root scripts and no Turborepo. Run scripts from the root so the root `.env` is loaded. | requirement | app:linkwarden |\n| STACK-102 | The web app is Next.js with the Pages Router; it serves both the UI and the REST API under `apps/web/pages/api/v1/`. | requirement | app:linkwarden |\n| STACK-103 | PostgreSQL through Prisma, Meilisearch for full-text search, and storage on local disk or S3-compatible object storage through `@linkwarden/filesystem`. | requirement | app:linkwarden |\n| STACK-104 | Web UI uses Tailwind with DaisyUI and some Radix primitives; mobile uses Expo with NativeWind. | requirement | app:linkwarden |\n| STACK-105 | Unit tests use Vitest and sit next to the code as `*.test.ts`; web end-to-end tests use Playwright in `apps/web/e2e`. | requirement | app:linkwarden |\n"}, {"path": "core/terminology.md", "text": "# Terminology\n\nScope: vocabulary shared across this knowledge bundle. Basis: the team's project design discussion on 19 October 2026. These definitions describe the project design, not findings from a pilot application. Initial human review is pending.\n\n| ID | Term | Meaning |\n| --- | --- | --- |\n| TERM-001 | Context Ops | Maintaining useful shared knowledge as an application's implementation and development decisions evolve |\n| TERM-002 | Shared knowledge | Persistent terminology, standards, conventions, and product guidance that developers and agents can reuse |\n| TERM-003 | Source application | An external application repository inspected as evidence for knowledge maintenance |\n| TERM-004 | Product | A technology-specific knowledge area, such as Firebase or Dataform, under the products folder |\n| TERM-005 | Maintenance run | A documentation-only inspection of the source repository, its diff, and the developer-agent conversation that produces knowledge change proposals |\n| TERM-006 | Sweeper | The agent in experiment A that inspects all three evidence sources before handing its context to specialists |\n| TERM-007 | Specialist | An agent assigned a specific part of core or product knowledge to maintain |\n| TERM-008 | Knowledge baseline | The recorded starting revision of this knowledge bundle, shared by both experiments before their states diverge |\n| TERM-009 | Initializer | The deterministic first step of a maintenance run that reads init.md and decides which specialists start |\n| TERM-010 | Evidence pack | The frozen copy of a push's diff, developer-agent conversation, and memory that every agent in a run reads |\n| TERM-011 | Cartographer | The agent that proposes new core documents or product folders from findings no existing document owns |\n| TERM-012 | Writer | The only agent that edits knowledge files; it applies accepted change records on a branch for review |\n| TERM-013 | Unowned finding | A supported finding that no specialist's assigned document can hold; input for the cartographer |\n| TERM-014 | Pitfall | A non-obvious failure with its trigger and the way to avoid it |\n\nUse [core maintenance guidance](../maintenance/core.md) when changing definitions, adding synonyms, or introducing supported domain terms. Product-specific meanings belong in the appropriate product section unless they apply more broadly.\n\n## Application: linkwarden\n\nScope: the Linkwarden bookmark manager (TypeScript monorepo). Basis: source at commit `eff7c6b7`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Term | Meaning | Scope |\n| --- | --- | --- | --- |\n| TERM-101 | Link | A saved webpage URL with its metadata, tags, and preserved artifacts. | app:linkwarden |\n| TERM-102 | Collection | A folder of links that can be shared with other users; access to a link follows membership of its collection, not only ownership. | app:linkwarden |\n| TERM-103 | Preservation | The worker's capture of a link into artifacts: screenshot, PDF, readability text, preview image, and single-file HTML. | app:linkwarden |\n| TERM-104 | Worker | The long-running Node process (`@linkwarden/worker`) that runs preservation, AI tagging, search indexing, RSS polling, and data migrations in loops. | app:linkwarden |\n"}, {"path": "products/dataform/README.md", "text": "---\ntype: Product\ntitle: Dataform Knowledge\nfileMatchPattern:\n  - \"**/*.sqlx\"\n  - \"**/workflow_settings.yaml\"\n  - \"**/dataform.json\"\n  - \"**/includes/*.js\"\nkeywords: [dataform, sqlx]\n---\n\n# Dataform Knowledge\n\nScope: Dataform-specific guidance learned from supported source application evidence and accepted developer decisions. Status: initial entry point; no application-specific facts have been imported.\n\n## What belongs here\n\n- Scoped Dataform usage conventions and architecture decisions.\n- Reusable implementation patterns supported by inspected source code.\n- Product-specific terminology, limitations encountered, and approved exceptions.\n\nFor each admitted finding, retain a stable ID, its scope, and revision-specific source or conversation evidence. Add focused documents when supported content needs them, and link them from this entry point. Do not copy the example repository's standards as if they were already approved for this bundle.\n\nUse [product maintenance guidance](../../maintenance/products.md). The [product maintainer definition](../../agents/product-maintainer.md) is instantiated with the Dataform path for this assignment. Shared definitions and policies belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/firebase/README.md", "text": "---\ntype: Product\ntitle: Firebase Knowledge\nfileMatchPattern:\n  - \"**/firebase.json\"\n  - \"**/.firebaserc\"\n  - \"**/firestore.rules\"\n  - \"**/firestore.indexes.json\"\n  - \"**/storage.rules\"\n  - \"**/database.rules.json\"\n  - \"**/google-services.json\"\n  - \"**/GoogleService-Info.plist\"\n  - \"**/functions/**\"\nkeywords: [firebase, firestore, crashlytics, remote config, cloud messaging, fcm]\n---\n\n# Firebase Knowledge\n\nScope: Firebase-specific guidance learned from supported source application evidence and accepted developer decisions. Status: initial entry point; no application-specific facts have been imported.\n\n## What belongs here\n\n- Scoped Firebase usage conventions and architecture decisions.\n- Reusable implementation patterns supported by inspected source code.\n- Product-specific terminology, limitations encountered, and approved exceptions.\n\nFor each admitted finding, retain a stable ID, its scope, and revision-specific source or conversation evidence. Add focused documents when supported content needs them, and link them from this entry point. Do not infer a required application stack from this folder's existence.\n\nUse [product maintenance guidance](../../maintenance/products.md). The [product maintainer definition](../../agents/product-maintainer.md) is instantiated with the Firebase path for this assignment. Shared definitions and policies belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/preservation/README.md", "text": "---\ntype: Product\ntitle: Preservation Knowledge\nfileMatchPattern:\n  - \"apps/worker/**\"\nkeywords: [preservation, archive, screenshot, pdf, monolith, readability, chromium, playwright, wayback]\n---\n\n# Preservation Knowledge\n\nScope: how the Linkwarden worker preserves links with headless Chromium. Basis: source and `AGENTS.md` at commit `eff7c6b7`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Fact | Scope |\n| --- | --- | --- |\n| PRESERVATION-001 | The web app only records that a link needs preserving; `apps/worker` claims batches of unpreserved links and drives headless Chromium through `lib/preservationScheme/*`. | app:linkwarden |\n| PRESERVATION-002 | Single-file HTML is produced by the Rust `monolith` binary; links can optionally be pushed to the Wayback Machine. | app:linkwarden |\n| PRESERVATION-003 | Preservation artifacts are written through `@linkwarden/filesystem`, so callers do not care whether they land on disk or in S3. | app:linkwarden |\n\nUse [product maintenance guidance](../../maintenance/products.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/prisma/README.md", "text": "---\ntype: Product\ntitle: Prisma Knowledge\nfileMatchPattern:\n  - \"packages/prisma/**\"\nkeywords: [prisma, schema.prisma, migration, database schema]\n---\n\n# Prisma Knowledge\n\nScope: the Linkwarden data model and its Prisma package. Basis: source at commit `eff7c6b7`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Fact | Scope |\n| --- | --- | --- |\n| PRISMA-001 | `packages/prisma` (`@linkwarden/prisma`) holds `schema.prisma`, the migrations, the generated client, and the seed. It is the single source of truth for the data model. | app:linkwarden |\n| PRISMA-002 | Create a migration with `yarn prisma:dev` and apply migrations with `yarn prisma:deploy`, both from the repository root. | app:linkwarden |\n\nUse [product maintenance guidance](../../maintenance/products.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.\n"}], "pushes": [{"push": "P1", "task": "People want to know whether a saved link is still alive. Add an API endpoint that checks a link's URL and reports the result. API only for now; the UI comes later.\n", "real_commits": null, "ground_truth": {"expected_result": "UPDATE", "expected": [{"id": "E1", "target": "core/pitfalls.md", "op": "ADD", "fact_id": "new", "gist": "Outbound fetches of user-supplied URLs must go through safeFetch and the SSRF helpers in packages/lib (security boundary); may land as a STACK row", "owner": "pitfalls", "from": "M1", "required": true}, {"id": "E2", "target": "core/naming-conventions.md", "op": "ADD", "fact_id": "new", "gist": "API routes in pages/api/v1 stay thin (verifyUser/getTokenFromRequest) and call controllers in apps/web/lib/api/controllers/<resource>/ returning { status, response }; may land as a STACK row", "owner": "conventions", "from": "M2", "required": true}], "acceptable": ["ADD PIT or UPDATE TERM-102 noting that permission checks go through getPermission for collection members"], "forbidden": [{"id": "F1", "gist": "Link check results are stored on the Link model or in the database", "from": "D1"}]}, "moments": [{"id": "M1", "kind": null, "fact": "Any outbound fetch of a user-supplied URL goes through safeFetch and the SSRF helpers in packages/lib. It is a security boundary, never call fetch, node-fetch, or axios on a user URL directly."}, {"id": "M2", "kind": null, "fact": "API routes in apps/web/pages/api/v1/ stay thin: authenticate with verifyUser or getTokenFromRequest and call a controller in apps/web/lib/api/controllers/<resource>/ that returns { status, response }."}, {"id": "M3", "kind": null, "fact": "Link access follows collection membership, not just ownership; reuse the permission helpers (getPermission) like the other link controllers."}], "decoys": [{"id": "D1", "fact": "If the agent proposes saving the check result on the Link model with a new column, say no schema change for this, just return the result."}], "deviations": [], "delivered": ["D1", "M1", "M2", "M3"], "base": "0654fb94cefc89a684c6b88217ef89f4835d4135", "head": "fe92b24b7079f47aa3174338c27764aa565945aa", "commits": 1, "generated": true, "conversation": {"persona_turns": 5, "session_chars": 7182, "check_passed": true, "check_warnings": ["session 7dc7f38c-2ab5-4704-b460-36e3fbfc1a8d has tool-only records under foreign cwd ['/workspace/contextops-eval/kb/linkwarden/dev/products/preservation']"]}, "transcript": [{"role": "developer", "session": "7dc7f38c", "text": "hey, i want an endpoint to check if a saved link is still alive. POST /api/v1/links/[id]/check, it requests the link's url and returns { status, ok, checkedAt }. api only, no ui yet. add unit tests for it too"}, {"role": "agent", "session": "7dc7f38c", "text": "There's an existing `safeFetch` helper, so I'll reuse it for SSRF protection. Checking how it behaves."}, {"role": "agent", "session": "7dc7f38c", "text": "I added `POST /api/v1/links/[id]/check` with unit tests, but I haven't run the tests. `node_modules` isn't installed, and `yarn vitest` fails until `yarn install` has been run. Prettier also didn't run for the same reason.\n\nThe endpoint is in `apps/web/pages/api/v1/links/[id]/check/index.ts` and the tests are in `index.test.ts` next to it.\n\n- **Request:** it follows the existing link routes: `verifyUser`, then a 404 if the link doesn't exist, then a 401 if the user has no access to the collection. Any collection member can check a link, not only members who can edit. Non-POST methods get a 405.\n- **Fetching:** it requests the URL with the repo's `safeFetch`, the same helper `fetchTitleAndHeaders` uses. That gives it private-network blocking, redirect handling and proxy support. It uses GET rather than HEAD because many servers reject HEAD. It has a 10 second timeout and discards the body.\n- **Response:** `{ response: { status, ok, checkedAt } }`. I wrapped the result in `response` to match the other endpoints. If you want the bare object, it's a one-line change.\n- **Values:** `ok` is true for statuses 200–399. If the request fails (DNS error, timeout, blocked address), you still get 200 with `status: null` and `ok: false`, since the check itself worked.\n- **Missing or non-HTTP(S) URL:** these get a 400.\n- **Tests:** they cover the 405, unauthenticated, 404 and 401 cases, member access, the 400 cases, 200 and 404 results, and the network-failure case, with `safeFetch`, Prisma and the auth helpers mocked.\n\nPlease run `yarn install && yarn vitest run apps/web/pages/api/v1/links` from the repo root and tell me if anything fails."}, {"role": "developer", "session": "7dc7f38c", "text": "move the logic into a controller under lib/api/controllers/links/linkId, route should just do auth and call it. also do HEAD first and only fall back to GET if HEAD isn't allowed (405/501). and try `yarn test` once, if the workspace isn't installed that's fine, skip it."}, {"role": "agent", "session": "7dc7f38c", "text": "My `cd` climbed too far, so both commands ran from the wrong directory. I'll rerun from the repo root."}, {"role": "agent", "session": "7dc7f38c", "text": "The logic now lives in a controller, and the route does auth only. The workspace isn't installed, so `yarn test` failed with \"Couldn't find the node_modules state file\" and I skipped it as you said. Nothing has been run, including the new tests. Prettier also didn't run, because my first attempt hit the wrong directory.\n\n- **Controller:** `apps/web/lib/api/controllers/links/linkId/checkLinkById.ts` takes `(userId, linkId)` and returns `{ response, status }`, like `getLinkById`. It does the link lookup, the collection access check, the URL check and the fetch.\n- **HEAD then GET:** it sends HEAD first and retries with GET only if HEAD returns 405 or 501. Any other HEAD result, such as a 404, is reported as is. If GET also fails, the GET status is what's reported.\n- **Route:** `pages/api/v1/links/[id]/check/index.ts` checks for POST, runs `verifyUser`, calls `checkLinkById` and relays its status and body.\n- **Tests:**\n  - `checkLinkById.test.ts` covers access, the 404 and 400 cases, the HEAD-only path, the fallback on both 405 and 501, no fallback for other errors, and network failure.\n  - The route's `index.test.ts` is now a thin test that mocks the controller.\n\nRun `yarn install && yarn test` when you can and tell me if anything fails."}, {"role": "developer", "session": "7dc7f38c", "text": "thinking we could save the result on the Link model, new lastCheckedAt column or something. actually no, no schema change for this, just return the result. can you paste the controller so i can look at the access check?"}, {"role": "agent", "session": "7dc7f38c", "text": "Understood, no schema change. The endpoint only returns the result and nothing is written to the `Link` model. This is the controller, `apps/web/lib/api/controllers/links/linkId/checkLinkById.ts`. The access check is lines 49-62:\n\n```ts\nconst link = await prisma.link.findUnique({ where: { id: linkId } });\n\nif (!link) return { response: \"Link not found.\", status: 404 };\n\nconst collection = await getPermission({\n  userId,\n  collectionId: link.collectionId,\n});\n\nconst hasAccess =\n  collection?.ownerId === userId ||\n  collection?.members.some((e: UsersAndCollections) => e.userId === userId);\n\nif (!hasAccess) return { response: \"Permission denied.\", status: 401 };\n```\n\n- **Access rule:** the collection owner or any member can run a check. It doesn't require `canUpdate`, because the check only reads the link, so view-only members are allowed. `getLinkById` uses the same rule. The archive route requires `canUpdate` because it modifies the link. If you'd rather restrict checks to editors, add `&& e.canUpdate` to the member clause.\n- **Missing vs. forbidden:** a missing link returns 404 and an inaccessible one returns 401. This is the same as the archive route, so it reveals whether a link ID exists to users who can't see it. `getLinkById` avoids that by returning 401 for both cases.\n- **What `getPermission` receives:** it gets the link's `collectionId`, so it checks membership of that collection only. It doesn't walk up to parent collections. I haven't checked whether `getPermission` itself handles nested collections, so look at that if sub-collection access matters.\n- **Order of checks:** access is checked before the URL validity check and before any fetch. A user with no access never triggers a server-side request."}, {"role": "developer", "session": "7dc7f38c", "text": "access check looks fine. one thing, both the HEAD and the GET fallback have to go through safeFetch, it's a user supplied url so no raw fetch or axios anywhere in there. confirm that's the case."}, {"role": "agent", "session": "7dc7f38c", "text": "Confirmed. In `checkLinkById.ts` the only network call is `safeFetch` at line 16, inside the `request()` helper. HEAD and the GET fallback both go through `request()` (lines 73 and 76). There's no raw `fetch`, `axios` or `http`/`https` use anywhere in the file, and nothing else in it makes a request.\n\nThe tests cover this as well. `safeFetch` is the only thing mocked for the network, and the fallback test asserts it was called with `[\"HEAD\", \"GET\"]`.\n\n`safeFetch` itself has two behaviours to know about. I read it earlier and haven't tested either:\n- **Redirects:** it follows them manually and re-validates every hop with `assertUrlIsSafeForServerSideFetch`, so a redirect to an internal address is blocked too.\n- **Proxy:** when `PROXY` is set it uses a proxy agent and skips the safe DNS lookup. The per-URL validation still runs before each request, but the connect-time DNS check doesn't apply in that case. It's an existing property of the helper and the same for every other caller."}, {"role": "developer", "session": "7dc7f38c", "text": "access check looks good, it uses getPermission so collection members can check too, keep it that way. looks good, commit it."}, {"role": "agent", "session": "7dc7f38c", "text": "I committed it on `sim` as `fe92b24b`, and the working tree is clean. It contains the controller, the route, and both test files. Collection members can still run a check. I haven't pushed anything.\n\nThe tests have still never been run, because the workspace isn't installed. Run `yarn install && yarn test` before you merge."}], "diffstat": {"files": 4, "added": 286, "deleted": 0, "top": [["apps/web/lib/api/controllers/links/linkId/checkLinkById.test.ts", 111, 0], ["apps/web/lib/api/controllers/links/linkId/checkLinkById.ts", 90, 0], ["apps/web/pages/api/v1/links/[id]/check/index.test.ts", 69, 0], ["apps/web/pages/api/v1/links/[id]/check/index.ts", 16, 0]], "commits": [{"sha": "fe92b24b", "subject": "Add POST /api/v1/links/[id]/check endpoint"}]}, "acceptance": ["POST /api/v1/links/[id]/check requests the link's URL (HEAD first, GET if HEAD is not allowed) and responds with { status, ok, checkedAt }", "Only users who can see the link (owner or member of its collection) can check it; others get 401 or 404", "The route file stays thin; the work lives in a controller under apps/web/lib/api/controllers/links/linkId/", "The outbound request is made safely (no requests to private network addresses)", "Unit tests cover the controller with the outbound request mocked"], "a": {"wall_seconds": 80.3, "exit_cod
