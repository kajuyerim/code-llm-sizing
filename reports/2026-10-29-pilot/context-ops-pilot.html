<title>Context Ops Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* Layout: a sticky top bar routes between an overview and one page per repository. Prose keeps a ~70ch measure; knowledge browser and merge requests use the full 1200px width. Experiments are identity colors: A blue, B orange. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --surface-3: #e4e8ee;
  --ink: #12161d;
  --ink-2: #4a525e;
  --ink-3: #6f7784;
  --rule: #d9dee6;
  --a: #2a78d6;
  --b: #eb6834;
  --a-soft: #e3eefb;
  --b-soft: #fdebe3;
  --good: #108a10;
  --warn: #a86f00;
  --bad: #c43535;
  --good-soft: #e5f4e5;
  --warn-soft: #fbf1dc;
  --bad-soft: #fbe7e7;
  --code-bg: #f1f3f6;
  --add-bg: #e6f5e8;
  --add-num: #c9eccf;
  --del-bg: #fbebeb;
  --del-num: #f5d1d1;
  --hunk-bg: #eef3fb;
  --branch-bg: #e8f0fc;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --measure: 70ch;
  --wide: 1200px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #171b21; --surface-2: #1f242c; --surface-3: #283039; --ink: #eef1f5; --ink-2: #b8c0cb; --ink-3: #8a93a0; --rule: #2c333d;
    --a: #3987e5; --b: #d95926; --a-soft: #16283f; --b-soft: #382015; --good: #46c246; --warn: #f0b23a; --bad: #ee7070;
    --good-soft: #15301a; --warn-soft: #362a12; --bad-soft: #3a1b1b; --code-bg: #1c2128; --add-bg: #142d1a; --add-num: #1b3f23; --del-bg: #361a1b; --del-num: #4a2224;
    --hunk-bg: #18243a; --branch-bg: #1a2a42; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #171b21; --surface-2: #1f242c; --surface-3: #283039; --ink: #eef1f5; --ink-2: #b8c0cb; --ink-3: #8a93a0; --rule: #2c333d;
  --a: #3987e5; --b: #d95926; --a-soft: #16283f; --b-soft: #382015; --good: #46c246; --warn: #f0b23a; --bad: #ee7070;
  --good-soft: #15301a; --warn-soft: #362a12; --bad-soft: #3a1b1b; --code-bg: #1c2128; --add-bg: #142d1a; --add-num: #1b3f23; --del-bg: #361a1b; --del-num: #4a2224;
  --hunk-bg: #18243a; --branch-bg: #1a2a42; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--font-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: var(--wide); margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 4.4vw, 3rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.2rem; }
h4 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--a); }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
.eyebrow { font: 500 0.72rem/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 0.86rem; }
.prose { max-width: var(--measure); display: grid; gap: 14px; }
.stack { display: grid; gap: 14px; }
.stack-lg { display: grid; gap: 28px; }
.view { padding-block: 40px 96px; display: grid; gap: 64px; }
.view[hidden] { display: none !important; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topbar .wrap { display: flex; align-items: center; gap: 20px; min-height: 54px; flex-wrap: wrap; padding-block: 6px; }
.brand { font: 600 1rem var(--font-display); white-space: nowrap; }
.brand span { color: var(--ink-3); font-weight: 500; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink-2); font: 500 0.9rem var(--font-body); padding: 6px 12px; border-radius: 4px; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* Overview */
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 400 0.84rem/1.4 var(--font-mono); color: var(--ink-2); }
.meta b { color: var(--ink); font-weight: 500; }
.notice { font-size: 0.88rem; color: var(--ink-2); border-left: 3px solid var(--rule); padding-left: 12px; max-width: var(--measure); }
.key { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.sw-a { background: var(--a); } .sw-b { background: var(--b); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
table.data { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 10px 12px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
table.data thead th { font: 500 0.7rem/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); background: var(--surface-2); white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.r, table.data th.r { text-align: right; white-space: nowrap; }
table.score td.num { font: 500 1.3rem/1.2 var(--font-display); white-space: nowrap; }
table.score td.num small { font: 400 0.78rem var(--font-body); color: var(--ink-3); margin-left: 4px; }
table.score .def { font-size: 0.82rem; color: var(--ink-2); max-width: 40ch; }
.findings { display: grid; gap: 14px; counter-reset: f; padding: 0; margin: 0; list-style: none; max-width: var(--measure); }
.findings li { padding-left: 34px; position: relative; }
.findings li::before { counter-increment: f; content: counter(f); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); font: 500 0.74rem/22px var(--font-mono); text-align: center; color: var(--ink-2); }
.caveats { display: grid; gap: 10px; max-width: var(--measure); padding-left: 18px; margin: 0; }
.figure { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; overflow-x: auto; margin: 0; }
.figure svg { display: block; min-width: 720px; width: 100%; height: auto; }
.figure figcaption { font-size: 0.84rem; color: var(--ink-2); margin-top: 12px; max-width: var(--measure); }
svg .box { fill: var(--surface-2); stroke: var(--rule); }
svg .box-a { fill: var(--a-soft); stroke: var(--a); }
svg .box-b { fill: var(--b-soft); stroke: var(--b); }
svg .t { fill: var(--ink); font: 500 13px var(--font-body); }
svg .t2 { fill: var(--ink-2); font: 400 11.5px var(--font-body); }
svg .tm { fill: var(--ink-3); font: 500 10.5px var(--font-mono); letter-spacing: 0.06em; }
svg .ln { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
svg .ln-a { stroke: var(--a); stroke-width: 1.5; fill: none; }
svg .ln-b { stroke: var(--b); stroke-width: 1.5; fill: none; }
svg .arrow { fill: var(--ink-3); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.cols > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.chart { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 16px 8px; display: grid; gap: 6px; min-width: 0; }
.chart h4 { font-size: 0.98rem; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis { fill: var(--ink-3); font: 400 11px var(--font-mono); }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .base { stroke: var(--ink-3); stroke-width: 1; }
.chart .bar-a { fill: var(--a); } .chart .bar-b { fill: var(--b); }
.legend { display: flex; gap: 16px; font-size: 0.82rem; color: var(--ink-2); flex-wrap: wrap; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font: 400 0.8rem/1.4 var(--font-body); padding: 8px 10px; border-radius: 4px; z-index: 20; max-width: 260px; }
.repo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.repo-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; display: grid; gap: 10px; text-decoration: none; color: inherit; }
.repo-card:hover { border-color: var(--ink-3); }
.repo-card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.86rem; font-variant-numeric: tabular-nums; }

/* Chips and verdicts: color plus icon plus label */
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 0.74rem/1 var(--font-mono); padding: 4px 7px; border-radius: 3px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip i { font-style: normal; font-weight: 600; }
.v-hit { background: var(--good-soft); border-color: transparent; } .v-hit i { color: var(--good); }
.v-partial { background: var(--warn-soft); border-color: transparent; } .v-partial i { color: var(--warn); }
.v-miss i { color: var(--ink-3); }
.v-bad { background: var(--bad-soft); border-color: transparent; } .v-bad i { color: var(--bad); }
.v-note i { color: var(--ink-2); }

/* Segmented controls */
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { font: 500 0.86rem var(--font-body); color: var(--ink-2); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Repo header */
.repo-head { display: grid; gap: 14px; border-bottom: 1px solid var(--rule); padding-bottom: 28px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 24px; font-size: 0.88rem; }
.facts div { display: grid; gap: 2px; }
.facts dt { font: 500 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.facts dd { margin: 0; }

/* Knowledge browser */
.kb { display: grid; grid-template-columns: 250px minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); min-height: 420px; }
.kb-tree { border-right: 1px solid var(--rule); padding: 12px 8px; display: grid; gap: 2px; align-content: start; background: var(--surface-2); border-radius: 6px 0 0 6px; }
.kb-tree .grp { font: 500 0.68rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 10px 8px 4px; }
.kb-tree button { text-align: left; font: 400 0.84rem var(--font-mono); color: var(--ink-2); background: transparent; border: 0; padding: 5px 8px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; }
.kb-tree button:hover { background: var(--surface-3); }
.kb-tree button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 2px 0 0 var(--ink); }
.kb-doc { padding: 20px 26px 28px; min-width: 0; overflow-x: auto; }
.kb-path { font: 400 0.8rem var(--font-mono); color: var(--ink-3); margin-bottom: 12px; }
@media (max-width: 760px) { .kb { grid-template-columns: 1fr; } .kb-tree { border-right: 0; border-bottom: 1px solid var(--rule); border-radius: 6px 6px 0 0; } }

/* Rendered markdown */
.md { font-size: 0.92rem; line-height: 1.6; max-width: 100%; }
.md > * + * { margin-top: 12px; }
.md h1 { font-size: 1.5rem; } .md h2 { font-size: 1.2rem; margin-top: 22px; } .md h3 { font-size: 1.02rem; margin-top: 18px; }
.md table { border-collapse: collapse; width: 100%; font-size: 0.84rem; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--rule); padding: 6px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; }
.md pre { background: var(--code-bg); padding: 10px 12px; border-radius: 4px; overflow-x: auto; font: 400 0.8rem/1.5 var(--font-mono); }
.md pre code { background: none; padding: 0; }
.md ul, .md ol { padding-left: 22px; }
.md hr { border: 0; border-top: 1px solid var(--rule); }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--ink-2); }

/* Push section */
.push-nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 55px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--rule); }
.push-title { display: grid; gap: 6px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
.grid-2 > * { min-width: 0; }
.list { display: grid; gap: 8px; margin: 0; padding-left: 18px; font-size: 0.9rem; }
.planted { display: grid; gap: 10px; }
.planted-row { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; font-size: 0.9rem; }
.planted-row .id { font: 600 0.78rem/1.6 var(--font-mono); }
.statline { display: flex; gap: 14px; flex-wrap: wrap; font: 400 0.82rem var(--font-mono); color: var(--ink-2); }
.statline .plus { color: var(--good); } .statline .minus { color: var(--bad); }
.files { font: 400 0.8rem/1.7 var(--font-mono); color: var(--ink-2); margin: 0; padding: 0; list-style: none; }
.files li { display: flex; gap: 10px; justify-content: space-between; border-bottom: 1px dashed var(--rule); }
.files li span:first-child { overflow-wrap: anywhere; }
details.conv { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
details.conv > summary { cursor: pointer; padding: 12px 16px; font-weight: 500; }
.chat { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 620px; overflow-y: auto; }
.msg { display: grid; gap: 4px; max-width: 86%; }
.msg .who { font: 500 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.msg .bubble { padding: 9px 12px; border-radius: 8px; font-size: 0.86rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.developer { justify-self: end; } .msg.developer .who { text-align: right; }
.msg.developer .bubble { background: var(--surface-3); }
.msg.agent .bubble { background: var(--surface-2); }

/* GitLab-style merge request */
.mr { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.mr.a { border-top: 3px solid var(--a); } .mr.b { border-top: 3px solid var(--b); }
.mr-head { padding: 16px 18px 0; display: grid; gap: 8px; }
.mr-exp { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 0.82rem; }
.mr-title { font: 600 1.15rem/1.3 var(--font-body); }
.mr-title .iid { color: var(--ink-3); font-weight: 400; }
.mr-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.84rem; color: var(--ink-2); }
.state { display: inline-flex; align-items: center; gap: 5px; font: 600 0.78rem var(--font-body); padding: 3px 9px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.state.none { background: var(--surface-2); color: var(--ink-2); }
.branchref { font: 400 0.78rem var(--font-mono); background: var(--branch-bg); color: var(--a); padding: 2px 6px; border-radius: 3px; overflow-wrap: anywhere; }
.mr-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-top: 8px; overflow-x: auto; }
.mr-tabs button { font: 500 0.86rem var(--font-body); color: var(--ink-2); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; cursor: pointer; white-space: nowrap; }
.mr-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.mr-tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--surface-2); font: 500 0.74rem/1.5 var(--font-mono); text-align: center; }
.mr-pane { padding: 16px 18px 18px; display: grid; gap: 14px; }
.mr-pane[hidden] { display: none !important; }
.mr-desc { border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; }
.mr-side { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-2); }
.mr-side b { color: var(--ink); font-weight: 500; }
.difffile { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.difffile-head { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--rule); font: 500 0.8rem var(--font-mono); flex-wrap: wrap; }
.difffile-head .plus { color: var(--good); } .difffile-head .minus { color: var(--bad); }
.diff-scroll { overflow-x: auto; }
table.diff { border-collapse: collapse; width: 100%; font: 400 0.76rem/1.55 var(--font-mono); }
table.diff td { padding: 0 8px; vertical-align: top; }
table.diff td.n { width: 1%; min-width: 40px; text-align: right; color: var(--ink-3); user-select: none; border-right: 1px solid var(--rule); }
table.diff td.c { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 300px; }
table.diff tr.add td { background: var(--add-bg); } table.diff tr.add td.n { background: var(--add-num); }
table.diff tr.del td { background: var(--del-bg); } table.diff tr.del td.n { background: var(--del-num); }
table.diff tr.hunk td { background: var(--hunk-bg); color: var(--ink-3); }
.held { border: 1px dashed var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 8px; font-size: 0.86rem; }

/* Assessment */
.assess { display: grid; gap: 20px; }
.assess-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
.assess-cols > * { min-width: 0; }
.rec { display: grid; gap: 5px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.rec:last-child { border-bottom: 0; }
.rec .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font: 500 0.76rem var(--font-mono); }
.op { padding: 1px 6px; border-radius: 3px; background: var(--surface-2); }
.op.ADD { background: var(--add-bg); } .op.UPDATE, .op.MERGE { background: var(--a-soft); } .op.DELETE { background: var(--del-bg); } .op.NEEDS_REVIEW { background: var(--warn-soft); }
.rec .text { font-size: 0.88rem; overflow-wrap: anywhere; }
.rec .why { font-size: 0.82rem; color: var(--ink-2); overflow-wrap: anywhere; }
.verdict-table td:first-child { white-space: nowrap; }
.callout { border-left: 3px solid var(--rule); padding: 4px 0 4px 12px; font-size: 0.9rem; color: var(--ink-2); }
footer { border-top: 1px solid var(--rule); padding-top: 22px; font-size: 0.84rem; color: var(--ink-2); display: grid; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 560px) { table.score .def { display: none; } .msg { max-width: 100%; } }
</style>

<header class="topbar gutter">
  <div class="wrap">
    <div class="brand">Context Ops <span>pilot</span></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
  </div>
</header>

<main class="gutter">
  <div class="wrap">
    <section class="view" id="view-overview" data-view="overview"></section>
    <section class="view" id="view-repo" data-view="repo" hidden></section>
  </div>

<script id="data" type="application/json">{"repos": [{"repo": "maybe", "mode": "rewind", "baseline": [{"path": "index.md", "text": "# Knowledge Index\n\nShared team knowledge: terminology, stack standards, naming conventions, pitfalls, and product notes.\n\n## Core\n\n- [Terminology](core/terminology.md)\n- [Tech stack standards](core/tech-stack-standards.md)\n- [Naming conventions](core/naming-conventions.md)\n- [Pitfalls](core/pitfalls.md)\n\n## Products\n\n- [Firebase](products/firebase/README.md)\n- [Dataform](products/dataform/README.md)\n- [ViewComponent Knowledge](products/viewcomponent/README.md)\n- [Plaid Knowledge](products/plaid/README.md)\n"}, {"path": "core/naming-conventions.md", "text": "# Naming Conventions\n\nScope: this knowledge repository. Status: initial foundation conventions, awaiting team review. These rules do not prescribe naming in an external application.\n\n| ID | Convention |\n| --- | --- |\n| NAME-001 | Use lowercase folder and document names with hyphens between words. Preserve conventional entry point names such as README.md, AGENTS.md, LICENSE, and SKILL.md. |\n| NAME-002 | Place product-specific knowledge under its lowercase product folder within products. |\n| NAME-003 | Give Markdown documents a descriptive first-level title and use relative links for documents in the bundle. |\n| NAME-004 | Preserve an existing knowledge ID when revising the same fact. New terminology uses the TERM prefix, naming rules the NAME prefix, stack standards the STACK prefix, and pitfalls the PIT prefix, each followed by a three-digit number. |\n| NAME-005 | Use no em dashes in authored project documents or GitHub tracking text. |\n\nApplication or company naming conventions need their own scope and supporting evidence before admission. Do not infer universal naming rules from a few identifiers or import the example repository's conventions without a decision.\n\nUse [core maintenance guidance](../maintenance/core.md) for changes and [the conventions maintainer](../agents/conventions-maintainer.md) for the specialist assignment.\n\n## Application: maybe\n\nScope: naming inside the maybe application. Basis: source at commit `3eea5a9`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Convention | Scope |\n| --- | --- | --- |\n| NAME-101 | View components live flat in `app/components/`. The class name ends in `Component` (for example `ButtonComponent` in `button_component.rb` with `button_component.html.erb`), and a component's Stimulus controller sits next to it as `<name>_controller.js`. | app:maybe |\n| NAME-102 | Use `Current.user` and `Current.family` for the signed-in user and family. Do not use `current_user` or `current_family`. | app:maybe |\n| NAME-103 | Lookbook previews live in `test/components/previews/` and are named `<name>_component_preview.rb`. | app:maybe |\n"}, {"path": "core/pitfalls.md", "text": "# Pitfalls\n\nScope: non-obvious failures met while developing source applications, and how to avoid them. Status: initial entry point; no pitfalls have been admitted yet.\n\nEach entry names the situation in which it applies, what goes wrong, and what to do instead. Admit an entry only when both the failure and the fix are supported by evidence. Product-only pitfalls belong in the matching product folder.\n\n| ID | Trigger | What goes wrong | Do instead | Scope |\n| --- | --- | --- | --- | --- |\n\nUse [core maintenance guidance](../maintenance/core.md) for changes and [the pitfalls maintainer](../agents/pitfalls-maintainer.md) for the specialist assignment.\n\n## Application: maybe\n\nScope: non-obvious failures in the maybe application. Basis: source at commit `3eea5a9`. Status: no pitfalls admitted yet.\n\n| ID | Trigger | What goes wrong | Do instead | Scope |\n| --- | --- | --- | --- | --- |\n"}, {"path": "core/tech-stack-standards.md", "text": "# Tech Stack Standards\n\nScope: approved technology choices and constraints that apply across source applications. Status: no mandatory application stack has been established in this bundle.\n\nFirebase and Dataform are knowledge categories, not mandatory dependencies for every application. An observed dependency or implementation choice does not by itself establish a shared standard.\n\n## Recording a standard\n\nFor each accepted standard, record a stable ID, its scope, the required or preferred behavior, the reason, and the developer decision or other evidence supporting it. Distinguish a preference from a requirement and identify approved exceptions explicitly.\n\nImplementation findings without an approved shared decision can be proposed as scoped product knowledge or deferred for review. Do not promote them into company-wide policy automatically.\n\nUse [core maintenance guidance](../maintenance/core.md) and the [stack maintainer definition](../agents/stack-maintainer.md). Product-specific patterns belong in the [Firebase](../products/firebase/README.md) or [Dataform](../products/dataform/README.md) area when relevant.\n\n## Application: maybe\n\nScope: technology choices in the maybe application. Basis: source and Gemfile at commit `3eea5a9`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Standard | Level | Scope |\n| --- | --- | --- | --- |\n| STACK-101 | Ruby on Rails 7.2 with PostgreSQL and Redis. Background work runs on Sidekiq, with sidekiq-cron for scheduled jobs. | requirement | app:maybe |\n| STACK-102 | The frontend is Hotwire (Turbo and Stimulus) with ViewComponent and Tailwind CSS, served through importmap and Propshaft. There is no client-side SPA framework. | requirement | app:maybe |\n| STACK-103 | Business logic belongs in `app/models/`, organized with concerns and plain Ruby objects. Avoid service objects in `app/services/`. | preference | app:maybe |\n| STACK-104 | Tests use Minitest with fixtures and mocha for stubs. Do not add RSpec or factories. | requirement | app:maybe |\n| STACK-105 | The external API lives under `/api/v1`, authenticates with Doorkeeper OAuth or API keys, and is rate limited by Rack::Attack (for example 100 requests per hour per access token). | requirement | app:maybe |\n"}, {"path": "core/terminology.md", "text": "# Terminology\n\nScope: vocabulary shared across this knowledge bundle. Basis: the team's project design discussion on 19 October 2026. These definitions describe the project design, not findings from a pilot application. Initial human review is pending.\n\n| ID | Term | Meaning |\n| --- | --- | --- |\n| TERM-001 | Context Ops | Maintaining useful shared knowledge as an application's implementation and development decisions evolve |\n| TERM-002 | Shared knowledge | Persistent terminology, standards, conventions, and product guidance that developers and agents can reuse |\n| TERM-003 | Source application | An external application repository inspected as evidence for knowledge maintenance |\n| TERM-004 | Product | A technology-specific knowledge area, such as Firebase or Dataform, under the products folder |\n| TERM-005 | Maintenance run | A documentation-only inspection of the source repository, its diff, and the developer-agent conversation that produces knowledge change proposals |\n| TERM-006 | Sweeper | The agent in experiment A that inspects all three evidence sources before handing its context to specialists |\n| TERM-007 | Specialist | An agent assigned a specific part of core or product knowledge to maintain |\n| TERM-008 | Knowledge baseline | The recorded starting revision of this knowledge bundle, shared by both experiments before their states diverge |\n| TERM-009 | Initializer | The deterministic first step of a maintenance run that reads init.md and decides which specialists start |\n| TERM-010 | Evidence pack | The frozen copy of a push's diff, developer-agent conversation, and memory that every agent in a run reads |\n| TERM-011 | Cartographer | The agent that proposes new core documents or product folders from findings no existing document owns |\n| TERM-012 | Writer | The only agent that edits knowledge files; it applies accepted change records on a branch for review |\n| TERM-013 | Unowned finding | A supported finding that no specialist's assigned document can hold; input for the cartographer |\n| TERM-014 | Pitfall | A non-obvious failure with its trigger and the way to avoid it |\n\nUse [core maintenance guidance](../maintenance/core.md) when changing definitions, adding synonyms, or introducing supported domain terms. Product-specific meanings belong in the appropriate product section unless they apply more broadly.\n\n## Application: maybe\n\nScope: the maybe personal finance application (Ruby on Rails). Basis: source at commit `3eea5a9`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Term | Meaning | Scope |\n| --- | --- | --- | --- |\n| TERM-101 | Family | The top-level owner of accounts, Stripe subscriptions, and most preferences. Users belong to a family as an admin or a member. | app:maybe |\n| TERM-102 | Accountable | The type-specific record behind an Account. Types are Depository, Investment, Crypto, Property, Vehicle, OtherAsset, CreditCard, Loan, and OtherLiability. | app:maybe |\n| TERM-103 | Entry | A dated ledger item on an account. Its entryable is a Transaction, a Valuation, or a Trade. | app:maybe |\n| TERM-104 | Valuation | An entry that records an account's absolute value on a date rather than a flow of money. | app:maybe |\n| TERM-105 | Holding | An investment account's position in a Security on a date, derived from Trades. | app:maybe |\n| TERM-106 | Balance | A daily balance record for an account, computed by the forward or reverse balance calculator. | app:maybe |\n| TERM-107 | Sync | A tracked synchronization operation on a syncable record such as a family, an account, or a Plaid item. Syncs can have a parent sync. | app:maybe |\n| TERM-108 | App mode | `Rails.application.config.app_mode`, either `managed` (the maybe team runs the servers) or `self_hosted` (users run the app themselves, usually with Docker Compose). | app:maybe |\n"}, {"path": "products/dataform/README.md", "text": "---\ntype: Product\ntitle: Dataform Knowledge\nfileMatchPattern:\n  - \"**/*.sqlx\"\n  - \"**/workflow_settings.yaml\"\n  - \"**/dataform.json\"\n  - \"**/includes/*.js\"\nkeywords: [dataform, sqlx]\n---\n\n# Dataform Knowledge\n\nScope: Dataform-specific guidance learned from supported source application evidence and accepted developer decisions. Status: initial entry point; no application-specific facts have been imported.\n\n## What belongs here\n\n- Scoped Dataform usage conventions and architecture decisions.\n- Reusable implementation patterns supported by inspected source code.\n- Product-specific terminology, limitations encountered, and approved exceptions.\n\nFor each admitted finding, retain a stable ID, its scope, and revision-specific source or conversation evidence. Add focused documents when supported content needs them, and link them from this entry point. Do not copy the example repository's standards as if they were already approved for this bundle.\n\nUse [product maintenance guidance](../../maintenance/products.md). The [product maintainer definition](../../agents/product-maintainer.md) is instantiated with the Dataform path for this assignment. Shared definitions and policies belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/firebase/README.md", "text": "---\ntype: Product\ntitle: Firebase Knowledge\nfileMatchPattern:\n  - \"**/firebase.json\"\n  - \"**/.firebaserc\"\n  - \"**/firestore.rules\"\n  - \"**/firestore.indexes.json\"\n  - \"**/storage.rules\"\n  - \"**/database.rules.json\"\n  - \"**/google-services.json\"\n  - \"**/GoogleService-Info.plist\"\n  - \"**/functions/**\"\nkeywords: [firebase, firestore, crashlytics, remote config, cloud messaging, fcm]\n---\n\n# Firebase Knowledge\n\nScope: Firebase-specific guidance learned from supported source application evidence and accepted developer decisions. Status: initial entry point; no application-specific facts have been imported.\n\n## What belongs here\n\n- Scoped Firebase usage conventions and architecture decisions.\n- Reusable implementation patterns supported by inspected source code.\n- Product-specific terminology, limitations encountered, and approved exceptions.\n\nFor each admitted finding, retain a stable ID, its scope, and revision-specific source or conversation evidence. Add focused documents when supported content needs them, and link them from this entry point. Do not infer a required application stack from this folder's existence.\n\nUse [product maintenance guidance](../../maintenance/products.md). The [product maintainer definition](../../agents/product-maintainer.md) is instantiated with the Firebase path for this assignment. Shared definitions and policies belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/plaid/README.md", "text": "---\ntype: Product\ntitle: Plaid Knowledge\nfileMatchPattern:\n  - \"app/models/plaid_item.rb\"\n  - \"app/models/plaid_item/**\"\n  - \"app/models/plaid_account.rb\"\n  - \"app/models/plaid_account/**\"\n  - \"app/models/plaid_entry/**\"\n  - \"app/controllers/plaid_items_controller.rb\"\nkeywords: [plaid, bank sync, plaid item, institution connection]\n---\n\n# Plaid Knowledge\n\nScope: how the maybe application syncs bank data through Plaid. Basis: source at commit `3eea5a9`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Fact | Scope |\n| --- | --- | --- |\n| PLAID-001 | A `PlaidItem` is one institution connection for a family. Each `PlaidAccount` under it maps to an application Account. | app:maybe |\n| PLAID-002 | Plaid data arrives through syncs that run in background jobs, not during web requests. | app:maybe |\n\nUse [product maintenance guidance](../../maintenance/products.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.\n"}, {"path": "products/viewcomponent/README.md", "text": "---\ntype: Product\ntitle: ViewComponent Knowledge\nfileMatchPattern:\n  - \"app/components/**\"\n  - \"test/components/**\"\n  - \"app/javascript/controllers/**\"\nkeywords: [viewcomponent, view component, lookbook, stimulus, design system]\n---\n\n# ViewComponent Knowledge\n\nScope: how the maybe application builds UI with ViewComponent, Lookbook, and Stimulus. Basis: source at commit `3eea5a9`. Status: baseline prepared for the pilot; not human-verified.\n\n| ID | Fact | Scope |\n| --- | --- | --- |\n| VIEWCOMPONENT-001 | Reusable UI with variants, slots, or interactive behavior is a ViewComponent. Simple, single-use markup stays a partial. | app:maybe |\n| VIEWCOMPONENT-002 | Components are developed and reviewed in Lookbook, served at `/lookbook` in development. | app:maybe |\n| VIEWCOMPONENT-003 | Stimulus controllers that belong to one component live next to it. Global controllers live in `app/javascript/controllers/`. | app:maybe |\n\nUse [product maintenance guidance](../../maintenance/products.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.\n"}], "pushes": [{"push": "P1", "task": "Every account type (depositories, investments, properties, vehicles, loans, credit cards, cryptos, other assets and liabilities) has its own near-identical show page. Consolidate them into one accounts show page with tabs, and add some missing database indexes on the core tables while we are at it.\n", "real_commits": ["8c97c9d", "d5b147f"], "ground_truth": {"expected_result": "EITHER", "expected": [{"id": "E1", "target": "core/naming-conventions.md", "op": "ADD", "fact_id": "new", "gist": "Type-specific account tab partials live in app/views/<type>/tabs/_<tab>.html.erb", "owner": "conventions", "from": "M1", "required": false}, {"id": "E2", "target": "core/pitfalls.md", "op": "ADD", "fact_id": "new", "gist": "Do not run database migrations automatically; deve his machine is the system 2.6, and the project needs 3.4.4. The change is untested, including the new test.\n\n- **Show page:** I added `app/views/accounts/show.html.erb`. Every account gets an Activity tab. Investment accounts also get Holdings. Property, Vehicle, Loan and CreditCard accounts also get Overview. Property keeps the address subtitle. Accounts with only one tab show no tab bar.\n- **Controllers:** `show` and `destroy` moved from the `AccountableResource` concern into `AccountsController`. The per-type controllers keep `new`, `create`, `edit` and `update`.\n- **Views:** I deleted the nine `*/show.html.erb` files.\n- **Routes:** `/accounts/:id` is now the show route. I removed the `direct :account` helper that mapped to `/depositories/123` and similar. `account_path(account)` now gives `/accounts/:id`, and `edit_account_path` still goes to the per-type edit page.\n- **Old URLs:** the old `/depositories/:id` show and delete URLs no longer exist. Update URLs are unchanged.\n- **Tests:** the vehicle, credit card and loan update tests used `account_path` to reach the per-type route, so I switched them to `vehicle_path`, `credit_card_path` and `loan_path`. I added a test that loads the show page for every account in the `dylan_family` fixtures.\n\nI haven't made any database index changes. Send me the index list when you have it."}, {"role": "developer", "session": "d2ae1ba9", "text": "overview and holdings partials should move into a tabs/ folder under each type, like loans/tabs/_overview and investments/tabs/_holdings. also ScrollFocusable and the focus_record stimulus controller should be gone, you're still including it in AccountsController. and credit cards don't need an overview tab, just properties, vehicles and loans."}, {"role": "agent", "session": "d2ae1ba9", "text": "Lazy `t(\".x\")` keys in the moved partials now resolve under `<type>.tabs.overview`, so I'm re-nesting the locale keys to match. I'm also removing the orphaned credit card overview keys."}, {"role": "agent", "session": "d2ae1ba9", "text": "The partials are moved and credit cards no longer get an Overview tab, but I only half-removed `ScrollFocusable` and `focus_record`. I haven't run any of this because the Ruby here is 2.6 and the project needs 3.4.4.\n\n- **Tabs folders:** the partials now live at `loans/tabs/_overview`, `vehicles/tabs/_overview`, `properties/tabs/_overview` and `investments/tabs/_holdings`. `accounts/show.html.erb` renders them from there.\n- **Locale keys:** the moved partials look up their text with `t(\".key\")`. I moved the `overview` keys to `<type>.tabs.overview` in the loans, vehicles and properties locale files so those lookups still resolve.\n- **Credit cards:** I deleted `credit_cards/_overview` and its locale keys. Only property, vehicle and loan accounts get an Overview tab now, and credit cards show only Activity.\n- **`ScrollFocusable` in `AccountsController`:** it's gone from `AccountsController`, along with the `set_focused_record` call and the `focused_record_id` pagy param. I also removed the `focus-record` data attributes from `accounts/show/_activity.html.erb`.\n\nI did not delete the `ScrollFocusable` concern or `focus_record_controller.js`. `TransactionsController` still includes the concern. `transactions/index.html.erb` uses the Stimulus controller, and `_transaction.html.erb` and `budget_categories/show.html.erb` still pass `focused_record_id`. Deleting them would remove the scroll-to-transaction behaviour from the transactions page.\n\nDecision for you: do you want that behaviour removed from transactions too? If so I'll delete both files and clean up those callers. `_transaction.html.erb` also links to `account_path(..., focused_record_id:)`, and that parameter now does nothing on the account page either way."}, {"role": "developer", "session": "d2ae1ba9", "text": "yes, remove it from transactions too. delete the concern and focus_record_controller.js and clean up all the callers, including the focused_record_id link in _transaction.\n\ni was going to ask for lazy-loading each tab through its own stimulus controller, but no, skip that. keep the tabs server-rendered and take the tab from a ?tab= query param."}, {"role": "agent", "session": "d2ae1ba9", "text": "`ScrollFocusable` and the `focus_record` Stimulus controller are deleted, and nothing in `app`, `test`, `config` or `lib` references them any more. I haven't run the tests, because the Ruby on this machine is 2.6 and the project needs 3.4.4.\n\n- **Deleted:** `app/controllers/concerns/scroll_focusable.rb` and `app/javascript/controllers/focus_record_controller.js`. Stimulus loads controllers automatically, so there was nothing to unregister.\n- **`TransactionsController`:** it no longer includes the concern. `index` now calls `pagy(base_scope, limit: per_page)` with no `focused_record_id` handling.\n- **`transactions/index.html.erb`:** I removed the `data-controller=\"focus-record\"` attributes.\n- **`transactions/_transaction.html.erb`:** I removed the border that highlighted the focused row. The account link now goes to `account_path(entry.account, tab: \"activity\")`. It used to pass `tab: \"transactions\"`, which isn't a real tab and only worked because the first tab is the fallback.\n- **`budget_categories/show.html.erb`:** the transaction name now links to `transactions_path` with no params. It lands on the plain transactions list instead of scrolling to that transaction. I could point it at the transaction's own show dialog instead, but that changes where the link goes.\n\nI did nothing for the tabs. `accounts/show/_tabs.html.erb` already picks the active tab from `params[:tab]` and renders every tab on the server. A tab name that doesn't exist falls back to the first tab.\n\nThe database index list is still waiting on you."}, {"role": "developer", "session": "d2ae1ba9", "text": "ok good. now the indexes, one migration: accounts (family_id, status), accounts status, accounts currency, balances (account_id, date desc), entries (account_id, date), entries date, entries entryable_type, entries lower(name), and transfers status. also update schema.rb to match by hand if you need to."}, {"role": "agent", "session": "d2ae1ba9", "text": "I added `db/migrate/20261029120000_add_missing_core_indexes.rb` with all nine indexes and updated `db/schema.rb` by hand to match. I haven't run the migration. The only Ruby here is 2.6, so I could only syntax-check both files with `ruby -c`.\n\n| Table | Indexes |\n| --- | --- |\n| `accounts` | `(family_id, status)`, `status`, `currency` |\n| `balances` | `(account_id, date DESC)` |\n| `entries` | `(account_id, date)`, `date`, `entryable_type`, `lower(name)` |\n| `transfers` | `status` |\n\n- **Schema version:** it's bumped to `2026_10_29_120000`, which is today's date.\n- **Hand-written entries:** I wrote the `lower(name)` expression index and the `order: { date: :desc }` entry the way Rails 7.2 normally dumps them. Run `bin/rails db:migrate` once on 3.4.4 to confirm the regenerated `schema.rb` has no diff.\n- **Expression index name:** I named it `index_entries_on_lower_name` explicitly.\n- **Some indexes are redundant:** `accounts(family_id, status)` already covers lookups by `family_id`, but the standalone `family_id` index stays, and nothing besides `status` alone can use the new `accounts.status` index.\n- **Balances overlap:** the existing unique index on `(account_id, date, currency)` already serves `account_id` + `date` lookups. The new descending index only helps if the query orders by date descending and doesn't filter on currency.\n- **Locking:** the migration uses plain `add_index`, which locks writes on each table while it builds. That matters most on `entries`. If those tables are large in production, I can switch it to `disable_ddl_transaction!` with `algorithm: :concurrently`."}, {"role": "developer", "session": "d2ae1ba9", "text": "looks good. commit it as two commits, first the accounts show page consolidation (r g, disclosure, filled icon, link, menu, menu item, tab, tabs (including `tabs/nav` and `tabs/panel`) and toggle. I used `git mv`, so history is kept.\n- The classes are now `DS::ButtonComponent`, `DS::LinkComponent`, `DS::Tabs::NavComponent` and so on.\n- Every reference in views, helpers (`application_helper.rb`, `styled_form_builder.rb`) and the components themselves is updated. So are the `ButtonishComponent` superclass refs and the CSS comment that mentioned `DialogComponent`.\n- The previews moved to `test/components/previews/ds/` as `DS::*ComponentPreview`, including the `tabs_component_preview` templates. There were no separate component test files, only previews.\n- `config/initializers/inflections.rb` now has acronyms for `DS` and `UI`, so Zeitwerk maps the `ds/` directory to `DS`.\n- `config/importmap.rb` now pins `app/components/ds` with `to: \"ds\"`. The Stimulus identifiers stay `dialog`, `menu` and `tabs`, so none of the `data-action=\"dialog#close\"` style references in views needed changing.\n\n**UI namespace**\nThere's no `UI` code yet. Every existing component is on your design-system list, so nothing went under `UI`. I added the `UI` acronym so `app/components/ui/` will work once you add something there.\n\n**Conflict with the team knowledge base**\n`NAME-101` and `NAME-103` in the KB describe components as flat in `app/components/` and previews as `<name>_component_preview.rb`. That's now outdated. I left it alone because the KB is read-only from here.\n\nTo verify, run `bin/rails zeitwerk:check` and `bin/rails test` under Ruby 3.4.4, then open `/lookbook` to check the previews render."}, {"role": "developer", "session": "379a4cdf", "text": "actually lets drop the Component suffix, DS::Button reads way better. sorry. so DS::Button, DS::Link, DS::Menu, in app/components/DS/button.rb and button.html.erb. redo the renames, previews and render calls too. no worries about not running tests here, that's expected."}, {"role": "agent", "session": "379a4cdf", "text": "The `Component` suffix is gone: it's now `DS::Button`, `DS::Link`, `DS::Menu`, and so on. As before, I couldn't run the app here, so none of it has been loaded or tested.\n\n- **Files:** components are in `app/components/DS/`, for example `button.rb` and `button.html.erb`. That covers all 14 classes, including `DS::Buttonish`, `DS::MenuItem`, `DS::FilledIcon`, `DS::Tab`, `DS::Tabs::Nav` and `DS::Tabs::Panel`. The Stimulus controllers keep their names (`dialog_controller.js`, `menu_controller.js`, `tabs_controller.js`) in the same folder.\n- **References:** every `render` call, the helper usages, the component-to-component references, the superclasses, the abstract-class error message and the CSS comment use the new names.\n- **Previews:** these are now `DS::ButtonPreview` and so on, in `test/components/previews/ds/button_preview.rb`. The tabs templates are in `ds/tabs_preview/`.\n- **Importmap:** it now pins `app/components/DS` with `to: \"DS\"`. The Stimulus identifiers are still `dialog`, `menu` and `tabs`, so no view's `data-action` needed changing.\n- **Inflections:** the `DS` and `UI` acronyms from before are still in place.\n\n- **Mixed-case directory:** you asked for `app/components/DS/`, so that folder is uppercase. I renamed it in two steps because macOS ignores case, and Linux treats the name as case-sensitive. I'm fairly sure Rails' Zeitwerk inflector maps `DS/` to the constant `DS`, but run `bin/rails zeitwerk:check` to confirm.\n- **Previews folder is lowercase:** I kept `previews/ds/` lowercase because Lookbook looks up preview templates by the underscored class name, `ds/tabs_preview`. An uppercase folder could break the tabs preview templates on Linux. Tell me if you'd rather it be `DS/`.\n- **`UI` is still empty:** every existing component was on your design-system list, so nothing went under `UI`.\n- **KB entries out of date:** `NAME-101` and `NAME-103` in the KB still describe the old flat `*_component` layout. I couldn't update them ontroller=\"dialog\"`. It's an unrelated copy-paste comment, so I left it.\n\n**Hotkey string:** `data[:hotkey] = \"esc:ds--dialog#close\"` is a pre-existing oddity. The `hotkey` controller passes that string to `@github/hotkey` as a key sequence, so it probably never closed the dialog on Esc. I renamed it for consistency but didn't change what it does.\n\nOpen one dialog, one menu and one tabs set in the browser to confirm the controllers connect."}, {"role": "developer", "session": "379a4cdf", "text": "ui is empty though. the account page and chart components from the last change should be app-specific, check git log for them and move them to app/components/UI/ as UI::<Name> inheriting ApplicationComponent. update their render calls and stimulus refs too."}, {"role": "agent", "session": "379a4cdf", "text": "I can't do this yet: there are no account-page or chart components to move. Nothing was changed this turn.\n\n- **Last change (`41ff394`):** it didn't touch `app/components/` at all. It folded the per-type account show pages into `accounts#show` by moving controllers, ERB partials, locales and routes.\n- **`app/components/` today:** only `DS/` and `design_system_component.rb`. A search for `*Chart*Component` and `*Account*Component` classes finds nothing.\n- **Older history:** `git log` on `app/components` shows nothing chart- or account-specific.\n- **`ApplicationComponent`:** it doesn't exist. You asked for `UI::<Name>` to inherit it, but today the only base class is `DesignSystemComponent`, which is just for DS.\n\nThe account and chart UI in this app is ERB partials and Stimulus controllers. For example `app/views/accounts/show/_header`, `_tabs`, `_menu`, `_activity` and `_chart`, plus controllers like `time_series_chart_controller.js` and `donut_chart_controller.js`.\n\nPick one:\n1. **Convert partials into `UI::` components.** Tell me which ones, such as `UI::AccountHeader` or `UI::AccountChart`. I'd create `app/components/UI/`, add `ApplicationComponent < ViewComponent::Base` and update the render calls. Chart controllers moved into `UI/` would get `ui--` identifiers like `ds--` has, and I'd update those references too.\n2. **Move only the pieces you name.** If you meant something from a different branch or an unpushed commit, give me the branch or commit. `git log --all -S\"ChartComponent\"` hit a corrupt object in this clone, so I couldn't search that way.\n3. **Create `ApplicationComponent` and `UI/` as an empty scaffold**, and fill it later.\n\nWhich one do you want?"}, {"role": "developer", "session": "379a4cdf", "text": "ok my bad, those must be on another branch. go with option 3: add ApplicationComponent < ViewComponent::Base and an empty app/components/UI/ for now. keep DS on DesignSystemComponent."}, {"role": "agent", "session": "379a4cdf", "text": "I added the scaffold, and nothing has been run or tested.\n\n- **`app/components/application_component.rb`:** `ApplicationComponent < ViewComponent::Base`.\n- **`app/components/UI/`:** empty, with a `.keep` file so git tracks it. Zeitwerk ignores empty directories and non-Ruby files, so it won't affect autoloading.\n- **`DesignSystemComponent`:** unchanged. It still inherits `ViewComponent::Base` directly, so DS components don't go through `ApplicationComponent`.\n\nThe `UI` acronym from earlier is already in the inflections. When you bring in the components from the other branch, the `UI::` folder will map to the `UI` constant. Any Stimulus controllers placed there will need a pin like `pin_all_from \"app/components/UI\", under: \"controllers/ui\", to: \"UI\"`. That would give them `ui--` identifiers, the same way `ds--` works."}, {"role": "developer", "session": "379a4cdf", "text": "looks good, commit it. make sure design_system_component.rb and the UI/.keep are included, the new base file is still untracked."}, {"role": "agent", "session": "379a4cdf", "text": "I committed everything as `3f243ac` (\"Split view components into DS and UI namespaces\") on `sim`  "ADD", "fact_id": "TERM-109", "scope": "app:maybe", "text": "| TERM-109 | DS (design system namespace) | The `DS::` namespace for the maybe app's design system components (Alert, Button, Buttonish, Dialog, Disclosure, FilledIcon, Link, Menu, MenuItem, Tab, Tabs, Toggle). They live in `app/components/DS/`, are named without a `Component` suffix (for example `DS::Button`), and inherit `DesignSystemComponent`. Their Stimulus controllers use the `ds--` identifier prefix. | app:maybe |", "reason": "The developer defined the DS grouping and its membership, and the source at head matches. Names and layout details are repeated in the naming and product documents, but the term itself is new vocabulary.", "problem": null}, {"bucket": "accepted", "agent": "conventions-maintainer", "target": "core/naming-conventions.md", "op": "UPDATE", "fact_id": "NAME-101", "scope": "app:maybe", "text": "| NAME-101 | View components live in `app/components/`, grouped by namespace. Design system components go in `app/components/DS/` as `DS::<Name>` (for example `DS::Button` in `DS/button.rb` with `DS/button.html.erb`). App-specific components go in `app/components/UI/` as `UI::<Name>`. Class names have no `Component` suffix. DS components inherit `DesignSystemComponent` and UI components are meant to inherit `ApplicationComponent`. A component's Stimulus controller sits next to it as `<name>_controller.js`. The `DS` and `UI` directories are uppercase and map to constants through inflection acronyms. | app:maybe |", "reason": "The developer decided the DS/UI split and dropped the Component suffix; source at head matches. The old flat *Component rule is superseded. UI is still empty, so the UI inheritance is stated as intent. Zeitwerk mapping of uppercase DS/ was not run (agent only 'fairly sure'), so the change is unverified.", "problem": null}, {"bucket": "accepted", "agent": "conventions-maintainer", "target": "core/naming-conventions.md", "op": "ADD", "fact_id": "NAME-104", "scope": "app:maybe", "text": "| NAME-104 | Stimulus controllers for DS components use the `ds--` identifier prefix (`ds--dialog`, `ds--menu`, `ds--tabs`). They are pinned in `config/importmap.rb` with `pin_all_from \"app/components/DS\", under: \"controllers/ds\", to: \"DS\"`. In Ruby `data` hashes, write namespaced attribute names as quoted keys such as `\"ds--menu-target\": \"button\"`, because plain symbol keys turn underscores into single dashes. | app:maybe |", "reason": "The developer asked for ds-- identifiers and the source implements them. The quoted-key detail is an agent statement that the code follows. A ui-- equivalent was only suggested by the agent and is not included.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-004", "scope": "app:maybe", "text": "| VIEWCOMPONENT-004 | Components are split into two namespaces. Design system pieces (Alert, Button, Buttonish, Dialog, Disclosure, FilledIcon, Link, Menu, MenuItem, Tab, Tabs with Nav and Panel, Toggle) live in `app/components/DS/` as `DS::<Name>` with no `Component` suffix. App-specific components belong in `app/components/UI/` as `UI::<Name>`, which is still an empty scaffold. `DS` and `UI` are registered as inflection acronyms in `config/initializers/inflections.rb`. | app:maybe |", "reason": "Developer decided the split and the suffix-free naming (later message overrides the first). Source at head matches. Unverified by running Rails.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-005", "scope": "app:maybe", "text": "| VIEWCOMPONENT-005 | Every DS component inherits `DesignSystemComponent`, which inherits `ViewComponent::Base`. App-specific `UI::` components are meant to inherit `ApplicationComponent` (also a `ViewComponent::Base` subclass). DS components do not go through `ApplicationComponent`. | app:maybe |", "reason": "Developer requested both bases; source confirms. No UI component exists yet to show ApplicationComponent in use.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-006", "scope": "app:maybe", "text": "| VIEWCOMPONENT-006 | DS Stimulus controllers are registered with the `ds--` prefix (`ds--dialog`, `ds--menu`, `ds--tabs`) through `pin_all_from \"app/components/DS\", under: \"controllers/ds\", to: \"DS\"` in `config/importmap.rb`. Use the prefixed identifier in `data-controller`, `data-action`, `*-target`, `*-value` and `*-class` attributes. Controller files stay next to their component. | app:maybe |", "reason": "Developer instruction implemented in source. A matching ui-- pin was only suggested by the agent, so it is not recorded.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-007", "scope": "app:maybe", "text": "| VIEWCOMPONENT-007 | In Ruby `data:` hashes, write namespaced Stimulus attributes with quoted keys, for example `\"ds--menu-target\": \"button\"`. A plain symbol key would have its underscores turned into single dashes and produce the wrong attribute name. | app:maybe |", "reason": "Source follows the pattern consistently; rationale is the agent's statement, not the developer's, and was not run. Medium confidence.", "problem": null}, {"bucket": "deferred", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "NEEDS_REVIEW", "fact_id": null, "scope": "app:maybe", "text": "The component directory is uppercase `app/components/DS/`. Whether Zeitwerk maps it to the `DS` constant on case-sensitive filesystems is unconfirmed.", "reason": "The agent never ran zeitwerk:check (Ruby 3.4.4 unavailable). Do not admit a pitfa nd_balance` is that date's. Both are `nil` if the record doesn't exist.\n- `breakdown` is `{ transactions:, trades:, valuations: }`, each a signed `Money` effect on the balance.\n  - Transactions and trades are cash flows. A negative entry amount is an inflow, so it raises an asset and lowers a liability.\n  - `valuations` is whatever the balance moved beyond those flows (`end − start − transactions − trades`), and it is non-zero only on dates that have a valuation entry.\n\n**Tests**\n- Grouping and ordering, with an empty case.\n- Transactions on an asset account, and on a liability account (credit card).\n- Trades on the investment account, reported separately from transactions.\n- A valuation adjustment on a date that also has a transaction.\n- Missing balance records.\n\n**Things to check**\n- I made `trades` the cash effect (−amount). A buy moves cash into holdings, so the total balance doesn't change, and the breakdown won't sum to the net change on trade days. If you want the breakdown to sum to the net change, we should show holdings changes instead.\n- The existing `entries_by_date` helper drops duplicate transfer entries. I didn't copy that, so the class groups whatever entries you pass it. Dedupe before calling it, or tell me to move that logic in.\n- I checked the app's conventions in `kb/maybe/dev`, plus the existing code and test helpers. Nothing there conflicted with a model under `app/models/account/` and a Minitest file."}, {"role": "developer", "session": "74f227cc", "text": "no worries, tests can't run on this laptop so that failure is expected. keep trades as cash effect for now, and leave the dedupe to the caller. just so we're on the same page, the feed is the activity tab on an account page, grouped by day with start and end balance for each day. looks good, commit it."}, {"role": "agent", "session": "74f227cc", "text": "I committed the two files as `2608e2e` on `sim`, and the working tree is clean. As agreed, trades stay as the cash effect and the caller handles transfer dedupe. The tests are still unrun because Ruby 3.4.4 isn't installed here."}, {"role": "developer", "session": "f43f0c31", "text": "same branch, Account::ActivityFeedData is already in. now build the ui for the account activity tab on top of it: UI::Account::ActivityFeed and UI::Account::ActivityDate (one date with its start/end balance), plus a small DS::Tooltip component for the breakdown on hover. remove Balance::TrendCalculator and move its callers to the new data. tab title should read Activity. dont run tests, no postgres here"}, {"role": "agent", "session": "f43f0c31", "text": "The KB's flat `*Component` convention is outdated; the repo now uses DS/UI namespaces. Let me look at the actual layout."}, {"role": "agent", "session": "f43f0c31", "text": "Checking the locale layout, then I'll write the components."}, {"role": "agent", "session": "f43f0c31", "text": "I'm writing the components now: DS::Tooltip first, then the two UI components, then the callers."}, {"role": "agent", "session": "f43f0c31", "text": "The activity tab now renders through the new components and `Balance::TrendCalculator` is gone. I haven't run any tests or loaded the page.\n\nI only syntax-checked the new Ruby files and the new locale file. The system Ruby here is 2.6, so it can't parse `entries_helper.rb`. The original file fails the same way because of its `date:,` shorthand hashes, so I haven't checked that file at all.\n\n**New components**\n- **`DS::Tooltip`**: content is the trigger, and `with_tooltip_content` holds the tooltip body. It reuses the existing global `tooltip` Stimulus controller and `.tooltip` styles instead of adding a new controller. I also added `DS::TooltipPreview` for Lookbook.\n- **`UI::Account::ActivityFeed`**: takes `account:` and `entries:`, builds `Account::ActivityFeedData` groups, and renders one `ActivityDate` per group. It refers to the model as `::Account::ActivityFeedData` so it isn't read as `UI::Account`.\n- **`UI::Account::ActivityDate`**: renders the date header with the entry count and the bulk-select checkbox. On the right it shows start → end balance, and hovering shows the breakdown in a `DS::Tooltip`. The breakdown lists transactions, trades and balance adjustments, skipping zero rows. The entries below render through the existing `entries/entry` partials.\n- **Locale**: the tooltip labels are in `config/locales/views/ui/account/en.yml`.\n\n**TrendCalculator removal**\n- **Deleted:** `Balance::TrendCalculator`. I also removed `Entry#balance_trend`, which called it with the wrong number of arguments and had no callers.\n- **Partials:** the transaction, trade and valuation partials now receive a plain `Trend`, built by `ActivityDate` from the group's start and end balances. So `balance_trend.current` replaces `balance_trend.trend.current`. The valuation icon and color still follow the trend.\n- **Transfer de-duplication:** I moved it out of `entries_by_date` into a public `deduped_entries` helper. The feed uses it so the same transfer isn't shown twice, as before. `entries_by_date` still works for the transactions index.\n\n**Tab title:** it already reads \"Activity\". The tabs partial humanizes the `activity` key, and the card heading's locale string is \"Activity\". I changed nothing there.\n\nThe KB says components live flat as `*Component` classes, but your DS/UI split commit supersedes that. I followed the new layout."}, {"role": "developer", "session": "f43f0c31", "text": "was thinking about caching the per-date breakdown in redis, but nah, compute it on the fly for now. also paste me activity_date.html.erb and tooltip.html.erb, i want to look at the markup before we commit."}, {"role": "agent", "session": "f43f0c31", "text": "Fine, the breakdown is already computed on the fly in `Account::ActivityFeedData`, so nothing changes there. Both files as they are now:"}, {"role": "agent", "session": "f43f0c31", "text": "Both are above. A few things I noticed while rereading them:\n\n- **Hover target:** `DS::Tooltip` wraps only the balance text, so the tooltip appears when hovering the balance. It doesn't appear on the date or the entry rows.\n- **Hidden tooltip:** the `.tooltip` class is `hidden absolute`, and the controller toggles `display` on hover. The tooltip box has no arrow or border, which matches the other tooltips in the app.\n- **No balance record:** when there's no end balance for a date, the balance and tooltip are skipped. If there's an end balance but no start balance, only the end balance shows, with no arrow.\n- **Entry partials:** the entries still render through `render \"entries/entry\"`. That works from a ViewComponent, but it's the one place the component depends on the old partials. The entry partials read `balance_trend` as a `Trend` now, and only the first row of each date gets it.\n- **Not rendered yet:** I haven't loaded this in a browser or run a render test."}, {"role": "developer", "session": "f43f0c31", "text": "i only see the bash call, not the file output. paste both files inline in your reply. also add a small render test for the activity feed component if you can, but dont run it."}, {"role": "agent", "session": "f43f0c31", "text": "Here are both files inline.\n\n**`app/components/UI/account/activity_date.html.erb`**\n\n```erb\n<div id=\"entry-group-<%= date %>\" class=\"bg-container-inset rounded-xl p-1 w-full\" data-bulk-select-target=\"group\">\n  <div class=\"py-2 px-4 flex items-center justify-between font-medium text-xs text-secondary\">\n    <div class=\"flex pl-0.5 items-center gap-4\">\n      <%= check_box_tag \"#{date}_entries_selection\",\n                        class: [ \"checkbox checkbox--light\", \"hidden\": entries.empty? ],\n                        id: \"selection_entry_#{date}\",\n                        data: { action: \"bulk-select#toggleGroupSelection\" } %>\n\n      <p class=\"uppercase space-x-1.5\">\n        <%= tag.span I18n.l(date, format: :long) %>\n        <span>·<\/span>\n        <%= tag.span entries.size %>\n      <\/p>\n    <\/div>\n\n    <% if end_balance %>\n      <%= render DS::Tooltip.new(placement: \"left\") do |tooltip| %>\n        <% tooltip.with_tooltip_content do %>\n          <div class=\"space-y-1 min-w-40\">\n            <% if breakdown_rows.empty? %>\n              <p><%= t(\"ui.account.activity_date.no_change\") %><\/p>\n            <% else %>\n              <% breakdown_rows.each do |key, money| %>\n                <div class=\"flex items-center justify-between gap-4\">\n                  <span><%= t(\"ui.account.activity_date.breakdown.#{key}\") %><\/span>\n                  <span><%= helpers.format_money(money) %><\/span>\n                <\/div>\n              <% end %>\n            <% end %>\n          <\/div>\n        <% end %>\n\n        <p class=\"flex items-center gap-1.5 cursor-default\">\n          <% if start_balance %>\n            <span><%= helpers.format_money(start_balance) %><\/span>\n            <%= helpers.icon \"arrow-right\", size: \"xs\", color: \"current\" %>\n          <% end %>\n          <span class=\"text-primary\"><%= helpers.format_money(end_balance) %><\/span>\n        <\/p>\n      <% end %>\n    <% end %>\n  <\/div>\n\n  <div class=\"bg-container shadow-border-xs rounded-lg\">\n    <% entries.each_with_index do |entry, index| %>\n      <%= render \"entries/entry\", entry: entry, balance_trend: index.zero? ? trend : nil, view_ctx: \"account\" %>\n    <% end %>\n  <\/div>\n<\/div>\n```\n\n**`app/components/DS/tooltip.html.erb`**\n\n```erb\n<%= tag.div class: \"inline-block\", data: { controller: \"tooltip\", tooltip_placement_value: placement, tooltip_offset_value: offset } do %>\n  <%= content %>\n\n  <div role=\"tooltip\" data-tooltip-tar [...]"}, {"role": "developer", "session": "f43f0c31", "text": "in tooltip.html.erb you used bg-gray-700, use the tokens not raw colors, like bg-container and text-primary or whatever the other tooltips use. check the activity_date markup for any raw color vityFeedData::Group` in `app/models/account/activity_feed_data/group.rb`. It still exposes `date`, `entries`, `start_balance`, `end_balance` and `breakdown`. It also has `trend` (nil without an end balance) and `breakdown_rows` (the non-zero breakdown pairs).\n- **ActivityFeedData:** it now dedupes the entries it's given before grouping, so the breakdown and balance lookups use the deduped list. The dedup is a public `Account::ActivityFeedData.deduped_entries`.\n- **`UI::Account::ActivityDate`:** it takes only `group:` and delegates to it. `ActivityFeed` no longer calls a helper.\n- **`EntriesHelper`:** I removed `deduped_entries` from it. `entries_by_date` still serves the transactions index, so it now calls `Account::ActivityFeedData.deduped_entries` instead of keeping its own copy.\n\nI added three tests to `activity_feed_data_test.rb`:\n- **Dedup:** the outflow and inflow entries of a transfer go in together and only the outflow comes out. I built it with `Transfer.create!` across the depository and credit card accounts.\n- **Trend and rows:** the group's `trend` and `breakdown_rows` for a day with a balance.\n- **No end balance:** a date without a balance record gets no trend and no rows.\n\nAn account's own feed never holds both sides of a transfer, since each side belongs to a different account. So the dedup test passes both entries in directly."}, {"role": "developer", "session": "f43f0c31", "text": "looks good, commit it"}, {"role": "agent", "session": "f43f0c31", "text": "I committed it on `sim` as `dad3988`, with 19 files changed. The commit message ends with the Co-Authored-By line. I didn't push, and the tests have still never been run."}], "diffstat": {"files": 19, "added": 419, "deleted": 68, "top": [["test/models/account/activity_feed_data_test.rb", 137, 0], ["app/models/account/activity_feed_data.rb", 87, 0], ["app/components/UI/account/activity_date.html.erb", 49, 0], ["test/components/ui/account/activity_feed_test.rb", 40, 0], ["app/models/account onent_preview.rb. Derived from source only; no developer statement.", "problem": null}, {"bucket": "accepted", "agent": "pitfalls-maintainer", "target": "core/pitfalls.md", "op": "ADD", "fact_id": "PIT-101", "scope": "app:maybe", "text": "| PIT-101 | Code inside a `UI::Account::*` component refers to the `Account` model or one of its nested classes, such as `Account::ActivityFeedData`. | Ruby resolves a bare `Account` to the `UI::Account` namespace module, so the lookup fails or returns the wrong constant. | Write the constant with a leading `::`, for example `::Account::ActivityFeedData`. | app:maybe |", "reason": "Source at head uses the leading :: form inside the UI::Account namespace and the development agent gave the reason. The failure follows from Ruby constant lookup, not from an observed test failure, because the code has never been run. The developer did not state it as a rule, so human review should confirm it. The other candidates are not pitfalls: the unrun tests and missing Ruby are specific to one laptop, the Redis caching choice is provisional, and the trades-as-cash-effect behavior is a deferred design choice.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-004", "scope": "app:maybe", "text": "Components are namespaced rather than flat. Design-system components are `DS::<Name>` in `app/components/DS/` and inherit `DesignSystemComponent`. Feature components are `UI::<Area>::<Name>` in `app/components/UI/<area>/`. Both inherit `ApplicationComponent` or `DesignSystemComponent` and have no `Component` suffix. Lookbook previews for design-system components are `DS::<Name>Preview` in `test/components/previews/ds/<name>_preview.rb`.", "reason": "The source at head shows the DS/UI layout and the sibling previews follow the same pattern. The baseline wording in core/naming-conventions.md (NAME-101, NAME-103) conflicts, which the conventions maintainer owns. The developer named the components in this layout but did not state it as an explicit rule, so it is scoped to app:maybe.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-005", "scope": "app:maybe", "text": "A component only renders. Calculation such as trends, breakdown rows, and de-duplication belongs in a plain Ruby object under `app/models/` (for example `Account::ActivityFeedData::Group`), and the component takes that object (`UI::Account::ActivityDate` takes only `group:` and delegates to it). Inside `UI::Account::*` components, refer to the model as `::Account::...` so it is not resolved as `UI::Account`.", "reason": "The developer stated the rule explicitly and the committed code follows it. The namespace note is shown in the source.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-006", "scope": "app:maybe", "text": "Component markup uses design tokens (for example `bg-container`, `bg-container-inset`, `text-primary`, `text-secondary`, `shadow-border-xs`), not raw Tailwind colors such as `bg-gray-700`. Older tooltips (`shared/_text_tooltip`, `holdings/_missing_price_tooltip`) still use raw colors and have not been migrated.", "reason": "The developer gave the instruction and the fix is in the head source. The note about older tooltips comes from the agent's reply in the same session and was not independently checked.", "problem": null}, {"bucket": "accepted", "agent": "product-maintainer:viewcomponent", "target": "products/viewcomponent/README.md", "op": "ADD", "fact_id": "VIEWCOMPONENT-007", "scope": "app:maybe", "text": "`DS::Tooltip` takes `placement:` (default `top`) and `offset:` (default 10). Its block content is the hover trigger and the `tooltip_content` slot holds the tooltip body. ill** (`data_migration:migrate_balance_components`)\n-  [...]"}, {"role": "developer", "session": "2b5f87f9", "text": "backfill task has no test yet, add one for it (a migrator test like the other data_migration ones). then do the rate limit part: for self hosted bump rack attack to 10k per token and 20k per ip, hosted stays at 100 and 200. also make ApiRateLimiter hand off to a NoopApiRateLimiter when the app is self hosted, with tests."}, {"role": "agent", "session": "2b5f87f9", "text": "Checking the existing Rack::Attack test for style, then I'll write the rate limit changes."}, {"role": "agent", "session": "2b5f87f9", "text": "Now the rate limit tests and the backfill task test."}, {"role": "agent", "session": "2b5f87f9", "text": "The backfill test and the rate limit changes are written, but none of it has been run, since there's still no Ruby or Postgres here. I only syntax-checked the Ruby files with `ruby -c`.\n\n**Backfill test** (`test/tasks/data_migration_test.rb`)\n- There are no existing data_migration tests to copy. The logic lives in the rake task, not in a migrator class, so this is the first one. It loads the task and invokes it, capturing the output.\n- **Backfill:** it materializes an account, resets the components to zero to mimic legacy rows, runs the task, and checks that `end_balance` matches `balance` again.\n- **Skip cases:** it checks that already-migrated accounts and `pending_deletion` accounts are left alone.\n- **Failures:** it checks that one failing account is logged and the task carries on with the next.\n\n**Rack::Attack** (`config/initializers/rack_attack.rb`)\n- **Self-hosted:** 10k per token and 20k per IP.\n- **Hosted:** 100 per token and 200 per IP, unchanged.\n- **Mechanism:** the limits are lambdas that read the app mode on each request, so tests can stub the mode.\n- **Tests:** they check the helper methods and the throttles' limit lambdas in both modes. They rely on Rack::Attack 6.7.0 accepting a callable `limit`, which I re
