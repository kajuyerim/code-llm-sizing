3": "hit"}, "forbidden": {"F1": false, "F2": false}, "extras": [{"record": 3, "verdict": "supported", "note": "Acceptable scoped exception on STACK-103 that names only the rate limiter pair and keeps the preference intact."}], "notes": "Has accurate balance component terminology, the STACK-105 update and a correctly scoped services exception. It misses the required pitfall that existing rows read zero until the data_migration backfill runs."}}}}</script>
<script id="notes" type="application/json">{"date": "29 Oct 2026", "notice": "Pilot results from one run per push: 15 pushes, 30 maintenance runs. Quality scores cover maybe and linkwarden (10 pushes); actual's merge requests, costs and times are complete but not scored yet. Scores were assigned by a Claude reviewer that saw each push's two proposals under random labels and did not know which pipeline wrote which. No human has verified them.", "findings": ["<b>A captured more of the planted knowledge.<\/b> Over the 10 scored pushes (maybe and linkwarden), sweeper-first found 10 of 12 planted facts and fresh specialists found 7. The gap comes from three pushes (maybe P1, maybe P5, linkwarden P1) where a forked specialist recorded a fact the fresh specialist missed.", "<b>A cost about twice as much and took about twice as long.<\/b> Estimated $18.28 against $8.43, and 22.7 against 11.8 minutes of wall time across all 15 pushes. Every push showed the same direction.", "<b>The extra cost comes from cache writes, not from more work.<\/b> Each forked specialist writes roughly 45k tokens to the prompt cache on its first turn, because its own system prompt sits in front of the inherited sweeper history and breaks the cached prefix. A forks finish in 2 to 6 turns where B's specialists take 6 to 13, yet each fork costs more. Keeping the sweeper's system prompt and passing the role as the first user message should let forks read that history from cache.", "<b>B proposed more useful knowledge beyond the plan.<\/b> Records outside the planted facts were judged supported 10 times for B and 6 times for A, and noise 5 times for B and 8 times for A.", "<b>Both pipelines fell for the same traps.<\/b> Each recorded a restatement of an existing standard in maybe P3 and generalized a one-form filter in maybe P4 (2 of 15 traps each). Quiet pushes were hard for both: B stayed quiet on 2 of 3, A on 1 of 3.", "<b>The baseline knowledge already changed the developer agent's behavior.<\/b> In linkwarden P2 and P3 the agent read the knowledge checkout and followed the conventions on its first try, so the persona never had to correct it. Those facts never appeared in the conversation and were left out of scoring."], "repos": {"maybe": {"what": "Personal finance app, Ruby on Rails (maybe-finance/maybe)", "mode": "Rewind and replay: the persona steered the agent toward five real upstream PRs, one push each", "start": "3eea5a9 (17 Jul 2025)", "withheld": "CLAUDE.md and 9 .cursor/rules files"}, "actual": {"what": "Local-first budgeting app, TypeScript monorepo (actualbudget/actual)", "mode": "Rewind and replay of six real upstream PRs in five pushes", "start": "d9d15c12 (27 Oct 2026)", "withheld": "AGENTS.md, CLAUDE.md, review guidelines, .claude/, .cursor/, .agents/, .codex/"}, "linkwarden": {"what": "Bookmark preservation app, TypeScript monorepo (linkwarden/linkwarden)", "mode": "Build on top: five new features designed for the pilot on the current head", "start": "eff7c6b7 (25 Oct 2026)", "withheld": "AGENTS.md"}}, "caveats": ["One run per push. Differences of one or two facts on a single push are within run-to-run noise; the cost and time gap is consistent across all 15 pushes.", "Scores come from a single Claude reviewer working blind, not from people. Its judgment calls are recorded with the scores, for example treating a restatement of STACK-103 as a trap in maybe P3.", "Costs are the Agent SDK's list-price estimates. The runs used a Claude subscription login, so there is no invoice to check them against. Token counts are exact.", "Conversations are simulated. A persona model played the developer from a private brief; real developers are less consistent and leave more noise in the transcript. In maybe the agent could not run tests because the machine has the wrong Ruby version.", "The runtime drops transcript records whose working directory is outside the application. When the developer agent ran <code>cd<\/code> into the knowledge checkout, two tool calls were dropped. No message text was lost here, but a long detour could lose real conversation.", "Proposals are never merged between pushes, as in production where a human reviews each pull request. Later runs can propose the same fact again; each push is scored on its own.", "The two branches share all runtime code except the strategy module. The sweeper and specialist instructions are each author's own wording, so part of any quality gap may come from prompts rather than from the strategy.", "actual P1 was generated twice. The first attempt was discarded because a planted fact was never delivered; the check was then relaxed so an undelivered fact only drops out of scoring."], "footer": ["Code: runtime branches <code>feat/sweeper-first-runtime<\/code> (A) and <code>feat/fresh-specialist-runtime<\/code> (B) of kajuyerim/code-llm-sizing. The two branches share every runtime module except <code>contextops/strategies.py<\/code>.", "Local artifacts: simulation driver, persona briefs, ground truth, per-push archives and run directories under <code>~/Desktop/contextops-eval<\/code>. Nothing from the simulation was published.", "Prepared with Claude Code for the CMPE 492 Context Ops project."], "tasks": {"maybe/P1": "Fold the per-type account pages into one tabbed page; add missing indexes on core tables", "maybe/P2": "Namespace view components into DS:: (design system) and UI:: (application)", "maybe/P3": "Account activity feed with per-date start and end balance breakdown", "maybe/P4": "Show only active accounts in the transaction form", "maybe/P5": "Cache balance components on balances; relax API rate limits for self-hosted mode", "actual/P1": "Store amounts in every currency with two implied decimals", "actual/P2": "Standardize sync server fetch on Undici", "actual/P3": "Split donut chart helpers into their own files; replace html-to-image with snapdom", "actual/P4": "Keep the search applied after toggling reconciled transactions", "actual/P5": "Add a Quarterly interval to custom reports", "linkwarden/P1": "Link-check API endpoint", "linkwarden/P2": "Check link button in the web app", "linkwarden/P3": "Configurable link-check timeout and a validated request body", "linkwarden/P4": "Temporary admin button to re-queue failed preservation jobs", "linkwarden/P5": "Wrap tag chips on link cards"}, "commentary": {"maybe/P1": "One durable convention was planted: tab partials live under each account type's <code>tabs/<\/code> folder. A recorded it as a naming convention. B wrote a related locale-key pitfall that uses the folder only as an example, so the convention itself is missing from B's merge request. The second fact (the developer runs migrations) never came up, because the agent could not run Ruby on this machine. Neither pipeline turned the rejected lazy-loading idea into a rule.", "maybe/P2": "Both pipelines replaced the stale flat-components rule with the final <code>DS::<\/code> and <code>UI::<\/code> layout, including the late correction that dropped the <code>Component<\/code> suffix. Neither captured the icon helper rule. B also fixed the stale Lookbook preview naming, which A tried but review rejected. Both repeated the same facts across the naming and ViewComponent files; B more so, with eight extra rows against A's four.", "maybe/P3": "Both captured all three planted facts: the activity feed term, design tokens instead of raw colors, and the <code>DS::Tooltip<\/code> API. Both also fell into the same trap: a ViewComponent row that restates the existing business-logic standard as a component rule. A added an unverified namespace pitfall whose mechanism the reviewer doubted. B left the stale flat-components rule in place, which now contradicts its own new ViewComponent row.", "maybe/P4": "A one-line change with nothing to learn. Both pipelines still proposed an Account status term derived from the transaction form filter. A scoped it to that one form and marked it optional; B generalized it to every account picker, which the code does not support. The right outcome was no merge request.", "maybe/P5": "A captured all three planted facts: balance component columns with <code>flows_factor<\/code>, the backfill pitfall (existing rows read zero until the data migration runs), and the self-hosted rate limits. B missed the backfill pitfall, which is the fact most likely to bite the next developer. Both correctly scoped the <code>app/services/<\/code> rate limiter as a one-off exception instead of rewriting the standard.", "linkwarden/P1": "A recorded the SSRF boundary (outbound requests go through <code>safeFetch<\/code>, with the proxy caveat), and the reviewer confirmed it against the source. B proposed nothing for a push that carried two durable rules. Neither recorded the thin-route plus controller convention for the API.", "linkwarden/P2": "Most planted facts never reached the conversation: the agent read the baseline knowledge and followed the router-hook rule on its first try, so the persona had nothing to correct. The one delivered fact (where shared code lives) was missed by both. A's only proposal was a NEEDS_REVIEW note that review held back.", "linkwarden/P3": "Both pipelines recorded both planted facts with accurate, source-checked detail: new variables go in the root <code>.env.sample<\/code>, and request bodies are validated with Zod. Both kept the rejected config-file idea out. Each slightly generalized from the single new timeout variable, which the reviewer did not penalize.", "linkwarden/P4": "The temporary admin button with a direct axios call was a one-off exception, and neither pipeline generalized it. A added one accurate preservation fact (what pending and failed mean, and which fields a re-queue resets). It is true but was not needed for this push. B proposed the same fact, but review rejected it, so B correctly opened no merge request.", "linkwarden/P5": "A routine styling fix. Both pipelines correctly opened no merge request."}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const parse = (id) => { try { return JSON.parse(document.getElementById(id).textContent) || {}; } catch (e) { return {}; } };
  const S = parse("scores"), N = parse("notes");
  const NAMES = { a: "A · sweeper-first", b: "B · fresh specialists" };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (v) => v == null ? "–" : "$" + v.toFixed(2);
  const secs = (v) => v == null ? "–" : (v >= 90 ? (v / 60).toFixed(1) + " min" : Math.round(v) + " s");
  const kTok = (v) => v == null ? "–" : (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : (v / 1e3).toFixed(0) + "k");

  // Markdown: marked when it loaded, raw text otherwise. Raw HTML in sources is shown as text.
  const hasMarked = typeof window.marked !== "undefined" && window.marked.parse;
  if (hasMarked) window.marked.use({ mangle: false, headerIds: false, renderer: { html: (t) => esc(t) } });
  const md = (text) => hasMarked ? `<div class="md">${window.marked.parse(String(text || ""))}</div>` : `<pre class="md" style="white-space:pre-wrap">${esc(text)}</pre>`;
  const stripFrontmatter = (t) => String(t || "").replace(/^---\n[\s\S]*?\n---\n/, "");

  const pushes = [];
  D.repos.forEach((r) => r.pushes.forEach((p) => { p.repo = r.repo; pushes.push(p); }));
  const runOk = (e) => e && e.has_run;
  const ran = pushes.filter((p) => runOk(p.a) && runOk(p.b));
  const score = (p, x) => ((S[p.repo] || {})[p.push] || {})[x] || null;
  const proposed = (e) => (e && e.records || []).filter((r) => r.op !== "NO_CHANGE");
  const accepted = (e) => proposed(e).filter((r) => r.bucket === "accepted");
  const delivered = (p, ex) => !ex.from || (p.delivered || []).some((d) => d === ex.from || d.split(".")[0] === ex.from);
  const taskTitle = (p) => (N.tasks || {})[p.repo + "/" + p.push] || String(p.task || "").split("\n")[0];

  // ---------- Totals ----------
  function totals(list, x) {
    const t = { scored: 0, cost: 0, wall: 0, tokens: 0, cacheWrite: 0, exp: 0, hit: 0, partial: 0, forb: 0, forbN: 0, quiet: 0, quietN: 0, sup: 0, noise: 0, uns: 0 };
    list.forEach((p) => {
      const e = p[x];
      t.cost += e.total_cost_usd || 0; t.wall += e.wall_seconds || 0;
      const k = e.tokens || {};
      t.tokens += (k.inputTokens || 0) + (k.outputTokens || 0) + (k.cacheReadInputTokens || 0) + (k.cacheCreationInputTokens || 0);
      t.cacheWrite += k.cacheCreationInputTokens || 0;
      const gt = p.ground_truth || {};
      if (gt.expected_result === "NO_CHANGE") { t.quietN += 1; if (accepted(e).length === 0) t.quiet += 1; }
      const sc = score(p, x);
      if (!sc) return;
      t.scored += 1;
      (gt.expected || []).forEach((ex) => {
        if (!delivered(p, ex)) return;
        const got = (y) => { const s2 = score(p, y); const v2 = s2 && s2.expected ? s2.expected[ex.id] : null; return v2 && v2 !== "miss"; };
        if (ex.required === false && !got("a") && !got("b")) return;
        t.exp += 1;
        const v = sc.expected ? sc.expected[ex.id] : null;
        if (v === "hit") t.hit += 1; else if (v === "partial") t.partial += 1;
      });
      t.forbN += (gt.forbidden || []).length;
      t.forb += Object.values(sc.forbidden || {}).filter(Boolean).length;
      (sc.extras || []).forEach((v) => { if (v.verdict === "supported") t.sup += 1; else if (v.verdict === "noise") t.noise += 1; else t.uns += 1; });
    });
    return t;
  }
  function scoreboard(list) {
    const A = totals(list, "a"), B = totals(list, "b");
    const rows = [
      ["Planted knowledge captured", `Planted facts that reached the conversation and appear in an accepted record; partial counts as half. Scored pushes: ${A.scored}`, (t) => t.scored ? `${(t.hit + t.partial / 2).toFixed(1)}<small>of ${t.exp}</small>` : "not scored"],
      ["Traps recorded as knowledge", "Rejected ideas or one-off exceptions written as rules", (t) => t.scored ? `${t.forb}<small>of ${t.forbN}</small>` : "not scored"],
      ["Quiet pushes kept quiet", "Pushes with nothing to learn that produced no accepted record", (t) => t.quietN ? `${t.quiet}<small>of ${t.quietN}</small>` : "none"],
      ["Records outside the plan", "Judged supported, noise, or unsupported", (t) => t.scored ? `${t.sup}<small>supported</small> ${t.noise}<small>noise</small> ${t.uns}<small>unsupported</small>` : "not scored"],
      ["Estimated cost", "All agents, list-price estimate", (t) => money(t.cost)],
      ["Wall time", "Maintenance runs end to end", (t) => secs(t.wall)],
      ["Tokens processed", "Input, output, cache reads and writes", (t) => `${kTok(t.tokens)}<small>${kTok(t.cacheWrite)} cache writes</small>`],
    ];
    return `<div class="table-wrap"><table class="data score"><thead><tr><th>Measure</th><th><span class="key"><span class="swatch sw-a"></span>${NAMES.a}</span></th><th><span class="key"><span class="swatch sw-b"></span>${NAMES.b}</span></th></tr></thead><tbody>` +
      rows.map(([n, d, f]) => `<tr><td><b>${n}</b><div class="def">${d}</div></td><td class="num">${f(A)}</td><td class="num">${f(B)}</td></tr>`).join("") + "</tbody></table></div>";
  }

  // ---------- Charts ----------
  const tip = document.getElementById("tip");
  function bindTips(root) {
    root.querySelectorAll("[data-tip]").forEach((el) => {
      el.addEventListener("mousemove", (ev) => { tip.innerHTML = el.dataset.tip; tip.hidden = false; tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 280) + "px"; tip.style.top = (ev.clientY + 14) + "px"; });
      el.addEventListener("mouseleave", () => { tip.hidden = true; });
    });
  }
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
  function grouped(title, cats, getA, getB, fmt, note) {
    const W = 520, H = 220, L = 46, R = 8, Tp = 14, B = 34;
    const vals = cats.flatMap((c) => [getA(c), getB(c)]).filter((v) => v != null);
    const max = niceMax(Math.max(...vals, 0));
    const y = (v) => Tp + (H - Tp - B) * (1 - v / max);
    const band = (W - L - R) / Math.max(cats.length, 1); const bw = Math.max(4, Math.min(22, band / 2 - 6));
    let s = "";
    for (let i = 0; i <= 4; i++) { const v = max * i / 4; const yy = y(v); s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmt(v)}</text>`; }
    s += `<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
    cats.forEach((c, i) => {
      const cx = L + band * i + band / 2;
      [["a", getA(c), cx - bw - 1], ["b", getB(c), cx + 1]].forEach(([x, v, bx]) => {
        if (v == null) return;
        const yy = y(v), h = Math.max(0, y(0) - yy), r = Math.min(4, h, bw / 2);
        s += `<path class="bar-${x}" d="M${bx},${y(0)} V${yy + r} Q${bx},${yy} ${bx + r},${yy} H${bx + bw - r} Q${bx + bw},${yy} ${bx + bw},${yy + r} V${y(0)} Z"/>`;
        s += `<rect x="${bx - 3}" y="${Tp}" width="${bw + 6}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(`<b>${esc(c.label)}</b><br>${NAMES[x]}: ${fmt(v)}`)}"/>`;
      });
      s += `<text class="axis" x="${cx}" y="${H - B + 16}" text-anchor="middle">${esc(c.short)}</text>`;
    });
    return `<div class="chart"><h4>${esc(title)}</h4>${note ? `<p class="small muted">${esc(note)}</p>` : ""}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${s}</svg></div>`;
  }

  // ---------- Overview ----------
  function renderOverview() {
    const cats = ran.map((p) => ({ label: `${p.repo} ${p.push}`, short: `${p.repo[0].toUpperCase()}${p.push.slice(1)}`, p }));
    const tokenCats = [["inputTokens", "Input"], ["outputTokens", "Output"], ["cacheReadInputTokens", "Cache read"], ["cacheCreationInputTokens", "Cache write"]].map(([k, l]) => ({ label: l, short: l, k }));
    const sumTok = (x, k) => ran.reduce((s, p) => s + ((p[x].tokens || {})[k] || 0), 0);
    const meta = [["Date", N.date || ""], ["Model", "Claude Sonnet 5.5, all agents"], ["Pushes", `${ran.length} of ${pushes.length}`], ["Maintenance runs", ran.length * 2]];
    const repoCards = D.repos.map((r) => {
      const list = ran.filter((p) => p.repo === r.repo); const A = totals(list, "a"), B = totals(list, "b"); const i = (N.repos || {})[r.repo] || {};
      return `<a class="repo-card" href="#${r.repo}"><span class="eyebrow">${esc(i.mode ? i.mode.split(":")[0] : "")}</span><h3>${esc(r.repo)}</h3><p class="small muted">${esc(i.what || "")}</p>
        <div class="row"><span class="key"><span class="swatch sw-a"></span>A</span><span>${A.scored ? (A.hit + A.partial / 2).toFixed(1) + " of " + A.exp + " facts" : "not scored"} · ${money(A.cost)}</span></div>
        <div class="row"><span class="key"><span class="swatch sw-b"></span>B</span><span>${B.scored ? (B.hit + B.partial / 2).toFixed(1) + " of " + B.exp + " facts" : "not scored"} · ${money(B.cost)}</span></div>
        <span class="small" style="color:var(--a)">Open the ${esc(r.repo)} page</span></a>`;
    }).join("");
    document.getElementById("view-overview").innerHTML = `
      <header class="stack-lg" style="border-bottom:1px solid var(--rule);padding-bottom:28px">
        <span class="eyebrow">CMPE 492 · Context Ops · pilot report</span>
        <h1>Sweeper-first vs. fresh specialists</h1>
        <p class="muted" style="font-size:1.1rem;max-width:var(--measure)">Two ways to keep a team's shared knowledge current after each push. We simulated ${ran.length} pre-pushes across three open-source repositories and ran both pipelines on identical evidence. Each repository has its own page with its starting knowledge, every push, the two merge requests the pipelines tried to open, and an assessment of each proposal.</p>
        <div class="meta">${meta.map(([k, v]) => `<span>${k} <b>${esc(v)}</b></span>`).join("")}</div>
        <p class="notice">${esc(N.notice || "")}</p>
      </header>
      <section class="stack-lg"><div class="stack"><span class="eyebrow">Summary</span><h2>Results at a glance</h2></div>${scoreboard(ran)}<ol class="findings">${(N.findings || []).map((f) => `<li>${f}</li>`).join("")}</ol></section>
      <section class="stack-lg"><div class="stack"><span class="eyebrow">Repositories</span><h2>Per-repository pages</h2></div><div class="repo-cards">${repoCards}</div></section>
      ${pipelineSection()}
      ${simSection()}
      ${measuresSection()}

        ${agentTable()}</section>
      <section class="stack-lg"><div class="prose"><span class="eyebrow">Discussion</span><h2>Observations and limits</h2></div><ul class="caveats">${(N.caveats || []).map((c) => `<li>${c}</li>`).join("")}</ul></section>
      <footer>${(N.footer || []).map((f) => `<p>${f}</p>`).join("")}</footer>`;
    bindTips(document.getElementById("view-overview"));
  }
  function pipelineSection() {

        <figcaption>Grey boxes run the same code in both experiments; the two branches differ only in the strategy module. The writer commits to a local branch named <code>contextops/&lt;run&gt;</code>; in production that branch becomes the merge request shown on each repository page.</figcaption></figure>
      <div class="cols"><div class="panel"><h3>Held identical</h3><ul class="small"><li>Runtime code outside the strategy step: evidence collection, review checks, writer, accounting</li><li>Model for every agent: Claude Sonnet 5.5</li><li>Budgets: $1.50 per agent, $10 per run, 30 turns per agent, 3 in parallel</li><li>Starting knowledge, pushes, diffs and conversations</li><li>Shared rules, writer and cartographer instructions</li></ul></div>

  function simSection() {
    const rows = D.repos.map((r) => { const i = (N.repos || {})[r.repo] || {}; return `<tr><td><b>${esc(r.repo)}</b><div class="small muted">${esc(i.what || "")}</div></td><td class="small">${esc(i.mode || "")}</td><td class="mono small">${esc(i.start || "")}</td><td class="small">${esc(i.withheld || "")}</td><td class="r">${r.pushes.filter((p) => runOk(p.a) && runOk(p.b)).length}</td></tr>`; }).join("");

      <p>Real developer conversations were not available, so we generated them. For each push a persona model played the developer and talked to a real Claude Code agent working in the application clone. The persona followed a private brief: the task, acceptance criteria, and a few facts the knowledge base should learn. It delivered those facts the way a developer would, mostly by correcting the agent when it got something wrong. It also floated ideas and rejected them, and allowed one-off exceptions that must not become standards.</p>
      <p>The persona ran outside the application directory, so its brief never appeared in the evidence. Before any maintenance run, a driver checked that the planted facts reached the conversation and that words such as "knowledge base" or "documentation" never did. The developer agent could read the starting knowledge, as it would in production.</p></div>

  function measuresSection() {
    return `<section class="stack-lg"><div class="prose"><span class="eyebrow">Method</span><h2>What we measured</h2></div><div class="table-wrap"><table class="data"><thead><tr><th>Measure</th><th>Definition</th><th>Source</th></tr></thead><tbody>
      <tr><td>Planted knowledge captured</td><td>Planted facts that reached the conversation and appear in an accepted record with the right meaning. Partial when the fact is incomplete or filed somewhere clearly worse.</td><td>Brief ground truth, scored blind</td></tr>
      <tr><td>Traps recorded as knowledge</td><td>Accepted records that turn a rejected idea or a one-off exception into a rule.</td><td>Brief ground truth, scored blind</td></tr>
      <tr><td>Quiet pushes kept quiet</td><td>Pushes with nothing worth remembering where the pipeline accepted no record.</td><td>Brief expected result</td></tr>
      <tr><td>Records outside the plan</td><td>Accepted records matching no planted fact, judged supported (true, durable, useful), noise (true but trivial, transient or duplicate) or unsupported (wrong or not backed by evidence).</td><td>Scored blind</td></tr>
      <tr><td>Estimated cost</td><td>Sum of the Agent SDK's per-call estimates at list price. Runs used a subscription login, so there is no invoice. Forked sessions have their parent's cost removed.</td><td><code>metrics.json</code></td></tr>

  function agentTable() {
    const stats = (x) => { const m = {}; ran.forEach((p) => (p[x].agents || []).forEach((a) => { const role = a.label.split(":")[0]; const r = m[role] || (m[role] = { n: 0, cost: 0, turns: 0, ms: 0, cw: 0 }); r.n += 1; r.cost += a.cost_usd || 0; r.turns += a.turns || 0; r.ms += a.duration_ms || 0; r.cw += (a.tokens || {}).cacheCreationInputTokens || 0; })); return m; };
    const SA = stats("a"), SB = stats("b");
    const order = ["sweeper", "terminology-maintainer", "stack-maintainer", "conventions-maintainer", "pitfalls-maintainer", "product-maintainer", "cartographer", "writer"];
    const roles = Array.from(new Set(Object.keys(SA).concat(Object.keys(SB)))).sort((p, q) => (order.indexOf(p) + 99) % 99 - (order.indexOf(q) + 99) % 99);
    const c = (s, f) => s ? f(s) : "–";
    return `<div class="table-wrap"><table class="data"><thead><tr><th>Agent role</th><th class="r">Calls A / B</th><th class="r">Mean cost A / B</th><th class="r">Mean turns A / B</th><th class="r">Mean time A / B</th><th class="r">Mean cache writes A / B</th></tr></thead><tbody>` +
      roles.map((r) => { const a = SA[r], b = SB[r]; return `<tr><td>${esc(r)}</td><td class="r">${c(a, (s) => s.n)} / ${c(b, (s) => s.n)}</td><td class="r">${c(a, (s) => money(s.cost / s.n))} / ${c(b, (s) => money(s.cost / s.n))}</td><td class="r">${c(a, (s) => (s.turns / s.n).toFixed(1))} / ${c(b, (s) => (s.turns / s.n).toFixed(1))}</td><td class="r">${c(a, (s) => secs(s.ms / s.n / 1000))} / ${c(b, (s) => secs(s.ms / s.n / 1000))}</td><td class="r">${c(a, (s) => kTok(s.cw / s.n))} / ${c(b, (s) => kTok(s.cw / s.n))}</td></tr>`; }).join("") + "</tbody></table></div>";
  }

  // ---------- Repository page ----------
  let state = { repo: null, push: "P1", file: "index.md" };
  function renderRepo(repoName) {
    const r = D.repos.find((x) => x.repo === repoName); if (!r) return;
    const i = (N.repos || {})[r.repo] || {};

      <section class="stack-lg"><div class="stack"><span class="eyebrow">Summary for ${esc(r.repo)}</span><h2>Both pipelines on this repository</h2></div>${scoreboard(list)}${(N.repoNotes || {})[r.repo] ? `<p class="callout">${(N.repoNotes || {})[r.repo]}</p>` : ""}</section>
      <section class="stack-lg" id="kb-section"><div class="prose"><span class="eyebrow">Starting point</span><h2>Baseline shared knowledge</h2><p class="muted">The knowledge base both pipelines started from at every push, and the copy the developer agent read while working. Rules that the persona held back are not here; the pipelines had to learn them from the conversations. Proposals were never merged between pushes, so this is also the baseline each merge request below is diffed against.</p></div>

    seg.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.push = b.dataset.v; seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); renderPush(r); try { history.replaceState(null, "", `#${r.repo}-${state.push.toLowerCase()}`); } catch (e) {} }));
    renderPush(r);
  }
  function renderKb(r) {
    const files = r.baseline || [];
    if (!files.find((f) => f.path === state.file)) state.file = files.length ? files[0].path : "";
    const groups = [["Index", (f) => f.path === "index.md"], ["Core", (f) => f.path.startsWith("core/")], ["Products", (f) => f.path.startsWith("products/")]];

    tree.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.file = b.dataset.p; tree.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); showDoc(r); }));

    document.getElementById("kb-doc").innerHTML = f ? `<div class="kb-path">kb/${esc(r.repo)}/${esc(f.path)}</div>${md(stripFrontmatter(f.text).replace(/\[([^\]]+)\]\((?!https?:)[^)]*\)/g, "$1"))}` : "";
  }

  function renderPush(r) {
    const p = r.pushes.find((x) => x.push === state.push);
    const body = document.getElementById("push-body");
    if (!p) { body.innerHTML = ""; return; }
    const both = runOk(p.a) && runOk(p.b);
    document.getElementById("push-hint").textContent = both ? "" : "This push did not finish before the page was built.";
    const gt = p.ground_truth || {};
    const ds = p.diffstat || {};
    const narrative = ((N.narratives || {})[p.repo + "/" + p.push]) || "";
    const acc = Array.isArray(p.acceptance) ? p.acceptance : (p.acceptance ? [p.acceptance] : []);
    const planted = (gt.expected || []).map((e) => `<div class="planted-row"><span class="id">${esc(e.id)}</span><div><div>${esc(e.gist)}</div><div class="small faint">${esc(e.owner || "")} · ${esc(e.target || "")}${e.required === false ? " · optional" : ""}${delivered(p, e) ? "" : " · <b>never reached the conversation; not scored</b>"}</div></div></div>`).join("") +
      (gt.forbidden || []).map((f) => `<div class="planted-row"><span class="id" style="color:var(--bad)">${esc(f.id)}</span><div><div>${esc(f.gist)}</div><div class="small faint">trap: must not become a rule</div></div></div>`).join("") +
      (gt.expected_result === "NO_CHANGE" ? `<div class="planted-row"><span class="id">NC</span><div>Nothing in this push is worth remembering. The right outcome is no merge request.</div></div>` : "");
    const transcript = (p.transcript || []).map((m) => `<div class="msg ${m.role}"><div class="who">${m.role === "developer" ? "Developer (persona)" : "Agent (Claude Code)"}</div><div class="bubble">${esc(m.text)}</div></div>`).join("");
    body.innerHTML = `
      <div class="push-title"><span class="eyebrow">${esc(r.repo)} · ${esc(p.push)}${gt.expected_result ? " · expected " + esc(gt.expected_result.replace("_", " ").toLowerCase()) : ""}</span><h3 style="font-size:1.45rem">${esc(taskTitle(p))}</h3></div>
      <div class="grid-2">
        <div class="panel"><h4>What happened</h4>${narrative ? `<p class="small">${narrative}</p>` : ""}
          ${acc.length ? `<div class="small faint">The developer's acceptance criteria</div><ul class="list">${acc.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
          ${p.real_commits && p.real_commits.length ? `<div class="small faint">Replayed upstream work</div><ul class="list mono small">${(p.real_commits || []).map((c) => `<li>${esc(typeof c === "string" ? c : (c.sha || "") + " " + (c.title || c.subject || ""))}</li>`).join("")}</ul>` : ""}</div>
        <div class="panel"><h4>Result in the application</h4>
          <div class="statline"><span>${(ds.commits || []).length} commit${(ds.commits || []).length === 1 ? "" : "s"}</span><span>${ds.files || 0} files</span><span class="plus">+${ds.added || 0}</span><span class="minus">−${ds.deleted || 0}</span><span>${p.persona_turns || 0} developer turns</span></div>
          <ul class="list mono small">${(ds.commits || []).map((c) => `<li>${esc(c.sha)} ${esc(c.subject)}</li>`).join("")}</ul>
          ${(ds.top || []).length ? `<div class="small faint">Largest changes</div><ul class="files">${ds.top.map(([f, a, d]) => `<li><span>${esc(f)}</span><span><span style="color:var(--good)">+${a}</span> <span style="color:var(--bad)">−${d}</span></span></li>`).join("")}</ul>` : ""}</div>
      </div>
      <div class="panel"><h4>Planted in the conversation</h4><div class="planted">${planted || '<p class="small muted">No planted facts.</p>'}</div></div>
      ${transcript ? `<details class="conv"><summary>Conversation the pipelines read (${(p.transcript || []).length} messages)</summary><div class="chat">${transcript}</div></details>` : ""}
      <div class="stack"><h3>Merge requests</h3><p class="small muted">What each pipeline would have opened on the knowledge repository. Nothing was published; these are the local branches the writer committed.</p></div>

    body.querySelectorAll(".mr").forEach((m) => {

        m.querySelectorAll(".mr-pane").forEach((pane) => { pane.hidden = pane.dataset.pane !== b.dataset.pane; });
      }));
    });
  }

  function diffFiles(patch) {
    const files = []; let cur = null, oldN = 0, newN = 0;
    String(patch || "").split("\n").forEach((l) => {
      if (l.startsWith("diff --git")) { cur = { name: l.replace(/^diff --git a\/(\S+) b\/.*$/, "$1"), rows: [], add: 0, del: 0 }; files.push(cur); return; }
      if (!cur || l.startsWith("index ") || l.startsWith("--- ") || l.startsWith("+++ ") || l.startsWith("new file") || l.startsWith("deleted file")) return;
      const h = l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/);
      if (h) { oldN = +h[1]; newN = +h[2]; cur.rows.push({ t: "hunk", c: l }); return; }
      if (l.startsWith("+")) { cur.rows.push({ t: "add", o: "", n: newN++, c: l.slice(1) }); cur.add++; }
      else if (l.startsWith("-")) { cur.rows.push({ t: "del", o: oldN++, n: "", c: l.slice(1) }); cur.del++; }
      else if (l.startsWith("\\")) { /* no newline marker */ }
      else if (l.length || cur.rows.length) { cur.rows.push({ t: "ctx", o: oldN++, n: newN++, c: l.slice(1) }); }
    });
    return files;
  }
  function mrTitle(acc) {
    const targets = Array.from(new Set(acc.map((x) => (x.target || "").replace(/^core\//, "").replace(/\.md$/, "").replace(/^products\//, "").replace(/\/README$/, ""))));
    return `Update ${targets.slice(0, 3).join(", ")}${targets.length > 3 ? " and more" : ""}`;
  }
  let iid = 0;
  function mr(r, p, x) {
    const e = p[x];
    const head = `<div class="mr-exp"><span class="key"><span class="swatch sw-${x}"></span>${NAMES[x]}</span>${runOk(e) ? `<span class="faint">${money(e.total_cost_usd)} · ${secs(e.wall_seconds)} · ${(e.agents || []).length} agents</span>` : ""}</div>`;
    if (!runOk(e)) return `<article class="mr ${x}"><div class="mr-head">${head}<div class="mr-title">No run</div><p class="small muted" style="padding-bottom:16px">This maintenance run did not complete before the page was built.</p></div></article>`;
    const acc = accepted(e);
    const held = proposed(e).filter((q) => q.bucket !== "accepted");
    if (!acc.length) {
      return `<article class="mr ${x}"><div class="mr-head">${head}<div class="mr-title">No merge request</div><div class="mr-meta"><span class="state none">Nothing to merge</span><span>Every specialist returned NO_CHANGE or review held its proposals back.</span></div></div>
        <div class="mr-pane">${held.length ? heldBox(held) : ""}${e.report_md ? `<details><summary class="small">Run report</summary>${md(e.report_md)}</details>` : ""}</div></article>`;
    }
    iid += 1;
    const files = diffFiles(e.kb_patch);
    const add = files.reduce((s, f) => s + f.add, 0), del = files.reduce((s, f) => s + f.del, 0);
    const changes = files.map((f) => `<div class="difffile"><div class="difffile-head"><span>${esc(f.name)}</span><span><span class="plus">+${f.add}</span> <span class="minus">−${f.del}</span></span></div><div class="diff-scroll"><table class="diff">${f.rows.map((row) => row.t === "hunk" ? `<tr class="hunk"><td class="n"></td><td class="n"></td><td class="c">${esc(row.c)}</td></tr>` : `<tr class="${row.t}"><td class="n">${row.o}</td><td class="n">${row.n}</td><td class="c">${row.t === "add" ? "+" : row.t === "del" ? "−" : " "}${esc(row.c)}</td></tr>`).join("")}</table></div></div>`).join("");
    const pane = (name, html, hidden) => `<div class="mr-pane" data-pane="${name}" ${hidden ? "hidden" : ""}>${html}</div>`;
    return `<article class="mr ${x}"><div class="mr-head">${head}
        <div class="mr-title">${esc(mrTitle(acc))} <span class="iid">!${iid}</span></div>
        <div class="mr-meta"><span class="state">● Open</span><span><b>contextops-bot</b> requested to merge</span><span class="branchref">${esc(e.kb_branch || "contextops/run")}</span><span>into</span><span class="branchref">main</span></div>
        <div class="mr-tabs" role="tablist"><button type="button" role="tab" data-pane="overview" aria-selected="true">Overview</button><button type="button" role="tab" data-pane="changes" aria-selected="false">Changes<span class="count">${files.length}</span></button><button type="button" role="tab" data-pane="records" aria-selected="false">Records<span class="count">${acc.length}</span></button></div></div>
      ${pane("overview", `<div class="mr-side"><span>Files <b>${files.length}</b></span><span>Lines <b style="color:var(--good)">+${add}</b> <b style="color:var(--bad)">−${del}</b></span><span>Records <b>${acc.length}</b></span>${held.length ? `<span>Held back <b>${held.length}</b></span>` : ""}</div><div class="mr-desc">${md(e.report_md || "")}</div>`)}
      ${pane("changes", changes || '<p class="small muted">No file changes recorded.</p>', true)}
      ${pane("records", acc.map((q) => recHtml(q)).join("") + (held.length ? heldBox(held) : ""), true)}
    </article>`;
  }
  function cleanRow(t) { t = String(t || "").trim(); if (t.startsWith("|")) { const parts = t.split("|").map((v) => v.trim()).filter(Boolean); return parts.slice(1, Math.max(2, parts.length - 1)).join(" · "); } return t; }
  function recHtml(q, verdictHtml) {
    return `<div class="rec"><div class="line"><span class="op ${esc(q.op)}">${esc(q.op)}</span><span>${esc(q.fact_id || "")}</span><span class="faint">${esc(q.target)}</span>${verdictHtml || ""}</div><div class="text">${esc(cleanRow(q.text))}</div>${q.agent ? `<div class="why">${esc(q.agent)}</div>` : ""}</div>`;
  }
  function heldBox(held) {
    return `<div class="held"><b class="small">Held back by review</b>${held.map((q) => `<div><div class="line mono small"><span class="op ${esc(q.op)}">${esc(q.op)}</span> ${esc(q.fact_id || "")} <span class="faint">${esc(q.target)}</span> · ${esc(q.bucket)}</div><div class="small">${esc(cleanRow(q.text))}</div>${q.problem ? `<div class="small faint">Review: ${esc(q.problem)}</div>` : ""}</div>`).join("")}</div>`;
  }

  const VERDICT = {
    hit: ["v-hit", "✓", "planted fact"], partial: ["v-partial", "~", "partial"], miss: ["v-miss", "–", "missed"],
    supported: ["v-hit", "+", "supported addition"], noise: ["v-note", "·", "noise"], unsupported: ["v-bad", "✕", "unsupported"],
  };
  const chip = (k, label) => { const v = VERDICT[k] || ["v-note", "·", k]; return `<span class="chip ${v[0]}"><i>${v[1]}</i>${esc(label || v[2])}</span>`; };
  function assessment(p) {
    const gt = p.ground_truth || {};
    const sa = score(p, "a"), sb = score(p, "b");
    if (!runOk(p.a) || !runOk(p.b)) return "";
    const head = `<div class="stack"><h3>Assessment</h3><p class="small muted">Verdicts come from a reviewer that saw both proposals under random labels. Planted facts count only if they reached the conversation.</p></div>`;
    if (!sa || !sb) return `<section class="assess">${head}<p class="callout">This push has not been scored yet. The merge requests above are complete; the verdicts are still to come.</p></section>`;
    const factRows = (gt.expected || []).filter((ex) => delivered(p, ex)).map((ex) => {
      const va = (sa.expected || {})[ex.id] || "miss", vb = (sb.expected || {})[ex.id] || "miss";
      return `<tr><td class="mono"><b>${esc(ex.id)}</b></td><td>${esc(ex.gist)}${ex.required === false ? ' <span class="faint">(optional)</span>' : ""}</td><td>${chip(va)}</td><td>${chip(vb)}</td></tr>`;
    }).join("") + (gt.forbidden || []).map((f) => {
      const va = !!(sa.forbidden || {})[f.id], vb = !!(sb.forbidden || {})[f.id];
      const c = (v) => v ? `<span class="chip v-bad"><i>✕</i>recorded as a rule</span>` : `<span class="chip v-hit"><i>✓</i>avoided</span>`;
      return `<tr><td class="mono" style="color:var(--bad)"><b>${esc(f.id)}</b></td><td><span class="faint">Trap:</span> ${esc(f.gist)}</td><td>${c(va)}</td><td>${c(vb)}</td></tr>`;
    }).join("") + (gt.expected_result === "NO_CHANGE" ? `<tr><td class="mono"><b>NC</b></td><td>Stay quiet: nothing here is worth remembering</td><td>${accepted(p.a).length ? chip("unsupported", accepted(p.a).length + " accepted") : chip("hit", "no change")}</td><td>${accepted(p.b).length ? chip("unsupported", accepted(p.b).length + " accepted") : chip("hit", "no change")}</td></tr>` : "");
    const side = (x, sc) => {
      const recs = proposed(p[x]);
      const extras = {}; (sc.extras || []).forEach((v) => { extras[v.record] = v; });
      const items = recs.map((q, i) => {
        if (q.bucket !== "accepted") return recHtml(q, `<span class="chip v-note"><i>!</i>held back (${esc(q.bucket)})</span>`);
        const v = extras[i];
        if (v) return recHtml(q, chip(v.verdict)) + (v.note ? `<div class="why" style="margin:-6px 0 8px">${esc(v.note)}</div>` : "");
        return recHtml(q, `<span class="chip v-hit"><i>✓</i>planted fact or trap, see table</span>`);
      }).join("");
      const missed = (gt.expected || []).filter((ex) => delivered(p, ex) && ((sc.expected || {})[ex.id] || "miss") === "miss");
      return `<div class="panel"><h4><span class="key"><span class="swatch sw-${x}"></span>${NAMES[x]}</span></h4>${sc.notes ? `<p class="small">${esc(sc.notes)}</p>` : ""}
        ${items || '<p class="small muted">No records proposed.</p>'}
        ${missed.length ? `<div class="small"><b>Could have been added:</b><ul class="list">${missed.map((ex) => `<li>${esc(ex.gist)} <span class="faint">(${esc(ex.target || ex.owner || "")})</span></li>`).join("")}</ul></div>` : ""}</div>`;
    };
    const commentary = ((N.commentary || {})[p.repo + "/" + p.push]) || "";
    return `<section class="assess">${head}${commentary ? `<p class="callout">${commentary}</p>` : ""}
      <div class="table-wrap"><table class="data verdict-table"><thead><tr><th>ID</th><th>Planted fact or trap</th><th><span class="key"><span class="swatch sw-a"></span>A</span></th><th><span class="key"><span class="swatch sw-b"></span>B</span></th></tr></thead><tbody>${factRows || '<tr><td colspan="4" class="muted">Nothing planted reached the conversation.</td></tr>'}</tbody></table></div>
      <div class="assess-cols">${side("a", sa)}${side("b", sb)}</div></section>`;
  }

  // ---------- Routing ----------
  const nav = document.getElementById("nav");
  nav.innerHTML = [`<a href="#overview">Overview</a>`].concat(D.repos.map((r) => `<a href="#${r.repo}">${esc(r.repo)}</a>`)).join("");
  function route() {
    const h = (location.hash || "#overview").slice(1);
    const m = h.match(/^([a-z0-9]+)(?:-(p\d))?$/);
    const repo = m && D.repos.find((r) => r.repo === m[1]) ? m[1] : null;
    nav.querySelectorAll("a").forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + (repo || "overview") ? "page" : "false"));
    document.getElementById("view-overview").hidden = !!repo;
    document.getElementById("view-repo").hidden = !repo;
    if (repo) {
      if (repo !== state.repo) { state.repo = repo; state.file = "index.md"; state.push = "P1"; }
      if (m[2]) state.push = m[2].toUpperCase();
      iid = 0; renderRepo(repo);
      if (m[2]) { const s = document.getElementById("push-section"); if (s) s.scrollIntoView(); } else window.scrollTo(0, 0);
    } else window.scrollTo(0, 0);
  }
  renderOverview();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
