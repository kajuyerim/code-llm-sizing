<style>
/* Palette and type follow the Context Ops walkthrough page: warm paper, deep green ink, serif headings.
   A is rust, B is teal; Sonnet solid, Haiku light. Verdicts use olive (caught), gold (partly), grey (not caught). */
:root {
  --paper: #f5f2eb; --white: #fffefa; --ink: #23312f; --muted: #65716a; --line: #d9ddd3; --dark: #20322e;
  --a: #ab4f32; --a-lt: #d39a82; --a-soft: #f7e8df;
  --b: #167367; --b-lt: #7fb3a7; --b-soft: #e4f0e9;
  --gold: #8e6c25; --gold-soft: #f6edd6;
  --hit: #4d6b22; --hit-soft: #e6ecd5;
  --miss: #7a7f78; --miss-soft: #ecebe5;
  --bubble-agent: #eef0e8; --code: #ebe8df;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; line-height: 1.15; text-wrap: balance; }
h1 { font: 400 clamp(36px, 5vw, 64px)/1.05 var(--serif); letter-spacing: -1.5px; }
h2 { font: 400 clamp(28px, 3.4vw, 40px)/1.1 var(--serif); letter-spacing: -0.8px; }
h3 { font: 400 22px/1.2 var(--serif); }
h4 { font: 600 14px/1.3 var(--sans); }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; }
code { font: 0.86em var(--mono); background: var(--code); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
pre { font: 12px/1.5 var(--mono); background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 0; }
pre code { background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--b); outline-offset: 3px; }
::selection { background: #d9e7d4; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }
.eyebrow { font: 650 11px/1.2 var(--sans); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.prose { max-width: 72ch; display: grid; gap: 14px; }
main { padding-block: 48px 120px; }
main > .wrap { display: grid; gap: 96px; }
section { display: grid; gap: 26px; scroll-margin-top: 84px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(245, 242, 235, .96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.topbar .wrap { min-height: 64px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; gap: 10px; align-items: center; font-weight: 650; font-size: 15px; letter-spacing: -.2px; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; }
.mark { width: 22px; height: 22px; display: flex; align-items: flex-end; gap: 3px; }
.mark i { display: block; width: 4px; border-radius: 2px; background: var(--ink); height: 20px; }
.mark i:nth-child(2) { height: 12px; background: var(--a); } .mark i:nth-child(3) { height: 16px; background: var(--b); }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 6px 11px; border-radius: 999px; }
.nav a:hover { background: var(--white); color: var(--ink); }
.nav a[aria-current="true"] { color: var(--ink); background: var(--white); box-shadow: inset 0 0 0 1px var(--line); }

/* Overview */
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 13px/1.4 var(--sans); color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.notice { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 14px; max-width: 72ch; }
.legend { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: 14px; }
.cond { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; font-size: 13px; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
.c-a-sonnet { background: var(--a); } .c-a-haiku { background: var(--a-lt); } .c-b-sonnet { background: var(--b); } .c-b-haiku { background: var(--b-lt); }
.findings { display: grid; gap: 16px; counter-reset: f; padding: 0; margin: 0; list-style: none; max-width: 76ch; }
.findings li { padding-left: 38px; position: relative; }
.findings li::before { counter-increment: f; content: counter(f); position: absolute; left: 0; top: 0; width: 25px; height: 25px; border-radius: 50%; background: var(--dark); color: var(--paper); font: 600 12px/25px var(--sans); text-align: center; }
.table-wrap { overflow-x: auto; background: var(--white); border: 1px solid var(--line); border-radius: 10px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.data thead th { font: 650 11px/1.2 var(--sans); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data .r { text-align: right; white-space: nowrap; }
table.data tr.total td { font-weight: 650; background: var(--paper); }
.big { font: 400 26px/1 var(--serif); }

/* Charts and panels */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.cols > * { min-width: 0; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis { fill: var(--muted); font: 11px var(--sans); }
.chart .lbl { fill: var(--ink); font: 600 12px var(--sans); }
.chart .val { fill: var(--ink); font: 11px var(--mono); }
.f-a-sonnet { fill: var(--a); } .f-a-haiku { fill: var(--a-lt); } .f-b-sonnet { fill: var(--b); } .f-b-haiku { fill: var(--b-lt); }

/* Chat bubbles, shared by examples, fact cards and the conversation view */
.bubble { border-radius: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; min-width: 0; }
.bubble.dev { background: var(--dark); color: #f3f1ea; border-bottom-right-radius: 4px; }
.bubble.dev code { background: rgba(255, 255, 255, .14); color: inherit; }
.bubble.agent { background: var(--white); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble.stop { background: var(--gold-soft); color: var(--gold); font-size: 13px; }
.bubble .md > :first-child { margin-top: 0; } .bubble .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 .7em; } .md ul, .md ol { padding-left: 1.3em; }
.md h1, .md h2, .md h3, .md h4 { font: 650 14px/1.4 var(--sans); margin: .8em 0 .3em; }
.md table { border-collapse: collapse; font-size: 13px; margin: .4em 0; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--paper); font-weight: 650; }
.who { font: 650 11px/1.2 var(--sans); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.pair { display: grid; gap: 8px; align-content: start; }

/* Analysis */
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.why .panel p { font-size: 14px; }
.split { display: grid; gap: 14px; }
.split-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 60px; gap: 12px; align-items: center; font-size: 13px; }
.split-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: var(--paper); }
.split-bar span { display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
.split-tot { font: 400 20px var(--serif); text-align: right; }
.levers td:first-child { font-weight: 650; white-space: nowrap; }
.levers td { font-size: 13px; }
.levers td.save { white-space: nowrap; font-weight: 650; color: var(--hit); }
.callout { background: var(--dark); color: #f3f1ea; border-radius: 12px; padding: 18px 22px; max-width: 80ch; }
.next { display: grid; gap: 12px; counter-reset: n; padding: 0; margin: 0; list-style: none; max-width: 80ch; }
.next li { padding-left: 38px; position: relative; }
.next li::before { counter-increment: n; content: counter(n); position: absolute; left: 0; top: 0; width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid var(--ink); font: 600 12px/22px var(--sans); text-align: center; }

/* Repository */
.mates { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.mate { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; font-size: 13px; }
.mate .av { grid-row: span 3; }
.mate b { font: 400 19px/1.2 var(--serif); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 650 15px var(--sans); color: #fff; flex: none; }
.av.sm { width: 30px; height: 30px; font-size: 12px; }
.av.m0 { background: #6b4f8a; } .av.m1 { background: #8e6c25; } .av.m2 { background: #2f5d7c; } .av.agentav { background: var(--ink); }
.tasks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.tasks li { display: grid; grid-template-columns: 40px 64px 1fr; gap: 12px; font-size: 14px; align-items: baseline; }
.tasks .tid { font: 600 12px var(--mono); color: var(--muted); }
.tasks .tm { font-weight: 650; }

.fact { background: var(--white); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.fact + .fact { margin-top: 18px; }
.fact-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--paper); }
.fid { font: 650 13px var(--mono); }
.tag { font: 650 10px/1 var(--sans); letter-spacing: 1px; text-transform: uppercase; padding: 5px 7px; border-radius: 4px; background: var(--miss-soft); color: var(--muted); }
.tag.req { background: var(--dark); color: var(--paper); }
.fact-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
.fact-left { padding: 18px; display: grid; gap: 16px; align-content: start; border-right: 1px solid var(--line); }
.said { display: grid; gap: 6px; }
.said .bubble { justify-self: start; max-width: 100%; }
.jump { font-size: 12px; color: var(--b); font-weight: 600; text-decoration: none; justify-self: start; }
.jump:hover { text-decoration: underline; }
.mdcard { display: grid; gap: 6px; }
.file { font: 12px var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.file::before { content: ""; width: 10px; height: 12px; border: 1.5px solid var(--muted); border-radius: 2px; flex: none; }
.mdbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--white); overflow-x: auto; font-size: 13px; }
.mdbox.expected { border-color: var(--ink); border-style: dashed; }
.fact-right { display: grid; align-content: start; }
.verdict { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
.verdict:last-child { border-bottom: 0; }
.verdict .vh { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { font: 650 11px/1 var(--sans); padding: 6px 9px; border-radius: 999px; white-space: nowrap; }
.pill.hit { background: var(--hit-soft); color: var(--hit); }
.pill.partial { background: var(--gold-soft); color: var(--gold); }
.pill.miss { background: var(--miss-soft); color: var(--miss); }
.proposed { font-size: 12px; color: var(--muted); font-weight: 600; }
.nocatch { font-size: 13px; color: var(--miss); font-style: italic; }
.excluded .fact-body { grid-template-columns: 1fr; }
.excluded .fact-left { border-right: 0; opacity: .75; }
.trap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.trap:last-child { border-bottom: 0; }
.trapmarks { display: flex; gap: 6px; flex-wrap: wrap; }
.tm-ok, .tm-bad { font: 650 11px/1 var(--sans); padding: 6px 8px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
.tm-ok { background: var(--hit-soft); color: var(--hit); } .tm-bad { background: var(--a-soft); color: var(--a); }
details.more > summary { cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 600; }
details.more[open] > summary { margin-bottom: 14px; }

/* Conversations: a messaging app */
.chat-app { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: min(82vh, 860px); background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.threads { border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; overscroll-behavior: contain; background: #faf8f3; }
.threads h4 { padding: 14px 16px 6px; font: 650 11px/1 var(--sans); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.thread { display: grid; grid-template-columns: 40px 1fr; gap: 2px 10px; padding: 10px 14px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; color: inherit; font: inherit; }
.thread:hover { background: var(--paper); }
.thread[aria-current="true"] { background: var(--b-soft); }
.thread .av { grid-row: span 2; }
.thread .tn { font-weight: 650; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.thread .tn span { font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.thread .tp { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pane { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.pane-head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; background: var(--white); }
.pane-head .pt { display: grid; gap: 1px; min-width: 0; }
.pane-head b { font-size: 15px; }
.pane-head span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: 18px 22px 30px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }
.sep { text-align: center; font: 650 10px/1 var(--sans); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 10px 0; display: flex; gap: 12px; align-items: center; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.row { display: flex; gap: 10px; align-items: flex-end; max-width: 82%; }
.row.dev { align-self: flex-end; flex-direction: row-reverse; }
.row.agent, .row.stop { align-self: flex-start; }
.row .col { display: grid; gap: 4px; min-width: 0; }
.row.dev .col { justify-items: end; }
.stamp { font: 11px var(--sans); color: var(--muted); }
.marks { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.mark-chip { font: 650 10px/1 var(--sans); padding: 5px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); text-decoration: none; letter-spacing: .5px; }
.mark-chip.trapc { background: var(--a-soft); color: var(--a); }
.tools { font-size: 12px; color: var(--muted); }
.tools summary { cursor: pointer; }
.tools ol { margin: 6px 0 0; padding-left: 1.4em; font: 11px/1.5 var(--mono); overflow-wrap: anywhere; }
.row.flash .bubble { box-shadow: 0 0 0 3px var(--gold); }
.thread-select { display: none; }

.caveats { display: grid; gap: 10px; max-width: 76ch; padding-left: 18px; margin: 0; }
footer { color: var(--muted); font-size: 13px; }

@media (max-width: 860px) {
  .fact-body { grid-template-columns: 1fr; }
  .fact-left { border-right: 0; border-bottom: 1px solid var(--line); }
  .chat-app { grid-template-columns: 1fr; height: auto; }
  .threads { display: none; }
  .thread-select { display: block; width: 100%; padding: 10px 12px; font: 14px var(--sans); border: 0; border-bottom: 1px solid var(--line); background: #faf8f3; color: var(--ink); }
  .feed { max-height: 75vh; padding: 14px; }
  .row { max-width: 94%; }
}
@media (max-width: 480px) {

}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; counter-reset: step; }
.steps .panel { position: relative; padding-top: 34px; }
.steps .panel::before { counter-increment: step; content: counter(step); position: absolute; top: 12px; left: 18px; font: 600 12px/1 var(--sans); color: var(--a); letter-spacing: 1px; }
.loopline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.loopline span.box { background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.loopline span.arr { color: var(--muted); }
.keeps { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.keeps ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.cond.c-none .sw { background: #b9b4a8; }
.sw.c-none { background: #b9b4a8; }
.exp-cap { font-size: 13px; color: var(--muted); }
td.good { color: var(--hit); font-weight: 650; }
.setups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.setups .panel h4 { display: flex; gap: 8px; align-items: center; }
.setups pre { white-space: pre-wrap; font-size: 11.5px; max-height: 220px; overflow: auto; }
.sbadge { display: inline-block; font: 600 12px/1 var(--sans); padding: 5px 9px; border-radius: 999px; background: var(--miss-soft); color: var(--ink); white-space: nowrap; }
.sbadge.kb { background: var(--b-soft); color: var(--b); }
.sbadge.kbd { background: var(--a-soft); color: var(--a); }
.exp { display: grid; gap: 12px; }
.exp .plain { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--b); border-radius: 10px; padding: 14px 18px; display: grid; gap: 8px; }
.exp .plain p { font-size: 15px; }
.headline { display: flex; flex-wrap: wrap; gap: 10px; }
.headline .hv { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; min-width: 150px; }
.headline .hv b { font: 400 30px/1.1 var(--serif); }
.headline .hv span { font-size: 12px; color: var(--muted); }
.headline .hv.win b { color: var(--hit); }
details.full summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.rcard { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 14px; }
.rcard table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rcard td, .rcard th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.rcard th { font: 650 11px/1.2 var(--sans); letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
.ok { color: var(--hit); font-weight: 650; } .no { color: var(--a); font-weight: 650; } .na { color: var(--muted); } .unjudged { color: var(--muted); font-weight: 650; text-decoration: underline dotted; text-underline-offset: 2px; }
.kind { font-size: 11px; color: var(--muted); display: block; }
.notice2 { background: var(--gold-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.tscore { font-size: 12px; color: var(--muted); }

/* Keep narrow screens within the viewport while preserving horizontal table scrolling. */
main > .wrap { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.wrap > section, section, .exp, details.full, .table-wrap, .prose { min-width: 0; max-width: 100%; }
.table-wrap { width: 100%; overflow-x: auto; }
.table-wrap table { width: max-content; min-width: 100%; }

"quote":"Market flows stay non-cash only"}],"reason":"Developer defined the new component layout and generated end columns; source at head confirms. Extends the existing term rather than duplicating.","agent":"terminology-maintainer"},{"target":"core/terminology.md","fact_id":"TERM-109","op":"ADD","text":"| TERM-109 | Flows factor | The sign on a Balance (`flows_factor`): 1 for assets and -1 for liabilities. Inflows and outflows are defined by entry sign, not by effect on the balance, so a loan payment is an inflow that lowers the debt and needs a factor of -1. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"64dd9fc7-4695-4e74-8e0a-48e0539347d1","quote":"inflows go up on assets and down on liabilities, like a loan payment"},{"kind":"source","path":"app/models/balance.rb","line":10,"quote":"flows_factor"}],"reason":"Developer-stated definition of a team-specific column meaning, not obvious from code.","agent":"terminology-maintainer"},{"target":"core/terminology.md","fact_id":"TERM-110","op":"ADD","text":"| TERM-110 | Daily activity breakdown | What `Account::DailyActivity` reports for each day of an account's activity tab: income, expense, trades, holdings and adjustment. Amounts are effects on the account balance and always sum to the day's change. Trades is the cash moved by trades, holdings is the offsetting value of shares at the trade price, and adjustment is the residual (reconciliations, market moves, anything without an entry). Net market flows are folded into adjustment. Fees are separate cash outflows and show as expense, not as trades. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"app/models/account/daily_activity.rb","line":7,"quote":"always sums to the day's change"},{"kind":"conversation","session":"cbd5d4bc-7d5d-46f5-9419-10dba5f8c210","message":"165291df-281a-44d9-87b1-58648a965cab","quote":"I'd rather have a separate holdings bucket"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"34a28aa6-e09d-4913-bf7f-c55ee6c14bd3","quote":"just map net_market_flows into the adjustment row like today"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"60a871f5-dd2c-4664-987d-7967e0e1eeab","quote":"fees being a separate cash outflow is fine"}],"reason":"Developer accepted these bucket meanings, including the holdings bucket and the residual adjustment; source at head matches.","agent":"terminology-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-105","op":"UPDATE","text":"| STACK-105 | The external API lives under `/api/v1`, authenticates with Doorkeeper OAuth or API keys, and is rate limited by Rack::Attack. Hosted instances allow 100 requests per hour per access token and 200 per IP. Self-hosted instances (`app_mode` `self_hosted`) allow 10,000 per hour per token and 20,000 per IP. API keys are unlimited on self-hosted: `ApiRateLimiter.for` returns `NoopApiRateLimiter` (same interface, no Redis writes), the `X-RateLimit-*` headers are omitted when there is no limit, and requests with a valid API key are safelisted from the Rack::Attack throttles. The key must be looked up (`ApiKey.find_by_value`), never trusted from the `X-Api-Key` header, so a made-up key cannot bypass throttling on the auth routes. | requirement | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"4705012f-2dc2-450d-8a23-70c385a41b2f","quote":"bump Rack::Attack to 10k an hour per token and 20k per IP. Hosted stays at 100 and 200"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"6ae51835-c470-46ab-8502-8f5051bc13e9","quote":"have it hand off to a NoopApiRateLimiter when self-hosted, same interface and no redis writes"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"65740d7b-9736-44eb-837b-e95fdd144012","quote":"login not being throttled is a no, keep the lookup"},{"kind":"source","path":"config/initializers/rack_attack.rb","line":22,"quote":"api_token_limit = Rails.application.config.app_mode.self_hosted? ? 10_000 : 100"},{"kind":"source","path":"config/initializers/rack_attack.rb","line":13,"quote":"ApiKey.find_by_value(request.get_header(\"HTTP_X_API_KEY\")).present?"}],"reason":"The developer accepted new self-hosted limits and unlimited API keys. Source confirms the limits and the looked-up safelist. The old text (100 per token) is incomplete for self-hosted. The `enabled` flag observation is agent-only and not included.","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-103","op":"UPDATE","text":"| STACK-103 | Business logic belongs in `app/models/`, organized with concerns and plain Ruby objects. Avoid service objects in `app/services/`. The only intended exception is `ApiRateLimiter` and `NoopApiRateLimiter`, which stay together in `app/services/` because the first already lived there; moving them is a separate cleanup and this is not a new habit. | preference | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"6ae51835-c470-46ab-8502-8f5051bc13e9","quote":"I know we normally keep this stuff in models, but that file already lives in services and moving it is a separate cleanup, so just this pair for now, not a new habit"},{"kind":"source","path":"app/services/noop_api_rate_limiter.rb","line":1,"quote":"Stands in for ApiRateLimiter on self-hosted instances"}],"reason":"The developer explicitly scoped a one-off exception. The preference stays valid. DailyActivity also follows it (plain object in app/models/account).","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-106","op":"ADD","text":"| STACK-106 | Data backfills after a schema change run as `data_migration` rake tasks (for example `data_migration:migrate_balance_components`), not as Sidekiq jobs and not inside the migration. Tasks are idempotent, rescue per record, and print a summary. | preference | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"34a28aa6-e09d-4913-bf7f-c55ee6c14bd3","quote":"no sidekiq job please. We do those as a data_migration rake task"},{"kind":"source","path":"lib/tasks/data_migration.rake","line":167,"quote":"task migrate_balance_components: :environment do"}],"reason":"The developer stated the team practice and rejected the agent's Sidekiq proposal. Source has the task. The practice appears to predate this change (the agent followed existing data_migration tasks), so it is a how-we-do-backfills rule that the repository does not make obvious. Marked a preference because only one instance was discussed and nobody called it a hard rule. STACK-105 and STACK-103 were already updated in my first pass, so I am not repeating them.","agent":"stack-maintainer"},{"target":"core/naming-conventions.md","fact_id":"NAME-101","op":"UPDATE","text":"| NAME-101 | Components are namespaced, not flat. Generic design system components live in `app/components/DS/` as `DS::<Name>` with no `Component` suffix (for example `DS::Button` in `DS/button.rb` and `button.html.erb`). They inherit `DesignSystemComponent`, which inherits `ApplicationComponent`. App-specific components go under `UI::` (for example `UI::Account::ActivityFeed` in `app/components/UI/account/`). A component's Stimulus controller still sits next to it. The `DS` and `UI` acronym inflections are in `config/initializers/inflections.rb`. This replaces the earlier flat layout with `*Component` class names (such as `ButtonComponent`), which older code and notes may still show. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"db86541d-a11e-4972-872f-0ad2053e948c","quote":"lets drop the Component suffix, DS::Button reads way better"},{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"0e8d197a-6ddc-445a-938c-992ef4bbb323","quote":"the folder should be app/components/DS not ds, caps"},{"kind":"conversation","session":"25a4eecd-b0f6-4c33-9b3b-727281d68e17","message":"62bf1951-934a-4d5d-a950-beb04edeb7d0","quote":"UI::Account::ActivityFeed for the list and UI::Account::ActivityDate for one day"},{"kind":"source","path":"config/initializers/inflections.rb","line":19,"quote":"inflect.acronym \"DS\""},{"kind":"diff","path":"diff/commits.txt","quote":"dropping the\nComponent suffix"}],"reason":"The developer explicitly replaced the flat *Component convention. Head source shows app/components/DS/*.rb, UI/account/*.rb, application_component.rb and design_system_component.rb. Existing code and the old entry show the old way, so the old and new way are both recorded. Component naming is normally out of scope, but this entry exists and is now wrong, so leaving it would mislead.","agent":"conventions-maintainer"},{"target":"core/naming-conventions.md","fact_id":"NAME-103","op":"UPDATE","text":"| NAME-103 | Lookbook previews live in `test/components/previews/`. Design system previews are in the lowercase `previews/ds/` folder and are named `DS::<Name>Preview` in `<name>_preview.rb` (for example `DS::ButtonPreview`). The old `<name>_component_preview.rb` naming no longer applies. The lowercase folder was kept deliberately, which is why the `DS` inflection acronym stays. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"108fa345-7272-4f98-b1ca-c6165408f28a","quote":"fine on previews, lowercase is ok, leave them and the inflection"},{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"0e9c52ab-96df-49a7-becf-76271416eeaa","quote":"They are now `DS::ButtonPreview` in `test/components/previews/ds/button_preview.rb`"},{"kind":"source","path":"test/components/previews/ds/button_preview.rb","line":1,"quote":"DS::ButtonPreview"}],"reason":"The previews were renamed in the same developer-approved change, and the head files match (test/components/previews/ds/*_preview.rb). The developer accepted the lowercase preview folder. The old pattern in NAME-103 is no longer true.","agent":"conventions-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-001","op":"ADD","text":"| PIT-001 | Adding a safelist (or any bypass) to Rack::Attack for self-hosted API keys in `config/initializers/rack_attack.rb`, and matching on the mere presence of the `X-Api-Key` header. | The safelist runs before every throttle, so any made-up key skips them all. `/api/v1/auth/login`, `signup` and `refresh` sit under `/api/`, skip authentication, and are limited only by the per-IP throttle. Unlimited password guessing and signup spam become possible. | Look the key up with `ApiKey.find_by_value`, which ignores revoked and expired keys, and safelist only when it resolves. Unknown or revoked keys stay under the normal limits. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"config/initializers/rack_attack.rb","line":7,"quote":"The key is looked up rather than trusted from the header"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"3fa62366-cede-403f-b0ba-6c93f2cee172","quote":"`/api/v1/auth/login`, `signup` and `refresh` lose their only throttle"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"65740d7b-9736-44eb-837b-e95fdd144012","quote":"login not being throttled is a no, keep the lookup"}],"reason":"Developer explicitly rejected the header-only variant after the agent traced the routes. The fix is in source at head. Both failure and remedy are supported.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-002","op":"ADD","text":"| PIT-002 | Moving or adding Stimulus controllers under a component folder and pinning them in `config/importmap.rb` with `pin_all_from`. | `under:` sets the module name (and so the Stimulus identifier), while `to:` is the asset path Propshaft serves, relative to the `app/components` asset root. A `to:` that does not match the folder (for example `\"\"` after moving files into `DS/`) makes the controller files 404, and every dialog, menu and tab silently stops working. | Set `to:` to the subfolder, as in `pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\"`. Controller identifiers stay plain (`dialog`, `menu`, `tabs`). Check the browser for 404s on the controller files, or run `bin/importmap json`. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"config/importmap.rb","line":8,"quote":"pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\""},{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"0871bd83-9d58-4e9d-b0df-4867c1ebfd26","quote":"every dialog, menu and tab would silently stop working"}],"reason":"The bug was found and fixed during the session and the fix is in source. The 404 consequence is the agent's reasoning, not observed at runtime, since the app could not be booted. It is flagged as unverified in the session, but the pin semantics are visible in source. Medium confidence.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-003","op":"ADD","text":"| PIT-003 | Running the `add_components_to_balances` migration on an existing database, or writing `end_cash_balance`, `end_non_cash_balance` or `end_balance` on `balances`. | The new component columns default to 0, so every existing row's generated `end_*` columns read 0 and the activity feed shows zeros until the backfill runs. The `end_*` columns are stored generated columns, so Postgres rejects any insert or upsert that includes them. Adding them also rewrites the whole `balances` table under an exclusive lock. | Run `rake data_migration:migrate_balance_components` after the migration. It writes only the component columns, skips rows whose recalculation differs from the stored balance, and is safe to re-run. Write only `Balance::COMPONENT_ATTRIBUTES`. Check the table size before migrating production. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"db/migrate/20261105130000_add_components_to_balances.rb","line":2,"quote":"Existing rows get zeros for every component, so their end_* columns read 0 until"},{"kind":"source","path":"app/models/balance.rb","line":4,"quote":"so they must never be part of an insert or upsert"},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"0322360d-1799-41a6-8fe1-7af0e660ac5d","quote":"Adding stored generated columns rewrites the whole `balances` table under an exclusive lock"}],"reason":"Zeros-until-backfill and the no-write rule are in migration and model comments and the commit message. The lock claim is the agent's statement and was not run. The developer accepted the deploy order. Neither the migration nor the task has been run, so this is a documented expectation.","agent":"pitfalls-maintainer"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-004","op":"ADD","text":"| VIEWCOMPONENT-004 | Generic design-system components live in `app/components/DS/` as `DS::<Name>` (for example `DS::Button`, `DS::Menu`, `DS::Tabs::Nav`), with no `Component` suffix. They inherit `DesignSystemComponent`, which inherits `ApplicationComponent`, which inherits `ViewComponent::Base`. App-specific components go in the `UI::` namespace (for example `UI::Account::ActivityFeed`) and inherit `ApplicationComponent`. `DS` and `UI` are registered as inflection acronyms. Inside `UI::Account::*`, a bare `Account` resolves to `UI::Account`, so reference models as `::Account`. This replaces the earlier flat `FooComponent` layout. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"db86541d-a11e-4972-872f-0ad xtends TERM-106 Balance.","agent":"terminology-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-105","op":"UPDATE","text":"| STACK-105 | The external API lives under `/api/v1`, authenticates with Doorkeeper OAuth or API keys, and is rate limited by Rack::Attack. Hosted instances: 100 requests per hour per access token and 200 per IP. Self-hosted instances (`config.app_mode.self_hosted?`): 10,000 per hour per token and 20,000 per IP, and API keys are not limited at all (`ApiRateLimiter.for` returns `NoopApiRateLimiter`, which never touches Redis, and a Rack::Attack safelist skips requests whose `X-Api-Key` matches a real key; unknown or revoked keys are throttled normally). Unlimited usage reports tier `unlimited` with nil limit values, and the `X-RateLimit-*` headers are omitted. | requirement | app:maybe |","scope":"app:maybe","evidence":[{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"4705012f-2dc2-450d-8a23-70c385a41b2f","quote":"bump Rack::Attack to 10k an hour per token and 20k per IP. Hosted stays at 100 and 200."},{"kind":"conversation","session":"10f5e393-9e77-4e2a-9267-c86a0efa999f","message":"6ae51835-c470-46ab-8502-8f5051bc13e9","quote":"have it hand off to a NoopApiRateLimiter when self-hosted"},{"kind":"diff","path":"config/initializers/rack_attack.rb","quote":"api_token_limit = Rails.application.config.app_mode.self_hosted? ? 10_000 : 100"},{"kind":"source","path":"app/services/noop_api_rate_limiter.rb","line":1,"quote":"Stands in for ApiRateLimiter on self-hosted instances"}],"reason":"Developer stated the self-hosted limits and unlimited API keys; code at head implements it. The old text (flat 100 per token) is now only true for hosted. The agent also flagged STACK-105 as outdated.","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-103","op":"UPDATE","text":"| STACK-103 | Business logic belongs in `app/models/`, organized with concerns and plain Ruby objects. ense treatment from the processor code and did not test real data. Scope is this application's processor.","agent":"tool-maintainer:plaid"},{"target":"tools/plaid/README.md","fact_id":"PLAID-004","op":"ADD","text":"| PLAID-004 | Plaid can return the wrong sign on investment transaction `quantity`, including on sells, so the application does not use the reported sign. It takes the sign from the transaction `type` (`sell` is negative, `buy` is positive), or from the sign of `amount` when the type is neither, and keeps the reported quantity when neither applies. The source comment says this was found in production data; other deployments are unverified. | tool:plaid |","scope":"tool:plaid","evidence":[{"kind":"source","path":"app/models/plaid_account/investments/transactions_processor.rb","line":91,"quote":"Plaid unfortunately returns incorrect signage on some"},{"kind":"source","path":"app/models/plaid_account/investments/transactions_processor.rb","line":93,"quote":"we have found multiple instances of production data"},{"kind":"source","path":"app/models/plaid_account/investments/transactions_processor.rb","line":99,"quote":"if transaction[\"type\"] == \"sell\" || transaction[\"amount\"] < 0"}],"reason":"Implemented at head and documented by the code comment. The behaviour described is a property of Plaid's data, so the scope is tool:plaid, with the observation coming from this application's production data. No developer conversation discusses it, so this rests on source evidence alone.","agent":"tool-maintainer:plaid"},{"target":"tools/plaid/README.md","fact_id":"PLAID-005","op":"ADD","text":"| PLAID-005 | Investment transactions are matched to existing entries by Plaid's `investment_transaction_id`, stored as the entry's `plaid_id`. A re-sync updates the matching entry instead of creating a duplicate. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"app/models/plaid_account/investments/transactions_processor.rb","line":41,"quote":"find_or_initialize_by(plaid_id: transaction[\"investment_transaction_id\"])"},{"kind":"source","path":"app/models/plaid_account/investments/transactions_processor.rb","line":68,"quote":"find_or_initialize_by(plaid_id: transaction[\"investment_transaction_id\"])"}],"reason":"Idempotent matching is verified at head for both trade and cash paths. Whether re-syncs produce no duplicates in practice was not tested. Scope is this application's processor.","agent":"tool-maintainer:plaid"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-002","op":"UPDATE","text":"Components are developed and reviewed in Lookbook, mounted at `/design-system` in `config/routes.rb`. Lookbook previews use `LookbooksController` as the preview controller (`config/application.rb`).","scope":"app:maybe","evidence":[{"kind":"source","path":"config/routes.rb","line":13,"quote":"mount Lookbook::Engine, at: \"/design-system\""},{"kind":"source","path":"config/application.rb","line":37,"quote":"config.view_component.preview_controller = \"LookbooksController\""}],"reason":"The existing fact says Lookbook is served at /lookbook in development. The mount at head is /design-system, with no environment guard in routes.rb, and the developer-agent messages that said /lookbook do not match the mount. The development-only claim is not shown by source. Whether Lookbook is reachable in production depends on Lookbook settings that were not checked, so that is left unstated.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-003","op":"UPDATE","text":"Stimulus controllers that belong to one component live next to it. Global controllers live in `app/javascript/controllers/`. Controllers in `app/components/DS/` are pinned from `config/importmap.rb` (see VIEWCOMPONENT-005). `DS::Tooltip` reuses the global `tooltip` controller.","scope":"app:maybe","evidence":[{"kind":"source","path":"config/importmap.rb","line":8,"quote":"pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\""},{"kind":"source","path":"app/components/DS/tooltip.rb","line":19,"quote":"controller: \"tooltip\","}],"reason":"The original rule still holds. The update adds the DS controller location and the shared tooltip controller, both confirmed at head.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-004","op":"ADD","text":"Design-system components (`DS::`) inherit from `DesignSystemComponent`, which inherits from `ApplicationComponent`, which inherits from `ViewComponent::Base`. App-specific components (`UI::`) inherit from `ApplicationComponent`. Changes to `ApplicationComponent` therefore reach the design system.","scope":"app:maybe","evidence":[{"kind":"source","path":"app/components/design_system_component.rb","line":1,"quote":"class DesignSystemComponent < ApplicationComponent"},{"kind":"source","path":"app/components/application_component.rb","line":1,"quote":"class ApplicationComponent < ViewComponent::Base"},{"kind":"source","path":"app/components/UI/account/activity_date.rb","line":3,"quote":"class UI::Account::ActivityDate < ApplicationComponent"},{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"3fdab1f5-ea1f-4c8a-b9dd-15b136f74270","quote":"give them their own base, DesignSystemComponent, and the UI stuff keeps ApplicationComponent"}],"reason":"Accepted by the developer's request for a DS base and confirmed in source. The DS-to-ApplicationComponent link was the development agent's choice. The developer committed it after reading the summary, so the chain is recorded as the current code state, not as a separate decision.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-005","op":"ADD","text":"Stimulus controllers in `app/components/DS/` are pinned with `pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\"`. Their identifiers stay `dialog`, `menu` and `tabs`, so `data-controller` attributes need no namespace. The `to:` value must match the folder's asset path. With `to: \"\"`, the files are requested from the asset root, where they do not exist, so the controllers would not load.","scope":"app:maybe","evidence":[{"kind":"source","path":"config/importmap.rb","line":8,"quote":"pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\""},{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"0871bd83-9d58-4e9d-b0df-4867c1ebfd26","quote":"so the controllers would have 404'd and every dialog, menu and tab would silently stop working"}],"reason":"The pin line is confirmed in source. The 404 consequence is the development agent's analysis of Propshaft asset paths and was not run in a browser, so the consequence is stated as an expectation. The developer accepted the explanation and committed the fix.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-006","op":"ADD","text":"`DS::Tooltip` wraps the shared `tooltip` Stimulus controller. Put the trigger in the block and the tooltip content in `with_body`. `focusable: true` (default `false`) makes the wrapper a tab stop with `tabindex=\"0\"` and `aria-describedby` pointing at the tooltip. Use it only when the trigger is not already focusable, such as plain text. A button or link trigger should keep the default, or it gets two tab stops.","scope":"app:maybe","evidence":[{"kind":"source","path":"app/components/DS/tooltip.rb","line":6,"quote":"focusable makes the wrapper a tab stop"},{"kind":"source","path":"app/components/DS/tooltip.rb","line":25,"quote":"merged.merge!(tabindex: 0, aria: { describedby: tooltip_id }) if focusable"},{"kind":"source","path":"app/components/UI/account/activity_date.html.erb","line":11,"quote":"DS::Tooltip.new(placement: \"bottom\", focusable: true"},{"kind":"conversation","session":"25a4eecd-b0f6-4c33-9b3b-727281d68e17","message":"f82ff788-ad9c-412b-9d1d-ef15a388c238","quote":"Keep the focusable option off by default like you said"}],"reason":"The option, its default, and its use in ActivityDate are confirmed in source. The developer asked for the default to stay off to avoid double tab stops on buttons. The keyboard behaviour was not tested in a browser at the time of the cutoff.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-007","op":"ADD","text":"The shared `tooltip` Stimulus controller shows on `mouseenter` and `focusin`, hides on `mouseleave` and `focusout`, and hides on Escape. The behaviour applies to every element with `data-controller=\"tooltip\"`, including tooltips that predate `DS::Tooltip`, so those now also show on keyboard focus. Focus moving between elements inside a tooltip wrapper also hides it.","scope":"app:maybe","evidence":[{"kind":"source","path":"app/javascript/controllers/tooltip_controller.js","line":34,"quote":"this.element.addEventListener(\"focusin\", this.show);"},{"kind":"source","path":"app/javascript/controllers/tooltip_controller.js","line":57,"quote":"if (event.key === \"Escape\") this.hide();"},{"kind":"conversation","session":"25a4eecd-b0f6-4c33-9b3b-727281d68e17","message":"f82ff788-ad9c-412b-9d1d-ef15a388c238","quote":"Yeah, \"3 of 8\" makes sense, go for it. And yes, please do the keyboard fix too."}],"reason":"Source confirms the listeners. The effect on existing tooltips is a consequence of the global controller and was disclosed by the development agent; the developer planned a browser check, and its result is not in the pack, so this stays unverified in practice.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-008","op":"ADD","text":"A component renders the data its model object provides and does not compute balances, totals, or groupings. For the account activity feed, `Account::DailyActivity` computes each day's balances and breakdown rows, and `UI::Account::ActivityDate` only formats values and maps favourability to colour classes.","scope":"app:maybe","evidence":[{"kind":"conversation","session":"cbd5d4bc-7d5d-46f5-9419-10dba5f8c210","message":"5daffd13-be68-49ba-9556-5ce81e586496","quote":"The math stays out of the component and it just renders what this gives it."},{"kind":"source","path":"app/components/UI/account/activity_date.rb","line":19,"quote":"def favorable_color_class(favorable)"}],"reason":"The developer stated this rule for the activity feed. The component's formatting helpers and colour mapping are the only logic it holds, as confirmed in source. This is an application rule for ViewComponents, and it complements STACK-103 in core, which the sweeper did not change.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-009","op":"ADD","text":"Lookbook previews for design-system components live in `test/components/previews/ds/` and are named `DS::<Name>Preview`, subclassing `ViewComponent::Preview`. The lowercase `ds` folder resolves to the `DS` module only because `config/initializers/inflections.rb` declares `DS` as an acronym. Removing that acronym, or renaming the folder, changes the constant names and needs the preview paths checked.","scope":"app:maybe","evidence":[{"kind":"source","path":"test/components/previews/ds/tabs_preview.rb","line":1,"quote":"class DS::TabsPreview < ViewComponent::Preview"},{"kind":"source","path":"config/initializers/inflections.rb","line":19,"quote":"inflect.acronym \"DS\""},{"kind":"conversation","session":"0a43fbc5-a71d-4248-8a48-c6d537d0eb80","message":"108fa345-7272-4f98-b1ca-c6165408f28a","quote":"fine on previews, lowercase is ok, leave them and the inflection"}],"reason":"The class names and inflection are confirmed in source. The claim that the acronym is what maps the lowercase folder is derived from Rails inflector behaviour and was not run. Whether a capitalised DS/ component folder works with these lowercase preview paths on a case-sensitive filesystem (CI, Linux) was not verified and is not recorded as a fact.","agent":"tool-maintainer:viewcomponent"},{"target":"tools/viewcomponent/README.md","fact_id":"VIEWCOMPONENT-010","op":"ADD","text":"Component tests extend `ViewComponent::TestCase`, render with `render_inline`, and assert on Capybara-style selectors. Templates expose `data-testid` hooks, such as `activity-date-balance`, which the tests use for assertions.","scope":"app:maybe","evidence":[{"kind":"source","path":"test/components/ui/account/activity_feed_test.rb","line":3,"quote":"class UI::Account::ActivityFeedTest < ViewComponent::TestCase"},{"kind":"source","path":"app/components/UI/account/activity_date.html.erb","line":35,"quote":"data: { testid: \"activity-date-balance\" }"}],"reason":"Both the test base class and the data-testid hooks are in source. This is the only component test file at head, so the pattern is a single observed example and should be treated as a usage pattern, not a required standard.","agent":"tool-maintainer:viewcomponent"}],"deferred":[],"rejected":[{"target":"core/terminology.md","fact_id":"TERM-114","op":"ADD","text":"| TERM-114 | Opening anchor | The valuation of kind opening_anchor (see TERM-104), which starts an account's balance history. Calculated balances run forward from it. A data migration marked each manual account's oldest valuation as its opening anchor. | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"app/app/models/valuation.rb","line":6,"quote":"opening_anchor: \"opening_anchor\","},{"kind":"source","path":"app/app/models/account/anchorable.rb","line":1,"quote":"All accounts are \"anchored\" with start/end valuation records"},{"kind":"source","path":"app/app/models/balance/forward_calculator.rb","line":5,"quote":"total_balance: account.opening_anchor_balance,"},{"kind":"source","path":"app/lib/tasks/data_migration.rake","line":117,"quote":"Manual accounts get their oldest valuation marked as opening_anchor"}],"reason":"The term is used in code, the anchorable concern, the calculators and migrations, and the KB glossary lacks it. The definition is source-based; no developer message defines it. The term 'current anchor' also exists in source, but its meaning is outside what the evidence in this run defines, so it is not added.","agent":"terminology-maintainer","rejected_because":"app/app/models/valuation.rb does not exist at 6db0b67"},{"target":"core/terminology.md","fact_id":"TERM-115","op":"ADD","text":"| TERM-115 | Reconciliation | A valuation of kind reconciliation, which is the default kind. On its date the day's total balance is set to the valuation amount, and any difference from the flows of that day lands in Adjustment (TERM-112). | app:maybe |","scope":"app:maybe","evidence":[{"kind":"source","path":"app/app/models/valuation.rb","line":5,"quote":"reconciliation: \"reconciliation\","},{"kind":"source","path":"app/app/models/valuation.rb","line":8,"quote":"default: \"reconciliation\""},{"kind":"source","path":"app/app/models/balance/forward_calculator.rb","line":18,"quote":"end_non_cash_balance = valuation.amount - end_cash_balance"}],"reason":"Source defines the kind and its calculator effect. The developer and agents used the word in the same sense (the valuation day's difference lands in adjustment, which the developer accepted). No earlier glossary term.","agent":"terminology-maintainer","rejected_because":"app/app/models/valuation.rb does not exist at 6db0b67"},{"target":"core/pitfalls.md","fact_id":"PIT-004","op":"ADD","scope":"app:maybe","text":"| PIT-004 | Constructing `ApiRateLimiter.new(api_key)` directly instead of `ApiRateLimiter.for(api_key)`. | `new` always builds a Redis-backed limiter. On a self-hosted instance the key is then counted and limited to the standard tier of 100 requests per hour, even though API keys are unlimited there. | Call `ApiRateLimiter.for(api_key)` (or `usage_for`). It returns `NoopApiRateLimiter` on
