uld still hit that limit.\n\nI'd do the following:\n\n1. **Make `ApiRateLimiter` unlimited on self-hosted.**\n   - `rate_limit` returns `nil` there, and `rate_limit_exceeded?` returns `false`.\n   - `usage_info` reports `tier: \"unlimited\"` with `limit` and `remaining` as `nil`.\n   - `/api/v1/usage` and the `X-RateLimit-*` headers need to cope with `nil`. Simplest is to drop the limit and remaining headers when unlimited.\n   - I'd keep counting requests in Redis, so the usage endpoint still shows `current_count`. Say if you'd rather skip the Redis write entirely.\n2. **Exempt API-key requests from Rack::Attack on self-hosted.**\n   - API keys authenticate with `X-Api-Key`, not a Bearer token. In Rack::Attack they fall into the `api_ip:` fallback, which is capped per IP at 10k and 20k.\n   - With only step 1, a busy integration would still hit 429 from the IP caps.\n   - For true \"no limit\", I'd add `safelist` for requests with an `X-Api-Key` header when self-hosted.\n   - That makes API keys unlimited and leaves OAuth tokens and unauthenticated requests on the new 10k and 20k limits.\n3. **Alternative for step 1: move the enterprise tier into play.** `RATE_LIMITS` already has an `enterprise: 10000` tier and `determine_tier` is a stub. Returning `:enterprise` for self-hosted would be a one-line change, but it isn't unlimited, and you said it shouldn't be.\n\n## Things I noticed\n\n- **The `enabled` flag does nothing.** The `enabled = Rails.env.production? || Rails.env.staging?` line at the top of the initializer is a local variable, never applied. Rack::Attack is therefore active in every environment, and the new limits apply in dev and test too.\n- **KB doc is now out of date.** STACK-105 in the KB says \"100 requests per hour per access token\". The KB is read-only for me, so someone with access should note that self-hosted differs.\n\nWant me to implement steps 1 and 2, with tests for the unlimited tier, the `nil` handling in the usage endpoint, and the safelist?","tools":["[Bash] cat config/initializers/rack_attack.rb; grep -rn \"self_hosted\\|self_hosting\" app config lib --include=*.rb | head -15; grep -rn \"Rack::Attack\\|rate_limit\\|RateL","[Bash] cat app/services/api_rate_limiter.rb app/controllers/api/v1/usage_controller.rb; grep -n \"rate_limit\\|RateLimit\\|usage\\|self_host\" app/controllers/api/v1/base_c","[Bash] sed -n 1,125p app/controllers/api/v1/base_controller.rb | grep -n \"X-Api-Key\\|HTTP_X_API\\|Bearer\\|authenticate_\\|def \" ; grep -n \"rate_limit\\|RateLimit\\|limit\" ","[Bash] python3 - <<'EOF' p='config/initializers/rack_attack.rb' s=open(p).read() s=s.replace(\"\"\"  # Throttle API requests per access token   throttle(\"api/requests\", l"],"user":null},{"role":"dev","text":"yep do 1 and 2. For 1, don't branch inside ApiRateLimiter, have it hand off to a NoopApiRateLimiter when self-hosted, same interface and no redis writes. Put that in app/services right next to ApiRateLimiter. I know we normally keep this stuff in models, but that file already lives in services and moving it is a separate cleanup, so just this pair for now, not a new habit. Dropping the limit/remaining headers when unlimited is fine. Add tests for the noop one and the safelist.","turn":5,"at":"2026-11-05T18:10:56.028030+00:00","marks":["P5-F1","P5-F2"]},{"role":"agent","at":"2026-11-05T18:12:11.490889+00:00","text":"`ApiKey.find_by_value` already returns only active keys, so the safelist can reuse it. Now the limiter pair, the controller wiring and the safelist.\n\nNow the tests for the noop limiter, the factory, the safelist, and the controller behaviour on self-hosted.\n\nSteps 1 and 2 are written, but I haven't run anything. All eight touched Ruby files pass a syntax check, and nothing is committed.\n\n## What changed\n\n- **`NoopApiRateLimiter`** is new, in `app/services/` next to `ApiRateLimiter`.\n  - It has the same public methods and never touches Redis.\n  - `rate_limit_exceeded?` is always `false`, and `increment_request_count!` does nothing.\n  - `usage_info` reports `tier: :unlimited` with `nil` for the limit, count, remaining and reset.\n- **The hand-off** is a new class method, `ApiRateLimiter.for(api_key)`. It returns the noop limiter when self-hosted and a real limiter otherwise. I used a factory so the instance methods stay branch-free.\n  - `usage_for` goes through it, and `Api::V1::BaseController` uses `ApiRateLimiter.for`.\n  - `ApiRateLimiter.new` still builds a real limiter, so the existing limiter tests are untouched.\n- **Headers:** `add_rate_limit_headers` skips all three `X-RateLimit-*` headers when there is no limit. You said limit and remaining, but a reset time with no limit is meaningless, so I dropped that header too.\n- **`/api/v1/usage`** returns `tier: \"unlimited\"` with `null` for the limit, count, remaining, `reset_in_seconds` and `reset_at`. `reset_at` is guarded so a `nil` reset doesn't raise.\n- **Safelist in `rack_attack.rb`:** requests to `/api/` with a valid `X-Api-Key` skip every throttle on self-hosted instances. It's off when hosted.\n\n## Safelist design\n\n- **The key is looked up, not trusted.** `ApiKey.find_by_value` already ignores revoked and expired keys. Matching on the header alone would let anyone send a made-up `X-Api-Key` to bypass the IP limits, and key guessing would then go unthrottled. Unknown or revoked keys fall under the normal 10k and 20k limits.\n- **Cost:** that's one extra indexed query per API request in middleware on self-hosted instances. The controller repeats the lookup.\n- **Side effect:** a safelisted request also skips the scanner-user-agent blocklist. That only affects holders of a valid key.\n\n## Tests\n\n- **`test/services/noop_api_rate_limiter_test.rb`**\n  - never exceeds\n  - never calls `Redis.new`\n  - the `nil` and `:unlimited` shapes\n  - same public interface as `ApiRateLimiter`\n  - `.for` returns the noop limiter when self-hosted and the real one otherwise\n- **`test/integration/rack_attack_test.rb`:** the safelist matches a valid key when self-hosted. It does not match unknown, missing or revoked keys, non-API paths such as `/oauth/token`, or any key when hosted.\n- **`usage_controller_test.rb`:** a self-hosted key gets no rate-limit headers and an unlimited usage response, and no Redis key is written.\n\n## Notes\n\n- **Two new tests to run first:** the self-hosted ones stub `Rails.application.config.app_mode`. One of them reloads the rack_attack initializer, so run that file on its own first.\n- **Existing tests:** I left the hosted usage test alone, since the default environment is hosted.\n- **KB:** STACK-105 still says 100 per hour per token with no mention of self-hosted. That's for someone with write access to the KB.","tools":["[Bash] sed -n 88,150p app/controllers/api/v1/base_controller.rb; grep -rn \"ApiRateLimiter\" app test lib config docs 2>/dev/null | grep -v \"^app/services/api_rate_limit","[Bash] sed -n 1,30p test/services/api_rate_limiter_test.rb; sed -n 85,125p test/services/api_rate_limiter_test.rb; grep -n \"def self.find_by_value\\|def active?\" -A6 ap","[Bash] cat > app/services/noop_api_rate_limiter.rb <<'EOF' # Stands in for ApiRateLimiter on self-hosted instances, where API keys are not limited. It has the same # i","[Bash] cat > test/services/noop_api_rate_limiter_test.rb <<'EOF' require \"test_helper\"  class NoopApiRateLimiterTest < ActiveSupport::TestCase   setup do     @user = u"],"user":null},{"role":"dev","text":"back, sorry. skimmed it, the noop handoff looks fine. one thing, the safelist does an extra db lookup on every api request in middleware. is that really worth it? what would happen if we only checked the header exists and let the controller reject bad keys?","turn":6,"at":"2026-11-05T18:12:18.281139+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:12:42.339472+00:00","text":"Let me check one thing in the routes before answering, because it affects how risky the header-only version would be.\n\nHeader-only is cheaper, but it opens a real hole, so I'd keep the lookup.\n\n## What header-only would do\n\nThe safelist runs before every throttle, so any request to `/api/` with an `X-Api-Key` header of any value skips all of them. On a self-hosted instance that means:\n\n- **`/api/v1/auth/login`, `signup` and `refresh` lose their only throttle.** I checked the routes. They sit under `/api/`, skip authentication in the controller, and are currently limited only by the per-IP throttle. Adding `X-Api-Key: x` to a login request would remove that limit, which means unlimited password guessing and signup spam.\n- **The lookup cost moves to the controller, and an attacker controls it.** Junk keys get a 401 from `ApiKey.find_by_value`, one query per request, now with no throttle on how many they can send. The saving applies only to valid-key requests, where the lookup is duplicated.\n- **Key guessing becomes unthrottled too.** That is probably infeasible given the key entropy, but the throttle was the only thing making it so.\n\n## Why the lookup is cheap\n\n- It only runs on self-hosted instances, and only for `/api/` requests that carry the header. Those are the requests where the controller does the same lookup anyway.\n- It is one query on a column that is queried by exact match. I haven't checked whether `display_key` has an index, so confirm that before relying on \"indexed\".\n- Self-hosted API traffic is low-volume compared with the hosted service.\n\n## If you still want to cut the cost\n\n- **Skip the auth routes:** with header-only, safelist only when the path is not under `/api/v1/auth/`. This closes the login hole, but junk-key requests are still unthrottled.\n- **Cache the lookup for about a minute:** a revoked key would stay unthrottled for up to that long, which is harmless since the controller still rejects it. This is a few lines, but it adds a cache dependency to middleware.\n- **Reuse the result in the controller:** the safelist stashes the found key in the Rack env and `authenticate_api_key` reads it. That removes the duplicate query rather than the safelist's, but couples the middleware and the controller.\n\nI'd leave it as is. If you'd rather not pay for the lookup, I'd do the first option and add a test that the auth routes are never safelisted. Tell me which you want and I'll make the change.","tools":["[Bash] grep -n \"namespace :api\" -A25 config/routes.rb | grep -n \"auth\\|signup\\|login\\|refresh\\|namespace\\|post \" | head -15; grep -n \"skip_before_action\" app/controlle"],"user":null},{"role":"dev","text":"ah yeah login not being throttled is a no, keep the lookup. good catch checking the routes. leave it as is, thanks. ok that all looks good to me, go ahead and commit.","turn":7,"at":"2026-11-05T18:12:50.621798+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:13:03.692948+00:00","text":"I'll commit this as two commits, one for the balance components and one for the rate limits.\n\nI made two commits on `sim2`, and the working tree is clean:\n\n- `44b2240`: store balance components on balances and backfill them.\n- `6db0b67`: raise API rate limits for self-hosted instances.\n\nNeither has been pushed.\n\nNone of the tests or the rake task have been run. Before shipping, run `bin/rails db:migrate` to regenerate `db/schema.rb`, then run the two test groups. The self-hosted Rack::Attack tests stub the app mode and reload the initializer, so run that file on its own first. As you said, you'll handle the deploy order.","tools":["[Bash] git status --short && git branch --show-current","[Bash] git add app/models db/migrate/20261105130000_add_components_to_balances.rb lib/tasks/data_migration.rake test/lib test/models test/support && git commit -q -F -"],"user":null},{"role":"dev","text":"thanks, both commits look fine. leaving it there for now, i'll push after i run the migration on my side","turn":8,"at":"2026-11-05T18:13:08.952648+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:13:12.408532+00:00","text":"Sounds good. The two commits are on `sim2` and nothing has been pushed.\n\nWhen you run the migration, check these:\n\n- **Schema:** commit the regenerated `db/schema.rb`. It will also pick up the earlier index migration that it was missing.\n- **Rake task:** run the backfill after the migration. It prints skipped accounts, and a sync fixes those.\n- **Tests:** run the new tests, since I couldn't. The rake task test and the self-hosted Rack::Attack tests are the least conventional, so start there.\n\nIf any test fails, send me the output and I'll fix it.","tools":[],"user":null},{"role":"dev","text":"sounds good, thanks. will ping you if the tests blow up after the migration","turn":9,"at":"2026-11-05T18:13:17.682733+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:13:19.766014+00:00","text":"Sounds good. If a test fails after the migration, send me the failure output and I'll dig in.","tools":[],"user":null},{"role":"dev","text":"btw one thing from the diff, the daily activity change. for investment accounts you're deriving trades from the non cash flows, is that right when a sell has fees or something? not 100% sure how we book those. just curious if you checked","turn":10,"at":"2026-11-05T18:13:30.331976+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:13:45.955290+00:00","text":"I didn't check fees, so I'll look at how trades are booked now.\n\nShort answer: no, I didn't check fees when I wrote it. Having looked now, I think the trades row is right, because the code has no way to book a fee on a trade.\n\n## How trades are booked\n\n- **Manual trades** (`Trade::CreateForm`): the entry amount is exactly `signed_qty * price`, and there is no fee field on the trade.\n- **Plaid trades**: the amount is `derived_qty * price`. The Plaid processor also treats `type == \"fee\"` as a cash transaction, so a fee is never part of a trade.\n- A trade's entry amount therefore always equals the holdings value that moved, so the non-cash flows I derive the trades from match the shares bought or sold at the trade price.\n\n## Where a fee would land\n\n- A fee on a sell would be a separate cash outflow, a plain transaction or a Plaid fee.\n- In the stored components it sits in `cash_outflows`, and it is not subtracted by the trade logic. The derivation only removes `non_cash_outflows` from cash inflows and `non_cash_inflows` from cash outflows.\n- It would therefore show up as an expense row on that day, not inside the trades row.\n\nI haven't verified that last point against a real Plaid fee transaction, and I didn't add a test with one.\n\n## Where it could be wrong\n\n- If Plaid ever delivers a trade whose cash amount differs from `qty * price` (fees baked into the settlement), the trade entry would still book `qty * price`. The extra cash difference would not be in any entry, so it would end up as an adjustment.\n- `derived_qty` and the trade price come from Plaid and can be off by rounding. That would show up as small adjustments too.\n\nI can add a test with a sell plus a separate fee transaction on the same day. It would check that trades and holdings show only the sale and that the fee appears under expense. I'd also like to see how the Plaid fee transactions look in your real data, since I'm inferring that from the processor code.","tools":["[Bash] grep -rni \"fee\\|commission\" app/models db/schema.rb | grep -vi \"feed\\|feedback\" | head -15; sed -n 1,60p app/models/trade.rb; grep -n \"amount\" app/models/accoun","[Bash] sed -n 20,75p app/models/plaid_account/investments/transactions_processor.rb; sed -n 25,60p app/models/trade/create_form.rb"],"user":null},{"role":"dev","text":"ok makes sense, fees being a separate cash outflow is fine, that matches how i remember it. no need for the extra test, we're good. already committed so leaving it as is.","turn":11,"at":"2026-11-05T18:13:51.276525+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:13:53.521041+00:00","text":"Sounds good. Fees stay a separate cash outflow loper's wording was 'every commit and PR title here'.","agent":"conventions-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-001","op":"ADD","text":"| PIT-001 | Scaling a stored amount by the currency's `decimalPlaces` (for example in `useFormat`, `amountToInteger`, `integerToAmount` or budget templates) | Zero-decimal currencies disagree between screens: a 1,500 yen budget showed as 15 on one screen and 150,000 on another. | Amounts are always stored x100 for every currency (1,500 yen is 150000). Use `decimalPlaces` only for display and input formatting, never as a storage scale. No migration is needed because real data is already x100. | app:actual |","scope":"app:actual","evidence":[{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"b3093f43-4dbd-4e40-a9b8-0f064b4476eb","quote":"it shows as 15 on one screen and 150,000 on another"},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"eb04ddcb-065d-465b-b2c5-93cc1726eaf9","quote":"we should never use the currency decimals to scale what we store, only for display"},{"kind":"diff","path":"diff/commits.txt","quote":"Amounts are now always stored x100; a currency's decimal places only"}],"reason":"Developer stated the rule and the failure; the commit adopts the remedy at head. Related terminology update to TERM-102 belongs to the terminology maintainer.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-002","op":"ADD","text":"| PIT-002 | A sync server module calls Node's built-in global `fetch` while passing an undici `Agent` as `dispatcher` (SimpleFIN's SSRF dispatcher) | The global fetch bundles a different undici version than the installed `undici` package, so the dispatcher and fetch can mismatch and the call can break across Node or undici upgrades. Nothing lints a bare `fetch(`. | Import `fetch` from `undici` in every sync server module (SimpleFIN, CORS proxy, GoCardless, Enable Banking, health check) and mock `undici`'s `fetch` in tests, not `global.fetch`. Do not add another HTTP library. | app:actual |","scope":"app:actual","evidence":[{"kind":"diff","path":"diff/commits.txt","quote":"Import fetch from\nundici in every sync server module"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"aeb3ca2c-cd97-49d0-8c21-cb2687b48a96","quote":"I don't want another HTTP library on the server, and undici is what Node ships anyway"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"bceea97c-cc3f-4465-bfff-a28e36464581","quote":"I can't enforce it either"}],"reason":"Code at head and commit message adopt the remedy. Caveat: the link to the user's reported SimpleFIN failure was never reproduced, so the consequence is worded as a mismatch risk. The bank-sync tool owner may also record the rule.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-003","op":"ADD","text":"| PIT-003 | Using the result of `snapdom.toPng` (from `@zumer/snapdom`, used by \"Download Snapshot\" on reports) directly as a download link target | `toPng` returns an image element, not a data URL. Assigning it to `link.href` makes the download fail silently with no error. | Read the returned element's `src` (`link.href = image.src`). | app:actual |","scope":"app:actual","evidence":[{"kind":"conversation","session":"d34fc234-ffeb-4f49-b9b7-9037b2a87b69","message":"1968406d-8b38-42a1-a4f2-f3631e7f9995","quote":"snapdom's toPng gives you an img element, not a data url"}],"reason":"Developer stated the behavior and the source implements the remedy. The Firefox fix itself is unverified and is not claimed here.","agent":"pitfalls-maintainer","dropped_locators":[{"locator":{"kind":"diff","path":"diff/changes.patch","quote":"link.href = image.src;"},"issue":"diff/changes.patch is not part of the diff"}]},{"target":"tools/bank-sync/README.md","fact_id":"BANKSYNC-003","op":"ADD","text":"| BANKSYNC-003 | Every sync server module that makes HTTP {"target":"core/tech-stack-standards.md","fact_id":"STACK-104","op":"UPDATE","text":"| STACK-104 | The sync server runs on Express 5 and requires Node 22.19.0 or newer (`\"node\": \">=22.19.0\"` in its package manifest). The root workspace requires Node 22.18.0 or newer (`\"node\": \">=22.18.0\"` in the root manifest). The sync server is mostly JavaScript and moving to TypeScript. | requirement | app:actual |","scope":"app:actual","evidence":[{"kind":"source","path":"packages/sync-server/package.json","line":132,"quote":"\"node\": \">=22.19.0\""},{"kind":"source","path":"package.json","line":130,"quote":"\"node\": \">=22.18.0\","},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"56238ec1-3d78-4ec3-9516-6ffe31efe243","quote":"please keep it at >=22.19.0 and don't revert it"}],"reason":"The developer explicitly set the sync server floor to 22.19.0 and asked not to revert it, so the stated 22 floor is out of date. The reason for 22.19.0 is not recorded, so the rationale is left open. The root floor is the developer's stated choice to leave as is, recorded for accuracy. Express 5 is unchanged (packages/sync-server/package.json declares express ^5.3.0).","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-105","op":"UPDATE","text":"| STACK-105 | Report graphs are built with Recharts 3. The \"Download Snapshot\" action on reports captures the report with `snapdom.toPng` from `@zumer/snapdom`, which replaced html-to-image. The action uses the returned image's `src` as the download link, because the return value is an image element, not a data URL. | requirement | app:actual |","scope":"app:actual","evidence":[{"kind":"source","path":"packages/desktop-client/src/components/reports/ReportTopbar.tsx","line":24,"quote":"import { snapdom } from '@zumer/snapdom';"},{"kind":"source","path":"packages/desktop-client/src/components/reports/ReportTopbar.tsx","line":75,"quote":"const image = await snapdom.toPng(reportElement);"},{"kind":"source","path":"packages/desktop-client/src/components/reports/ReportTopbar.tsx","line":77,"quote":"link.href = image.src;"},{"kind":"source","path":"packages/desktop-client/package.json","line":218,"quote":"\"recharts\": \"^3.10.1\","},{"kind":"conversation","session":"d34fc234-ffeb-4f49-b9b7-9037b2a87b69","message":"e72d768a-19f3-48f7-841b-fbefcd49a705","quote":"i want to swap it for snapdom, it's maintained and has its own font embedding."}],"reason":"Source at head uses snapdom.toPng, and the developer asked for the swap, so the html-to-image statement is stale. The Firefox cause (html-to-image aborting during web font embedding) is the developer's belief and is not recorded as fact. The html-to-image entry still in desktop-client/package.json at head is an open discrepancy (see contradictions and unresolved), so no removal claim is made. Recharts 3 is confirmed by the package manifest.","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-107","op":"ADD","text":"| STACK-107 | Sync server outbound HTTP calls use `fetch` imported from `undici` (for example `import { fetch } from 'undici'`), not Node's built-in global `fetch`, so the request dispatcher and the fetch implementation come from the same undici version. Do not add another HTTP client library, such as axios or node-fetch, to the sync server. | requirement | app:actual |","scope":"app:actual","evidence":[{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"aeb3ca2c-cd97-49d0-8c21-cb2687b48a96","quote":"I don't want another HTTP library on the server, and undici is what Node ships anyway."},{"kind":"diff","path":"diff/commits.txt","quote":"Import fetch from undici in every sync server module"},{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":3,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-cors-proxy.js","line":4,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts","line":2,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/package.json","line":109,"quote":"\"undici\": \"^8.12.3\","}],"reason":"The developer stated the no-other-HTTP-library decision and to stay on undici for the sync server. Source confirms the fetch call sites in SimpleFIN, CORS proxy and Enable Banking import from undici, and undici is the only HTTP dependency declared in the sync-server manifest. The developer was asked whether global-fetch avoidance is a written rule and did not restate it as one; this record covers the stated decision only. Scope is app:actual, not company-wide, because nothing states a broader applicability.","agent":"stack-maintainer"},{"target":"core/naming-conventions.md","fact_id":"NAME-104","op":"ADD","text":"Commit messages and PR titles in this repository start with the prefix `[AI] `, for example `[AI] Keep search, sort and filters when toggling reconciled transactions`. The developer requires the prefix on every commit and PR title. It is not written in the repository's CONTRIBUTING.md and no tool enforces it.","scope":"app:actual","evidence":[{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"239b2ae3-2fd0-484e-bb19-ebebe1e5f8ef","quote":"the message needs the [AI] prefix, since we do that for every commit and PR title here."},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"48e88bbc-6072-4df9-b2a8-122ee21c05c7","quote":"Glad the message starts with [AI], that's what we do here."},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"2b41817d-fb42-420b-8b99-81c980a94517","quote":"start the message with [AI] like the rest of the history"},{"kind":"diff","path":"diff/commits.txt","quote":"[AI] Use undici's fetch throughout the sync server"}],"reason":"The developer states the prefix as a repository-wide rule for commits and PR titles in three sessions (70de19bb, de720aee), and every commit in the pushed range starts with it (diff/commits.txt). The rule is a title-format naming convention, not a code or linter rule, and it is absent from CONTRIBUTING.md (grep for commit, [AI] and PR title found no match). Scope is app:actual because the developer says 'here', not company-wide. Open question: whether it binds contributors other than this developer and agent; recorded under unresolved.","agent":"conventions-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-001","op":"ADD","text":"| PIT-001 | Account page (desktop): a handler re-fetches transactions with `updateQuery` or `fetchTransactions` while the search box holds text, for example toggling \"show reconciled transactions\". | The refetch replaces the search query, so the search text stays in the box but the list shows unfiltered rows. Rebuilding the query from the root also drops the active sort when no filters are set. | After the refetch, call `this.onSearch(this.state.search)` when search text is set, as `remove-sorting` does. Re-run `this.currentQuery` instead of rebuilding from the root so sort and filters survive (`packages/desktop-client/src/components/accounts/Account.tsx:970`). | app:actual |","scope":"app:actual","evidence":[{"kind":"conversation","session":"6866729d-4758-475d-ab89-f59a2f88a398","message":"90d6562c-d472-46b7-b8e1-fe790d9fbb6f","quote":"the search text stays in the box but the list stops being filtered by it"},{"kind":"conversation","session":"6866729d-4758-475d-ab89-f59a2f88a398","message":"feec3946-1748-42bf-8af9-1402ff7fae8a","quote":"already call `this.onSearch(this.state.search)` afterwards"},{"kind":"conversation","session":"6866729d-4758-475d-ab89-f59a2f88a398","message":"2a9c8a2d-e78b-4669-ace9-1facfd75dd03","quote":"rebuilds the query from the root"},{"kind":"source","path":"packages/desktop-client/src/components/accounts/Account.tsx","line":970,"quote":"this.onSearch(this.state.search);"}],"reason":"Failure reported by a user and reproduced by reading the code; the remedy is in head source at line 970 and the sort behaviour is explained in the conversation. The remedy was not run in the app or a test (the test was removed), so the entry states the cause and fix as code-level facts only.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-002","op":"ADD","text":"| PIT-002 | Computing, storing or displaying an amount for a currency with 0 decimal places (such as JPY), or passing `currency.decimalPlaces` as a storage scale. | The same amount is stored at different scales: a 1,500 yen budget showed as 15 on one screen and 150,000 on another. | Store every amount x100 with `amountToInteger` and `integerToAmount`, which take no decimal-places argument (`packages/loot-core/src/shared/util.ts:539-545`). Use `decimalPlaces` only to format for display. | app:actual |","scope":"app:actual","evidence":[{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"b3093f43-4dbd-4e40-a9b8-0f064b4476eb","quote":"they budget 1,500 yen and it shows as 15 on one screen and 150,000 on another"},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"d208a293-ba9d-4d21-bb27-8001a9983cc5","quote":"storage is always x100, yen included."},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"eb04ddcb-065d-465b-b2c5-93cc1726eaf9","quote":"we should never use the currency decimals to scale what we store, only for display."},{"kind":"source","path":"packages/loot-core/src/shared/util.ts","line":540,"quote":"return Math.round(amount * 100);"}],"reason":"The reported symptom, the developer's rule and the head implementation agree. The one-scale rule is a replaced decision (old: 10^decimalPlaces), recorded here as the failure it prevents. TERM-102 is handled by the terminology maintainer.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-003","op":"ADD","text":"| PIT-003 | `AmountInput` with `autoDecimals` (cover, transfer and hold modals, mobile split input) for a currency with 0 decimal places. | Typed digits are read as cents, so typing 1500 shows 15.00 (when hide fraction is off). | Keep the guard `autoDecimals && format.currency.decimalPlaces > 0` in `packages/desktop-client/src/components/util/AmountInput.tsx:135`, and keep the yen case in `AmountInput.test.tsx`. | app:actual |","scope":"app:actual","evidence":[{"kind":"source","path":"packages/desktop-client/src/components/util/AmountInput.tsx","line":135,"quote":"if (autoDecimals && format.currency.decimalPlaces > 0) {"},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"a61b750f-6e91-4e01-bab3-d4130ee36301","quote":"It reads typed digits as cents"},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"b597ed6d-70c5-40ed-ac69-ab7b730b14ce","quote":"it fails (the field showed `0`)"},{"kind":"diff","path":"packages/desktop-client/src/components/util/AmountInput.test.tsx","quote":"packages/desktop-client/src/components/util/AmountInput.test.tsx"}],"reason":"The guard exists at head, and the conversation reports the yen test fails when the guard is removed. The cents-reading consequence comes from the developer agent's reading of the code, so it is stated as the observed behaviour with the hide-fraction condition attached.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-004","op":"ADD","text":"| PIT-004 | Custom report date range where the stored From date is a full date and the To pick is a bare month, quarter or year key, and both fall in the same period. | Comparing the two as strings makes To sort before From, so the range is treated as reversed and From is reset to the fallback range. | Compare against the normalized end date, as `validateEnd` does (`packages/desktop-client/src/components/reports/reportRanges.ts:99-101`). | a );"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"d90aa03a-20bf-4885-8744-3613e2444720","quote":"The server is allowed through the `simplefinAllowedNetworks` config setting."}],"reason":"Verified at head in app-simplefin.js: the SSRF dispatcher is built from the config setting. The conversation describes the same mechanism for the integration test. Scoped to app:actual because the setting and guard are this application's sync server configuration.","agent":"tool-maintainer:bank-sync"},{"target":"tools/bank-sync/README.md","fact_id":"BANKSYNC-004","op":"ADD","text":"| BANKSYNC-004 | Sync server provider modules that call `fetch` import it from `undici`, not Node's global `fetch`, so the undici dispatcher used for the SSRF guard and the `fetch` call come from the same undici version. Checked in SimpleFIN, GoCardless and Enable Banking. Whether the rule applies beyond bank sync is not settled. | app:actual |","scope":"app:actual","evidence":[{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":3,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-gocardless/services/gocardless-api.ts","line":2,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts","line":2,"quote":"import { fetch } from 'undici';"},{"kind":"diff","path":"diff/commits.txt","quote":"SimpleFIN passed an undici v8 Agent as the dispatcher to Node's built-in"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"aeb3ca2c-cd97-49d0-8c21-cb2687b48a96","quote":"I don't want another HTTP library on the server, and undici is what Node ships anyway."}],"reason":"Source confirms the import in all three provider modules. The commit message gives the dispatcher-mismatch reason, which the commit author described as a best guess and did not reproduce. The developer chose to stay on u still carry the old text; those are not in scope.","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-107","op":"ADD","text":"| STACK-107 | Sync server HTTP requests use `fetch` imported from `undici`, never Node's global `fetch`. The SSRF guard's dispatcher is an undici `Agent`, and it must be passed to the same undici `fetch`. Do not add other HTTP client libraries (for example axios or node-fetch) to the sync server. | requirement | app:actual |","scope":"app:actual","evidence":[{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"aeb3ca2c-cd97-49d0-8c21-cb2687b48a96","quote":"I don't want another HTTP library on the server"},{"kind":"diff","path":"diff/commits.txt","quote":"Import fetch from undici in every sync server module"},{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":3,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":20,"quote":"const dispatcher = createSsrfDispatcher(networkOptions);"}],"reason":"The developer decided to keep the sync server on undici and to add no other HTTP library, which is a durable rule for this application. Verified at head: app-simplefin.js, app-cors-proxy.js, gocardless-api.ts, enablebanking-service.ts and scripts/health-check.ts import fetch from undici, and the SimpleFIN dispatcher comes from createSsrfDispatcher. The reason the developer gave, that undici is what Node ships, is imprecise: the commit message says Node's built-in fetch bundles a different undici version, which is why the dispatcher and fetch must match. The record keeps the technical reason. No linter enforces the import, so this is a convention; the developer said it is not written in the shared knowledge base yet. Scope is the sync server only, not a company rule.","agent":"stack-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-001","op":"ADD","scope":"app:actual","text":"| PIT-001 | Changing a handler in `accounts/Account.tsx` that refetches transactions, such as the \"show reconciled transactions\" toggle. | The refetch replaces the search query. The list shows unfiltered rows while the search box still holds the text. A user reported this on Discord as \"the search text stays in the box but the list stops being filtered by it\". | After any refetch, call `this.onSearch(this.state.search)` when the search is not empty. Otherwise re-run `this.currentQuery`, which keeps the active filters and sort. | app:actual |","evidence":[{"kind":"conversation","session":"6866729d-4758-475d-ab89-f59a2f88a398","message":"90d6562c-d472-46b7-b8e1-fe790d9fbb6f","quote":"the search text stays in the box but the list stops being filtered by it"},{"kind":"conversation","session":"6866729d-4758-475d-ab89-f59a2f88a398","message":"feec3946-1748-42bf-8af9-1402ff7fae8a","quote":"The `toggle-reconciled` case in `onMenuSelect` refetched transactions with only the filter conditions."},{"kind":"source","path":"packages/desktop-client/src/components/accounts/Account.tsx","line":969,"quote":"if (this.state.search !== '') {"}],"reason":"Failure reported by a user and explained from code reading. Remedy is present at head (Account.tsx:962-977), matching the pattern used by other refetching handlers. The development agent did not run the app or the test, so the human manual check is still outstanding; this is recorded as supported by code, not as human-verified. Also update the file's Status line, which still says no pitfalls are admitted.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-002","op":"ADD","scope":"app:actual","text":"| PIT-002 | Comparing a stored full From date with an end value from a custom report date picker. The end is a month key (`2026-07`) or a year (`2026`). | A plain string comparison sorts `'2026-07-01'` after `'2026-07'`. A To in the same month, quarter or year as From is then treated as reversed, and From is replaced by a fallback range, so the range flips. | In `validateEnd` (`reportRanges.ts`), compare against the normalized end date (month end, quarter end, or `yyyy-12-31`), not the raw picker key. | app:actual |","evidence":[{"kind":"conversation","session":"b44d114c-d4b7-4694-95b1-228bb7dd60bd","message":"e54dbbc6-f221-45f3-ac39-b0a483796e71","quote":"compared the stored From date"},{"kind":"conversation","session":"b44d114c-d4b7-4694-95b1-228bb7dd60bd","message":"388f0e98-3ec0-4040-9ec8-5ce1a29631e4","quote":"all failed on the old code and passed again once I restored the fix"},{"kind":"source","path":"packages/desktop-client/src/components/reports/reportRanges.ts","line":99,"quote":"Compare against the normalized end"}],"reason":"Mechanism verified by the development agent with a stash experiment: the new cases failed on the old code and passed with the fix. The fix is present at head (reportRanges.ts:99-101). The same flaw was in the Quarterly commit 090c1b0b and was fixed later in session b44d114c, so this entry covers both. Trigger is limited to the picker path; saved reports bypass validateEnd per the session.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-003","op":"ADD","scope":"app:actual","text":"| PIT-003 | Converting an amount to or from its stored integer form, for any currency including zero-decimal ones such as JPY. | Scaling storage by the currency's `decimalPlaces` mixes two scales. A yen budget of 1,500 showed as 15 on one screen and 150,000 on another. | Stored amounts are always ×100 (`amountToInteger`, `integerToAmount`). Use `decimalPlaces` only for display, as in `useFormat` and `integerToCurrencyWithDecimal`. | app:actual |","evidence":[{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"b3093f43-4dbd-4e40-a9b8-0f064b4476eb","quote":"they budget 1,500 yen and it shows as 15 on one screen and 150,000 on another"},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"d208a293-ba9d-4d21-bb27-8001a9983cc5","quote":"storage is always x100, yen included"},{"kind":"conversation","session":"de720aee-7716-4ecb-ba17-3a38c00ee07e","message":"eb04ddcb-065d-465b-b2c5-93cc1726eaf9","quote":"we should never use the currency decimals to scale what we store, only for display"},{"kind":"source","path":"packages/loot-core/src/shared/util.ts","line":539,"quote":"return Math.round(amount * 100);"}],"reason":"The rule is stated by the developer as a team decision for this application. Source at head shows amountToInteger is fixed at ×100 with no currency parameter. Supported, and it cost a visible data-display bug. Scope is app:actual, not company, because the developer described this app's storage scale.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-004","op":"ADD","scope":"app:actual","text":"| PIT-004 | Moving code out of a file marked `// @ts-strict-ignore` into a new file. | The directive does not carry over. The new file is strictly type-checked, so code that was accepted before (for example an implicit `any` parameter) fails `yarn typecheck`. A typecheck run that stops at an unrelated error can hide these strict-mode errors until that error is fixed. | Give the moved code real types. Recharts types pie-label props as optional, so cast to a local type with those fields required, as `donutLabel.ts` does. Do not copy the directive into new files. Rerun `yarn typecheck` after fixing every error. | app:actual |","evidence":[{"kind":"conversation","session":"d34fc234-ffeb-4f49-b9b7-9037b2a87b69","message":"e3b728d4-47e1-4cb5-997f-9260234ad043","quote":"That error stopped the run before the strict-mode pass"},{"kind":"conversation","session":"d34fc234-ffeb-4f49-b9b7-9037b2a87b69","message":"1968406d-8b38-42a1-a4f2-f3631e7f9995","quote":"New files shouldn't carry that, we only grandfather the old ones"},{"kind":"source","path":"packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx","line":1,"quote":"// @ts-strict-ignore"},{"kind":"source","path":"packages/desktop-client/src/components/reports/graphs/donutLabel.ts","line":9,"quote":"Recharts types these as optional"}],"reason":"Strict-mode failure observed in the typecheck, remedy present at head (donutLabel.ts has no directive and uses typed props). Hidden-error mechanism is the development agent's explanation, consistent with the observed sequence, so it is stated as the trigger, not as a general claim about the typecheck script. Recharts typing detail is handed off to the recharts tool document.","agent":"pitfalls-maintainer"},{"target":"tools/bank-sync/README.md","fact_id":"BANKSYNC-003","op":"ADD","scope":"app:actual","text":"| BANKSYNC-003 | SimpleFIN passes a dispatcher from `createSsrfDispatcher` (an undici `Agent` that enforces the SSRF guard) to `fetch` in `app-simplefin/app-simplefin.js`. Its requests must use `fetch` imported from `undici`, not Node's built-in global `fetch`, which bundles a different undici version; mixing the two is fragile. The team made this change after a SimpleFIN sync report. The development agent's suspected root cause was not reproduced. | app:actual |","evidence":[{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":3,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":20,"quote":"const dispatcher = createSsrfDispatcher(networkOptions);"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"be2af540-6678-4141-aaad-1ff9103a384b","quote":"SimpleFIN is the only code that passes a `dispatcher` to `fetch`."},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"be2af540-6678-4141-aaad-1ff9103a384b","quote":"This is my best guess. I haven't reproduced the user's failure."}],"reason":"Supported by the pushed diff (commit 567f1496 switches SimpleFIN to undici fetch), the head source, and the developer's request to fix a SimpleFIN report. It is a SimpleFIN-specific usage constraint, so it belongs in the SimpleFIN section. The root cause is recorded as unverified. The general sync-server rule is handed off to core. No existing row covers this.","agent":"tool-maintainer:bank-sync"},{"target":"tools/bank-sync/README.md","fact_id":"BANKSYNC-004","op":"ADD","scope":"app:actual","text":"| BANKSYNC-004 | The SimpleFIN integration test (`app-simplefin/integration.test.ts`) runs the real `app-simplefin.js` with the real undici `fetch` and the real SSRF dispatcher against a local HTTP server bound to `127.0.0.1` on an ephemeral port (`listen(0)`). It mocks only the config, and allows the local address through the `simplefinAllowedNetworks` setting. Mocked-fetch unit tests do not exercise this path, so use this setup when a SimpleFIN test must cover real network behaviour. | app:actual |","evidence":[{"kind":"source","path":"packages/sync-server/src/app-simplefin/integration.test.ts","line":19,"quote":"name === 'simplefinAllowedNetworks' ? allowedNetworks : get(name)"},{"kind":"source","path":"packages/sync-server/src/app-simplefin/integration.test.ts","line":45,"quote":"server.listen(0, '127.0.0.1');"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"d90aa03a-20bf-4885-8744-3613e2444720","quote":"It mocks nothing except the config, so it uses the real undici `fetch` and the real SSRF dispatcher."}],"reason":"Verified in the head source: the test file mocks only `#load-config`, binds port 0, and reads the allowed networks from config. The development agent described the reason for the mocked tests not covering this path. It is a reusable test setup for SimpleFIN network behaviour, which the tool README does not yet describe.","agent":"tool-maintainer:bank-sync"},{"target":"tools/bank-sync/README.md","fact_id":"BANKSYNC-005","op":"ADD","scope":"app:actual","text":"| BANKSYNC-005 | Known gap: SimpleFIN requests in the sync server set no timeout of their own, so a bridge that never answers can hold a sync for undici's default header timeout (about 300 seconds, per the development agent). Enable Banking sets its own abort controller and does not share this gap. The developer deferred a SimpleFIN timeout as a separate change. Do not assume SimpleFIN calls are bounded. | app:actual |","evidence":[{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":3,"quote":"import { fetch } from 'undici';"},{"kind":"source","path":"packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts","line":154,"quote":"const controller = new AbortController();"},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"a48fd694-1203-40d3-9213-a24461ec1c11","quote":"`app-simplefin.js` sets no request timeout of its own, and undici's default header timeout is 300 seconds."},{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"2c0ff959-c6c0-45f2-8c86-41040b54c3bf","quote":"The SimpleFIN timeout is a separate thing and I'd rather not widen this change."}],"reason":"The absence of a timeout is confirmed by the head source: no timeout or abort signal appears in app-simplefin.js. The 300-second figure is the agent's statement about undici defaults and is marked as such. The developer explicitly deferred the fix, so the row records a known gap rather than a decision to keep it.","agent":"tool-maintainer:bank-sync"},{"target":"tools/recharts/README.md","fact_id":"RECHARTS-003","op":"ADD","text":"| RECHARTS-003 | Recharts types the pie label props (`PieLabelRenderProps`: `cx`, `cy`, `midAngle`, `innerRadius`, `outerRadius`, `value`, `percent`) as optional, but it always supplies them for pie slices. `graphs/donutLabel.ts` casts them to a local type with those fields required, with a comment explaining why, instead of adding null checks that would change runtime behavior. Slices with value 0 get a `false` label text, so `renderCustomLabel` accepts `string | false`. | app:actual |","scope":"app:actual","evidence":[{"kind":"source","path":"packages/desktop-client/src/components/reports/graphs/donutLabel.ts","line":9,"quote":"Recharts types these as optional, but always supplies them for pie sectors."},{"kind":"source","path":"packages/desktop-client/src/components/reports/graphs/renderCustomLabel.tsx","line":14,"quote":"display: string | false,"},{"kind":"conversation","session":"d34fc234-ffeb-4f49-b9b7-9037b2a87b69","message":"9515ef78-5349-40d5-b411-3de7d6d8c1d2","quote":"Recharts types `cx`, `midAngle` and the other fields as optional, even though it always supplies them for pie slices."}],"reason":"Developer accepted this approach in the donut split session (the cast was chosen over runtime null handling to keep behavior unchanged). Source at head matches: donutLabel.ts declares the local DonutLabelProps type, and renderCustomLabel takes display as string | false. Scoped to app:actual because it describes this application's donut and label code, not a general Recharts rule.","agent":"tool-maintainer:recharts"},{"target":"tools/recharts/README.md","fact_id":"RECHARTS-004","op":"ADD","text":"| RECHARTS-004 | `DonutGraph.tsx` passes Recharts sector props to the active shape renderers through six `props as unknown as ActiveShapeProps` casts. The compiler does not check these against Recharts' types, so a changed Recharts prop would not be caught there. The team deferred this to a later change. The suggested fix is to build the props explicitly from Recharts' `PieSectorShapeProps`. | app:actual |","scope":"app:actual","evidence":[{"kind":"source","path":"packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx","line":169,"quote":"{...(props as unknown as ActiveShapeProps)}"},{"kind":"conversation","session":"d34fc234-ffeb-4f49-b9b7-9037b2a87b69","message":"ed08aa42-5143-4a2f-ac62-fa3b279a10cd","quote":"leave the six `as unknown as` casts alone, that's a follow-up for another day"}],"reason":"Known debt, stated by the developer with its reason, and visible in source at six call sites (lines 169, 178, 251, 260, 346, 355). It is useful to a future developer who might assume the active shape props are type-checked against Recharts. Scoped to app:actual.","agent":"tool-maintainer:recharts"}],"deferred":[{"target":"core/pitfalls.md","fact_id":null,"op":"NEEDS_REVIEW","scope":"app:actual","text":"Candidate, not admitted: | (no ID yet) | Passing an undici `Agent` dispatcher (the SSRF guard) to Node's built-in global `fetch` in sync-server code. | Suspected cause of a SimpleFIN bank sync failure on the nightly build: the dispatcher comes from undici 8 while the global fetch uses its own bundled undici. | Import `fetch` from `undici` in sync-server code, as `app-simplefin/app-simplefin.js` does. | app:actual |","evidence":[{"kind":"conversation","session":"70de19bb-341e-4ca0-a42f-f4262eb59326","message":"be2af540-6678-4141-aaad-1ff9103a384b","quote":"This is my best guess. I haven't reproduced the user's failure."},{"kind":"source","path":"packages/sync-server/src/app-simplefin/app-simplefin.js","line":3,"quote":"import { fetch } from 'undici';"}],"reason":"The mechanism was not reproduced, and the agent calls it a best guess. The remedy is present and a new integration test passes through real undici, but nothing confirms the reporter's failure is fixed. Per the deferral rule, do not admit this as a PIT entry until someone reproduces the failure or confirms the fix on the nightly build. The developer also did not confirm the undici convention as a written rule.","agent":"pitfalls-maintainer"}],"rejected":[],"no_change":4,"failures":[]}},"conversations":[{"task":"P1","mate":"Lena","mate_key":"lena","title":"Yen and other zero-decimal currencies show up 100 times off in places, because some code scales stored amounts by the currency's own decimal places. Make every currency use the same stored scale and only use the currency's decimals for display.","sessions":[{"n":1,"messages":[{"role":"dev","text":"hey, got a user report on yen: they budget 1,500 yen and it shows as 15 on one screen and 150,000 on another. looks like some of our currency code scales amounts differently depending on the currency. can you dig into it and make the stored scale consistent across currencies?","turn":1,"at":"2026-11-05T17:41:30.128016+00:00","marks":[]},{"role":"agent","at":"2026-11-05T17:41:57.043556+00:00","text":"Now the code.\n\nStorage is meant to follow the currency's `decimalPlaces` (JPY is 0), but several helpers default to 2. I'll check which callers pass the currency and which don't.\n\nI haven't changed anything yet. The fix means choosing which scale becomes the standard, and that choice affects existing data.\n\n**What's wrong**\n\nThe code uses two stored scales:\n- **Currency-aware (×10^decimalPlaces):** `useFormat` (`desktop-client/src/hooks/useFormat.ts`) reads `activeCurrency.decimalPlaces`. JPY is 0, so ¥1,500 is stored as `1500`. `amountToCurrencyInteger` and `integerToCurrencyWithDecimal(amount, code)` in `loot-core/src/shared/util.ts` do the same.\n- **Hardcoded ×100:** `amountToInteger`, `integerToAmount` and `integerToCurrency` default `decimalPlaces` to `2`. `currencyToInteger`, `toRelaxedNumber`, `looselyParseAmount` and the `% 100` check in `integerToCurrencyWithDecimal` always use 2.\n- **Where the defaults are used:** the other call sites (roughly 150 across 59 files) mostly call those helpers without a currency. They include the budget templates, rules, transaction sync, CSV export/import, the YNAB4 importer, the goal editors, the transaction tables and the bank-sync modules.\n\nFor a JPY user, a value saved as `1500` through the `useFormat` path displays as `15` through a default-2 path (1500/100). A value saved through a default-2 path as `150000` shows up as `150,000` in `useFormat`. That matches the report.\n\n**Direction**\n\n- **A. Always store ×100.** This is simple and leaves 2-decimal currencies untouched. It would remove the currency-aware logic in `useFormat`. Existing JPY and KRW data written through the currency-aware path would need a migration, and it contradicts TERM-102 in the knowledge base.\n- **B. Always store ×10^decimalPlaces.** This matches TERM-102 and what `useFormat` already does. It means threading the currency through the ~150 call sites and removing the silent `= 2` defaults. Existing data written through the default-2 path would need a migration, and all zero-decimal currencies would be affected. Data for 2-decimal currencies stays valid.\n\nI recommend B, but only if the currency-aware path is what most existing JPY users' data went through. If it's mostly default-2 data, then A causes less breakage. Which do you want, and do you know which scale the affected users' stored data is in? A budget or two from the reporter would settle it.\n\nOnce you pick, I'll make the defaults throw or require a currency, and I'll add tests for JPY and KRW.","tools":["[Read] /workspace/contextops-eval/kb/actual/dev/index.md","[Read] /workspace/contextops-eval/kb/actual/dev/core/pitfalls.md","[Read] /workspace/contextops-eval/kb/actual/dev/core/terminology.md","[Read] /workspace/contextops-eval/kb/actual/dev/core/tech-stack-standards.md","[Read] /workspace/contextops-eval/kb/actual/dev/core/naming-conventions.md","[Grep] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared","[Grep] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/util.ts","[Grep] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/currencies.ts","[Read] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/util.ts","[Grep] /workspace/contextops-eval/apps/actual/packages","[Grep] /workspace/contextops-eval/apps/actual/packages","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/hooks/useFormat.ts","[Grep] /workspace/contextops-eval/apps/actual/packages"],"user":null},{"role":"dev","text":"hm no, it's A. storage is always x100, yen included. 1500 yen is 150000 in the db. the currency decimals are display only. so useFormat and the currency-aware bits in util are the buggy ones, not the default-2 callers. no migration needed, the real data is already x100. (i briefly wondered about storing yen with zero implied decimals and special casing display, but no, one stored scale for everyone)","turn":2,"at":"2026-11-05T17:42:02.619432+00:00","marks":["P1-E1"]},{"role":"agent","at":"2026-11-05T17:53:30.161304+00:00","text":"Understood: storage is always ×100 and `decimalPlaces` only affects display. I'll find every place that uses it as a storage scale.\n\nUpdating the tests to the new storage contract (JPY 150000 displays as ¥1,500).\n\nCore callers are fixed. Next I'm checking the user-facing `INTEGER_TO_AMOUNT` formula, which exposes a second `decimalPlaces` argument, before moving on to the desktop-client callers.\n\n`normalizeIntegerValue` and its callers pass `decimalPlaces` as a scale too, so I'm removing it there as well.\n\nThe only remaining type error is a missing `html-to-image` module in `ReportTopbar.tsx`, which I haven't touched. Now the tests and lint.\n\nThe shell is on Node 18 and the repo needs 22 or newer, so Vitest won't start. I'll look for a newer Node.\n\nThe remaining failures are all in `category-template-context.test.ts`, which encodes the old currency-scaled behaviour for JPY. I'll look at them.\n\nMy earlier `prettier --write` calls did nothing because that script doesn't exist, so the files are unformatted. I'll find the repo's actual formatter and linter.\n\nLint found leftovers where the currency is no longer needed. I'll clean those up.\n\n`currencyCode` threads through three public handlers (`coverOverspending` and two others) and their client callers. I'll count the callers before deciding how far to cascade the removal.\n\nThe remaining `decimalPlaces` uses are all display formatting. I'll check that the two `parse-file` charset failures are not caused by my change.\n\nAmounts are now stored ×100 for every currency, and `decimalPlaces` only controls display. ¥1,500 is `150000` in storage and shows as `¥1,500`. Tests pass in `desktop-client` (1403) and `loot-core` (1367). Lint is clean. Typecheck has one error, a missing `html-to-image` module in `ReportTopbar.tsx`, which I didn't touch.\n\n## What changed\n\n- **`loot-core/src/shared/util.ts`:**\n  - `amountToInteger`, `integerToAmount` and `integerToCurrency` no longer take a `decimalPlaces` argument and always use 100.\n  - `integerToCurrencyWithDecimal(amount, code)` divides by 100 and uses the currency's decimals only for the fraction digits.\n  - I removed `amountToCurrencyInteger`, which duplicated `amountToInteger` once the scale was fixed.\n- **`useFormat`:** `toAmount`, `fromAmount`, `forEdit` and `fromEdit` use ×100.\n- **Other callers:** I removed `currency.decimalPlaces` from about 30 call sites. They were in the goal editors, the budget goal helpers (`getGoalDifference`, `makeBalanceAmountStyle`, `normalizeIntegerValue`) and the `useFormulaExecution` hook. The server side was `category-template-context`, `schedule-template` and the movement notes in `actions.ts`.\n- **Tests:** I rewrote the JPY and IRR cases around ×100 storage, including `150000` showing as `1,500`. That covered `util.test.ts`, `components/budget/util.test.ts` and the JPY block in `category-template-context.test.ts`.\n\n## Left as is\n\n- **`INTEGER_TO_AMOUNT` formula:** its optional second argument is still accepted so saved formulas keep working, but it's now ignored (commented in the code). A formula that passed `0` for yen would have been wrong anyway.\n- **`currencyCode` on three handlers:** `coverOverspending`, `coverOverbudgeted` and `transferCategory` still accept it, now optional and unused. Removing it fully means changing about a dozen UI and mutation files. Say if you want that as a follow-up.\n\n## Other things to know\n\n- **Pre-existing test failures:* etch` so they mock `undici`'s `fetch` instead.\n\nFixing the remaining Enable Banking tests and the type errors now.\n\nUse undici's own `Response`/`RequestInit` types and constructor so everything matches.\n\nThe sync server now uses undici's `fetch` everywhere. I haven't confirmed this fixes the SimpleFIN report, and nothing is committed. The sync-server tests pass (764/764) and lint is clean. `yarn typecheck` fails on one error: `html-to-image` can't be found in `ReportTopbar.tsx`, which is in `desktop-client`, not in anything I changed.\n\n**Likely cause:** SimpleFIN is the only code that passes a `dispatcher` to `fetch`. That dispatcher is an `Agent` from the installed `undici@8.12.3`, but the call was to Node's built-in global `fetch`, which bundles its own, different undici version. Mixing the two is fragile, and the SSRF guard in `util/ssrf.ts` depends on that dispatcher, so a Node or undici version change can break the sync. This is my best guess. I haven't reproduced the user's failure.\n\n**Where the fetch calls were** (all under `packages/sync-server/src`):\n- `app-simplefin/app-simplefin.js` has two calls, the claim `POST` and the redirect-following accounts `GET`. Both pass the dispatcher.\n- `app-cors-proxy.js` has two calls, the plugin allowlist and the proxy request.\n- `app-enablebanking/services/enablebanking-service.ts` and `app-gocardless/services/gocardless-api.ts` have one call each.\n- `scripts/health-check.ts` has one call.\n\nEach file now has `import { fetch } from 'undici'`, and I didn't change any other source logic. In `enablebanking-service.ts` I also import undici's `RequestInit` and `Response` types so they match.\n\n**Tests:** they were stubbing `global.fetch`, which no longer affects the code, so I changed them to mock `undici`'s `fetch` instead. That touched seven test files across SimpleFIN, the CORS proxy, Enable Banking and sensitive-logging.\n\n**Environment:** the default shell here uses Node 18, which can't run Vitest. I ran everything on Node 22.20 from nvm, and the server requires Node 22 or newer. If the user reporting the problem is on an older Node, that could also explain the breakage.\n\nI didn't add a release-notes entry. If this repo needs one, I can add it.","tools":["[Read] /workspace/contextops-eval/kb/actual/dev/index.md","[Grep] /workspace/contextops-eval/apps/actual/packages/sync-server","[Read] /workspace/contextops-eval/kb/actual/dev/core/tech-stack-standards.md","[Read] /workspace/contextops-eval/kb/actual/dev/core/pitfalls.md","[Read] /workspace/contextops-eval/kb/actual/dev/products/bank-sync/README.md","[Read] /workspace/contextops-eval/apps/actual/packages/sync-server/src/util/ssrf.ts","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src && sed -n 1,20p app-simplefin/app-simplefin.js && sed -n 395,560p app-simplefi","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server && grep -rnE \"dispatcher|from 'undici'|fetch\" src --include=*.js --include=*.ts | ","[Bash] grep -rnE \"stubGlobal|global\\.fetch|globalThis\\.fetch|vi\\.mock\\('undici|spyOn\\(.*fetch|fetch\" src --include=\"*.test.*\" -l; sed -n 1,30p src/scripts/health-check","[Bash] grep -nE \"fetch\" src/util/sensitive-logging.test.ts src/app-simplefin/app-simplefin.test.js src/app-simplefin/ssrf.test.ts src/app-cors-proxy.test.js | head -50","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src && python3 - <<'EOF' import re def sub(path, old, new):     s=open(path).read(","[Bash] sed -n 1,19p app-simplefin/app-simplefin.test.js; grep -n \"global\\|beforeEach\\|afterEach\\|restoreAllMocks\\|resetAllMocks\" app-simplefin/app-simplefin.test.js; s","[Bash] python3 - <<'EOF' import re MOCK = \"vi.mock('undici', async importOriginal => ({\\n  ...(await importOriginal()),\\n  fetch: vi.fn(),\\n}));\\n\"  # simplefin test p","[Bash] python3 - <<'EOF' p='app-cors-proxy.test.js' s=open(p).read() s=s.replace(\"    return (url, _requestOptions) => {\",\"    return vi.mocked(fetch).mockImplementati","[Bash] cd /workspace/contextops-eval/apps/actual && sed -i '/vi.unstubAllGlobals();/d' packages/sync-server/src/util/sensitive-logging.test.ts; ls ~/.nv","[Bash] sed -i '' '/vi.unstubAllGlobals();/d' packages/sync-server/src/util/sensitive-logging.test.ts && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && node -v ","[Bash] cd /workspace/contextops-eval/apps/actual && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && yarn workspace @actual-app/sync-server run ty","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && yarn tsc --noEmit 2>&1 |","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src && sed -n 1,12p app-enablebanking/tests/poll-auth.spec.ts; sed -n 44,56p app-e","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src/app-enablebanking && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && py","[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && python3 - <<'EOF' p='src/app-enablebanking/services/tests/enablebanking-service.spec.ts' s=open(p).read()","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src && sed -n 148,170p app-enablebanking/services/enablebanking-service.ts; sed -n","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && python3 - <<'EOF' p='src","[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && grep -n '\"lint' package.json; yarn oxfmt packages/sync-server/src 2>&1 | tail -3; yarn lint 2>&1 | tail -"],"user":null},{"role":"dev","text":"Thanks, that's a really helpful summary, and sorry for the extra work on the tests. Quick question about the Node thing you mentioned: I think we have the engines field in the sync server package.json set a bit low? I'm not sure of the exact number, but I believe the floor should be 22.19.0 now. Could you check and bump it if so? Also, just so I'm clear, the rule is that server code imports fetch from undici explicitly and never relies on the global one, right? Could you double check nothing else in the sync server still uses the global fetch, including the places that aren't tests? And since the SimpleFIN bit is what the user hit, is there a test that actually exercises SimpleFIN through the undici fetch?","turn":2,"at":"2026-11-05T18:05:13.485733+00:00","marks":["P2-E1"]},{"role":"agent","at":"2026-11-05T18:05:30.190097+00:00","text":"I bumped the engines floor, and nothing in the sync server uses the global `fetch` any more. SimpleFIN is tested through the undici import, but only against mocks.\n\n**Engines:** it was `\">=22\"` and is now `\">=22.19.0\"` in `packages/sync-server/package.json`. The root `package.json` says `>=22.18.0`, so the two now differ. I left the root alone, so say if you want it raised too. I didn't run anything after this edit. I confirmed 22.19.0 only from your recollection, not from the repo.\n\n**Global `fetch`:**\n- I grepped the whole sync-server package, including non-test code and scripts. Every `fetch(` call site imports from `undici`: `app-simplefin.js`, `app-cors-proxy.js`, `enablebanking-service.ts`, `gocardless-api.ts` and `scripts/health-check.ts`.\n- The tests import it or mock `undici` too. I found no `global.fetch`, `globalThis.fetch` or `stubGlobal('fetch')` left.\n- I can't confirm the rule you describe. The shared knowledge base has no entry saying server code must import `fetch` from `undici`. Its tech-stack and pitfalls pages are empty on this. It's a sensible convention, and the SimpleFIN dispatcher needs it, but it isn't written down anywhere. I can't enforce it either, since a new bare `fetch(` would still lint clean.\n\n**SimpleFIN test coverage:**\n- `app-simplefin.test.js` and `app-simplefin/ssrf.test.ts` mock `undici`'s `fetch`. They exercise the SimpleFIN claim, accounts and redirect logic through that import, so they would fail if the code went back to the global `fetch`. They check that the dispatcher is passed (`createSsrfDispatcher` is mocked in the first file).\n- The only real, unmocked undici `fetch` with the SSRF dispatcher is in `util/ssrf.test.ts`. It runs against a local HTTP server and checks that a blocked address is refused and an allowed one connects. That covers the mechanism, not SimpleFIN's own call sites.\n- So no test runs `app-simplefin.js` through real undici with the real dispatcher. That is the combination I suspect broke. I could add one that points SimpleFIN at a local server through the `simplefinAllowedNetworks` setting. Want me to?","tools":["[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server && grep -n -B1 -A3 '\"engines\"' package.json; grep -rnE \"(^|[^.\\w])fetch\\(|globalTh","[Grep] /workspace/contextops-eval/apps/actual/packages/sync-server","[Edit] /workspace/contextops-eval/apps/actual/packages/sync-server/package.json","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src && grep -L \"from 'undici'\" app-cors-proxy.js app-cors-proxy.test.js app-enable"],"user":null},{"role":"dev","text":"Yes please, add the SimpleFIN integration test against a local server. And I was wondering whether axios or node-fetch would make that test setup simpler, but actually no, scrap that. I don't want another HTTP library on the server, and undici is what Node ships anyway. Please keep it on undici.\n\nYou're right about the release note too, so can you add one? I think it's a Bugfix. Also, can you try `yarn typecheck` once more after the engines edit? If it only fails on that html-to-image thing, that's fine.","turn":3,"at":"2026-11-05T18:05:40.002104+00:00","marks":["P2-F1"]},{"role":"agent","at":"2026-11-05T18:07:23.447436+00:00","text":"The SimpleFIN integration test and the release note are both added. `yarn typecheck`, lint and the full sync-server suite all pass, and I kept everything on undici.\n\n- **Integration test:** `app-simplefin/integration.test.ts` runs the real `app-simplefin.js` against a local HTTP server on 127.0.0.1. It mocks nothing except the config, so it uses the real undici `fetch` and the real SSRF dispatcher. The server is allowed through the `simplefinAllowedNetworks` config setting. It has two tests:\n  - Claiming a setup token, storing the access key and listing accounts. It asserts the request order and the Basic auth header.\n  - Following a same-origin 302 on the accounts request and keeping the credentials on the second hop.\n- **Typecheck:** `yarn typecheck` from the repo root shows no errors this time, including after the engines edit, so the `html-to-image` error didn't appear. I ran it from the repo root, where earlier I ran it inside the sync-server package.\n- **Tests and lint:** the sync-server suite passes (766 tests, including the 2 new ones) and `yarn lint` is clean.\n- **Release note:** `upcoming-release-notes/sync-server-use-undici-fetch.md` has category Bugfix. I don't know your GitHub handle, so `authors` is the placeholder `[YOUR-GITHUB-HANDLE]`. Please replace it before pushing.\n\nThe new test doesn't check a redirect to a different origin or a blocked address, since the existing mocked tests already cover those.","tools":["[Bash] cd /workspace/contextops-eval/apps/actual && ls upcoming-release-notes | tail -5; f=$(ls upcoming-release-notes | grep -v README | tail -1); cat ","[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server/src/app-simplefin && sed -n 20,140p app-simplefin.js; sed -n 300,360p app-simplefi","[Bash] cat > integration.test.ts <<'EOF' import { once } from 'node:events'; import { createServer } from 'node:http'; import type { IncomingHttpHeaders, Server } from","[Bash] cd /workspace/contextops-eval/apps/actual && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && gh api user -q .login 2>&1 | head -2; git con","[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && cat > upcoming-release-notes/sync-server-use-undici-fetch.md <<'EOF' --- category: Bugfix authors: [YOUR-"],"user":null},{"role":"dev","text":"Thanks, that's great. I'll fill in the GitHub handle on the release note myself, so leave the placeholder for now. Sorry, one more question about the integration test. It binds a local server, so could it flake if the port is already taken, or on a CI box with odd networking? I think it picks a random port, but I'm not sure. Could you check, and also tell me how it behaves if the server never answers? I'd rather it fail quickly than hang.","turn":4,"at":"2026-11-05T18:07:32.884893+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:08:15.917356+00:00","text":"Port clashes aren't a worry. A server that never answers makes the test fail after Vitest's default 5 seconds, not hang. I made one small hardening change to the test teardown.\n\n**Port clashes:** the test binds with `server.listen(0, '127.0.0.1')`. Port 0 asks the OS for a free ephemeral port, and the test reads the real port back from `server.address()`. The port is never hard-coded, so a taken port can't cause a collision. Binding to 127.0.0.1 also avoids IPv6 and `localhost` resolution problems on odd CI networking. The test doesn't touch DNS, because the address is a literal IP.\n\n**Server that never answers:** `app-simplefin.js` sets no request timeout of its own, and undici's default header timeout is 300 seconds. What bounds the test is Vitest's default 5-second test timeout. To check, I ran a temporary copy of the test whose server accepted requests and never replied. Both tests failed with \"Test timed out in 5000ms\", and the whole run took about 12 seconds including startup. I deleted that copy afterwards.\n\n**Teardown change:** `server.close()` waits for open connections, so a stalled request could have left `afterAll` hanging. I added `server.closeAllConnections()` before it in `integration.test.ts`. The two real tests pass and lint is clean.\n\nI could add an explicit shorter timeout to the tests, but 5 seconds already seems quick enough. The sync server itself still has no timeout on SimpleFIN requests, so a bridge that never replies would keep a user's sync waiting for up to 300 seconds. The other providers set their own timeouts; for example, Enable Banking uses an abort controller. That isn't part of this bug, but say if you want me to add a timeout to the SimpleFIN calls.\n\nThe release-note placeholder is untouched.","tools":["[Bash] cd /workspace/contextops-eval/apps/actual/packages/sync-server && cat vitest.config.* 2>/dev/null | head -40; grep -n \"timeout\\|Timeout\\|signal\" ","[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && python3 - <<'EOF' p='src/app-simplefin/integration.test.ts' s=open(p).read() s=s.replace(\"\"\"afterAll(asyn"],"user":null},{"role":"dev","text":"Okay, that makes sense, thanks for checking. 5 seconds is fine, I won't ask for an extra timeout. The SimpleFIN timeout is a separate thing and I'd rather not widen this change. Maybe I'll mention it to the team later.\n\nOne more question, sorry. Should the root package.json engines (>=22.18.0) match the sync-server one, or is it fine to leave them different? I'm not sure how we usually handle that. What do you think?","turn":5,"at":"2026-11-05T18:08:25.226856+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:09:30.380604+00:00","text":"I'd leave them different, but I'd also drop the sync-server bump back to `>=22`, because I can't find a reason for the higher floor.\n\n**Why different floors are normal here:** the root `package.json` describes what developers need to work on the whole monorepo. Each package's `engines` describes what a consumer of that published package needs. The two don't have to match. `packages/api` and `packages/cli` both say `>=22`, so the sync-server was in line with them until my edit.\n\n**The floor is probably over-strict:**\n- The code runs on Node 22.19.0 or newer without trouble, but I haven't found anything that needs it. The undici change works on any Node 22, because it uses the installed `undici@8.12.3` package, not Node's built-in one.\n- I bumped it because you remembered 22.19.0 as the floor. I never checked that against the repo.\n- A stricter floor makes `yarn install` warn or fail for anyone on 22.0–22.18. That includes self-hosters who run the sync server from npm, and the SimpleFIN user may be one of them.\n- The Docker image and CI use Node 24 (`.nvmrc` says v24.22.1), so neither depends on this field.\n\n**What I'd do:**\n- If there's a real reason for 22.19.0, such as a dependency's own `engines` or a known Node bug, keep it and raise the root floor to match, since the root should be at least as high as any package.\n- If not, revert the sync-server line to `>=22` so this bug fix doesn't add a new requirement.\n\nI lean toward reverting. Do you remember where the 22.19.0 number came from? If a particular dependency or Node bug is behind it, keep the bump. If it was just a feeling, I'd revert.","tools":["[Bash] grep -n -A2 '\"engines\"' package.json packages/*/package.json; cat .nvmrc .node-version 2>/dev/null; grep -rn \"node-version\" .github | head -5; git log --oneline"],"user":null},{"role":"dev","text":"Hmm, no, I do think 22.19.0 is the right floor for the sync server, I'm fairly sure that's what we settled on, so please keep it at >=22.19.0 and don't revert it. Sorry I can't point at the exact reason offhand. Leave the root one alone then, different floors are fine. Thanks for the thorough answer, I think we're pretty much done here. Can you commit it? Thank you!","turn":6,"at":"2026-11-05T18:09:48.768308+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:09:53.822374+00:00","text":"I committed everything as `567f1496` on `sim2`: the undici switch, the test changes, the new SimpleFIN integration test and the release note. The sync-server `engines` floor stays at `>=22.19.0` and the root one is untouched, as you asked.\n\nThe release note still has the `YOUR-GIT 5T18:21:50.629713+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:21:59.300751+00:00","text":"Only `donutLabel.ts` ever had it, and it's gone now. I grepped the new files for `ts-strict-ignore`, `ts-ignore`, `ts-expect-error` and `: any`, and found none. The strict typecheck's file count also confirms it: it went from 914 to 915 strict files when I removed the ignore from `donutLabel.ts`, so all six new files are strict-checked. `DonutGraph.tsx` is the only file with the directive.\n\n**`ActiveShapeMobile` and `ActiveShapeDesktop`: mostly inherited**\n- **Props:** Both take a hand-written `ActiveShapeProps` (now in `activeShapeProps.ts`) with every field explicitly typed. That type moved over unchanged from the old inline version. Both files pass strict mode with no implicit `any`, so they're typed properly at the component level.\n- **Call sites:** The typing has a weak spot there. `DonutGraph.tsx` has six `{...(props as unknown as ActiveShapeProps)}` casts, which turn Recharts' sector props into our type with no real checking. If Recharts changed a prop, neither the compiler nor these components would notice. That was already in the old code, and `DonutGraph.tsx` is exempt from strict mode anyway. I left it alone as a pure move.\n- **Type shape:** `ActiveShapeProps` also includes `chartMidRadius` and `midAngle`, which only some of the components actually use. That's harmless.\n\nIf you want to tighten this, I'd build the props explicitly from Recharts' `PieSectorShapeProps` instead of the double cast. It would touch the three duplicated shape renderers you wanted left alone, so I haven't done it.","tools":["[Bash] grep -n \"ts-strict-ignore\\|ts-ignore\\|ts-expect-error\\|: any\\|as unknown\" ActiveShape*.tsx activeShapeProps.ts donut*.ts DonutGraph.tsx"],"user":null},{"role":"dev","text":"ok good, glad it's only donutLabel that tripped it. leave the six `as unknown as` casts alone, that's a follow-up for another day (and honestly i'd rather not touch those
