:24:01.671965+00:00","text":"The app repo is clean. The only mention of `html-to-image` in `apps/actual` is the one in the release note I wrote, which is meant to be there. It's gone from every `package.json`, from `yarn.lock`, from source and config, and from `node_modules`. It isn't in the Yarn cache either, because `enableGlobalCache` is off and the checked-in cache has no entry for it.\n\nI also searched the rest of `contextops-eval`, which turned up some matches outside the app repo:\n- **Team knowledge base (`kb/actual/dev`):** `core/tech-stack-standards.md` still has STACK-105: \"The 'Download Snapshot' action on reports captures the report with html-to-image's `toPng`.\" That's now out of date. It's the read-only checkout from your CLAUDE.md, so I didn't touch it. Someone will want to update it to say snapdom's `toPng`.\n- **Copies and archives:** The same line is in other copies of the knowledge base (`kb/actual/a`, `kb/actual/b`, `kb2/*`, `baselines/`). The rest are simulation archives, session logs and docs HTML under `sim/` and `runtimes/`. Those are history, not live config, so I'd leave them.\n\nSo there's nothing left to remove in the app, and the only follow-up is the STACK-105 knowledge entry.","tools":["[Bash] cd ~/Desktop/contextops-eval && grep -rIl -i \"html-to-image\\|htmltoimage\\|html_to_image\" . --exclude-dir=node_modules --exclude-dir=.git --exclu","[Bash] grep -rIn -i \"html-to-image\\|htmltoimage\" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=build 2>/dev/null | head; echo \"exit-lines: done\"; grep "],"user":null},{"role":"dev","text":"nice, clean. the stale mention outside the app repo isn't ours to touch, someone else can fix that, so leave it alone. i'm happy with where this is, so go ahead and commit it all. donut split, snapdom swap and both release notes can go in one commit, and keep the usual [AI] prefix on the message.","turn":9,"at":"2026-11-05T18:24:14.445980+00:00","marks":[]},{"role":"agent","at":"2026-11-0 d` case in `onMenuSelect` refetched transactions with only the filter conditions. The refetch replaces the query that `onSearch` had set, so the list went back to unfiltered while `state.search` still held the text. Other handlers that refetch, such as `remove-sorting`, already call `this.onSearch(this.state.search)` afterwards to put the search back.\n\n**Fix:** After the refetch, `toggle-reconciled` now re-applies the search when `state.search` isn't empty, the same way `remove-sorting` does. I also merged the two duplicated true/false branches into a single toggle.\n\nTo check it, search for a payee, toggle \"show reconciled transactions\" both ways, and confirm the list stays filtered.\n\nThe knowledge base had no pitfalls recorded that applied to this change.","tools":["[Read] /workspace/contextops-eval/kb/actual/dev/index.md","[Grep] /workspace/contextops-eval/apps/actual","[Read] /workspace/contextops-eval/kb/actual/dev/core/pitfalls.md","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx"],"user":null},{"role":"dev","text":"Thanks, that makes sense! One thing I'm wondering about: does this also keep the current sort and filters applied after toggling, or only the search? I'd like all of them to survive. Could you also add a test that searches and then toggles reconciled? Please try the relevant yarn command once, but if the workspace isn't installed on this laptop that's fine.","turn":2,"at":"2026-11-05T18:24:47.991980+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:25:31.504610+00:00","text":"Now the test. I'll build an instance directly, stub `updateQuery`, and make `setState` synchronous.\n\nI couldn't run the test here, so I haven't verified the fix or the test. Vitest fails at startup because this laptop's Node version doesn't export `styleText` from `node:util`. That's a toolchain issue, not a failure in the test. I didn't try other Node versions, since you said one attempt was fine.\n\n**Sort and filters:** my first fix didn't reliably keep them, so I changed it.\n- **Cause:** the toggle called `fetchTransactions(filterConditions)`, which rebuilds the query from the root. With no filters but an active sort, `applyFilters([])` calls `fetchTransactions()` again, and the sort is dropped.\n- **Fix:** the root query doesn't depend on `showReconciled`, because `updateQuery` adds that filter itself. The toggle now skips the rebuild and re-runs `updateQuery` on `this.currentQuery`, which already holds the filters and sort. If a search is active it goes through `onSearch`, as before, so the search is kept too.\n- **Where:** `toggle-reconciled` in `packages/desktop-client/src/components/accounts/Account.tsx`.\n\n**Test:** I added `Account.test.tsx` next to the component. To reach the handler I exported `AccountInternal`, which wasn't exported before.\n- **Search:** the first test builds an instance with `search: 'grocery'`, toggles reconciled, and checks the search is still in state and in the query passed to `updateQuery`.\n- **Sort and filters:** the second test sets a filtered, sorted `currentQuery` with no search. It checks that `updateQuery` gets that same query after the toggle.\n\nThe test stubs `setState` and `updateQuery` rather than rendering the whole account page, which has many dependencies. It covers the toggle logic, not the UI. Please run `yarn vitest run src/components/accounts/Account.test.tsx` from `packages/desktop-client` on a machine with a newer Node.","tools":["[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Glob] /workspace/contextops-eval/apps/actual","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Bash] ls node_modules 2>&1 | head -3; sed -n 1,60p packages/desktop-client/src/components/accounts/Reconcile.test.tsx; grep -n \"export\" packages/desktop-client/src/co","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Bash] grep -n \"transactionsSearch\" -A25 packages/desktop-client/src/queries/queries.ts | head -50; grep -n \"^import\" packages/desktop-client/src/components/accounts/A","[Write] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.test.tsx","[Bash] cd /workspace/contextops-eval/apps/actual/packages/desktop-client && timeout 300 yarn vitest run src/components/accounts/Account.test.tsx 2>&1 | ","[Bash] yarn vitest run src/components/accounts/Account.test.tsx 2>&1 | tail -40"],"user":null},{"role":"dev","text":"Ok thanks, that's a really clear explanation, and no worries about the Node thing, I figured the laptop might not be set up. One question though, sorry: exporting AccountInternal just for the test feels a little odd to me. Is that something we already do elsewhere, or is there a nicer way to reach that handler? Also, does the sort actually survive in the real flow, not just in the stubbed test? I'm a bit nervous since the test mocks setState and updateQuery.","turn":3,"at":"2026-11-05T18:25:36.764269+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:25:54.797839+00:00","text":"**Exporting `AccountInternal`:** it isn't an existing pattern. The only other exported component class in `desktop-client/src` is `FixedSizeList`, which is a public component, not an internal one. So the export exists purely for the test, and I understand it feeling odd. The alternatives:\n\n- **Render the real `Account` in the test** with `TestProviders`, and mock `send`, `pagedQuery` and the redux state. That exercises the real wiring, but it needs a lot of mocking for this one handler.\n- **Keep the export and mark it test-only**, with a short comment on the `export`.\n- **Drop the class-level test.** The logic is now a single `updateQuery(this.currentQuery, ...)` call, which is thin enough that you could skip the test.\n\nI'd lean toward the first option if you want real coverage, but it's a bigger test. I haven't picked one, so tell me which you prefer and I'll change it.\n\n**Does the sort survive in the real flow?** I believe so, but I've checked it by reading the code, not by running anything. The stubbed test only shows that the toggle calls `updateQuery` with whatever `currentQuery` holds. These are the real-flow facts that make that enough:\n\n- **Sort and filters are stored on `currentQuery`:** `applySort` and `applyFilters` both assign `this.currentQuery`, so it carries the `orderBy` and filter clauses.\n- **The reconciled filter doesn't pollute `currentQuery`:** `updateQuery` adds `reconciled = false` to a local copy of the query. I checked `Query.filter` and `orderBy` in `loot-core/src/shared/query.ts`, and they return a new `Query` each time, so the stored query stays clean. Toggling both ways therefore works from the same base.\n- **Search keeps the sort too:** `onSearchDone` builds the search query on top of `currentQuery`, so it inherits the sort and filters.\n\nWhat I haven't confirmed is that the live list stays sorted after a toggle in the actual UI. I'd check that by hand once the app runs: sort a column, add a filter, search, then toggle reconciled both ways.","tools":["[Bash] cd /workspace/contextops-eval/apps/actual/packages/desktop-client/src && grep -rn \"export class\\|export default class\" --include=*.tsx . | grep -","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Bash] cd /workspace/contextops-eval/apps/actual/packages && f=$(ls loot-core/src/shared/query.ts 2>/dev/null || find . -path ./node_modules -prune -o -"],"user":null},{"role":"dev","text":"Ok, thanks for checking, that's helpful. I think I'd rather not keep an export that only exists for the test, and rendering the whole Account page with all those mocks sounds like way too much for one handler. Could you drop the AccountInternal export and the class-level test, and keep just the small fix in the toggle? I'll sort a column, search, and toggle reconciled by hand once I have the app running.","turn":4,"at":"2026-11-05T18:26:00.884391+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:26:04.685121+00:00","text":"I dropped the `AccountInternal` export and deleted `Account.test.tsx`. The only change left is the `toggle-reconciled` fix in `packages/desktop-client/src/components/accounts/Account.tsx`, and nothing is committed.\n\nThe toggle now re-runs the current query instead of rebuilding it from the root. That means the active filters, sort and search all stay applied, and it uses `onSearch` when there's search text.\n\nThere's no automated coverage for this, and I still haven't run it. For your manual check, sort a column, add a filter, search a payee, then toggle \"show reconciled transactions\" both ways and confirm the list stays sorted, filtered and searched each time.","tools":["[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx","[Bash] cd /workspace/contextops-eval/apps/actual && rm packages/desktop-client/src/components/accounts/Account.test.tsx && git status --short && git dif"],"user":null},{"role":"dev","text":"Thanks, the diff looks a lot smaller now, which I like. One edge case I'm wondering about, sorry: when onSearch gets called from the toggle, does it do any debouncing or extra work that could make the list flicker or refetch twice? Also a user on Discord mentioned this happens with the reconciled toggle on the mobile view too. Is that a separate code path, or does it all go through this same handler?","turn":5,"at":"2026-11-05T18:26:11.735444+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:26:33.067713+00:00","text":"**Debounce, flicker and double fetch on desktop**\n\n`onSearch` isn't free. It does three things:\n1. It unsubscribes the current paged query.\n2. It calls `setState({ search })` with the same value, which is a no-op re-render for a `PureComponent`.\n3. It schedules `onSearchDone`, which is debounced by 150ms. When that fires, it runs `updateQuery` once and builds one new paged query.\n\nSo there's one refetch, not two. The props-change handler only reacts to `accountId` changes, so the `setShowReconciled` pref update doesn't trigger a second fetch. I also didn't see anything else that reacts to `showReconciled`.\n\nTwo side effects of the debounce:\n- **Frozen list for ~150ms:** the list stays on the old data (reconciled rows not yet shown or hidden) because the subscription is already dropped. It doesn't flash unfiltered, but there's a short delay before the toggle takes effect.\n- **Non-search toggles are immediate:** without search text I call `updateQuery` directly, so the delay only applies when a search is active.\n\nIf that 150ms bothers you, I can skip the debounce by calling `updateQuery` with the search query directly. It would duplicate a few lines from `onSearchDone`, so I held back. I haven't measured any of this in the running app.\n\n**Mobile**\n\nMobile is a separate code path and doesn't go through `onMenuSelect`. The mobile screens only read the `hide-reconciled-*` synced pref. The toggle itself is in the account menu modals (`AccountMenuModal` and `AllAccountsMenuModal`). I read the mobile code, but I haven't confirmed whether it has this bug:\n- **Single account (`mobile/accounts/AccountTransactions.tsx`):** an effect rebuilds the base query when `hideReconciled` changes, then re-runs `search(searchTextRef.current)`. That should keep the search. `search` is debounced inside `useTransactionsSearch`, so the list may show the unfiltered query for a moment before the search lands, which would look like a flicker.\n- **All accounts (`mobile/accounts/AllAccountTransactions.tsx`):** on a `hideReconciled` change it rebuilds the query and wraps it in `transactionsSearch` when search text exists. That looks correct.\n\nSo I don't see a cause for \"search drops after toggling\" on mobile from the code. The Discord user may have been on desktop, or may be seeing the brief unfiltered flash on the single-account screen. It would help to ask them which screen, whether it was a single account or all accounts, and whether the search stayed off or only flickered. I haven't changed anything in this turn.","tools":["[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/mobile","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Header.tsx","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/mobile/accounts/AccountTransactions.tsx","[Grep] /workspace/contextops-eval/apps/actual/packages","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/mobile/accounts/AllAccountTransactions.tsx","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/hooks/useTransactionsSearch.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx"],"user":null},{"role":"dev","text":"Ok, the 150ms delay is fine, I won't worry about it. I'll ask the Discord user which screen they were on. Mobile looks separate from this fix so let's leave it alone for now. The diff looks good to me, so please go ahead and commit it.","turn":6,"at":"2026-11-05T18:26:38.997728+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:26:42.659860+00:00","text":"I committed the fix as `34e8699f` on `sim2`: \"[AI] Keep search, sort and filters when toggling reconciled transactions\". It only touches `Account.tsx`, and I haven't pushed it.\n\nAs we discussed, it hasn't been run or tested yet. Once you have the app running, sort a column, add a filter, search a payee, and toggle reconciled both ways.","tools":["[Bash] git status --short && git log -5 --format=%s && git add packages/desktop-client/src/components/accounts/Account.tsx && git commit -q -m \"[AI] Keep search, sort "],"user":null}]}]},{"task":"P5","mate":"Lena","mate_key":"lena","title":"Custom reports can group by day, week, month, or year. Add a Quarterly interval.","sessions":[{"n":1,"messages":[{"role":"dev","text":"hey, custom reports let you group by day, week, month or year. can we add a quarterly option too? users keep asking for it. take a look at how the existing intervals are wired up and tell me what you think before changing stuff","turn":1,"at":"2026-11-05T18:26:49.296428+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:27:24.992504+00:00","text":"I'll start with the team KB index, as CLAUDE.md asks, and look for where the intervals are defined.\n\nI've read through how the intervals are wired up and haven't changed anything. Quarterly is doable. It's more than adding one entry to a list, because \"Yearly\" and \"Monthly\" are hardcoded in several places.\n\n**How intervals work today**\n\n`interval` is a plain `string` on the report entity (`loot-core/src/types/models/reports.ts`) and in the DB schema, so saved reports don't need a migration. `ReportOptions.ts` defines each interval as `{key, name, format, range}`, and the `name` and `range` fields point at a `monthUtils` function. Most of the UI reads from those maps, and that part adapts automatically.\n\n**What would break, in order of difficulty**\n\n1. **The query layer needs a quarter bucket.** `makeQuery.ts` groups with AQL's `$day`, `$month` or `$year`, and `compiler.ts:611-622` has no `$quarter`. There are two ways to handle it:\n   - **Add `$quarter` to the AQL compiler.** This is cleaner but touches the core query engine. It would need a new `castInput` type (like `date-month` and `date-year`) that maps to SQL on the integer date, plus compiler tests.\n   - **Group by month and roll up client-side.** This is the same trick Weekly already uses in `custom-spreadsheet.ts:181`, where it remaps dates with `weekFromDate`. It's lower risk and needs no engine change. I'd go this way.\n   - **Range filter.** `makeQuery.ts:21-24` also applies the date range filter with `$transform`. For Quarterly it should use `$month`, with the start and end snapped to quarter boundaries.\n\n2. **Quarter helpers are missing from `months.ts`.** It already has `getQuarter`, `getQuarterStart`, `getQuarterEnd` and `prevQuarter`. It lacks `quarterFromDate`, `quarterRangeInclusive` and `currentQuarter`. I'd represent a quarter by its first month (`2026-04`). That keeps the same key format Monthly uses, and it formats through the existing date code.\n\n3. **Hardcoded `Daily/Weekly/Monthly/Yearly` branches (the easy part to miss).**\n   - **Type unions:** `ReportOptions.ts` has the `'Day'|'Week'|'Month'|'Year'` unions, and `GetCardData.tsx` has `convertFromDate` and `convertRangeInclusive`. Both would silently map Quarterly to the daily default.\n   - **Ternary chains:** `CustomReport.tsx:349-392` and `showActivity.ts:58-62` build function names with `name.toLowerCase() + 'FromDate'`, so a new name needs a matching `quarterFromDate`. `CustomReport.tsx` also has a `currentInterval` chain that falls back to the current month.\n   - **Date range table:** `dateRangeOptions` in `ReportOptions.ts` has a `Daily/Weekly/Monthly/Yearly` boolean per preset. Each preset needs a `Quarterly` flag, and `dateRangeProps` needs the field. `disabledList.ts` has its own copy of the interval options.\n   - **Budgeted balance type:** `budgetDataQuery.ts:231` only knows Monthly and Yearly. `ReportSidebar.tsx:213` forces Daily and Weekly back to Monthly. Quarterly needs to be allowed or forced here too, and for Budgeted it means summing three months of budget data.\n\n4. **Labels.** `getIntervalFormat` already handles non-day intervals through `intervalFormat`. The date-fns `QQQ` token gives \"Q2 '26\". Check how it localizes before settling on a format.\n\n5. **Click-through (`showActivity.ts`).** Clicking a bar opens the transactions for that interval. It builds a start and end from the interval type, so Quarterly needs a three-month span there.\n\n**Things I'd check first**\n- NetWorth, BalanceForecast and Spending have their own interval handling. I'd keep them out of scope unless you want Quarterly there too.\n- `ReportOptions.test.ts` iterates over the intervals, so it will exercise the new entry.\n\n**Recommendation:** do the client-side rollup with new `months.ts` helpers, add Quarterly to `intervalOptions`, and fix the hardcoded branches listed above. I'd add tests for the new helpers, `makeQuery`, and the Budgeted path. It's around 10 files and no schema or engine change.\n\nShould I go ahead on that plan, or would you rather add `$quarter` to AQL?","tools":["[Read] /workspace/contextops-eval/kb/actual/dev/index.md","[Grep] /workspace/contextops-eval/apps/actual","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/ReportOptions.ts","[Re ext":"Core logic is in: the `months.ts` helpers, the month-level query, and the client-side rollup. Now I'm wiring Quarterly into `ReportOptions` and the hardcoded branches.\n\nNext I'm checking the remaining interval switches (`reportRanges`, `ReportLegend`, the table header), then typecheck and tests.\n\nTypecheck passes. `oxfmt` won't run on this Node 18, so I'll fix the long line by hand and add tests.\n\nVitest needs a newer Node than the 18 on PATH. Checking for another install.\n\nQuarterly is now an interval option for custom reports. Typecheck, oxlint, and the tests pass (465 in `desktop-client/reports`, plus the `months` tests). I haven't run the app and checked the chart, so that's still to do. Nothing is committed.\n\nNode 18 is the default here, and `oxfmt` and `vitest` fail on it. I ran them with Node 22 from nvm, and `oxfmt` reformatted the changed files.\n\n**What changed**\n- **Quarter helpers** in `months.ts`: `quarterFromDate`, `currentQuarter` and `quarterRangeInclusive`. A quarter is keyed by its first month, so Q3 2026 is `2026-07`.\n- **Option definition** in `ReportOptions.ts`: a `Quarterly` interval with the label format `QQQ ''yy`, which renders as Q3 '26. Each date range preset also got a `Quarterly` flag. It's off for presets shorter than a quarter: this/last week, this/last month, and last 30 days.\n- **Query** in `makeQuery.ts`: Quarterly queries by month, the same way Weekly queries by day, and there are no AQL changes.\n- **Rollup** in `fetchSpreadsheetQueryData.ts`: monthly rows are re-keyed to their quarter. Both spreadsheets get this, and Budgeted reports too, since budget data is monthly.\n- **Hardcoded branches** updated in `GetCardData.tsx`, `CustomReport.tsx` (current interval and the `FromDate` cast), `showActivity.ts`, `reportRanges.ts`, and `disabledList.ts` (default range for the picker). The Budgeted comment in `ReportSidebar.tsx` now says Quarterly is supported.\n- **Tests** for the helpers, the label format, and the month-level query.\n\n**Decisions for you**\n- **Partial quarters at the edges.** A range like \"Last 6 months\" can start mid-quarter, so the first and last buckets can cover fewer than three months. That matches how Weekly handles partial weeks. I didn't snap ranges to quarter boundaries.\n- **Click-through.** `showActivity.ts` now opens a range from the first day of the quarter's first month to the end of its last month. Monthly and Yearly use an exact-date match, which can't work for a quarter.\n- **Default range.** `disabledList.ts` sets \"Last 12 months\" as the default when you pick Quarterly. That was my pick, so change it if you'd prefer something else.\n\nI left NetWorth, BalanceForecast and Spending alone as you asked. `reportRanges.ts` is shared with them, but I only added `Quarterly` cases, so their behavior is unchanged.","tools":["[Grep] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/months.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/graphs/showActivity.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/spreadsheets/grouped-spreadsheet.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/spreadsheets/budgetDataQuery.ts","[Edit] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/months.ts","[Edit] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/months.ts","[Edit] /workspace/contextops-eval/apps/actual/packages/loot-core/src/shared/months.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/spreadsheets/recalculate.ts","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/spreadsheets","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/spreadsheets/fetchSpreadsheetQueryData.ts","[Read] /workspace/contextops-eval/apps/actual/pack  and this code never reads them.\n\nThe rollup does no summing itself. It only re-keys each row's `date` from the month to the quarter's first month, so three rows (e.g. `2026-07`, `2026-08`, `2026-09`) all become `2026-07`. The consumers sum rows that share a date: `recalculate.ts:62-66` and `custom-spreadsheet.ts:233`. Yearly already works this way for Budgeted: `budgetDataQuery.ts:231` slices the month to the year and relies on the same summing.\n\nTwo things I haven't verified:\n- **No Budgeted test.** I haven't tested the Budgeted rollup end to end. The tests I added cover the `months` helpers, the label format, and the month-level query, but not Budgeted. I can add one that feeds three months of budget rows through and checks the quarter total.\n- **Partial quarters.** If the range starts mid-quarter, the first bucket sums only the months in range, so it will look smaller than a full quarter. That's the partial-quarter behavior I mentioned earlier. It's easy to misread on a Budgeted chart, so it's worth a look in the UI.\n\nWant me to add that Budgeted test?","tools":["[Bash] cd /workspace/contextops-eval/apps/actual/packages && sed -n 255,290p desktop-client/src/components/reports/spreadsheets/budgetDataQuery.ts; grep"],"user":null},{"role":"dev","text":"yeah that makes sense, it's a flow so summing is fine. add the budgeted test please, three months in, check the quarter total. also what happens in the custom range picker if From ends up after To with quarterly on? what does it fall back to?","turn":4,"at":"2026-11-05T18:32:01.236483+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:33:19.119793+00:00","text":"I'll read the rest of the range logic and run the picker cases instead of reasoning from the code alone.\n\nThe Budgeted test is added and passes. For the picker, a From after To falls back to a one-year range. Picking the same quarter in both fields has a related quirk, described below. Lint is clean.\n\n## Budgeted test\n\nIt's in the new `spreadsheets/fetchSpreadsheetQueryData.test.ts`. It mocks `send` to return a `budget-<cat>` cell for each month, with 100, 200, 300 and 400 for Jul to Oct, and runs the result through `recalculate`. It checks three things:\n- **Keying:** three months in Q3 all come out keyed `2026-07`.\n- **Quarter total:** the Q3 total is 600, which is 100 + 200 + 300.\n- **Partial quarter:** a range of Sep to Oct gives 300 for Q3 and 400 for Q4, so a quarter only partly in range counts only the months in range.\n\n## Picker when From ends up after To\n\nThe fallback lives in `reportRanges.ts`. I ran the cases for Monthly and Quarterly side by side. The test-mode \"today\" is 2017-01, so end dates were clamped to that.\n\n| Case | Quarterly result |\n|---|---|\n| From set after To | Start stays as picked. End becomes start + 365 days, capped at the end of the current month. |\n| To set before From | End becomes the end of the picked quarter. Start becomes end − 365 days. Picking Q1 2016 gives 2015-04-01 to 2016-03-31. |\n| From and To set to the same quarter | The range widens back a year (see below). |\n\n- **The 365 days is my choice.** Monthly uses 180 and Yearly uses 1095. I picked a year so you'd get about four quarters. Say if you'd prefer something else.\n- **Same-quarter quirk:** if To is set to the same quarter as From, the range doesn't collapse to one quarter. The code compares the stored start, a full day like `2026-07-01`, against the picked key `2026-07`. As strings, the day sorts after the key, so it counts as \"start after end\" and pushes start back.\n  - Quarterly inherits this from existing code. Monthly does the same: From and To both July 2016 became 2016-02-02 to 2016-07-31.\n  - I haven't changed it, since it would alter Monthly behavior. The fix is to compare on month keys, not raw strings. It's small, and I can do it for all intervals, or for Quarterly only if you'd rather not touch Monthly. Which do you want?","tools":["[Bash] cd /workspace/contextops-eval/apps  and I've now written one. The click-through for the current quarter stops at the end of the current month, not the quarter end.\n\n## Release note\nThe new file is `upcoming-release-notes/custom-reports-quarterly-interval.md`. It uses the same format as the recent ones: `category: Enhancements`, `authors: [context-ops-demo]`, and a one-line description. I picked Enhancements over Features since this extends an existing option. Change the category if you'd rather call it a feature.\n\n## Click-through on the current quarter bar\nThis comes from reading the code. I haven't clicked it in the app. The end date goes past today but stops short of the quarter end. It stops at the end of the current month.\n\n- **Where the end date comes from:** the last interval's end date is the report's own end date. `showActivity` then snaps it to the end of that month for Quarterly (`getMonthEnd`). That matches the report query, which also works in whole months.\n- **Example:** today is 2026-11-05 and the report is \"Last 6 months\". The Q4 bar covers 2026-10-01 to 2026-11-30. It doesn't reach 12-31, and it includes the 25 days after today.\n- **\"Year to date\":** the report's end date is today, so the end still snaps to 11-30. The click-through and the bar agree, since the bar is built from whole months too.\n- **Earlier quarters:** a fully past quarter's bar ends on its real quarter end, because that comes from the day before the next quarter's key.\n\nPast-today days only matter if you have future-dated transactions. If you'd rather the click-through stop at today, I can clamp the end date to `currentDay()` for Quarterly. That would make the click-through show fewer transactions than the bar sums. Do you want that?","tools":["[Bash] cd /workspace/contextops-eval/apps/actual && ls | head -30; ls upcoming-release-notes 2>/dev/null | tail -5; git log -5 --stat --format='%h %s' -","[Bash] cat upcoming-release-notes/split-donut-graph.md upcoming-release-notes/consistent-currency-storag quarter as From. It covers the first and last month of the quarter.\n\nVitest needed Node 22 here. The default shell is on Node 18, so I used the nvm 22.20.0 install.","tools":["[Read] /workspace/contextops-eval/kb/actual/dev/index.md","[Bash] git show 090c1b0b --stat","[Bash] git show 090c1b0b -- '*reportRanges.ts' '*months.ts' '*CustomReport.tsx' '*ReportOptions.ts'; cat /workspace/contextops-eval/kb/actual/dev/core/p","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reportRanges.ts","[Bash] grep -n \"getQuarter\" -A12 packages/loot-core/src/shared/months.ts | head -60; grep -n \"validateStart\\|validateEnd\" -r packages/desktop-client/src --include=*.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reportRanges.ts","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/ReportSidebar.tsx","[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reportRanges.ts","[Read] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reportRanges.test.ts","[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reportRanges.test.ts","[Bash] yarn vitest run packages/desktop-client/src/components/reports/reportRanges.test.ts 2>&1 | tail -25","[Bash] node -v; cat .nvmrc 2>/dev/null; ls ~/.nvm/versions/node 2>/dev/null; grep -n '\"node\"' package.json","[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && yarn vitest run packages/desktop-client/src/components/reports/reportRanges.test.ts 2>&1 | tail -25","[Bash] cd /workspace/contextops-eval/apps/actual/packages/desktop-client && export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && yarn vitest run src/c"],"user":null},{"role":"dev","text":"ah nice, so it was comparing the full From date against the short period key, which sorts wrong. comparing real computed dates is the right call. does the fallback still give four whole quarters when one end actually passes the other?","turn":2,"at":"2026-11-05T18:38:05.402645+00:00","marks":["P5-E2"]},{"role":"agent","at":"2026-11-05T18:38:11.984712+00:00","text":"Yes. The fallback still gives four whole quarters when one end passes the other, and the existing tests cover it.\n\n- **To moved before From:** the fallback sets From to the first day of the quarter nine months before the picked quarter. With From at `2016-07-01` and To picked as `2016-01`, the result is `2015-04-01` to `2016-03-31`, which is four whole quarters. The old assertions still pass because the reversed case compares as reversed under the new check too (`2016-07-01` is after `2016-03-31`).\n- **From moved after To:** I didn't touch `validateStart`. It compares the stored end date (a full date) with the short From pick, and the old bug doesn't happen there. For example, an end of `2015-09-30` against a From of `2015-07` isn't flagged as reversed. A From of `2015-10` is flagged, and falls back to `2015-10-01` through `2016-09-30`.\n\nThe one case that isn't a fallback is a To in the same quarter as From. It keeps From and gives one whole quarter, such as `2015-07-01` to `2015-09-30`.","tools":[],"user":null},{"role":"dev","text":"ok makes sense. you said monthly and yearly had the same bug, did you add tests for those too or just quarterly? would be good to have a same-month and same-year case in there.","turn":3,"at":"2026-11-05T18:38:18.355718+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:38:32.688663+00:00","text":"Only quarterly. I'll add the monthly and yearly cases now.\n\nI added a same-month and a same-year case, in a new `To in the same period as From` block in `reportRanges.test.ts`.\n\n- **Monthly:** From `2015-07-01` with To `2015-07` gives `2015-07-01` to `2015-07-31`.\n- **Yearly:** From `2015-01-01` with To `2015` gives `2015-01-01` to `2015-12-31`.\n\nAll 27 tests pass with the fix. I also stashed the `reportRanges.ts` change and re-ran the file. The new monthly, yearly and quarterly cases all failed on the old code and passed again once I restored the fix. So these tests do catch the bug, and monthly and yearly really were affected.\n\nBoth changes are still uncommitted, in `reportRanges.ts` and `reportRanges.test.ts`. Tell me if you want me to commit them.","tools":["[Edit] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reportRanges.test.ts","[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && yarn vitest run src/components/reports/reportRanges.test.ts 2>&1 | tail -15; git stash -q -- src/componen"],"user":null},{"role":"dev","text":"nice, the stash check was a good call. one thing, when To is a year like '2015', how does it get to the end date? is that going through the month helpers or its own string math?","turn":4,"at":"2026-11-05T18:38:39.544936+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:38:42.598770+00:00","text":"Its own string math. In `validateEnd`, the Yearly case is:\n\n```ts\ncase 'Yearly':\n  dateEnd = end + '-12-31';\n  subDays = 1095;\n```\n\nSo a To of `'2015'` becomes `'2015-12-31'` by appending. It doesn't go through `getMonthEnd` or any other month helper. That works because every year ends on Dec 31, so there's no month length or leap-year logic to get wrong. `validateStart` does the same thing, with `start + '-01-01'`.\n\nMonthly and Quarterly do use the month helpers. Monthly calls `getMonthEnd(end + '-01')`, and Quarterly calls `getMonthEnd(getQuarterEnd(end) + '-01')`.\n\nThis relies on To being a bare four-digit year when the interval is Yearly. The To dropdown passes keys in that shape. If a full date such as `'2015-12-31'` ever reached that branch, you'd get `'2015-12-31-12-31'`. I haven't checked whether any saved-report path can produce that. I can check if you want.","tools":[],"user":null},{"role":"dev","text":"yeah, can you check whether any saved-report path can hand that branch a full date? i'd rather know now than find out from a bug report. also, in the new code from yesterday, did you end up using any `as` casts anywhere?","turn":5,"at":"2026-11-05T18:38:48.542345+00:00","marks":[]},{"role":"agent","at":"2026-11-05T18:39:02.925288+00:00","text":"**Saved reports can't hand that branch a full date.** I traced it from the code but didn't run it against a saved report.\n\n- **Only caller:** `validateStart` and `validateEnd` are called in one place, the From/To `Select` `onChange` handlers in `ReportSidebar.tsx`. Loading a saved report goes through `setReportData` in `CustomReport.tsx`, which sets the dates directly and never calls the validators.\n- **What To can be:** the `newValue` comes from the `allIntervals` options, which `onSetAllIntervals` builds from the range helpers. For Yearly that's `yearRangeInclusive`, whose values are formatted `yyyy`. Yearly To can only be a bare four-digit year.\n- **Stale To after a switch:** if you switch the interval to Yearly while a full-date `endDate` is stored, nothing calls `validateEnd` with that value. It only runs when you pick a new To, and then the value is a fresh `yyyy` key.\n\nThe other input, `start`, does come from stored state and can be in any shape, including from a saved report. It is only used in the `start > dateEnd` comparison, so a mismatched shape would give a wrong comparison, not a malformed date. I didn't check how switching the interval resets the stored dates.\n\n**Casts:** the quarterly commit added no new `as` casts to production code.\n\n- **Existing cast, extended:** in `CustomReport.tsx`, the `fromDate` string cast already existed. I added `'quarterFromDate'` to its union, so the cast is wider, not new.\n- **New casts in a test file:** the other three are in `fetchSpreadsheetQueryData.test.ts`. Two are `as CategoryEntity[]` and `as CategoryGroupEntity[]` on fixtures. The third is `as unknown as typeof send` on a mock, which is the one worth a second look.\n\nThe `fromDate` cast is the only one that could hide a real mistake. It builds a method name by string concatenation, so a typo in an interval name wouldn't be a type error. I can replace it with a lookup map if you'd like.","tools":["[Bash] cd /workspace/contextops-eval/apps/actual && git show 090c1b0b | grep -nE '^\\+.*\\bas\\b ' ; echo ---; grep -n \"allIntervals\" -B3 -A25 packages/des","[Grep] /workspace/contextops-eval/apps/actual/packages/desktop-client/src/components/reports/reports/CustomReport.tsx","[Bash] git show 090c1b0b | grep -nE '^[+-].*\\bas\\b' | grep -v \"import \\* as\"; echo ---; sed -n 335,420p packages/desktop-client/src/components/reports/reports/CustomRe","[Bash] grep -n \"export function yearFromDate\\|export function yearRangeInclusive\\|export function dayRangeInclusive\" -A14 packages/loot-core/src/shared/months.ts | hea"],"user":null},{"role":"dev","text":"ok good on the saved reports. the `as` casts in the new test file though, use `satisfies` on the fixtures instead of `as CategoryEntity[]` and the group one. the `as unknown as typeof send` one is probably fine if it needs a comment saying why. leave the fromDate cast alone for now.","turn":6,"at":"2026-11-05T18:39:10.059307+00:00","marks":["P5-E3"]},{"role":"agent","at":"2026-11-05T18:39:48.751617+00:00","text":"The fixtures already satisfy both types, since the extra fields are optional. I'll switch them and add the comment on the mock cast.\n\nDone, in `fetchSpreadsheetQueryData.test.ts`:\n\n- **Fixtures:** the `categories` and `categoryGroups` arrays now use `satisfies CategoryEntity[]` and `satisfies CategoryGroupEntity[]`. This compiled cleanly because the fields the fixtures leave out are optional on both types.\n- **Mock cast:** `as unknown as typeof send` stays, with a comment above it. The comment says `send` is typed per handler name, so one mock that answers the budget sheet query for any month needs the cast.\n- rs in `packages/lib` | app:linkwarden |"}},{"id":"P1-E2","task":"P1","mate":"Sam","gist":"API routes in pages/api/v1 stay thin (verifyUser/getTokenFromRequest) and call controllers in apps/web/lib/api/controllers/<resource>/ returning { status, response }; may land as a STACK row","target":"core/naming-conventions.md","op":"ADD","owner":"conventions","required":true,"from":"M2","delivered":true,"source":{"session":1,"turn":4,"message":"good that the route just does auth and calls a controller, that's how we keep them. does getLinkById go through getPermission? members of the collection should be able to check it too, not just the owner.","reply":"Yes. `getLinkById` calls `getPermission({ userId, linkId })`, so the status endpoint gets the same access rules.\n\n- **Permission lookup:** with a `linkId`, `getPermission` finds the collection containing the link and includes its `members`. It doesn't filter by user.\n- **Access check:** `getLinkById` then allows the request if `ownerId === userId` or any member has `userId`. So any collection member can check the link, and the owner can too.\n- **No permission-flag check:** it doesn't look at `canCreate`, `canUpdate` or `canDelete`. A read-only member can run the check, which is what you want now that nothing is stored.\n\nIf the link doesn't exist, `getPermission` returns null and the check ..."},"expected_md":{"file":"core/naming-conventions.md","row":"| NAME-103 | API routes in `pages/api/v1` stay thin: they authenticate with `verifyUser` or `getTokenFromRequest` and call a controller in `apps/web/lib/api/controllers/<resource>/` that returns `{ status, response }`. | app:linkwarden |"}},{"id":"P2-E1","task":"P2","mate":"Jules","gist":"Client components never call axios/fetch directly; they use packages/router hooks (shared by web and mobile) for data access; may land as STACK","target":"core/naming-conventions.md","op":"ADD","owner":"conventions","required":true,"from":"M1","delivered":true,"source":{"session":1,"turn":4,"message":"ah ok good, so the status text really comes from the endpoint, nice. and yeah, that's what i like here: the component only calls mutate. we never do axios or fetch straight in a component, it always goes through a hook so the cache stuff stays shared, so keep it that way. for the toast, go with your simpler option: show just the reason when there is one, otherwise fall back to the HTTP code. the \"HTTP 503 - Server responded with HTTP 503\" thing looks silly.","reply":"I changed the toast in `useCheckLinkStatus.ts` so it shows the endpoint's `reason` when there is one. If there is no reason, it falls back to `HTTP <code>`. `tsc` reports no errors in the touched files.\n\nThe toasts now read like this:\n- **Alive:** \"Link is alive (HTTP 200).\" The reason is null, so it falls back to the code.\n- **Dead (404/410):** \"Link check failed (Page not found.).\" This drops the code, since the reason is the more useful text.\n- **503:** \"Could not determine link status (Server responded with HTTP 503.).\" The code now appears once.\n- **Timeout or DNS failure:** the reason alone, for example \"Request timed out.\"\n\nThe component still only calls `mutate`, and all the ..."},"expected_md":{"file":"core/naming-conventions.md","row":"| NAME-104 | Client components never call axios or fetch directly; they use the data hooks in `packages/router`, shared by web and mobile. | app:linkwarden |"}},{"id":"P2-E2","task":"P2","mate":"Jules","gist":"Logic shared by web and mobile lives in packages/router or packages/lib, not apps/web (may be folded into E1)","target":"core/tech-stack-standards.md","op":"ADD","owner":"stack","required":true,"from":"M2","delivered":true,"source":{"session":1,"turn":7,"message":"oh wait, one thing came up. i was just chatting about this and mobile is going to want the check link action too, so i was wrong about it being web only. can you move the hook into packages/router/links.tsx with the other link hooks, like you described for delete e controller:\n- 404 or 410 gives `\"Page not found.\"`.\n- Any other 4xx or 5xx gives `\"Server responded with HTTP <code>.\"`.\n- A DNS failure gives `\"Domain does not exist.\"` and a refused connection gives `\"Connection refused.\"`.\n- A timeout gives `\"Request timed out.\"`.\n- For other errors it uses the error's own message.\n\nThere are two rough edges in how the toast displays this:\n\n- **Alive:** `reason` is `null`, so the toast only shows `(HTTP 200)`.\n- **Other 4xx/5xx:** the reason ..."},"expected_md":{"file":"core/naming-conventions.md","row":"| NAME-105 | Edit only `apps/web/public/locales/en/*`; the other locales are synced from Crowdin. | app:linkwarden |"}},{"id":"P3-E1","task":"P3","mate":"Sam","gist":"New environment variables are added to the root .env.sample; may land as PIT or STACK","target":"core/naming-conventions.md","op":"ADD","owner":"conventions","required":true,"from":"M1","delivered":true,"source":{"session":1,"turn":2,"message":"ad hoc if-check on the method? put a zod schema in schemaValidation.ts like the other routes and safeParse it, 400 with the zod message. good that you added the env var to .env.sample though.","reply":"The method check now uses a zod schema, but I haven't run it. The workspace still isn't installed, so there's no type-check or test run.\n\n- **Schema:** I added `CheckLinkStatusSchema` to `packages/lib/schemaValidation.ts`. It is `z.object({ method: z.enum([\"HEAD\", \"GET\"]).optional() })`, with an inferred type alongside it.\n- **Route:** `status/index.ts` now calls `safeParse(req.body ?? {})`. On failure it returns a 400 with `Error: <message> [<path>]`, the same format as `forgot-password.ts`. The `?? {}` keeps an empty body valid.\n- **Controller:** I removed the if-check from `checkLinkStatus`. It now takes a typed `method?: CheckMethod`. The timeout env var, the `.env.sample` entry and the ..."},"expected_md":{"file":"core/naming-conventions.md","row":"| NAME-106 | Every new environment variable i .md","fact_id":"STACK-110","op":"ADD","text":"| STACK-110 | Server settings are environment variables. Read them from the root `.env` (root scripts run through `dotenv`) and list each new one in `.env.sample`. Do not add a separate runtime config file for them. | requirement | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"conversation","session":"6bc502ce-ecc4-47a1-b9b9-c401fc0e8b9b","message":"057cc699-8d4f-4a4b-9a88-936373ed1775","quote":"env var like everything else, forget that"},{"kind":"diff","path":".env.sample","quote":"+LINK_CHECK_TIMEOUT_MS="},{"kind":"source","path":"package.json","line":11,"quote":"\"web:dev\": \"dotenv -- yarn workspace @linkwarden/web dev\""}],"reason":"The developer rejected a linkwarden.config.json in favour of an env var, citing that it is how everything else is configured. The root scripts load .env through dotenv and .env.sample exists at head. Scoped to this application. Extends STACK-101 (root .env) rather than replacing it.","agent":"stack-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-101","op":"ADD","text":"| PIT-101 | Reading a `\"unavailable\"` preservation field (image, pdf, readable, monolith, preview) as a failed archive, for example when choosing links to re-queue. | The worker also writes `\"unavailable\"` for formats the link's archival settings disable, and for every format when preservation is skipped (DISABLE_BROWSER or DISABLE_PRESERVATION, a non-http(s) URL, or a URL blocked by the SSRF check). Treating every `\"unavailable\"` as a failure re-queues links for formats the user never enabled, which adds needless worker load. | Before treating a field as failed, check whether the format is enabled for the link: use its archival tags if it has any, otherwise the owner's archival settings. `apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts` does this. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":220,"quote":"readable: !finalLink.readable ? \"unavailable\" : undefined,"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":48,"quote":"skipPreservation ||"},{"kind":"diff","path":"apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts","quote":"since the worker marks those \"unavailable\" too"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"56995e96-9041-403a-95a2-42842e4ce4eb","quote":"for formats a user has disabled, so this would requeue every link with a disabled format"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"7f53deaa-dec7-46b4-962c-090156e77845","quote":"do the first one with the settings check"}],"reason":"Failure is source-verified: the worker writes unavailable in the finally block for any field still empty, and on the skip path for all formats. The developer chose the settings-check approach (7f53deaa). The consequence (requeuing disabled formats) is stated by the development agent and follows directly from the code, so it is recorded as the trigger's effect rather than as an observed incident. The fix is the one the developer approved and the code implements.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-102","op":"ADD","text":"| PIT-102 | Using the admin worker stats `failed` figure (`getWorkerStats`) to estimate how many links need preservation again. | That count includes only links where image, pdf, readable and monolith are all `\"unavailable\"`. Partial failures and failed previews are not counted, so the figure is lower than the number of links that would be re-preserved. | Count with the same rule the action uses: a link needs work when an enabled format is `\"unavailable\"` or its preview is `\"unavailable\"`, after the settings check in PIT-101. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":25,"quote":"const linkFailed = await prisma.link.count({"},{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":29,"quote":"image: \"unavailable\","},{"kind":"diff","path":"apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts","quote":"Preview is always"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"4bd7a3ac-53bc-4642-bd41-849302df0946","quote":"which only counts fully failed links"}],"reason":"Source confirms the count rule and that preview is excluded. The development agent explained why the modal count would have been wrong, and the developer asked that the modal count still make sense after the change, which accepts the corrected count. The remedy is the rule the code implements in the requeue controller.","agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-103","op":"ADD","text":"| PIT-103 | Adding a GET endpoint that sends an outbound request to a user-supplied URL, or that writes data. | GET reads as a safe call. Prefetchers and link unfurlers can trigger it and make the server hit the target site, and a write under GET is not expected by caches or clients. | Use POST for the action and return 405 for other methods. Reserve GET for read-only lookups, such as the dry-run count the requeue endpoint returns. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"conversation","session":"744acc87-afdd-404c-a991-0cecb4ee70c7","message":"07da5f5b-c6ac-4a88-943e-d3dd230ee12d","quote":"why GET though, it fires an outbound request every call, feels more like a POST"},{"kind":"conversation","session":"744acc87-afdd-404c-a991-0cecb4ee70c7","message":"5598e8e3-81e8-4c06-b971-560b6bb2f92b","quote":"A GET shouldn't make an outbound request or write to the DB."},{"kind":"diff","path":"apps/web/pages/api/v1/links/[id]/status/index.ts","quote":"if (req.method === \"POST\") {"}],"reason":"Rejected approach with a stated reason, so it fits the knowledge bar. The developer raised it and the assistant implemented POST, and the diff shows the POST branch with 405 for other methods. The prefetcher risk is the reasoning given in conversation, not an observed incident, so the entry states it as the reason for the rule.","agent":"pitfalls-maintainer"},{"target":"tools/preservation/README.md","fact_id":"PRESERVATION-004","op":"ADD","text":"| PRESERVATION-004 | The value `unavailable` on a link's `image`, `pdf`, `readable`, `monolith` or `preview` field means the artifact was not produced. It does not by itself mean that preservation failed. The worker writes it in three cases: (a) preservation is skipped, when `DISABLE_BROWSER` or `DISABLE_PRESERVATION` is `true`, or when the URL is not http(s) or fails the SSRF check, in which case no browser runs and all five fields are marked; (b) the link's archival settings (tags first, otherwise the owner's settings) disable a format, so it is never attempted; (c) a field is still empty when a browser run ends. Treat `unavailable` as \"not produced\" when counting or retrying. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":32,"quote":"process.env.DISABLE_PRESERVATION"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":37,"quote":"await assertUrlIsSafeForServerSideFetch(link.url);"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":48,"quote":"skipPreservation ||"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":55,"quote":"readable: \"unavailable\","},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":220,"quote":"readable: !finalLink.readable ? \"unavailable\" : undefined,"},{"kind":"diff","path":"apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts","quote":"since the worker marks those \"unavailable\" too"}],"reason":"Supported by source at head (archiveHandler.ts). The skip path, the settings-disabled path and the end-of-run path are all in the worker t, so healthy artifacts are kept and only missing ones are rebuilt. Do not clear healthy fields. The regenerate-all action (`allAndRePreserve`) is a separate procedure: it removes the files and clears every artifact field. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/worker/lib/getLinkBatchFairly.ts","line":37,"quote":"lastPreserved: null,"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":172,"quote":"if (!link.preview) await handleArchivePreview(link, page);"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":175,"quote":"if (archivalSettings.archiveAsReadable && !link.readable)"},{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":157,"quote":"lastPreserved: null,"},{"kind":"diff","path":"apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts","quote":"image: reset.image ? null : undefined,"}],"reason":"This is the operational procedure that the existing allBroken action (preservation.tsx) and the new requeue endpoint both implement. Worker source at head supports the selection and per-field checks. Whether a partly rebuilt screenshot or PDF handler overwrites a healthy sibling was not verified, so the text avoids that claim.","agent":"tool-maintainer:preservation"},{"target":"tools/preservation/README.md","fact_id":"PRESERVATION-007","op":"ADD","text":"| PRESERVATION-007 | The admin action \"Regenerate Broken Links\" (`allBroken`, `apps/web/pages/api/v1/worker/preservation.tsx`) only covers links in collections owned by the acting admin. Its check also omits `preview`. Failed links owned by other users are not covered by it, and need a separate action or a manual run. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":75,"quote":"ownerId: user.id,"},{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":127,"quote":"const needsReprocessing ="},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"6d808c51-9634-4ed2-ad66-5253b8ad558b","quote":"only touches links in collections owned by the admin"}],"reason":"Verified in source at head. The developer's need for an all-users action (msg 72cd8e08) is why the separate requeue endpoint exists. Scoped to app:linkwarden and to the admin action, not to the worker.","agent":"tool-maintainer:preservation"}],"deferred":[{"target":"core/terminology.md","fact_id":null,"op":"NEEDS_REVIEW","text":"Failed link: a link whose preservation did not produce some of its archive formats. Exact scope not yet decided.","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":25,"quote":"const linkFailed = await prisma.link.count({"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"72cd8e08-8058-441c-b3aa-81a814999dfe","quote":"a bunch of links ended up with failed archives"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"4bd7a3ac-53bc-4642-bd41-849302df0946","quote":"the old number came from the worker stats \"failed\" figure"}],"reason":"Two definitions are in use. The admin worker stats 'failed' count requires image, pdf, readable and monolith to all be unavailable, and ignores preview. The requeue action treats a link as failed when any enabled format or the preview failed. The developer uses 'failed archives' informally and never defined the term. A term needs one agreed meaning, and the developer has not chosen one, so this stays NEEDS_REVIEW. The underlying meaning of the 'unavailable' value belongs to the preservation tool area, not this terminology document.","agent":"terminology-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":null,"op":"NEEDS_REVIEW","text":"Pending review, not a standard yet: the server admin is the user whose id equals `NEXT_PUBLIC_ADMIN`, falling back to user id 1 when the variable is unset. Confirm the intended admin identity and whether the fallback is wanted before recording it.","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/web/pages/api/v1/worker/index.ts","line":12,"quote":"if (user.id !== Number(process.env.NEXT_PUBLIC_ADMIN || 1)) {"},{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":13,"quote":"const isServerAdmin = user.id === Number(process.env.NEXT_PUBLIC_ADMIN || 1);"},{"kind":"diff","path":"apps/web/pages/api/v1/worker/requeue-failed.ts","quote":"if (user.id !== Number(process.env.NEXT_PUBLIC_ADMIN || 1)) {"}],"reason":"Three admin routes use this check, and it is a security-relevant configuration choice. No conversation discusses the fallback or the NEXT_PUBLIC prefix, so intent cannot be verified from the pack. Not a standard until a developer confirms it.","agent":"stack-maintainer"},{"target":"core/pitfalls.md","fact_id":null,"op":"NEEDS_REVIEW","text":"| PIT-104 | Setting the `PROXY` environment variable while `safeFetch` fetches user-supplied URLs. | `createAgent` returns the proxy agent before the safe DNS lookup is built, so the lookup that refuses private and internal addresses is skipped. Only the per-hop URL check still runs. DNS rebinding protection then depends on the proxy. | Not decided: no remedy is established in the sources reviewed. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"packages/lib/safeFetch.ts","line":60,"quote":"if (process.env.PROXY) {"},{"kind":"source","path":"packages/lib/safeFetch.ts","line":107,"quote":"const validatedUrl = await assertUrlIsSafeForServerSideFetch(currentUrl);"},{"kind":"conversation","session":"744acc87-afdd-404c-a991-0cecb4ee70c7","message":"b1929919-64ba-452f-8794-78f2cc3a40d2","quote":"DNS rebinding protection then depends on the proxy"}],"reason":"The failure is source-verified, but no remedy is supported. The development agent called it existing behaviour, and the developer did not discuss it. The row is held for a decision on whether this is acceptable or should change, and what the do-instead should be. Do not write it until a remedy is decided.","agent":"pitfalls-maintainer"}],"rejected":[],"no_change":5,"failures":[]},"b-haiku":{"wall_seconds":266.9,"exit_code":0,"ok":true,"cost":0.16241542,"duration_s":529.817,"agents":[{"label":"conventions-maintainer","status":"success","cost":0.01528437,"turns":15,"ms":26111,"inputTokens":2273,"outputTokens":5202,"cacheReadInputTokens":103467,"cacheCreationInputTokens":57107},{"label":"stack-maintainer","status":"success","cost":0.027155270000000002,"turns":24,"ms":95935,"inputTokens":2253,"outputTokens":21134,"cacheReadInputTokens":183017,"cacheCreationInputTokens":72664},{"label":"pitfalls-maintainer","status":"success","cost":0.03079898,"turns":24,"ms":97908,"inputTokens":2131,"outputTokens":22060,"cacheReadInputTokens":457288,"cacheCreationInputTokens":74915},{"label":"tool-maintainer:preservation","status":"success","cost":0.00936485,"turns":21,"ms":31427,"inputTokens":2355,"outputTokens":7010,"cacheReadInputTokens":140295,"cacheCreationInputTokens":21107},{"label":"terminology-maintainer","status":"success","cost":0.0385421,"turns":25,"ms":134771,"inputTokens":2284,"outputTokens":31389,"cacheReadInputTokens":383560,"cacheCreationInputTokens":93918},{"label":"tool-maintainer:prisma","status":"success","cost":0.015166830000000001,"turns":30,"ms":55046,"inputTokens":2357,"outputTokens":11949,"cacheReadInputTokens":201763,"cacheCreationInputTokens":34695},{"label":"pitfalls-maintainer:handoffs","status":"success","cost":0.002929280000000003,"turns":2,"ms":10551,"inputTokens":2,"outputTokens":2228,"cacheReadInputTokens":84428,"cacheCreationInputTokens":4854},{"label":"tool-maintainer:preservation:handoffs","status":"success","cost":0.00374941,"turns":4,"ms":15597,"inputTokens":6,"outputTokens":3052,"cacheReadInputTokens":99141,"cacheCreationInputTokens":6157},{"label":"cartographer","status":"success","cost":0.00264547,"turns":5,"ms":3389,"inputTokens":1499,"outputTokens":583,"cacheReadInputTokens":13787,"cacheCreationInputTokens":10331},{"label":"writer","status":"success","cost":0.01677886,"turns":24,"ms":59082,"inputTokens":1407,"outputTokens":15455,"cacheReadInputTokens":144746,"cacheCreationInputTokens":37316}],"tokens":{"inputTokens":16567,"outputTokens":120062,"cacheReadInputTokens":1811492,"cacheCreationInputTokens":413064},"accepted":[{"target":"core/terminology.md","fact_id":"TERM-103","op":"UPDATE","text":"| TERM-103 | Preservation | The worker's capture of a link into artifacts: screenshot, PDF, readability text, preview image, and single-file HTML. A preview image is attempted whenever the link has no preview yet, whatever the archival settings; the other artifacts are produced only when the link's archival settings enable them. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":172,"quote":"if (!link.preview) await handleArchivePreview(link, page);"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":178,"quote":"// Screenshot/PDF"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"73be766b-943c-4f20-912d-0cdd6f02aa84","quote":"the preview thing is fine, keep it."}],"reason":"The existing row lists five artifacts as one set, which hides that the preview is attempted regardless of settings while the others depend on archival settings. Source at head confirms the preview call has no settings check (archiveHandler.ts:172), and the developer accepted the preview behaviour when asked to keep it. Tool-level detail is handed off to the preservation tool document.","agent":"terminology-maintainer"},{"target":"core/terminology.md","fact_id":"TERM-105","op":"ADD","text":"| TERM-105 | Link status | The result of a live check of a saved link's URL, run by the \"Check Link\" action and `POST /api/v1/links/:id/status`. Nothing is stored; each check is made on demand. `alive`: the HTTP status is below 400. `dead`: 404 or 410, the domain does not resolve, or the connection is refused. `unknown`: anything else, such as 401, 403, 429, 5xx, a timeout, or a URL blocked by the SSRF check. 403 and 429 are `unknown` on purpose because they usually mean bot blocking, not a missing page. Only `alive` sets `ok` to true. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts","line":41,"quote":"if (httpStatus < 400) return { status: \"alive\", httpStatus, reason: null };"},{"kind":"source","path":"apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts","line":45,"quote":"if (httpStatus === 404 || httpStatus === 410)"},{"kind":"conversation","session":"744acc87-afdd-404c-a991-0cecb4ee70c7","message":"b0a70456-6bbc-44ad-a717-ed436ce204df","quote":"ok semantics are fine"},{"kind":"conversation","session":"5d6cbf4f-3424-40a2-811b-5b0367989015","message":"eca94bbf-4d5e-4cdc-b9c2-ec0352bcc3c1","quote":"\"Check link\" option"}],"reason":"A domain meaning with a non-obvious boundary: 'dead' is narrow and 'unknown' absorbs bot-blocking and temporary errors. The developer accepted the three-state semantics ('ok semantics are fine') and the code implements them. The no-storage rule was a developer decision after a proposal to store results was withdrawn. Not a rejected name, so it is recorded as the accepted meaning.","agent":"terminology-maintainer"},{"target":"core/terminology.md","fact_id":"TERM-106","op":"ADD","text":"| TERM-106 | Unavailable | The value the worker writes to a link's image, pdf, readable, monolith or preview field when that format has no artifact after a preservation run. It does not by itself mean a failure: formats that the link's archival settings leave off are also marked unavailable. Preview is always attempted, so an unavailable preview means no preview was captured in that run. Links skipped for a non-http(s) or unsafe URL are marked unavailable on all five fields. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":221,"quote":"image: !finalLink.image ? \"unavailable\" : undefined,"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":55,"quote":"readable: \"unavailable\","},{"kind":"diff","path":"diff/commits.txt","quote":"Formats disabled in a link's archival"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"7f53deaa-dec7-46b4-962c-090156e77845","quote":"partial failures are probably a chunk of it"}],"reason":"The stored value is used in several places with a meaning that differs from its name: the worker sets it for disabled formats as well as failed ones. The developer's requeue work depends on this distinction (only enabled failed formats are retried), and the commit message records it. Recorded as a domain term because a reader would otherwise assume 'unavailable' always means failure.","agent":"terminology-maintainer"},{"target":"core/terminology.md","fact_id":"TERM-107","op":"ADD","text":"| TERM-107 | Failed link | A preserved link (`lastPreserved` set) where image, pdf, readable and monolith are all unavailable. This is the \"failed\" count on the admin worker stats. A link where only some of these are unavailable has a partial failure; that can be a disabled format rather than a real failure (see Unavailable). | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":25,"quote":"const linkFailed = await prisma.link.count({"},{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":29,"quote":"image: \"unavailable\","},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"d03d4003-03aa-40fc-b0b8-b55333374df4","quote":"does the controller only touch links where everything failed?"}],"reason":"The admin stats count and the developer's wording distinguish fully failed links from partial failures. The definition is taken from the stats query, which is the number people read on the page. It is a durable meaning, not a one-off, so it is recorded; the term is scoped to the stats definition.","agent":"terminology-maintainer"},{"target":"core/terminology.md","fact_id":"TERM-108","op":"ADD","text":"| TERM-108 | Archival settings | The switches that decide which formats the worker produces for a link: screenshot, PDF, readable text, single-file HTML, Wayback Machine submission, and AI tagging. A link's archival tags (tags that carry any of these switches) take precedence when the link has any; otherwise the owner's user settings apply. | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":90,"quote":"archivalTags.length > 0"},{"kind":"source","path":"packages/lib/isArchivalTag.ts","line":3,"quote":"export const isArchivalTag"},{"kind":"diff","path":"diff/commits.txt","quote":"Formats disabled in a link's archival"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"7f53deaa-dec7-46b4-962c-090156e77845","quote":"do the first one with the settings check"}],"reason":"The developer's own term 'archival settings' is used in the commit and in requests, but its scope (tag settings overriding user settings) appears only in code. The developer accepted the settings-check design, so the precedence rule is recorded as the accepted meaning of the term.","agent":"terminology-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-106","op":"ADD","text":"| STACK-106 | Server-side requests to user-supplied URLs go through `safeFetch` from `@linkwarden/lib/safeFetch` (`packages/lib/safeFetch.ts`). Direct `fetch`, `axios` or `node-fetch` calls to those URLs bypass the SSRF checks. | requirement | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"conversation","session":"744acc87-afdd-404c-a991-0cecb4ee70c7","message":"8226c0f2-8b62-470e-9a4b-e116aeb95278","quote":"anything hitting a user supplied url has to, otherwise it's an ssrf hole"},{"kind":"source","path":"packages/lib/safeFetch.ts","line":98,"quote":"export async function safeFetch("},{"kind":"source","path":"apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts","line":1,"quote":"import { safeFetch } from \"@linkwarden/lib/safeFetch\";"}],"reason":"The developer stated a normative rule for this application in session 744acc87 (\"has to\", with an SSRF rationale). The shared helper exists at head and the new link-status controller uses it. Scope is app:linkwarden because the helper is this application's library. The PROXY bypass of the DNS-safe lookup is a security caveat, not a change to this requirement, so it is handed off to core/pitfalls.md rather than written here.","agent":"stack-maintainer"},{"target":"core/tech-stack-standards.md","fact_id":"STACK-107","op":"ADD","text":"| STACK-107 | Components do not call `axios` or `fetch` for server data. Data access goes through TanStack Query hooks (`useQuery`, `useMutation`, for example in `packages/router/links.tsx`) so the query cache stays shared. The admin re-queue button in `apps/web/pages/admin/background-jobs.tsx` is a temporary exception that calls `axios` directly; it is not a precedent. | requirement | app:linkwarden |","scope":"app:linkwarden","evidence":[{"kind":"conversation","session":"5d6cbf4f-3424-40a2-811b-5b0367989015","message":"db3708a8-c92b-4742-9988-6f8799d33cc7","quote":"we never do axios or fetch straight in a component"},{"kind":"source","path":"packages/router/links.tsx","line":7,"quote":"} from \"@tanstack/react-query\";"},{"kind":"source","path":"apps/web/package.json","line":41,"quote":"\"@tanstack/react-query\": \"^5.51.15\","},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"b74d7584-eb9f-4674-a8ac-7ce96336a1ca","quote":"not a new rule ailedPreservations.ts both apply the enabled-format check before resetting. The developer accepted this scope in session fa41debe ('A single unavailable format is often just a disabled setting. Requeuing those would put a lot of needless load on the worker'). The harm is stated as reasoning, not measured, so the consequence is worded as a risk of needless requeues.","evidence":[{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":220,"quote":"readable: !finalLink.readable ? \"unavailable\" : undefined,"},{"kind":"source","path":"apps/worker/lib/archiveHandler.ts","line":55,"quote":"readable: \"unavailable\","},{"kind":"source","path":"apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts","line":7,"quote":"Formats the link's archival settings (tags, else user) leave disabled are"},{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":127,"quote":"const needsReprocessing ="},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"56995e96-9041-403a-95a2-42842e4ce4eb","quote":"the worker also writes \"unavailable\" for formats a user has disabled"}],"agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-002","op":"ADD","scope":"app:linkwarden","text":"| PIT-002 | Using the admin worker stats `link.failed` figure (from `getWorkerStats`) to size, report or act on failed archives. | That count includes only links where image, pdf, readable and monolith are all `\"unavailable\"`. Links with a single failed format, and links with a failed preview, are left out, so the figure understates the work. | Count with the enabled-format rule in PIT-001 before showing a number or acting on it, for example with the dry-run mode of `apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts`. | app:linkwarden |","reason":"The query in getWorkerStats.ts is confirmed in source. The developer's agent stated in session fa41debe that the stats figure would have given the wrong modal count, and that is the observed consequence. The remedy is the dry-run count from the same controller, which applies the enabled-format rule. That remedy is temporary code, so a maintainer should re-check this entry if the endpoint is removed.","evidence":[{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":25,"quote":"const linkFailed = await prisma.link.count({"},{"kind":"source","path":"apps/web/lib/api/controllers/worker/getWorkerStats.ts","line":29,"quote":"image: \"unavailable\","},{"kind":"conversation","session":"fa41debe-aa3a-4166-9ce4-07cd240b51c3","message":"4bd7a3ac-53bc-4642-bd41-849302df0946","quote":"the worker stats \"failed\" figure, which only counts fully failed links, so it would have been wrong"}],"agent":"pitfalls-maintainer"},{"target":"core/pitfalls.md","fact_id":"PIT-003","op":"ADD","scope":"app:linkwarden","text":"| PIT-003 | Using `Regenerate Broken Links` (the `allBroken` action in `apps/web/pages/api/v1/worker/preservation.tsx`) to recover failed archives on an instance with several users. | Its query filters on `collection.ownerId = user.id`, so only the requesting admin's own links are reset. Failed archives belonging to other users are not requeued and stay failed. | Select failed links across all owners, as the throwaway `requeue-failed` endpoint does through `requeueFailedPreservations.ts`. | app:linkwarden |","reason":"The ownership filter is confirmed in preservation.tsx (lines 39-40 and 74-76). The developer's agent gave this as the reason for building a new endpoint in session fa41debe. The remedy is a temporary endpoint, so the entry names it as an example of the cross-owner query rather than as a standing feature.","evidence":[{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":74,"quote":"collection: {"},{"kind":"source","path":"apps/web/pages/api/v1/worker/preservation.tsx","line":75,"quote":"ownerId: user.id,"},{"kind":"conversation","session":"fa41debe-aa3a-4166-9c
