t descriptive slug for the filename (not a PR number), with category and authors front matter, and keep it to one line. can you add that and amend or commit it?","act":"correct"},{"role":"agent","text":"I added the release note and amended it into the same commit, which is now `e7c9e15f`.","tools":["[Bash] ls upcoming-release-notes | head -8 && for f in $(ls upcoming-release-notes | head -3); do echo \"--- $f\"; cat upcoming-release-notes/$f; done; git log -5 --form","[Bash] git show --stat --format=%s da724d47 090c1b0b | grep -i release; git show da724d47 -- upcoming-release-notes | tail -8; cat upcoming-release-notes/README.md | h","[Bash] printf -- '---\\ncategory: Bugfix\\nauthors: [context-ops-demo]\\n---\\n\\nDistribute split transactions in whole units for zero-decimal currencies such as yen and won\\n' "]},{"role":"agent","text":"The file is `upcoming-release-notes/distribute-splits-zero-decimal-currencies.md`. It has category `Bugfix` and authors `[context-ops-demo]`, matching the handle in your earlier note `custom-reports-same-period-range.md`. The text is one line: \"Distribute split transactions in whole units for zero-decimal currencies such as yen and won\".","tools":[]},{"role":"agent","text":"If your GitHub handle isn't `context-ops-demo`, change the `authors` line.","tools":[]},{"role":"dev","text":"looks good, stored x100 is handled right and the release note is there. thanks, merging this.","act":"approve"}]}],"notes":{"eyebrow":"CMPE 492 · Context Ops · results up to 15 November 2026","title":"From developer conversations to a team's knowledge, and what it changes for the next agent","meta":[["applications","3"],["maintenance runs","12 (v3) + 12 (v2, rescored)"],["development sessions","367 evaluated + 3 learning"],["downstream runs","120"],["runtime","code-llm-sizing fbe12b8 / b95fe73"],["status","midterm, final in December"]],"notice":"Context Ops reads what developers and their coding agent said and changed, then writes selected team knowledge into a shared Git repository. This page reports simulated development studies, selectable chat comparisons, and maintenance scoring across three open-source applications. Costs are client-side list-price estimates.","findings":["<b>Team knowledge carried decisions across repositories in this test.</b> Pooled across Actual Budget, Maybe, and Linkwarden, agents followed 29/48 checks (60.4%) without knowledge and 42/48 (87.5%) with it, a 27.1-point pooled gain. Twelve of the 13 additional first-commit decision passes concerned Conventional Commits. The original task-weighted contrast was +30.0 points (exploratory p = 0.0002). Simulated teammate review rounds averaged 0.25 versus 0.05.","<b>Earlier decisions carried into later feature sessions.</b> Team knowledge passed all 60 carried checks; repository knowledge passed all 58 judged carried checks, with two unjudged; no knowledge passed 43/60. These results are limited to the tested feature sequences.","<b>Maintained knowledge improved observed downstream checks in this comparison.</b> Pooled results were 146/188 (77.7%) without knowledge, 146/190 (76.8%) with the seed, 161/188 (85.6%) with maintained A, and 152/188 (80.9%) with B. This does not establish that knowledge helps only when code is silent.","<b>Persona development showed no demonstrated improvement on these tasks.</b> First-commit fact rates were 64%-73% with knowledge versus 71% without; affected cells have unjudged checks. After simulated teammate review, observed rates were 90%-94%, which does not establish every condition exceeded 90% after missing judgments are considered.","<b>Maintenance captured 16 of 21 required facts in v3 A Sonnet.</b> It had 3 partial facts, 2 missing required facts, zero of 19 predefined traps, 8 supported extras, 1 noise extra, and 1 unsupported extra. That is not zero wrong rules. Its mean was $1.42 per run; feature-sequence maintenance pushes were $0.39-$0.41 and 98-106 seconds in these typically short one-session, one-commit pushes."],"usage":{"intro":["The knowledge is an ordinary Git repository that belongs to a team. Its default scope is <b>team</b>: the team's applications share it, so a decision made in one repository reaches agents working in another. A single application can use it alone with <b>repository</b> scope.","Developers clone the knowledge repository and connect an application. The first run is an explicit command; a pre-push adapter is experimental. By default, results stay local. A run may send selected source, diff, and conversation evidence to hosted Claude inference using private authentication."],"loop":["develop with the agent","git push","maintenance run (A)","pull or merge request","review and merge","next session reads it"],"steps":[["Create the team repository","Clone this repository, run <code>contextops init --kb . --branch team-knowledge --scope team</code>, adjust \"What this knowledge keeps\" in <code>init.md</code>, set <code>open_pr: true</code>, commit, and push the branch to GitHub or GitLab as the team's default branch."],["Clone and install","Each developer clones it, creates a virtual environment, and installs the runtime from the lock file. No credentials are stored; maintenance uses their own Claude login."],["Attach an application","The experimental <code>contextops attach</code> path writes a pointer into <code>CLAUDE.local.md</code>, read access and a session-start hook into <code>.claude/settings.local.json</code>, and an optional pre-push hook."],["Work as usual","The session-start path can refresh knowledge and provide a digest. Background maintenance does not guarantee a nonblocking push: refresh synchronously calls <code>git fetch</code> before spawning and has no timeout."],["Review the request","When configured with <code>open_pr: true</code>, a generated result branch can open a pull or merge request. The default is local output. Human review and hosted-forge end-to-end validation remain pending."]],"keeps":["How the team provisions and deploys (for example infrastructure only through Terraform)","Secrets, environments and regions; releases and migrations","How the team uses tools and internal services, and what not to use","Security, privacy and compliance rules","Rejected approaches and pitfalls, with the reason","Decisions that replace an earlier way of working","Contracts between repositories and teams","Team-specific terms"],"leaves":["UI and styling conventions (where buttons go, colors, spacing, copy)","Patterns the code, linters or formatters already show or enforce","Instructions for the current task only","Implementation details of one feature and personal preferences"],"after":["The experiments support selected positive effects, a limited persona negative result, and hypotheses about causes. They do not establish a universal mechanism or a policy that excludes UI conventions."]},"development":{"intro":["The studies compare simulated development sessions under different knowledge conditions. A blind judge scored hidden criteria in the diffs. The four studies cover team decisions across repositories (1), feature sequences (2), ready-made downstream knowledge (3), and persona development (4). The retrieval table is a diagnostic within Experiment 4, not a fifth experiment.","<b>First commit</b> means the agent's work before simulated teammate review. <b>After review</b> means the final diff after that simulated teammate asked for fixes, at most twice."],"after":["<b>Reading these results together.</b> Benefits varied by task and information available. The team and downstream comparisons show selected positive effects; persona development did not demonstrate improvement on these tasks. The evidence suggests possible explanations, but does not establish a universal or causal mechanism.","<b>Product changes and next questions.</b> A session-start digest was added after Experiment 4's first analysis. Future comparisons can test decisions made in one repository and needed in another, and decisions that replace a pattern most of the code still uses."],"setups":[{"label":"No knowledge","cls":"","text":"The agent sees only the repository it works in: the code, its history, and what it reads itself. This is how coding agents work today.","sample":""},{"label":"Knowledge","cls":"kb","text":"<code>contextops attach</code> writes a short pointer into the application's <code>CLAUDE.local.md</code>, which Claude Code loads at start. The agent then decides whether to open <code>index.md</code> and which documents to read.","sample":"## Shared knowledge\nShared knowledge for this team's applications is in a separate checkout: <knowledge path>\nRead its index.md before starting a task and follow the entries that apply. This application is app:actual; company entries apply to every application."},{"label":"Knowledge + digest","cls":"kbd","text":"Since Experiment 4, attach can add a session-start digest with one-line entry summaries before the first message. It may help orient the agent, but the retrieval diagnostic does not establish that it fixes retrieval or ensures comprehensive reading.","sample":"core/naming-conventions.md:\n- NAME-001: Commit subjects use Conventional Commits with a scope: `type(scope): summary`, for example `feat(links): show relative dates on links from the past week`. ...\ncore/pitfalls.md:\n- PIT-001: A timeout on an outside-service request is implemented by racing the request against a timer (`Promise.race` with a `setTimeout` rejection). / The race only...\n- PIT-002: Code logs personal data: emails, names, IPs, tokens, keys, URLs people save, file names or uploaded content, or a full error object or error message from a ...\ncore/tech-stack-standards.md:\n- STACK-001: Do not add third-party packages for small things. Use the platform's built-in APIs or dependencies the repository already has. If a new package seems nece...\n- STACK-002: Every call to an outside service has an explicit timeout of 10 seconds at most. If the call fails or times out, the user's action still goes through witho..."}],"coverage":"<b>Evidence coverage (16 November 2026).</b> Nine judge files omit 61 expected judgments: 20 feature-sequence and 41 persona-development checks. Missing IDs are Unjudged, distinct from explicit Not applicable checks. For p passes, f fails, and m unjudged, the observed rate is p/(p+f), and the sensitivity range is [p/(p+f+m), (p+m)/(p+f+m)]. These are worst/best-case missing-judgment bounds, not confidence intervals or estimates. No explicit Not applicable occurs in the feature study. Feature rows use p/f/m counts; persona rows use p/f/m/NA. Feature: None stated 34/0/5, 87.2%-100%; None code 89/9/7, 84.8%-91.4%; None all 178/26/12, 82.4%-88.0%; repository carried F2+F3 58/0/2, 96.7%-100%; carried F2 19/0/2, 90.5%-100%; stated 37/0/2, 94.9%-100%; code 94/8/3, 89.5%-92.4%; no-leak 11/0/1, 91.7%-100%; all 200/8/8, 92.6%-96.3%. Persona fact cells: first None 41/17/3/14, 67.2%-72.1%; first A Haiku 41/20/2/12, 65.1%-68.3%; final None 59/4/2/10, 90.8%-93.8%; final A Haiku 58/5/2/10, 89.2%-92.3%; final A Sonnet digest 59/5/2/9, 89.4%-92.4%; final B Sonnet digest 53/6/4/12, 84.1%-90.5%. Exact omissions: `2-feature-sequence/sessions/none-linkwarden-r2/linkwarden-F1/judge.json`: `f1-owner-scope`, `f1-demo-guard`, `f1-locale`, `f1-test` (code), `f1-405`, `f1-hook-auth`, `f1-cc` (stated). `2-feature-sequence/sessions/none-maybe-r1/maybe-F1/judge.json`: `search-vs-no-search`, `i18n`, `component-test` (code), `d1-preview`, `d2-semantic-colors` (stated). `2-feature-sequence/sessions/repo-maybe-r1/maybe-F2/judge.json`: `correct-sources`, `i18n`, `tests` (code), `d3-aggregation-in-model`, `d4-named-date-format` (stated), `d1-preview-carried`, `d2-semantic-colors-carried` (carried), `no-conventional-prefix` (leak). `4-persona-development/sessions/actual-T1-none-1/judge-first.json`: `no-scale-change`, `release-note`, `satisfies` (facts), `both-paths`, `exact-sum`, `two-decimal-same`, `test-yen-and-cents` (code). `4-persona-development/sessions/linkwarden-T2-a-haiku-1/judge-final.json`, `linkwarden-T2-a-haiku-2/judge-first.json`, `linkwarden-T2-a-sonnet-digest-3/judge-final.json`, and `linkwarden-T2-none-2/judge-final.json`: each omits `shared-hook`, `en-locale` (facts), `i18n-strings`, `copy-fields`, `create-path`, `feedback`, `public-hidden` (code). `4-persona-development/sessions/maybe-T1-b-sonnet-digest-3/judge-final.json`: `docs-run-task`, `no-generated-writes`, `stale-from-stored`, `feed-path` (facts), `no-fake-zero`, `test` (code).","retrieval_caption":"Experiment 4 retrieval diagnostic"},"devconv_intro":"Selectable comparisons show the same task under different knowledge conditions. Choose a task on the left. The card lists hidden checks and their first-commit and post-review statuses. Grey bubbles are the coding agent, colored bubbles the simulated teammate; tool calls are folded.","changes":["The maintenance study compares the A sweeper-first strategy and B fresh-specialist strategy on the same evidence. In v3 A Sonnet, the joint blind scoring found 16/21 required facts, 3 partial facts, 2 missing required facts, zero of 19 predefined traps, 8 supported extras, 1 noise extra, and 1 unsupported extra. The Maybe Lookbook record says `/lookbook`, while the judge checked `/design-system`; this is the confirmed score and written output, not a new independent full-source adjudication.","The current v2/v3 comparison uses joint rescoring; its v2 counts differ from the original v2 report. The original v2 and joint-rescore figures are separate evidence. UI conventions are excluded by a later configurable policy choice, not by an experiment-established rule."],"repos":{"maybe":{"about":"Maybe, a personal finance Rails app. Rewind replay of five upstream changes: account page consolidation and indexes, design system namespacing, the activity feed balance breakdown, an active-accounts filter, and balance cache columns with self-hosted rate limits."},"actual":{"about":"Actual Budget, a TypeScript budgeting monorepo. Rewind replay: fixed x100 amount scale, undici for the sync server, a DonutGraph split with snapdom export, a search-reset fix, and a Quarterly report interval."},"linkwarden":{"about":"Linkwarden, a self-hosted bookmark and archive manager. Build-on-top tasks: a link check endpoint, its web UI action, a configurable timeout, a temporary admin requeue button, and a tag chip CSS fix."}},"cost":["Downstream mean development cost was $0.202 without knowledge and $0.240 with maintained A, about 19% higher; median time was 44 versus 47 seconds, while mean time was 75 versus 96 seconds. These are client-side list-price estimates, not subscription invoices. Keep maintenance cost separate: feature-sequence pushes cost $0.39-$0.41 and took 98-106 seconds, typically for one short session and one commit. Full v3 A Sonnet averaged $1.42/run and B Sonnet $0.92/run.","Study sizes: 81 feature-sequence sessions, 126 persona-development sessions, 43 team-study sessions (40 test sessions plus 3 learning sessions), and 120 ready-made downstream runs: 367 development sessions plus 3 learning sessions. Repetitions were four for the team study, five downstream, and three for feature and persona studies; maintenance had one run per application and condition."],"caveats":["Developers, personas, tasks, and judges were simulated. The persona study used simulated teammate review, not human review.","The team study pools three repositories, including test sessions in Linkwarden, the learning repository. Its original +30.0-point first-commit contrast is task-weighted; pooled rates are 29/48 (60.4%) and 42/48 (87.5%), a +27.1-point difference. Original tests are exploratory and task-weighted. Linked features share evolving chains, while the original permutation test treats them as exchangeable within app and feature; it does not account for that dependence.","The downstream study has complete judged coverage. Its original three conditions were None, seed, and A; B was added post hoc. There were three protocol amendments. The original +6.1-point A-B and +8.2-point A-None contrasts and p-values are task-weighted; pooled values differ. Routine tasks changed from 82% to 97%, while knowledge tasks changed from 74% to 76%, so the result does not show benefit only when code is silent.","Across both studies, nine judge files are incomplete: three feature-sequence files omit 20 checks, and six persona-development files omit 41 checks. Missing checks are Unjudged, not failures or Not applicable. Observed rates use judged applicable checks; sensitivity bounds are worst/best-case missing-judgment bounds, not confidence intervals or estimates. See the coverage note below the tables. The Maybe self-hosting check was unreliable.","Experiment 4's retrieval diagnostic uses an observed hard-check subset defined by checks that failed at least once in no-knowledge first-commit judgments. This subset is incomplete by construction. Citation frequency is a proxy and does not prove retrieval was fixed, comprehensive reading, or improved development quality.","One maintenance run per condition and application; repetitions were four for the team study, five downstream, and three for feature and persona studies. The joint judge differs from the v2 judge, so original and rescored v2 counts must remain distinct.","The pre-push hook and review requests were tried against local bare remotes with automatic merges. A hosted forge and human reviewers remain future work. A background run may delay a push because refresh synchronously fetches without a timeout.","Costs are client-side list-price estimates on a subscription, not invoices."],"footer":"Built from the evaluation workspace: v3 (maint.py, score_maint.py, dev.py, analyze.py, retrieval.py, PROTOCOL.md), loop (feature sequence), downstream (comparison), and sim/report-v2 (v2 data and conversations).","strip":[["team decisions passed, pooled","60.4% → 87.5%",1],["carried checks passed, team knowledge","43/60 → 60/60",1],["maintained A downstream checks, pooled","77.7% → 85.6%",1],["persona tasks","no demonstrated improvement",0]]},"persona":{},"cache_check":[],"generation":""}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = ['a-sonnet', 'b-sonnet', 'a-haiku', 'b-haiku'];
const CN = {'a-sonnet': 'A · Sonnet', 'b-sonnet': 'B · Sonnet', 'a-haiku': 'A · Haiku', 'b-haiku': 'B · Haiku'};
const VERDICT = {hit: 'Caught', partial: 'Partly caught', miss: 'Did not catch'};
const HEADERS = {
  'core/naming-conventions.md': ['ID', 'Convention', 'Scope'],
  'core/pitfalls.md': ['ID', 'Trigger', 'What goes wrong', 'Do instead', 'Scope'],
  'core/tech-stack-standards.md': ['ID', 'Standard', 'Level', 'Scope'],
  'core/terminology.md': ['ID', 'Term', 'Meaning', 'Scope'],
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const usd = v => v == null ? '–' : '$' + v.toFixed(v < 1 ? 3 : 2);
const secs = v => v == null ? '–' : (v >= 60 ? Math.floor(v / 60) + 'm ' + String(Math.round(v % 60)).padStart(2, '0') + 's' : Math.round(v) + 's');
const ktok = v => v == null ? '–' : (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : Math.round(v / 1e3) + 'k');
const condTag = c => `<span class="cond"><span class="sw c-${c}"></span>${CN[c]}</span>`;
const scoreOf = (repo, c) => ((D.scores || {})[repo] || {})[c];
const hhmm = iso => { try { return new Date(iso).toISOString().slice(11, 16) + ' UTC'; } catch (e) { return ''; } };

// Markdown: raw HTML in agent text is shown as text, never interpreted.
let md = s => `<p>${esc(s).replace(/\n/g, '<br>')}</p>`;
if (window.marked) {
  const renderer = new marked.Renderer();
  renderer.html = h => esc(h);
  marked.setOptions({gfm: true, breaks: true, mangle: false, headerIds: false, renderer});
  md = s => marked.parse(String(s ?? ''));
}
const fileOf = t => String(t || '').replace(/^products\//, 'tools/');
function headerFor(file, cols) {
  const h = HEADERS[file] || (/^tools\/[^/]+\/README\.md$/.test(file) ? ['ID', 'Fact', 'Scope'] : null);
  const hh = h && h.length === cols ? h : ['ID', ...Array(Math.max(cols - 1, 0)).fill(' ')];
  return '| ' + hh.join(' | ') + ' |\n|' + hh.map(() => ' --- ').join('|') + '|\n';
}
function asFileMd(file, text) {
  const t = String(text || '').trim();
  if (t.startsWith('|') && !/^\|\s*ID\s*\|/.test(t)) {
    const first = t.split('\n')[0];
    const cols = (first.match(/(?<!\\)\|/g) || []).length - 1;
    return headerFor(fileOf(file), cols) + t;
  }
  return t;
}
const mdBox = (file, text, cls = '') => `<div class="mdcard"><span class="file">${esc(fileOf(file))}</span><div class="mdbox md ${cls}">${md(asFileMd(file, text))}</div></div>`;

function mateIndex(repo, key) { return Object.keys(repo.mates).indexOf(key); }
function initials(name) { return String(name || '?').slice(0, 1).toUpperCase(); }

function tally(c) {
  const t = {req: 0, reqHit: 0, reqPartial: 0, opt: 0, optHit: 0, traps: 0, trapsHit: 0, supported: 0, noise: 0, unsupported: 0, cost: 0, wall: 0};
  for (const r of D.repos) {
    const s = scoreOf(r.repo, c), cond = r.conditions[c];
    if (cond && cond.ok) { t.cost += cond.cost || 0; t.wall += cond.wall_seconds || 0; }
    if (!s) continue;
    for (const f of r.facts.filter(f => f.delivered)) {
      const v = (s.expected[f.id] || {}).verdict;
      if (f.required) { t.req++; if (v === 'hit') t.reqHit++; if (v === 'partial') t.reqPartial++; }
      else { t.opt++; if (v === 'hit') t.optHit++; }
    }
    for (const tr of r.traps) { t.traps++; if (s.forbidden[tr.id]) t.trapsHit++; }
    for (const e of s.extras || []) t[e.verdict] = (t[e.verdict] || 0) + 1;
  }
  return t;
}

function barChart(rows, valueFmt) {
  const W = 640, L = 150, R = 76, H = 20, gap = 6, groupGap = 14;
  let y = 4, last = null; const parts = [];
  const m = Math.max(...rows.map(r => r.value || 0), 1e-9);
  for (const r of rows) {
    if (r.group !== last) { if (last !== null) y += groupGap; parts.push(`<text class="lbl" x="0" y="${y + 13}">${esc(r.group)}</text>`); y += 20; last = r.group; }
    const w = Math.max(1, (W - L - R) * (r.value || 0) / m);
    parts.push(`<text class="axis" x="${L - 8}" y="${y + H / 2 + 4}" text-anchor="end">${esc(r.label || CN[r.cond])}</text>`);
    parts.push(`<rect class="f-${r.cond}" x="${L}" y="${y}" width="${w}" height="${H}" rx="3"><title>${esc(r.label || CN[r.cond])}: ${valueFmt(r.value)}</title></rect>`);
    parts.push(`<text class="val" x="${L + w + 6}" y="${y + H / 2 + 4}">${valueFmt(r.value)}</text>`);
    y += H + gap;
  }
  return `<svg viewBox="0 0 ${W} ${y + 4}" role="img">${parts.join('')}</svg>`;
}

function factCard(r, f) {
  const src = f.source, exp = f.expected_md;
  const head = `<div class="fact-head" id="fact-${r.repo}-${f.id}"><span class="fid">${f.id}</span>${f.required ? '<span class="tag req">required</span>' : '<span class="tag">optional</span>'}<span class="small muted">task ${f.task} · ${esc(f.mate)}</span></div>`;
  let left = '';
  if (src) {
    left += `<div class="said"><span class="who">Said by ${esc(f.mate)} · session ${src.session}, turn ${src.turn}</span>
      <div class="bubble dev"><div class="md">${md(src.message)}</div></div>
      <a class="jump" href="#conversations" data-open="${r.repo}|${f.task}|${src.session}|${src.turn}">Open in the conversation →</a></div>`;
  } else if (f.delivered) {
    left += `<p class="small muted">Comes from the code change itself (the existing entry is stale after this push), not from one message.</p>`;
  } else {
    left += `<p class="small muted">This planted fact never came up in the conversation, so it is excluded from scoring.</p>`;
  }
  left += exp ? `<div class="mdcard"><span class="who">Expected change · ${esc(f.op || '')}</span>${mdBox(exp.file, exp.row, 'expected')}</div>`
             : `<div class="mdcard"><span class="who">Expected change</span><p>${esc(f.gist)}</p></div>`;
  if (!f.delivered) return `<article class="fact excluded">${head}<div class="fact-body"><div class="fact-left">${left}</div></div></article>`;
  let right = '';
  for (const c of C) {
    const s = scoreOf(r.repo, c), cond = r.conditions[c];
    const v = (s && s.expected[f.id]) || {};
    const verdict = v.verdict || 'miss';
    const recs = (v.records || []).map(i => cond && cond.accepted[i]).filter(Boolean);
    right += `<div class="verdict"><div class="vh">${condTag(c)}<span class="pill ${verdict}">${VERDICT[verdict] || verdict}</span></div>
      ${recs.length ? `<span class="proposed">Proposed this:</span>${recs.map(x => mdBox(x.target, x.text)).join('')}` : `<span class="nocatch">No accepted record carries this fact.</span>`}</div>`;
  }
  return `<article class="fact">${head}<div class="fact-body"><div class="fact-left">${left}</div><div class="fact-right">${right}</div></div></article>`;
}

function renderThread(repoName, taskId) {
  const r = D.repos.find(x => x.repo === repoName); const th = r.conversations.find(t => t.task === taskId);
  const mi = mateIndex(r, th.mate_key);
  document.querySelectorAll('.thread:not(.dthread)').forEach(b => b.setAttribute('aria-current', b.dataset.key === repoName + '|' + taskId ? 'true' : 'false'));
  const sel = document.getElementById('thread-select'); if (sel) sel.value = repoName + '|' + taskId;
  document.getElementById('pane-head').innerHTML = `<span class="av m${mi}">${initials(th.mate)}</span><div class="pt"><b>${esc(th.mate)} · ${esc(repoName)} ${th.task}</b><span>${esc(th.title)}</span></div>`;
  let h = '';
  for (const s of th.sessions) {
    h += `<div class="sep">Session ${s.n}${s.n > 1 ? ' · fresh agent session' : ''}</div>`;
    for (const m of s.messages) {
      if (m.role === 'dev') {
        const chips = (m.marks || []).map(id => `<a class="mark-chip${/-F\d/.test(id) ? ' trapc' : ''}" href="#fact-${repoName}-${id}">${/-F\d/.test(id) ? 'trap ' : 'plants '}${id}</a>`).join('');
        h += `<div class="row dev" id="msg-${repoName}-${th.task}-${s.n}-${m.turn}"><span class="av sm m${mi}">${initials(th.mate)}</span><div class="col"><span class="stamp">${esc(th.mate)} · ${hhmm(m.at)}</span><div class="bubble dev"><div class="md">${md(m.text)}</div></div>${chips ? `<div class="marks">${chips}</div>` : ''}</div></div>`;
      } else {
        const tools = m.tools && m.tools.length ? `<details class="tools"><summary>Used ${m.tools.length} tool${m.tools.length > 1 ? 's' : ''}</summary><ol>${m.tools.map(t => `<li>${esc(t)}</li>`).join('')}</ol></details>` : '';
        const body = m.text ? `<div class="bubble ${m.role === 'stop' ? 'stop' : 'agent'}">${m.role === 'stop' ? `<div class="small"><b>Driver:</b> ${esc(m.user || '')}</div>` : ''}<div class="md">${md(m.text)}</div></div>` : '';
        h += `<div class="row ${m.role === 'stop' ? 'stop' : 'agent'}"><span class="av sm agentav">C</span><div class="col"><span class="stamp">Claude Code · ${hhmm(m.at)}</span>${body}${tools}</div></div>`;
      }
    }
  }
  const feed = document.getElementById('feed'); feed.innerHTML = h; feed.scrollTop = 0;
}

function openMessage(repoName, task, session, turn) {
  renderThread(repoName, task);
  document.getElementById('conversations').scrollIntoView();
  const el = document.getElementById(`msg-${repoName}-${task}-${session}-${turn}`);
  if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2400); }
}

}

    ${D.repos.map(r => C.map(c => { const x = r.conditions[c]; if (!x || !x.agents) return `<tr><td>${r.repo}</td><td>${condTag(c)}</td><td colspan="10" class="muted">not run</td></tr>`;
      const part = re => x.agents.filter(a => re.test(a.label)).reduce((n, a) => n + a.cost, 0);
      return `<tr><td>${r.repo}</td><td>${condTag(c)}</td><td class="r">${usd(x.cost)}</td><td class="r">${secs(x.wall_seconds)}</td><td class="r">${c.startsWith('a') ? usd(part(/^sweeper$/)) : '–'}</td><td class="r">${usd(part(/maintainer/))}</td><td class="r">${usd(part(/^writer$/))}</td><td class="r">${ktok(x.tokens.cacheReadInputTokens)}</td><td class="r">${ktok(x.tokens.cacheCreationInputTokens)}</td><td class="r">${ktok(x.tokens.outputTokens)}</td><td class="r">${x.agents.reduce((n, a) => n + a.turns, 0)}</td><td class="r">${x.accepted.length}</td></tr>`; }).join('')).join('')}
    ${C.map(c => `<tr class="total"><td>All three</td><td>${condTag(c)}</td><td class="r">${usd(T[c].cost)}</td><td class="r">${secs(T[c].wall)}</td><td colspan="8"></td></tr>`).join('')}
    </tbody></table></div>${D.generation ? `<p class="small muted">${D.generation}</p>` : ''}</section>`;

  h += `<section id="caveats"><div class="prose"><div class="eyebrow">Read with care</div><h2>Caveats</h2></div><ul class="caveats">${(N.caveats || []).map(c => `<li>${c}</li>`).join('')}</ul><footer>${N.footer || ''}</footer></section>`;
  document.getElementById('app').innerHTML = h;

  document.querySelectorAll('.thread:not(.dthread)').forEach(b => b.addEventListener('click', () => { const [rp, t] = b.dataset.key.split('|'); renderThread(rp, t); }));
  document.querySelectorAll('.dthread').forEach(b => b.addEventListener('click', () => renderDevThread(b.dataset.key)));
  const ds = document.getElementById('dthread-select'); if (ds) ds.addEventListener('change', e => renderDevThread(e.target.value));
  if ((D.devconv || []).length) renderDevThread(D.devconv[0].key);
  document.getElementById('thread-select').addEventListener('change', e => { const [rp, t] = e.target.value.split('|'); renderThread(rp, t); });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-open]'); if (!a) return;
    e.preventDefault(); const [rp, t, s, turn] = a.dataset.open.split('|');
    if (s) openMessage(rp, t, s, turn); else { renderThread(rp, t); document.getElementById('conversations').scrollIntoView(); }
  });
  renderThread(D.repos[0].repo, D.repos[0].conversations[0].task);
  const links = [...document.querySelectorAll('.nav a[data-sec]')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) links.forEach(a => a.setAttribute('aria-current', a.dataset.sec === e.target.id ? 'true' : 'false'));
    }, {rootMargin: '-45% 0px -50% 0px'});
    document.querySelectorAll('#app > section').forEach(sec => io.observe(sec));
  }
}
render();
// The sections exist only after rendering, so honour a #section link once they do.
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView({behavior: 'auto'}); }
</script>
</body>
</html>
