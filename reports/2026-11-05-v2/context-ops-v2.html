 "2026-11-05T18:07:23.447436+00:00", "text": "The SimpleFIN integration test and the release note are both added. `yarn typecheck`, lint and the full sync-server suite all pass, and I kept everything on undici.\n\n- **Integration test:** `app-simplefin/integration.test.ts` runs the real `app-simplefin.js` against a local HTTP server on 127.0.0.1. It mocks nothing except the config, so it uses the real undici `fetch` and the real SSRF dispatcher. The server is allowed through the `simplefinAllowedNetworks` config setting. It has two tests:\n  - Claiming a setup token, storing the access key and listing accounts. It asserts the request order and the Basic auth header.\n  - Following a same-origin 302 on the accounts request and keeping the credentials on the second hop.\n- **Typecheck:** `yarn typecheck` from the repo root shows no errors this time, including after the engines edit, so the `html-to-image` error didn't appear. I ran it from the repo root, where earlier I ran it inside the sync-server package.\n- **Tests and lint:** the sync-server suite passes (766 tests, including the 2 new ones) and `yarn lint` is clean.\n- **Release note:** `upcoming-release-notes/sync-server-use-undici-fetch.md` has category Bugfix. I don't know your GitHub handle, so `authors` is the placeholder `[YOUR-GITHUB-HANDLE]`. Please replace it before pushing.\n\nThe new test doesn't check a redirect to a different origin or a blocked address, since the existing mocked tests already cover those.", "tools": ["[Bash] cd <workspace>/apps/actual && ls upcoming-release-notes | tail -5; f=$(ls upcoming-release-notes | grep -v README | tail -1); cat ", "[Bash] cd <workspace>/apps/actual/packages/sync-server/src/app-simplefin && sed -n 20,140p app-simplefin.js; sed -n 300,360p app-simplefi", "[Bash] cat > integration.test.ts <<'EOF' import { once } from 'node:events'; import { createServer } from 'node:http'; import type { IncomingHttpHeaders, Server } from", "[Bash] cd <workspace>/apps/actual && , so a stalled request could have left `afterAll` hanging. I added `server.closeAllConnections()` before it in `integration.test.ts`. The two real tests pass and lint is clean.\n\nI could add an explicit shorter timeout to the tests, but 5 seconds already seems quick enough. The sync server itself still has no timeout on SimpleFIN requests, so a bridge that never replies would keep a user's sync waiting for up to 300 seconds. The other providers set their own timeouts; for example, Enable Banking uses an abort controller. That isn't part of this bug, but say if you want me to add a timeout to the SimpleFIN calls.\n\nThe release-note placeholder is untouched.", "tools": ["[Bash] cd <workspace>/apps/actual/packages/sync-server && cat vitest.config.* 2>/dev/null | head -40; grep -n \"timeout\\|Timeout\\|signal\" ", "[Bash] export PATH=~/.nvm/versions/node/v22.20.0/bin:$PATH && python3 - <<'EOF' p='src/app-simplefin/integration.test.ts' s=open(p).read() s=s.replace(\"\"\"afterAll(asyn"], "user": null}, {"role": "dev", "text": "Okay, that makes sense, thanks for checking. 5 seconds is fine, I won't ask for an extra timeout. The SimpleFIN timeout is a separate thing and I'd rather not widen this change. Maybe I'll mention it to the team later.\n\nOne more question, sorry. Should the root package.json engines (>=22.18.0) match the sync-server one, or is it fine to leave them different? I'm not sure how we usually handle that. What do you think?", "turn": 5, "at": "2026-11-05T18:08:25.226856+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:09:30.380604+00:00", "text": "I'd leave them different, but I'd also drop the sync-server bump back to `>=22`, because I can't find a reason for the higher floor.\n\n**Why different floors are normal here:** the root `package.json` describes what developers need to work on the whole monorepo. Each package's `engines` describes what a consumer of that published package needs. The two don't have to match. `packages/api` and `pac  doesn't. Following the same pattern:\n\nI found the cause and fixed it in `packages/desktop-client/src/components/accounts/Account.tsx`. I haven't run the app or any tests, so the fix is untested.\n\n**Cause:** The `toggle-reconciled` case in `onMenuSelect` refetched transactions with only the filter conditions. The refetch replaces the query that `onSearch` had set, so the list went back to unfiltered while `state.search` still held the text. Other handlers that refetch, such as `remove-sorting`, already call `this.onSearch(this.state.search)` afterwards to put the search back.\n\n**Fix:** After the refetch, `toggle-reconciled` now re-applies the search when `state.search` isn't empty, the same way `remove-sorting` does. I also merged the two duplicated true/false branches into a single toggle.\n\nTo check it, search for a payee, toggle \"show reconciled transactions\" both ways, and confirm the list stays filtered.\n\nThe knowledge base had no pitfalls recorded that applied to this change.", "tools": ["[Read] <workspace>/kb/actual/dev/index.md", "[Grep] <workspace>/apps/actual", "[Read] <workspace>/kb/actual/dev/core/pitfalls.md", "[Grep] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Edit] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Edit] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx"], "user": null}, {"role": "dev", "text": "Thanks, that makes sense! One thing I'm wondering about: does this also keep the current sort and filters applied after toggling, or only the search? I'd like all of them to survive. Could you also add a test that searches and then toggles reconciled? Please try the relevant yarn command once, but if the workspace isn't installed on this laptop that's fine.", "turn": 2, "at": "2026-11-05T18:24:47.991980+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:25:31.504610+00:00", "text": "Now the test. I'll build an instance directly, stub `updateQuery`, and make `setState` synchronous.\n\nI couldn't run the test here, so I haven't verified the fix or the test. Vitest fails at startup because this laptop's Node version doesn't export `styleText` from `node:util`. That's a toolchain issue, not a failure in the test. I didn't try other Node versions, since you said one attempt was fine.\n\n**Sort and filters:** my first fix didn't reliably keep them, so I changed it.\n- **Cause:** the toggle called `fetchTransactions(filterConditions)`, which rebuilds the query from the root. With no filters but an active sort, `applyFilters([])` calls `fetchTransactions()` again, and the sort is dropped.\n- **Fix:** the root query doesn't depend on `showReconciled`, because `updateQuery` adds that filter itself. The toggle now skips the rebuild and re-runs `updateQuery` on `this.currentQuery`, which already holds the filters and sort. If a search is active it goes through `onSearch`, as before, so the search is kept too.\n- **Where:** `toggle-reconciled` in `packages/desktop-client/src/components/accounts/Account.tsx`.\n\n**Test:** I added `Account.test.tsx` next to the component. To reach the handler I exported `AccountInternal`, which wasn't exported before.\n- **Search:** the first test builds an instance with `search: 'grocery'`, toggles reconciled, and checks the search is still in state and in the query passed to `updateQuery`.\n- **Sort and filters:** the second test sets a filtered, sorted `currentQuery` with no search. It checks that `updateQuery` gets that same query after the toggle.\n\nThe test stubs `setState` and `updateQuery` rather than rendering the whole account page, which has many dependencies. It ne` builds the search query on top of `currentQuery`, so it inherits the sort and filters.\n\nWhat I haven't confirmed is that the live list stays sorted after a toggle in the actual UI. I'd check that by hand once the app runs: sort a column, add a filter, search, then toggle reconciled both ways.", "tools": ["[Bash] cd <workspace>/apps/actual/packages/desktop-client/src && grep -rn \"export class\\|export default class\" --include=*.tsx . | grep -", "[Grep] <workspace>/apps/actual/packages/desktop-client/src", "[Grep] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Bash] cd <workspace>/apps/actual/packages && f=$(ls loot-core/src/shared/query.ts 2>/dev/null || find . -path ./node_modules -prune -o -"], "user": null}, {"role": "dev", "text": "Ok, thanks for checking, that's helpful. I think I'd rather not keep an export that only exists for the test, and rendering the whole Account page with all those mocks sounds like way too much for one handler. Could you drop the AccountInternal export and the class-level test, and keep just the small fix in the toggle? I'll sort a column, search, and toggle reconciled by hand once I have the app running.", "turn": 4, "at": "2026-11-05T18:26:00.884391+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:26:04.685121+00:00", "text": "I dropped the `AccountInternal` export and deleted `Account.test.tsx`. The only change left is the `toggle-reconciled` fix in `packages/desktop-client/src/components/accounts/Account.tsx`, and nothing is committed.\n\nThe toggle now re-runs the current query instead of rebuilding it from the root. That means the active filters, sort and search all stay applied, and it uses `onSearch` when there's search text.\n\nThere's no automated coverage for this, and I still haven't run it. For your manual check, sort a column, add a filter, search a payee, then toggle \"show reconciled transactions\" both ways and confirm the list stays sorted, filtered and searched each time.", "tools": ["[Edit] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx", "[Bash] cd <workspace>/apps/actual && rm packages/desktop-client/src/components/accounts/Account.test.tsx && git status --short && git dif"], "user": null}, {"role": "dev", "text": "Thanks, the diff looks a lot smaller now, which I like. One edge case I'm wondering about, sorry: when onSearch gets called from the toggle, does it do any debouncing or extra work that could make the list flicker or refetch twice? Also a user on Discord mentioned this happens with the reconciled toggle on the mobile view too. Is that a separate code path, or does it all go through this same handler?", "turn": 5, "at": "2026-11-05T18:26:11.735444+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:26:33.067713+00:00", "text": "**Debounce, flicker and double fetch on desktop**\n\n`onSearch` isn't free. It does three things:\n1. It unsubscribes the current paged query.\n2. It calls `setState({ search })` with the same value, which is a no-op re-render for a `PureComponent`.\n3. It schedules `onSearchDone`, which is debounced by 150ms. When that fires, it runs `updateQuery` once and builds one new paged query.\n\nSo there's one refetch, not two. The props-change handler only reacts to `accountId` changes, so the `setShowReconciled` pref update doesn't trigger a second fetch. I also didn't see anything else that reacts to `showReconciled`.\n\nTwo side effects of the debounce:\n- **Frozen list for ~150ms:** the list stays on the old data (reconciled rows not yet shown or hidden) because the subscription is already dropped. It doesn't flash unfiltered, but there's a short delay before the toggle takes effect.\n- **Non-search toggles are immediate:** without search text I call `updateQuery` directly, so the delay only applies when a search is active.\n\nIf that 150ms bothers you, I can skip the debounce by calling `updateQuery` with the search query directly. It would duplicate a few lines from `onSearchDone`, so I held back. I haven't measured any of this in the running app.\n\n**Mobile**\n\nMobile is a separate code path and doesn't go through `onMenuSelect`. The mobile screens only read the `hide-reconciled-*` synced pref. The toggle itself is in the account menu modals (`AccountMenuModal` and `AllAccountsMenuModal`). I read the mobile code, but I haven't confirmed whether it has this bug:\n- **Single account (`mobile/accounts/AccountTransactions.tsx`):** an effect rebuilds the base query when `hideReconciled` changes, then re-runs `search(searchTextRef.current)`. That should keep the search. `search` is debounced inside `useTransactionsSearch`, so the list may show the unfiltered query for a moment before the search lands, which would look like a flicker.\n- **All accounts (`mobile/accounts/AllAccountTransactions.tsx`):** on a `hideReconciled` change it rebuilds the query and wraps it in `transactionsSearch` when search text exists. That looks correct.\n\nSo I don't see a cause for \"search drops after toggling\" on mobile from the code. The Discord user may have been on desktop, or may be seeing the brief unfiltered flash on the single-account screen. It would help to ask them which screen, whether it was a single account or all accounts, and whether the search stayed off or only flickered. I haven't changed anything in this turn.", "tools": ["[Grep] <workspace>/apps/actual/packages/desktop-client/src/components/mobile", "[Grep] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Header.tsx", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/mobile/accounts/AccountTransactions.tsx", "[Grep] <workspace>/apps/actual/packages", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/mobile/accounts/AllAccountTransactions.tsx", "[Grep] <workspace>/apps/actual/packages/desktop-client/src/hooks/useTransactionsSearch.ts", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/accounts/Account.tsx"], "user": null}, {"role": "dev", "text": "Ok, the 150ms delay is fine, I won't worry about it. I'll ask the Discord user which screen they were on. Mobile looks separate from this fix so let's leave it alone for now. The diff looks good to me, so please go ahead and commit it.", "turn": 6, "at": "2026-11-05T18:26:38.997728+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:26:42.659860+00:00", "text": "I committed the fix as `34e8699f` on `sim2`: \"[AI] Keep search, sort and filters when toggling reconciled transactions\". It only touches `Account.tsx`, and I haven't pushed it.\n\nAs we discussed, it hasn't been run or tested yet. Once you have the app running, sort a column, add a filter, search a payee, and toggle reconciled both ways.", "tools": ["[Bash] git status --short && git log -5 --format=%s && git add packages/desktop-client/src/components/accounts/Account.tsx && git commit -q -m \"[AI] Keep search, sort "], "user": null}]}]}, {"task": "P5", "mate": "Lena", "mate_key": "lena", "title": "Custom reports can group by day, week, month, or year. Add a Quarterly interval.", "sessions": [{"n": 1, "messages": [{"role": "dev", "text": "hey, custom reports let you group by day, week, month or year. can we add a quarterly option too? users keep asking for it. take a look at how the existing intervals are wired up and tell me what you think before changing stuff", "turn": 1, "at": "2026-11-05T18:26:49.296428+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:27:24.992504+00:00", "text": "I'll start with the team KB index, as CLAUDE.md asks, and look for where the intervals are defined.\n\nI've read through how the intervals are wired up and haven't changed anything. Quarterly is doable. It's more than adding one entry to a list, because \"Yearly\" and \"Monthly\" are hardcoded in several places.\n\n**How intervals work today**\n\n`interval` is a plain `string` on the report entity (`loot-core/src/types/models/reports.ts`) and in the DB schema, so saved reports don't need a migration. `ReportOptions.ts` defines each interval as `{key, name, format, range}`, and the `name` and `range` fields point at a `monthUtils` function. Most of the UI reads from those maps, and that part adapts automatically.\n\n**What would break, in order of difficulty**\n\n1. **The query layer needs a quarter bucket.** `makeQuery.ts` groups with AQL's `$day`, `$month` or `$year`, and `compiler.ts:611-622` has no `$quarter`. There are two ways to handle it:\n   - **Add `$quarter` to the AQL compiler.** This is cleaner but touches the core query engine. It would need a new `castInput` type (like `date-month` and `date-year`) that maps to SQL on the integer date, plus compiler tests.\n   - **Group by month and roll up client-side.** This is the same trick Weekly already uses in `custom-spreadsheet.ts:181`, where it remaps dates with `weekFromDate`. It's lower risk and needs no engine change. I'd go this way.\n   - **Range filter.** `makeQuery.ts:21-24` also applies the date range filter with `$transform`. For Quarterly it should use `$month`, with the start and end snapped to quarter boundaries.\n\n2. **Quarter helpers are missing from `months.ts`.** It already has `getQuarter`, `getQuarterStart`, `getQuarterEnd` and `prevQuarter`. It lacks `quarterFromDate`, `quarterRangeInclusive` and `currentQuarter`. I'd represent a quarter by its first month (`2026-04`). That keeps the same key format Monthly uses, and it formats through the existing date code.\n\n3. **Hardcoded `Daily/Weekly/Monthly/Yearly` branches (the easy part to miss).**\n   - **Type unions:** `ReportOptions.ts` has the `'Day'|'Week'|'Month'|'Year'` unions, and `GetCardData.tsx` has `convertFromDate` and `convertRangeInclusive`. Both would silently map Quarterly to the daily default.\n   - **Ternary chains:** `CustomReport.tsx:349-392` and `showActivity.ts:58-62` build function names with `name.toLowerCase() + 'FromDate'`, so a new name needs a matching `quarterFromDate`. `CustomReport.tsx` also has a `currentInterval` chain that falls back to the current month.\n   - **Date range table:** `dateRangeOptions` in `ReportOptions.ts` has a `Daily/Weekly/Monthly/Yearly` boolean per preset. Each preset needs a `Quarterly` flag, and `dateRangeProps` needs the field. `disabledList.ts` has its own copy of the interval options.\n   - **Budgeted balance type:** `budgetDataQuery.ts:231` only knows Monthly and Yearly. `ReportSidebar.tsx:213` forces Daily and Weekly back to Monthly. Quarterly needs to be allowed or forced here too, and for Budgeted it means summing three months of budget data.\n\n4. **Labels.** `getIntervalFormat` already handles non-day intervals through `intervalFormat`. The date-fns `QQQ` token gives \"Q2 '26\". Check how it localizes before settling on a format.\n\n5. **Click-through (`showActivity.ts`).** Clicking a bar opens the transactions for that interval. It builds a start and end from the interval type, so Quarterly needs a three-month span there.\n\n**Things I'd check first**\n- NetWorth, BalanceForecast and Spending have their own interval handling. I'd keep them out of scope unless you want Quarterly there too.\n- `ReportOptions.test.ts` iterates over the intervals, so it will exercise the new entry.\n\n**Recommendation:** do the client-side rollup with new `months.ts` helpers, add Quarterly to `intervalOptions`, and fix the hardcoded branches listed above. I'd add tests for the new helpers, `makeQuery`, and the Budgeted path. It's around 10 files and no schema or engine change.\n\nShould I go ahead on that plan, or would you rather add `$quarter` to AQL?", "tools": ["[Read] <workspace>/kb/actual/dev/index.md", "[Grep] <workspace>/apps/actual", "[Read] <workspace>/apps/actual/packages/desktop-client/src/components/reports/ReportOptions.ts", "[Read] <workspace>/kb/actual/dev/core/pitfalls.md", "[Grep] <workspace>/apps/actual/packages", "[Grep] <workspace>/apps/actual/packages", "[Gr ly and Quarterly side by side. The test-mode \"today\" is 2017-01, so end dates were clamped to that.\n\n| Case | Quarterly result |\n|---|---|\n| From set after To | Start stays as picked. End becomes start + 365 days, capped at the end of the current month. |\n| To set before From | End becomes the end of the picked quarter. Start becomes end \u2212 365 days. Picking Q1 2016 gives 2015-04-01 to 2016-03-31. |\n| From and To set to the same quarter | The range widens back a year (see below). |\n\n- **The 365 days is my choice.** Monthly uses 180 and Yearly uses 1095. I picked a year so you'd get about four quarters. Say if you'd prefer something else.\n- **Same-quarter quirk:** if To is set to the same quarter as From, the range doesn't collapse to one quarter. The code compares the stored start, a full day like `2026-07-01`, against the picked key `2026-07`. As strings, the day sorts after the key, so it counts as \"start after end\" and pushes start back.\n  - Quarterly inherits this from existing code. Monthly does the same: From and To both July 2016 became 2016-02-02 to 2016-07-31.\n  - I haven't changed it, since it would alter Monthly behavior. The fix is to compare on month keys, not raw strings. It's small, and I can do it for all intervals, or for Quarterly only if you'd rather not touch Monthly. Which do you want?", "tools": ["[Bash] cd <workspace>/apps/actual/packages/desktop-client/src/components/reports && ls spreadsheets | grep -i -E \"budget|fetch\"; grep -n ", "[Bash] sed -n 640,720p ReportSidebar.tsx; sed -n 80,140p reportRanges.ts; sed -n 1,60p spreadsheets/budgetDataQuery.test.ts; cat spreadsheets/budgetMonthCell.ts | head", "[Bash] sed -n 140,215p reportRanges.ts | grep -n \"\" | sed -n 1,5p; awk 'NR>=150 && NR<=215' reportRanges.ts | sed -n '/^function boundedRange/,$p'; grep -n \"Monthly\\|F", "[Bash] cd <workspace>/apps/actual/packages/desktop-client && export PATH=$HOME/.nvm/versions/node/v22.20.0/bin:$PATH && grep -n \"currentD", "[Bash] cd e": "dev", "text": "nice, the stash check was a good call. one thing, when To is a year like '2015', how does it get to the end date? is that going through the month helpers or its own string math?", "turn": 4, "at": "2026-11-05T18:38:39.544936+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:38:42.598770+00:00", "text": "Its own string math. In `validateEnd`, the Yearly case is:\n\n```ts\ncase 'Yearly':\n  dateEnd = end + '-12-31';\n  subDays = 1095;\n```\n\nSo a To of `'2015'` becomes `'2015-12-31'` by appending. It doesn't go through `getMonthEnd` or any other month helper. That works because every year ends on Dec 31, so there's no month length or leap-year logic to get wrong. `validateStart` does the same thing, with `start + '-01-01'`.\n\nMonthly and Quarterly do use the month helpers. Monthly calls `getMonthEnd(end + '-01')`, and Quarterly calls `getMonthEnd(getQuarterEnd(end) + '-01')`.\n\nThis relies on To being a bare four-digit year when the interval is Yearly. The To dropdown passes keys in that shape. If a full date such as `'2015-12-31'` ever reached that branch, you'd get `'2015-12-31-12-31'`. I haven't checked whether any saved-report path can produce that. I can check if you want.", "tools": [], "user": null}, {"role": "dev", "text": "yeah, can you check whether any saved-report path can hand that branch a full date? i'd rather know now than find out from a bug report. also, in the new code from yesterday, did you end up using any `as` casts anywhere?", "turn": 5, "at": "2026-11-05T18:38:48.542345+00:00", "marks": []}, {"role": "agent", "at": "2026-11-05T18:39:02.925288+00:00", "text": "**Saved reports can't hand that branch a full date.** I traced it from the code but didn't run it against a saved report.\n\n- **Only caller:** `validateStart` and `validateEnd` are called in one place, the From/To `Select` `onChange` handlers in `ReportSidebar.tsx`. Loading a saved report goes through `setReportData` in `CustomReport.tsx`, which sets the reports/CustomRe", "[Bash] grep -n \"export function yearFromDate\\|export function yearRangeInclusive\\|export function dayRangeInclusive\" -A14 packages/loot-core/src/shared/months.ts | hea"], "user": null}, {"role": "dev", "text": "ok good on the saved reports. the `as` casts in the new test file though, use `satisfies` on the fixtures instead of `as CategoryEntity[]` and the group one. the `as unknown as typeof send` one is probably fine if it needs a comment saying why. leave the fromDate cast alone for now.", "turn": 6, "at": "2026-11-05T18:39:10.059307+00:00", "marks": ["P5-E3"]}, {"role": "agent", "at": "2026-11-05T18:39:48.751617+00:00", "text": "The fixtures already satisfy both types, since the extra fields are optional. I'll switch them and add the comment on the mock cast.\n\nDone, in `fetchSpreadsheetQueryData.test.ts`:\n\n- **Fixtures:** the `categories` and `categoryGroups` arrays now use `satisfies CategoryEntity[]` and `satisfies CategoryGroupEntity[]`. This compiled cleanly because the fields the fixtures leave out are optional on both types.\n- **Mock cast:** `as unknown as typeof send` stays, with a comment above it. The comment says `send` is typed per handler name, so one mock that answers the budget sheet query for any month needs the cast.\n- **`fromDate` cast:** I left it alone, as you asked.\n\n`tsc` on the desktop-client package reports no errors, and the three tests in that file pass.\n\nAll three changed files (`reportRanges.ts`, `reportRanges.test.ts` and this one) are still uncommitted.", "tools": ["[Bash] cd <workspace>/apps/actual/packages/desktop-client/src/components/reports/spreadsheets && grep -n \"as CategoryEntity\\|as CategoryG", "[Bash] cd <workspace>/apps/actual && grep -rn \"type CategoryEntity\\b\\|type CategoryGroupEntity\\b\" -A18 packages/loot-core/src/types/model", "[Bash] cd <workspace>/apps/actual/packages/desktop-client/src/components/reports/spreadsheets && python3 - <<'EOF' p='fetchSpreadsheetQue"], "user": null} s of the collection should be able to check it too, not just the owner.", "reply": "Yes. `getLinkById` calls `getPermission({ userId, linkId })`, so the status endpoint gets the same access rules.\n\n- **Permission lookup:** with a `linkId`, `getPermission` finds the collection containing the link and includes its `members`. It doesn't filter by user.\n- **Access check:** `getLinkById` then allows the request if `ownerId === userId` or any member has `userId`. So any collection member can check the link, and the owner can too.\n- **No permission-flag check:** it doesn't look at `canCreate`, `canUpdate` or `canDelete`. A read-only member can run the check, which is what you want now that nothing is stored.\n\nIf the link doesn't exist, `getPermission` returns null and the check ..."}, "expected_md": {"file": "core/naming-conventions.md", "row": "| NAME-103 | API routes in `pages/api/v1` stay thin: they authenticate with `verifyUser` or `getTokenFromRequest` and call a controller in `apps/web/lib/api/controllers/<resource>/` that returns `{ status, response }`. | app:linkwarden |"}}, {"id": "P2-E1", "task": "P2", "mate": "Jules", "gist": "Client components never call axios/fetch directly; they use packages/router hooks (shared by web and mobile) for data access; may land as STACK", "target": "core/naming-conventions.md", "op": "ADD", "owner": "conventions", "required": true, "from": "M1", "delivered": true, "source": {"session": 1, "turn": 4, "message": "ah ok good, so the status text really comes from the endpoint, nice. and yeah, that's what i like here: the component only calls mutate. we never do axios or fetch straight in a component, it always goes through a hook so the cache stuff stays shared, so keep it that way. for the toast, go with your simpler option: show just the reason when there is one, otherwise fall back to the HTTP code. the \"HTTP 503 - Server responded with HTTP 503\" thing looks silly.", "reply": "I changed the toast in `useCheckLinkStatus.ts` word.ts", "line": 17, "quote": "ForgotPasswordSchema.safeParse(req.body)"}], "reason": "Developer stated the rule in direct correction of an ad hoc check, and an existing route (forgot-password) already follows it. Scoped to this app.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-107", "op": "ADD", "text": "| STACK-107 | Any server-side request to a user-supplied URL must go through `safeFetch` from `@linkwarden/lib/safeFetch`, which applies the SSRF checks; fetching such a URL directly is an SSRF hole. | requirement | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "8226c0f2-8b62-470e-9a4b-e116aeb95278", "quote": "anything hitting a user supplied url has to, otherwise it's an ssrf hole"}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 327, "quote": "const response = await safeFetch(url, {"}], "reason": "Explicit developer statement of a normative rule; safeFetch exists at packages/lib/safeFetch.ts and the new controller uses it. The PROXY caveat is existing behavior stated only by the assistant, so it is left out.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-108", "op": "ADD", "text": "| STACK-108 | Runtime configuration, such as the link check timeout `LINK_CHECK_TIMEOUT_MS`, is read from environment variables and listed in `.env.sample`, not from a JSON config file. | preference | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "6bc502ce-ecc4-47a1-b9b9-c401fc0e8b9b", "message": "057cc699-8d4f-4a4b-9a88-936373ed1775", "quote": "env var like everything else, forget that"}, {"kind": "diff", "path": ".env.sample", "quote": "LINK_CHECK_TIMEOUT_MS="}], "reason": "Developer considered a config file and chose env vars 'like everything else'. Marked preference because wording is casual s/worker/requeueFailedPreservations.ts", "line": 488, "quote": "const archivalTags = link.tags.filter(isArchivalTag);"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "do the first one with the settings check"}], "reason": "The worker source marks any missing format as unavailable. The developer accepted the settings-aware approach and the head controller implements it. The failure is a consequence stated by the development agent and consistent with the worker source. Not verified by running anything.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-102", "op": "ADD", "text": "| PIT-102 | Exposing an action that makes the server send an outbound request to a link's URL as a GET route | Prefetchers and link unfurlers can fire a GET, and each one would hit the target site. | Use POST for such actions, as `POST /api/v1/links/:id/status` does (405 for other methods, blocked in demo mode). | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "07da5f5b-c6ac-4a88-943e-d3dd230ee12d", "quote": "it fires an outbound request every call, feels more like a POST"}, {"kind": "source", "path": "apps/web/pages/api/v1/links/[id]/status/index.ts", "line": 19, "quote": "if (req.method === \"POST\") {"}], "reason": "The developer raised the concern, the assistant explained the consequence, and the code adopted POST. The prefetch consequence is reasoning, not an observed incident. Moderate confidence.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-103", "op": "ADD", "text": "| PIT-103 | Server code fetching a user-supplied URL (such as a link's URL) with plain `fetch` or another client | This creates an SSRF hole, since internal addresses and redirect hops go unchecked. | Fetch through `safeFetch` from `@linkwarden/lib/safeFetch`, which applies the SSRF checks, and map `UnsafeUrlError` to a result instead of crashing. Reject unparseable or non-http(s) URLs with a 400 before fetching. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "8226c0f2-8b62-470e-9a4b-e116aeb95278", "quote": "anything hitting a user supplied url has to, otherwise it's an ssrf hole"}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 327, "quote": "const response = await safeFetch(url, {"}], "reason": "Developer stated the rule explicitly and the code follows it. The PROXY caveat (the safe DNS lookup step is skipped when PROXY is set) exists in safeFetch.ts createAgent but was not developer-stated, so it is omitted.", "agent": "pitfalls-maintainer"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-004", "op": "ADD", "text": "After a preservation run, the worker writes the string `unavailable` to every artifact field (`image`, `pdf`, `readable`, `monolith`, `preview`) that is still empty. This covers both a capture that failed and a format that is disabled by settings, so `unavailable` alone does not mean a failure the worker would retry.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 220, "quote": "readable: !finalLink.readable ? \"unavailable\" : undefined,"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "6a9a94ad-36f7-4f65-87df-14b7183e95c3", "quote": "the worker also writes `\"unavailable\"` for formats a user has disabled"}], "reason": "Verified in worker source at head: unset fields are marked unavailable after the run, with no distinction between failed and disabled. The assistant stated it in the session and the new controller (diff) is built around it. Durable, reusable behavior.", "agent": "tool-maintainer:preservation"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-005", "op": "ADD", "text": "Which formats are enabled for a link comes from its archival tags if it has any (tags where `isArchivalTag` is true, using their `archiveAsScreenshot`, `archiveAsMonolith`, `archiveAsPDF` and `archiveAsReadable` flags, true if any such tag enables it), otherwise from the link owner's `archiveAs*` user settings. The preview is always attempted regardless of these settings, so a failed preview is always a real failure. To re-queue a link, set the failed fields to null and clear `lastPreserved` and `indexVersion`; the worker then treats it as unpreserved and rebuilds only the missing fields. Re-queueing by `unavailable` without the settings check would re-queue every link that has a disabled format.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "line": 488, "quote": "const archivalTags = link.tags.filter(isArchivalTag);"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "73be766b-943c-4f20-912d-0cdd6f02aa84", "quote": "the preview thing is fine, keep it"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "do the first one with the settings check"}], "reason": "The developer accepted the settings-aware approach and the preview rule, and the code at head implements it, mirroring the worker's logic. The throwaway admin endpoint and button themselves are deliberately not recorded: the developer says they are removed after a few weeks, so the entry would go stale. The resolution logic is the reusable part. One residual uncertainty: the claim that the worker's own settings resolution matches the tag-then-user rule rests on the assistant reading archiveHandler.ts; I only checked the unavailable writes (lines 55-59, 220-224) and isArchivalTag directly.", "agent": "tool-maintainer:preservation"}] ved link's URL, one of `alive` (final response below HTTP 400 after redirects), `dead` (HTTP 404 or 410, domain does not resolve, or connection refused), or `unknown` (anything else, such as 401, 403, 429, other 5xx, timeouts, or URLs blocked by the SSRF check, with the cause in `reason`). `unknown` exists because 403 and 429 are usually bot blocking, so the link cannot be called dead. The response also has `ok`, which is true only for `alive`, so `ok: false` does not imply dead. The result is returned only and never stored on the link. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "701fa946-185f-4f72-8331-e8c1f55c9f04", "quote": "unknown:** everything else, with the cause in `reason`"}, {"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "35993600-aec7-4c44-8a3c-4a1718db6050", "quote": "no schema change for this, just return the result"}, {"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "b0a70456-6bbc-44ad-a717-ed436ce204df", "quote": "ok semantics are fine"}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 15, "quote": "export type LinkStatus = \"alive\" | \"dead\" | \"unknown\";"}], "reason": "The developer asked for alive/dead detection and accepted the three-state semantics and the ok flag. Source at head implements them. It is a new domain concept not in the existing terms. The stored-result idea was explicitly rejected, so it is excluded.", "agent": "terminology-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-001", "op": "ADD", "text": "| PIT-001 | Treating a link archive field (`image`, `pdf`, `readable`, `monolith`) set to `\"unavailable\"` as proof the archive failed, for example when bulk re-queueing preservation. | The worker also writes `\"unavailable\"` for any format it did not produce, including formats the owner or an archival tag has disabled. Matching on `\"unavailable\"` alone re-queues every link with a disabled format and floods the worker for nothing. | Work out which formats are enabled per link before resetting a field: use the link's archival tags if it has any, otherwise the owner's `archiveAs*` settings. Reset only fields that are `\"unavailable\"` and enabled. `preview` is attempted regardless of settings, so a failed preview always counts. See `requeueFailedPreservations.ts`. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "9f651b7e-3cc9-49c4-8d5c-a09c16b5db94", "quote": "the worker also writes `\"unavailable\"` for formats a user has disabled"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "do the first one with the settings check"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 220, "quote": "readable: !finalLink.readable ? \"unavailable\" : undefined,"}, {"kind": "source", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "line": 8, "quote": "ignored, since the worker marks those \"unavailable\" too."}], "reason": "Failure and remedy are both supported. Worker source sets \"unavailable\" for any missing format, the developer asked for the per-link settings check, and the committed controller implements it. The consequence (needless worker load) is the agent's analysis, not an observed incident, so the entry is scoped to this app and the wording stays on the trigger.", "agent": "pitfalls-maintainer"}], "deferred": [], "rejected": [], "no_change": 4, "failures": []}, "a-haiku": {"wall_seconds": 541.7, "exit_code": 0, "ok": true, "cost": 0.7585498700000001, "duration_s": 677.231, "agents": [{"label": "sweeper", "status": "success", "cost": 0.34406135, "turns": 63, "ms": 370777, "inputTokens": 2238, "outputTokens": 80288, "c ample archiveAsScreenshot and failed archives). | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "72cd8e08-8058-441c-b3aa-81a814999dfe", "quote": "a bunch of links ended up with failed archives"}, {"kind": "source", "path": "packages/prisma/schema.prisma", "line": 63, "quote": "archiveAsScreenshot"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 88, "quote": "const archivalTags = link.tags.filter(isArchivalTag);"}], "reason": "Existing TERM-103 names preservation but not the archive wording used throughout the settings, the admin page and the developer's own message. Adding the alias keeps the ID and meaning and links the two words. Scope stays app:linkwarden.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": null, "op": "ADD", "text": "| TERM-105 | Link check status | The result of checking a saved link's URL with a live request. alive: the final response is below HTTP 400. dead: HTTP 404 or 410, the domain does not resolve, or the connection is refused. unknown: any other response or failure, such as 401, 403, 429, 5xx, a timeout or a blocked internal address. unknown does not mean dead. The ok field of the check result is true only for alive. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 43, "quote": "Only these mean the page is gone."}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 126, "quote": "ok: result.status === \"alive\","}, {"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "74aded9f-e2c4-44d2-93a9-6c63a481a26f", "quote": "people keep asking if a saved link is still alive or dead"}, {"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "b0a70456-6bbc-44ad-a717-ed436ce204df", "quote": "ok semantics are fine"}], "reason": "Developer-defined status vocabulary with accepted semantics, implemented in the status endpoint. No existing term covers it. The third state is a deliberate design choice so bot-blocked pages are not called dead.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": null, "op": "ADD", "text": "| TERM-106 | Re-queue | Clearing a link's preservation state so the worker preserves it again. The admin re-queue action sets the failed format fields and preview to empty, and clears lastPreserved and indexVersion. The worker then treats the link as not yet preserved and claims it again. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "diff", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "quote": "lastPreserved: null,"}, {"kind": "source", "path": "apps/worker/lib/getLinkBatchFairly.ts", "line": 37, "quote": "lastPreserved: null,"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "72cd8e08-8058-441c-b3aa-81a814999dfe", "quote": "re-queues preservation for those"}], "reason": "The developer's term for the admin action, with the mechanism shown in the controller and the worker's claim query. Scope is app-level because the admin action and the worker claim both belong to this application.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": null, "op": "ADD", "text": "| TERM-107 | Failed link | In the admin worker stats, a link that was attempted (lastPreserved set) and has image, pdf, readable and monolith all unavailable. In the re-queue action, a link where any enabled format or the preview is unavailable. The two counts differ and are not interchangeable. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/lib/api/controllers/worker/getWorkerStats.ts", "line": 25, "quote": "const linkFailed = await prisma.link.count("}, {"kind": "diff", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "quote": "if (!Object.values(reset).some(Boolean)) continue;"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "partial failures are probably a chunk of it"}], "reason": "The word failed is used with two definitions in one change set. The developer accepted including partial failures in the re-queue. Recording both prevents the admin count and the re-queue count from being treated as the same figure.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": null, "op": "ADD", "text": "| TERM-108 | Unavailable | The value a format field (image, pdf, readable, monolith, preview) holds after a worker run when that format was not produced. It is set for a failed format, for a format disabled in the archival settings, and for every format of a link whose URL is not http or https. It is not by itself proof of failure. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 221, "quote": "image: !finalLink.image ? \"unavailable\" : undefined,"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 47, "quote": "(!link.url?.startsWith(\"http://\") && !link.url?.startsWith(\"https://\"))"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "keep it in the controller tho"}], "reason": "The worker's sentinel value is used in several app features and has a meaning that differs from its plain reading. The source at head establishes the behavior. The developer's message only shows the settings check was requested; the disabled-format behavior rests on the source, not on the developer.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": null, "op": "ADD", "text": "| TERM-109 | Archival tag | A tag that carries an explicit archive or AI tag setting, meaning one of its archive or AI tag flags is true or false rather than unset. When a link has any archival tag, those tags decide which formats are archived, using the union of their enabled flags. Otherwise the link creator's archive settings apply. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "packages/lib/isArchivalTag.ts", "line": 3, "quote": "export const isArchivalTag = (tag: any | Tag) =>"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 88, "quote": "const archivalTags = link.tags.filter(isArchivalTag);"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "do the first one with the settings check"}], "reason": "Shared domain term used by the worker and the admin re-queue. The precise resolution is also in tools/preservation; this entry only defines the term. Scope is app:linkwarden.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-106", "op": "ADD", "text": "| STACK-106 | Request bodies are validated with zod schemas defined in `packages/lib/schemaValidation.ts`. The route calls `safeParse` and returns 400 with `Error: <message> [<path>]` on failure. Observed in the password-reset route and the new link status route. | requirement | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/pages/api/v1/auth/forgot-password.ts", "line": 17, "quote": "const dataValidation = ForgotPasswordSchema.safeParse(req.body);"}, {"kind": "source", "path": "packages/lib/schemaValidation.ts", "line": 8, "quote": "import { z } from \"zod\";"}, {"kind": "source", "path": "apps/web/package.json", "line": 90, "quote": "\"zod\": \"^4.1.13\""}, {"kind": "conversation", "session": "6bc502ce-ecc4-47a1-b9b9-c401fc0e8b9b", "message": "3924b65a-673c-4a97-b4d9-0ebd50e3cd2 inside the hook. The developer wrote 'we', so company-wide scope is possible but not established; scope is app:linkwarden. A NEEDS_REVIEW follow-up on company scope is recommended.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-108", "op": "ADD", "text": "| STACK-108 | Application configuration is read from environment variables. New settings are added to `.env.sample` with an empty default and fall back to a built-in default when unset or invalid. Example: `LINK_CHECK_TIMEOUT_MS`. | requirement | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "6bc502ce-ecc4-47a1-b9b9-c401fc0e8b9b", "message": "057cc699-8d4f-4a4b-9a88-936373ed1775", "quote": "env var like everything else, forget that."}, {"kind": "diff", "path": ".env.sample", "quote": "+LINK_CHECK_TIMEOUT_MS="}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 8, "quote": "const getTimeoutMs = () =>"}], "reason": "The developer rejected a config file in favour of an env var 'like everything else', which states existing practice. The new variable is listed in .env.sample and falls back to 10 seconds when unset, empty, non-numeric or non-positive. Scope is app:linkwarden; the 'like everything else' phrasing does not prove company-wide policy.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-109", "op": "ADD", "text": "| STACK-109 | User-facing strings are added in English only, in `apps/web/public/locales/en/common.json`. Crowdin translates the other locales from that file. Other locale files are not edited by hand for new keys. | requirement | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "5d6cbf4f-3424-40a2-811b-5b0367989015", "message": "3007e6db-c6a2-43c8-b1df-d2288925aad5", "quote": "just en is right, crowdin fills in the other languages so don't worry about those"}, {"kind": "so 0d2", "quote": "skips the safe-lookup step"}], "reason": "Trigger and consequence are both in source at head (safeFetch returns the proxy agent before creating the safe lookup; the address check in ssrf.ts runs before connecting). The developer's requirement that user URLs go through safeFetch supports the remedy. The second half of the remedy (verify the proxy blocks internal addresses) is a recommendation drawn from the source caveat, not a developer decision, so the writer should keep it as stated. No runtime failure was observed in the sessions. Header status line of pitfalls.md should change from no pitfalls admitted yet when this row is written.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-102", "op": "ADD", "text": "| PIT-102 | A tag or other text chip is placed inside the shared `Button` component (`apps/web/components/ui/button.tsx`) in a card narrower than the text. | `Button` includes `whitespace-nowrap`, so the text cannot wrap. Long chips overflowed phone-width link cards, as the developer reported. | Set `min-w-0 max-w-full` on the `Button` and `truncate max-w-full` on the inner element so the chip shrinks and the text ends in an ellipsis. Applied in LinkMasonry.tsx. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/components/ui/button.tsx", "line": 7, "quote": "whitespace-nowrap"}, {"kind": "diff", "path": "apps/web/components/LinkViews/LinkComponents/LinkMasonry.tsx", "quote": "className=\"min-w-0 max-w-full\""}, {"kind": "conversation", "session": "78763d09-7e61-4add-a438-08782035abf0", "message": "fe74f012-487c-48e4-b681-431327a4b576", "quote": "the tag chips on the link cards run right off the edge of the card"}, {"kind": "conversation", "session": "78763d09-7e61-4add-a438-08782035abf0", "message": "0f17f43a-9034-44f6-9b34-dd1c74aff8d8", "quote": "`Button` is `whitespace-nowrap`"}], "reason": "Cause is in source at head (button.tsx line 7). The overflow was reported by the developer and the remedy was accepted (truncation is fine). The assistant did not check the result in a browser, so the remedy is recorded as applied in code, not as visually verified. The wording of the remedy follows the committed diff.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-103", "op": "ADD", "text": "| PIT-103 | Links are selected or counted by a format field value of `unavailable` to find failed preservations (for example to re-queue them). | The worker writes `unavailable` for every format that is missing after a run, including formats disabled in the link's archival settings. It also marks all formats for non-http URLs without a browser run. Selecting by the value alone re-queues work the user turned off, and the worker marks those formats unavailable again. | Resolve each link's enabled formats first (archival tags with explicit settings if present, otherwise the creator's user settings), then count or reset only enabled formats that failed, plus preview. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 221, "quote": "image: !finalLink.image ? \"unavailable\" : undefined,"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 49, "quote": "!link.url?.startsWith(\"http://\")"}, {"kind": "diff", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "quote": "if (!Object.values(reset).some(Boolean)) continue;"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "56995e96-9041-403a-95a2-42842e4ce4eb", "quote": "the worker also writes \"unavailable\" for formats a user has disabled"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "4bd7a3ac-53bc-4642-bd41-849302df0946", "quote": "A failed format that's disabled is ignored"}], "reason": "The worker behaviour is confirmed in source at head (finally block line 221 marks any missing format; the non-http branch at line 49 marks all formats). The developer and assistant discussed the cost of requeuing disabled formats (fa41debe) and the developer chose the settings-aware version. The consequence is described as repeated needless work, based on the code path and the discussion; no measured load was recorded. This is a Linkwarden data-semantics trap, not a generic job-queue pitfall, so it stays in core pitfalls rather than the preservation tool file; the preservation owner may hold the matching fact.", "agent": "pitfalls-maintainer"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-004", "op": "ADD", "text": "A format that is still missing after a worker run is stored as the string \"unavailable\". This happens whether the format failed or its archival setting was off. Links whose URL does not start with http:// or https:// skip the browser, get \"unavailable\" for every format, and have lastPreserved set. So \"unavailable\" does not by itself mean a failure; check the link's archival settings first.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 221, "quote": "image: !finalLink.image ? \"unavailable\" : undefined,"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 47, "quote": "(!link.url?.startsWith(\"http://\") && !link.url?.startsWith(\"https://\"))"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "7f53deaa-dec7-46b4-962c-090156e77845", "quote": "hmm yeah do the first one with the settings check, partial failures are probably a chunk of it"}], "reason": "Read at app head: the finally block of archiveHandler writes unavailable for each of readable, image, monolith, pdf and preview that is still empty, with no check of settings. The non-http branch writes unavailable for all formats. The developer accepted a re-queue that checks settings before treating unavailable as a failure (msg 7f53deaa). Scope is this application's worker; no other deployment was inspected.", "agent": "tool-maintainer:preservation"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-005", "op": "ADD", "text": "Archival settings for a link are taken from its tags when any tag has an explicit archive or AI-tag boolean (null means not set). The formats enabled are the OR across those tags. Otherwise the link creator's user archiveAs settings apply. Preview is attempted whenever the link has no preview, regardless of these settings.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 88, "quote": "const archivalTags = link.tags.filter(isArchivalTag);"}, {"kind": "source", "path": "packages/lib/isArchivalTag.ts", "line": 3, "quote": "export const isArchivalTag = (tag: any | Tag) =>"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 172, "quote": "if (!link.preview) await handleArchivePreview(link, page);"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "4bd7a3ac-53bc-4642-bd41-849302df0946", "quote": "using the link's archival tags if it has any and otherwise the owner's settings"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "73be766b-943c-4f20-912d-0cdd6f02aa84", "quote": "the preview thing is fine, keep it"}], "reason": "Verified in worker source at head (archiveHandler lines 88-110 and 172, isArchivalTag lines 3-9). The re-queue controller in the same diff copies this resolution. The developer accepted the preview behaviour during the re-queue review. The conversation says owner's settings, but the source reads link.createdBy (creator), so the source wording is used here. Scope is this application.", "agent": "tool-maintainer:preservation"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-006", "op": "ADD", "text": "In links mode the worker claims links whose lastPreserved is null and whose url is not null. Setting lastPreserved back to null, together with clearing the failed format fields, makes a link eligible for preservation again.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/getLinkBatchFairly.ts", "line": 37, "quote": "lastPreserved: null,"}, {"kind": "diff", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "quote": "lastPreserved: null,"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "6a9a94ad-36f7-4f65-87df-14b7183e95c3", "quote": "The worker then picks them up as unpreserved"}], "reason": "getLinkBatchFairly lines 35-38 show the links-mode claim filter (lastPreserved null, url not null); the tags mode uses lastPreserved not null instead. The re-queue controller at head clears lastPreserved and the failed fields. The conversation statement is an assistant claim, but the source supports it independently. Only lines 1-50 of getLinkBatchFairly were read in full; the rest of its selection logic was not inspected.", "agent": "tool-maintainer:preservation"}, {"target": "tools/prisma/README.md", "fact_id": "PRISMA-003", "op": "ADD", "text": "Preservation fields on `Link` (`preview`, `image`, `pdf`, `readable`, `monolith`) are nullable `String` columns, not Prisma enums. The worker stores the literal string `unavailable` as a missing-format marker, so queries compare that string. `lastPreserved` (`DateTime?`) and `indexVersion` (`Int?`) are also nullable. Null means not yet preserved or not indexed.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "packages/prisma/schema.prisma", "line": 174, "quote": "preview"}, {"kind": "source", "path": "packages/prisma/schema.prisma", "line": 183, "quote": "lastPreserved"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 221, "quote": "image: !finalLink.image ? \"unavailable\" : undefined,"}, {"kind": "source", "path": "apps/worker/lib/getLinkBatchFairly.ts", "line": 37, "quote": "lastPreserved: null,"}], "reason": "Data-model representation that a query author needs. The schema shows these fields as String?, DateTime? and Int?, and the worker writes the unavailable string. Sweeper candidate checked against source. The failure meaning of unavailable belongs to the preservation tool, so this entry records only the schema representation and points no further.", "agent": "tool-maintainer:prisma"}, {"target": "tools/prisma/README.md", "fact_id": "PRISMA-004", "op": "ADD", "text": "Tag archive and AI fields (`archiveAsScreenshot`, `archiveAsMonolith`, `archiveAsPDF`, `archiveAsReadable`, `archiveAsWaybackMachine`, `aiTag`) are nullable `Boolean` columns. Null means the tag does not set that option. A tag counts as setting archive behavior when any of these fields is a boolean, including false.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "packages/prisma/schema.prisma", "line": 197, "quote": "archiveAsScreenshot"}, {"kind": "source", "path": "packages/prisma/schema.prisma", "line": 202, "quote": "aiTag"}, {"kind": "source", "path": "packages/lib/isArchivalTag.ts", "line": 3, "quote": "export const isArchivalTag = (tag: any | Tag) =>"}], "reason": "isArchivalTag checks typeof boolean on each field, so null means unset and false counts as set. This is a schema representation fact that query and helper authors need. The archiving decision it drives is preservation behavior and is left to the preservation tool.", "agent": "tool-maintainer:prisma"}, {"target": "tools/prisma/README.md", "fact_id": "PRISMA-005", "op": "ADD", "text": "Application code imports the Prisma client instance from `@linkwarden/prisma` (`import { prisma } from \"@linkwarden/prisma\"`) and generated model or input types from `@linkwarden/prisma/client`.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "line": 1, "quote": "import { prisma } from \"@linkwarden/prisma\";"}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/getLinkById.ts", "line": 2, "quote": "import { UsersAndCollections } from \"@linkwarden/prisma/client\";"}, {"kind": "source", "path": "apps/worker/lib/getLinkBatchFairly.ts", "line": 2, "quote": "import { Prisma } from \"@linkwarden/prisma/client\";"}, {"kind": "source", "path": "packages/prisma/index.ts", "line": 1, "quote": "import { PrismaClient } from \"@prisma/client\";"}], "reason": "Repeated import pattern across web and worker code (grep of named files). Supported usage, so it qualifies as a reusable pattern. Scoped to app:linkwarden because it reflects this workspace layout. Not verified for other repos.", "agent": "tool-maintainer:prisma"}], "deferred": [{"target": "core/tech-stack-standards.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Shared data hooks in packages/router serve both web and mobile, and take toast and translation functions as parameters because the mobile app has no toast library. Pending a decision on whether this is a stack standard or a convention.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/mobile/package.json", "line": 24, "quote": "\"@linkwarden/router\": \"*\","}, {"kind": "source", "path": "packages/router/links.tsx", "line": 1174, "quote": "type ToastLike = {"}, {"kind": "conversation", "session": "69421113-461a-4adc-bfb9-dc4154d01b20", "message": "4cc744a9-a598-441a-969e-1aa7f58c25d1", "quote": "Mobile doesn't have a toast library at all."}], "reason": "Mobile depends on @linkwarden/router and the router hooks take an injected ToastLike type. The mobile toast claim comes from the assistant's search, not a developer decision, and the hook shape is a convention question. Deferred to NEEDS_REVIEW rather than admitted as a stack standard.", "agent": "stack-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-102", "op": "NEEDS_REVIEW", "text": "Data hooks in `packages/router` are named `use<Resource>`, for example `useLinks`, `useCollections`, `useTags`.", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "packages/router/links.tsx", "line": 33, "quote": "const useLinks = (params: LinkRequestQuery = {}, auth?: MobileAuth) => {"}, {"kind": "source", "path": "packages/router/collections.tsx", "line": 108, "quote": "const useCreateCollection = (auth?: MobileAuth) => {"}, {"kind": "source", "path": "packages/router/collections.tsx", "line": 180, "quote": "const useDeleteCollection = ({"}, {"kind": "source", "path": "packages/router/tags.tsx", "line": 292, "quote": "const useUpdateTag = () => {"}, {"kind": "source", "path": "packages/router/tags.tsx", "line": 414, "quote": "const useMergeTags = () => {"}, {"kind": "source", "path": "packages/router/links.tsx", "line": 1180, "quote": "const useCheckLinkStatus = ({"}, {"kind": "conversation", "session": "5d6cbf4f-3424-40a2-811b-5b0367989015", "message": "e8de98de-5cac-4c3f-ab07-adeba0b98ed3", "quote": "the team naming notes (NAME-102) say data hooks live in `packages/router` as `use<Resource>`"}, {"kind": "conversation", "session": "5d6cbf4f-3424-40a2-811b-5b0367989015", "message": "e10cfef9-eeb5-40b1-b33e-06d5ee2dd580", "quote": "can you move the hook into packages/router/links.tsx with the other link hooks"}], "reason": "Query hooks in packages/router follow use<Resource> (useLinks, useCollections, useTags, useTag). Mutation hooks follow use<Action><Resource> (useCreateCollection, useDeleteCollection, useUpdateTag, useMergeTags, useDeleteLink, useUpdateArchive, useCheckLinkStatus). The current text names only the query form, so it is incomplete. The conversations contain no developer statement about hook naming: the developer only asked to move the hook into packages/router, and the assistant's reference to NAME-102 is its own paraphrase. Adopting the action-plus-resource form for mutations would be a new convention inferred from implementation, which the developer has not accepted. Needs developer decision on whether mutation hooks should use use<Action><Resource> as a rule, and whether NAME-102 should scope the rule to queries.", "agent": "conventions-maintainer"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-001", "op": "NEEDS_REVIEW", "text": "The web app only records that a link needs preserving; apps/worker claims batches of unpreserved links and drives headless Chromium through lib/preservationScheme/*.", "scope": "app:linkwarden", "evidence": [{"kind": "diff", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "quote": "indexVersion: null,"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "72cd8e08-8058-441c-b3aa-81a814999dfe", "quote": "need a throwaway button on the admin background jobs page"}], "reason": "The change adds a throwaway admin controller in apps/web that clears output fields (image, pdf, readable, monolith, preview) and queue markers (lastPreserved, indexVersion). The fact as written says the web app only records a need to preserve. The developer approved the endpoint as temporary and asked for it to be removed later. A decision is needed on whether to amend this fact now or only after the throwaway is removed. The existing fact is left unchanged until then.", "agent": "tool-maintainer:preservation"}], "rejected": [], "no_change": 6, "failures": [], "forks_share_prefix": true}, "b-haiku": {"wall_seconds": 257.3, "exit_code": 0, "ok": true, "cost": 0.16578565, "duration_s": 544.646, "agents": [{"label": "conventions-maintainer", "status": "success", "cost": 0.01802371, "turns": 17, "ms": 42351, "inputTokens": 2114, "outputTokens": 9078, "cacheReadInputTokens": 161291, "cacheCreationInputTokens": 58302}, {"label": "pitfalls-maintainer", "status": "success", "cost": 0.017577190000000003, "turns": 19, "ms": 40460, "inputTokens": 2013, "outputTokens": 8467, "cacheReadInputTokens": 166379, "cacheCreationInputTokens": 57393}, {"label": "terminology-maintainer", "status": "success", "cost": 0.02386496, "turns": 18, "ms": 85802, "inputTokens": 2170, "outputTokens": 18135, "cacheReadInputTokens": 162926, "cacheCreationInputTokens": 64756}, {"label": "tool-maintainer:prisma", "status": "success", "cost": 0.019661679999999997, "turns": 37, "ms": 59114, "inputTokens": 2255, "outputTokens": 12348, "cacheReadInputTokens": 369118, "cacheCreationInputTokens": 47855}, {"label": "stack-maintainer", "status": "success", "cost": 0.040685200000000005, "turns": 36, "ms": 153546, "inputTokens": 2153, "outputTokens": 34075, "cacheReadInputTokens": 522740, "cacheCreationInputTokens": 91025}, {"label": "tool-maintainer:preservation", "status": "success", "cost": 0.03388268, "turns": 41, "ms": 128281, "inputTokens": 2269, "outputTokens": 27225, "cacheReadInputTokens": 803108, "cacheCreationInputTokens": 60061}, {"label": "cartographer", "status": "success", "cost": 0.0029209, "turns": 5, "ms": 2905, "inputTokens": 1451, "outputTokens": 487, "cacheReadInputTokens": 9290, "cacheCreationInputTokens": 12197}, {"label": "writer", "status": "success", "cost": 0.00916933, "turns": 12, "ms": 32187, "inputTokens": 1371, "outputTokens": 8555, "cacheReadInputTokens": 59673, "cacheCreationInputTokens": 20790}], "tokens": {"inputTokens": 15796, "outputTokens": 118370, "cacheReadInputTokens": 2254525, "cacheCreationInputTokens": 412379}, "accepted": [{"target": "core/terminology.md", "fact_id": "TERM-105", "op": "ADD", "scope": "app:linkwarden", "text": "| TERM-105 | Link check | A live request to a saved link's URL that classifies the link as alive, dead, or unknown. Alive: the final response after redirects is below HTTP 400. Dead: HTTP 404 or 410, a domain that does not exist, or a refused connection. Unknown: every other outcome, such as 401, 403, 429, other 5xx, timeouts, or URLs blocked by the server-side fetch check, because these often reflect bot blocking or temporary failure. The result's `ok` flag is true only for alive. Results are returned to the caller and are not stored on the link. | app:linkwarden |", "evidence": [{"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "74aded9f-e2c4-44d2-93a9-6c63a481a26f", "quote": "people keep asking if a saved link is still alive or dead"}, {"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "b0a70456-6bbc-44ad-a717-ed436ce204df", "quote": "ok semantics are fine"}, {"kind": "conversation", "session": "744acc87-afdd-404c-a991-0cecb4ee70c7", "message": "35993600-aec7-4c44-8a3c-4a1718db6050", "quote": "no schema change for this, just return the result"}, {"kind": "conversation", "session": "5d6cbf4f-3424-40a2-811b-5b0367989015", "message": "a3916b6f-9e3f-41cc-8245-901440611a69", "quote": "oh nice, this looks pretty good!"}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 15, "quote": "export type LinkStatus = \"alive\" | \"dead\" | \"unknown\";"}, {"kind": "source", "path": "apps/web/lib/api/controllers/links/linkId/checkLinkStatus.ts", "line": 126, "quote": "ok: result.status === \"alive\","}], "reason": "New domain concept the developer explicitly asked for (alive or dead status of saved links) and accepted with its semantics (\"ok semantics are fine\"). The source defines LinkStatus as alive, dead, unknown, with ok true only for alive. The developer removed storage (\"just return the result\"), so the definition states results are not stored. No existing TERM covers this, and the developer's own term 'link check' is used in discussion. Scope is app:linkwarden because the feature is in the web app. The developer's 'Check Link' menu wording is a UI label and is not added as a separate term.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-103", "op": "UPDATE", "scope": "app:linkwarden", "text": "| TERM-103 | Preservation | The worker's capture of a link into artifacts: screenshot, PDF, readability text, preview image, and single-file HTML. The same capture is called archive in code and discussion (for example the `links/[id]/archive` API route and `archiveHandler` in the worker), and a failed capture is called a failed archive. | app:linkwarden |", "evidence": [{"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "72cd8e08-8058-441c-b3aa-81a814999dfe", "quote": "ended up with failed archives"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "72cd8e08-8058-441c-b3aa-81a814999dfe", "quote": "re-queues preservation for those"}, {"kind": "source", "path": "apps/web/pages/api/v1/links/[id]/archive/index.ts", "line": 9, "quote": "export default async function links(req: NextApiRequest, res: NextApiResponse) {"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 25, "quote": "export default async function archiveHandler("}], "reason": "The developer uses 'failed archives' and 'preservation' for the same capture in one message, and the source names the web route and worker handler 'archive'. Adding 'archive' as an alias keeps the existing ID and meaning and helps readers map code names to the term. Not added: the tool-specific 'failed' count used by the throwaway admin re-queue button, since the developer said it will be deleted.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-106", "op": "ADD", "text": "| STACK-106 | Application settings are read from environment variables, loaded from the root `.env` and listed in `.env.sample`, not from a separate config file. | requirement | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "conversation", "session": "6bc502ce-ecc4-47a1-b9b9-c401fc0e8b9b", "message": "057cc699-8d4f-4a4b-9a88-936373ed1775", "quote": "nah, env var like everything else, forget that."}, {"kind": "conversation", "session": "6bc502ce-ecc4-47a1-b9b9-c401fc0e ook lives in packages/router, which depends on @tanstack/react-query. The pushed diff adds axios calls directly in apps/web/pages/admin/background-jobs.tsx. The developer accepted that as a one-off for a temporary admin button and said explicitly that it is 'not a new rule', so it is recorded as a temporary deviation to remove with the button, not as a standard exception. The rule is scoped to app:linkwarden. I did not audit older web code for compliance, and the pinLink helper mentioned in session 5d6cbf4f was not checked.", "agent": "stack-maintainer"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-001", "op": "UPDATE", "text": "| PRESERVATION-001 | The web app mostly records that a link needs preserving by leaving `lastPreserved` empty. It can also clear failed format fields to request a new run (see PRESERVATION-006). `apps/worker` claims batches of unpreserved links and drives headless Chromium through `lib/preservationScheme/*`. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "line": 83, "quote": "image: reset.image ? null : undefined,"}, {"kind": "source", "path": "apps/web/lib/api/controllers/worker/requeueFailedPreservations.ts", "line": 88, "quote": "lastPreserved: null,"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "6a9a94ad-36f7-4f65-87df-14b7183e95c3", "quote": "Only the failed fields are set to null"}], "reason": "The existing row says the web app only records that a link needs preserving. The requeue controller in this push writes preservation fields directly (clears format fields, lastPreserved and indexVersion), so the word 'only' overstates the web app's role. The worker-side description is still accurate. The controller is temporary, so the update keeps the claim general and points to PRESERVATION-006.", "agent": "tool-maintainer:preservation"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-004", "op": "ADD", "text": "| PRESERVATION-004 | After a run, the worker writes `\"unavailable\"` to every field still empty (`readable`, `image`, `monolith`, `pdf`, `preview`). This includes formats the link's settings leave disabled, so `\"unavailable\"` does not always mean a failure. If the run is skipped before the browser starts (`DISABLE_BROWSER` or `DISABLE_PRESERVATION` set to `\"true\"`, the URL fails the SSRF check, or the link is not http or https), all five fields are set to `\"unavailable\"` without opening a page. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 220, "quote": "readable: !finalLink.readable ? \"unavailable\" : undefined,"}, {"kind": "source", "path": "apps/worker/lib/archiveHandler.ts", "line": 47, "quote": "skipPreservation ||"}, {"kind": "conversation", "session": "fa41debe-aa3a-4166-9ce4-07cd240b51c3", "message": "56995e96-9041-403a-95a2-42842e4ce4eb", "quote": "formats a user has disabled"}], "reason": "The finally block in archiveHandler.ts marks any empty field as unavailable regardless of settings, and the early-return branch (lines 47-64) marks all five fields without launching Chromium. The assistant in the requeue session stated the disabled-format case, and the source confirms it. The developer did not contest it. The disable-flag and SSRF skip paths were read in source only.", "agent": "tool-maintainer:preservation"}, {"target": "tools/preservation/README.md", "fact_id": "PRESERVATION-005", "op": "ADD", "text": "| PRESERVATION-005 | Format choice is per link. If a link has archival tags, the worker enables a format when any of those tags enables it. Otherwise it uses the link owner's archival settings. The preview is attempted for every processed link whose `preview` is empty, whatever the settings. | app:linkwarden |", "scope": "app:linkwarden", "evidence": [{"kind": "source", "path": "apps/worker/lib/a
