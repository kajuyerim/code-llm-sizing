intainer"}, {"target": "core/terminology.md", "fact_id": null, "op": "ADD", "text": "The key that identifies a calendar quarter in custom reports: the quarter's first month as YYYY-MM. For example, Q3 2026 has the key 2026-07. It is labelled Q3 '26 in the interface.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "for the quarter key, use the first month so q3 2026 is 2026-07, and label it Q3 '26"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "ad39eae0-2f88-47a4-80ed-611998cf7da6", "quote": "glad you went with the first month key"}], "reason": "The developer defined the quarter key explicitly and accepted the implementation. It is an application-scoped report term. Next unused ID is TERM-107 (TERM-101 through TERM-106 exist). The quarter key is a term of its own, not a naming convention, so it belongs here.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-104", "op": "UPDATE", "text": "The sync server runs on Express 5 and Node 22.19.0 or newer (`\"node\": \">=22.19.0\"` in its package manifest). It is mostly JavaScript and moving to TypeScript.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "56238ec1-3d78-4ec3-9516-6ffe31efe243", "quote": "please keep it at >=22.19.0 and don't revert it"}, {"kind": "source", "path": "packages/sync-server/package.json", "line": 132, "quote": "\"node\": \">=22.19.0\""}, {"kind": "source", "path": "packages/sync-server/package.json", "line": 101, "quote": "\"express\": \"^5.3.0\","}], "reason": "The developer explicitly decided to keep the sync-server Node floor at 22.19.0 after the assistant suggested reverting it to >=22. The head manifest confirms the value and Express 5. The root package.json stays at >=22.18.0 by the developer's choice (different floors are fine), so the root floor is not changed here. The developer could not recall the origin of 22.19.0; the record states the floor as decided, not as justified by a dependency.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-105", "op": "UPDATE", "text": "Report graphs are built with Recharts. The \"Download Snapshot\" action on reports captures the report with `@zumer/snapdom` (`snapdom.toPng`).", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportTopbar.tsx", "line": 75, "quote": "const image = await snapdom.toPng(reportElement);"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/ReportTopbar.tsx", "quote": "+import { snapdom } from '@zumer/snapdom';"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "1968406d-8b38-42a1-a4f2-f3631e7f9995", "quote": "oh nice, you used image.src, good"}], "reason": "The code at head uses snapdom for Download Snapshot, and the developer asked for the swap. STACK-105 still names html-to-image's toPng, which is no longer the implementation. Not recorded: the developer's Firefox diagnosis (not reproduced in a browser). Unresolved: packages/desktop-client/package.json at head still lists \"html-to-image\": \"^1.11.13\" (line 190), contrary to the session's claim that it was removed, so the dependency state is left for NEEDS_REVIEW rather than stated here.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-107", "op": "ADD", "text": "Sync server outbound HTTP calls use `undici`. Do not add another HTTP client library to the sync server.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "I don't want another HTTP library on the server"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "Please keep it on undici."}, {"kind": "source", "path": "packages/sync-server/package.json", "line": 109, "quote": "\"undici\": \"^8.12.3\","}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}], "reason": "Explicit developer decision (rejected axios and node-fetch) for this application, verified in the manifest and in the source of the SimpleFIN module. Scope is app:actual because the developer stated it for this server. The developer's rationale, 'undici is what Node ships anyway', is inaccurate: the sync server depends on the installed undici@8.12.3 package, and Node's built-in fetch bundles a different undici version (commit 567f1496, session 70de19bb msg be2af540). The record deliberately omits that rationale.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-108", "op": "ADD", "text": "New desktop-client source files must not carry `// @ts-strict-ignore`. Only existing files that predate this rule may keep it.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "1968406d-8b38-42a1-a4f2-f3631e7f9995", "quote": "New files shouldn't carry that, we only grandfather the old ones."}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/donutLabel.ts", "line": 1, "quote": "import { theme } from '@actual-app/components/theme';"}], "reason": "Explicit developer rule for new files in this application, stated as a policy ('we only grandfather the old ones'). The source file donutLabel.ts is a new file at head without the directive, which is consistent with the rule. The rule is scoped to app:actual because it was stated about this repository's typecheck setup. The session says DonutGraph.tsx keeps the directive as a grandfathered file; that file was not separately checked here.", "agent": "stack-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-104", "op": "ADD", "text": "| NAME-104 | Start every commit title and PR title with `[AI]`, for example `[AI] Store amounts at the same x100 scale for every currency`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "239b2ae3-2fd0-484e-bb19-ebebe1e5f8ef", "quote": "the message needs the [AI] prefix, since we do that for every commit and PR title here"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "48e88bbc-6072-4df9-b2a8-122ee21c05c7", "quote": "Glad the message starts with [AI], that's what we do here."}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "2b41817d-fb42-420b-8b99-81c980a94517", "quote": "start the message with [AI] like the rest of the history"}], "reason": "The developer stated the rule twice in the same repository, citing it as the practice for every commit and PR title. The developer's words name this repository ('here'), so scope is app:actual, not company. The seven commits in the pushed range all carry the prefix, which is consistent with the rule but not the evidence for it; the developer statements are. The Co-Authored-By trailer that the agent adds is deliberately not recorded, because the developer never confirmed it as a rule.", "agent": "conventions-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-101", "op": "ADD", "text": "| PIT-101 | Toggling \"show reconciled transactions\" on the desktop account page while a search, sort or filter is active. | The toggle re-ran fetchTransactions with only the filter conditions. That rebuilds the query from the root, so the active search and sort are dropped and the list shows unfiltered rows. | Re-run the current query instead of rebuilding it. Call updateQuery(this.currentQuery, ...) when there is no search text, and onSearch(this.state.search) when there is. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "6866729d-4758-475d-ab89-f59a2f88a398", "message": "2a9c8a2d-e78b-4669-ace9-1facfd75dd03", "quote": "the toggle called `fetchTransactions(filterConditions)`, which rebuilds the query from the root"}, {"kind": "conversation", "session": "6866729d-4758-475d-ab89-f59a2f88a398", "message": "feec3946-1748-42bf-8af9-1402ff7fae8a", "quote": "The refetch replaces the query that `onSearch` had set"}, {"kind": "source", "path": "packages/desktop-client/src/components/accounts/Account.tsx", "line": 972, "quote": "this.updateQuery("}], "reason": "Failure: reported by a user on the account page, and the cause was identified by reading the code; the developer accepted the explanation. Remedy: present at head in the toggle-reconciled case (Account.tsx line 962 onward). Not run in the app or in a test: the developer planned a manual check. Scope is app:actual because the failure is in this app's account page code.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-102", "op": "ADD", "text": "| PIT-102 | Picking a To date in the same month, quarter or year as the From date in a custom report range (validateEnd in reportRanges.ts). | The stored From date, a full date such as 2026-07-01, is compared as a string with the raw To key such as 2026-07. The longer string sorts later, so the range looks reversed and From is reset to the fallback range. | Compare against the normalized end date: getMonthEnd of the To month, getQuarterEnd of the To quarter, or To plus -12-31 for a year. Do not compare the raw key. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "e54dbbc6-f221-45f3-ac39-b0a483796e71", "quote": "compared the stored From date (`'2026-07-01'`) with the raw To pick (`'2026-07'`)"}, {"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "388f0e98-3ec0-4040-9ec8-5ce1a29631e4", "quote": "The new monthly, yearly and quarterly cases all failed on the old code"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 74, "quote": "dateEnd = monthUtils.getMonthEnd(end + '-01');"}], "reason": "Failure: the user reported it, the cause was identified, and the new tests were run against the old code and failed (per the session), which supports the trigger and consequence. Remedy: normalized end comparison is present at head (reportRanges.ts lines 74-102). Scope app:actual: it is this app's date-range helper.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-103", "op": "ADD", "text": "| PIT-103 | Calling amountToInteger, integerToAmount or integerToCurrency, or scaling values in useFormat, with a currency's decimalPlaces to store or read an amount. | Zero-decimal currencies were stored on a different scale from the rest. A 1,500 yen budget showed as 15 on one screen and 150,000 on another. | Use the fixed x100 scale and do not pass a currency argument for storage. Use the currency's decimal places only for display. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "b3093f43-4dbd-4e40-a9b8-0f064b4476eb", "quote": "it shows as 15 on one screen and 150,000 on another"}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included"}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display"}, {"kind": "source", "path": "packages/loot-core/src/shared/util.ts", "line": 539, "quote": "export function amountToInteger(amount: Amount): IntegerAmount {"}], "reason": "Failure: a user report that the same yen amount displayed at two scales, and the cause (mixed scales) was analyzed in the session. Remedy: the developer chose the fixed x100 scale, and the helpers at head take no decimal argument (util.ts lines 539 and 543). Existing data: the developer said no migration is needed; recorded as their statement, not as verified data.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-104", "op": "ADD", "text": "| PIT-104 | Running yarn typecheck when an earlier stage fails, for example on a missing module. | The root typecheck script chains tsgo and then lage typecheck with &&, so later stages do not run. Strict-mode errors in new files stay hidden, and a clean result can look like a pass. | Fix the first failing error, then rerun the full yarn typecheck until it passes before relying on it. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "e3b728d4-47e1-4cb5-997f-9260234ad043", "quote": "That error stopped the run before the strict-mode pass"}, {"kind": "source", "path": "package.json", "line": 66, "quote": "\"typecheck\": \"tsgo -p tsconfig.root.json --noEmit && lage typecheck\","}], "reason": "Failure: the assistant hit it while splitting DonutGraph (a strict-mode error in donutLabel.ts appeared only after the earlier error was fixed). Remedy: rerun the full check, which is procedural and supported by the && chain at head. The mechanism that the strict pass sits inside lage typecheck is taken from the session; the root chain confirms the stop-on-failure behavior.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-105", "op": "ADD", "text": "| PIT-105 | Running tests, oxfmt or lage with a Node version below 22, for example a shell whose default is Node 18. | Vitest fails at startup (a session saw a missing styleText export from node:util), and oxfmt and lage also fail on Node 18. | Run the commands on Node 22 or newer. The root package requires >=22.18.0, the sync server requires >=22.19.0, and .nvmrc pins v24.22.1. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "870bdb8d-a3b3-480a-a3a7-1aa7b77b9522", "quote": "The shell is on Node 18 and the repo needs 22 or newer, so Vitest won't start."}, {"kind": "conversation", "session": "6866729d-4758-475d-ab89-f59a2f88a398", "message": "2a9c8a2d-e78b-4669-ace9-1facfd75dd03", "quote": "Vitest fails at startup because this laptop's Node version doesn't export `styleText` from `node:util`"}, {"kind": "source", "path": "package.json", "line": 130, "quote": "\"node\": \">=22.18.0\","}, {"kind": "source", "path": ".nvmrc", "line": 1, "quote": "v24.22.1"}], "reason": "Failure: observed in three sessions on the developer's machine, and the session notes that oxfmt and lage fail on Node 18. Remedy: the engines and .nvmrc at head state the supported version, and the sessions ran the checks successfully on Node 22.20 from nvm. Scope app:actual: it describes this repo's toolchain floor.", "agent": "pitfalls-maintainer"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-003", "op": "ADD", "text": "| BANKSYNC-003 | The SimpleFIN, GoCardless and Enable Banking modules import `fetch` from `undici` explicitly. SimpleFIN passes its undici dispatcher only to that imported `fetch`, so the dispatcher and the fetch come from the same undici package. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/app-gocardless/services/gocardless-api.ts", "line": 2, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts", "line": 2, "quote": "import { fetch } from 'undici';"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "fe370a12-46b9-470c-8115-39752c432913", "quote": "the rule is that server code imports fetch from undici explicitly"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "Please keep it on undici."}], "reason": "The three provider modules at head adopt the undici import, so the code accepts the pattern. The developer asked for it as a rule and approved keeping undici. The SimpleFIN symptom was a best-guess cause (conversation be2af540, 'This is my best guess. I haven't reproduced the user's failure'), so the fact states the adopted pattern and not a confirmed root cause. The developer's reason 'undici is what Node ships anyway' conflicts with the finding that Node's global fetch bundles a different undici version, so the wording cites the installed undici package. Akahu and Pluggy.ai were not checked for this pattern and are not claimed. Scope is app:actual. The general rule belongs in core/tech-stack-standards.md, which this record does not change.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-004", "op": "ADD", "text": "| BANKSYNC-004 | SimpleFIN creates its SSRF dispatcher once at module load from the `simplefinAllowedNetworks` config value, and both its claim request and its accounts requests pass that dispatcher to `fetch`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 18, "quote": "allowedNetworks: config.get('simplefinAllowedNetworks'),"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 20, "quote": "const dispatcher = createSsrfDispatcher(networkOptions);"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 416, "quote": "dispatcher,"}], "reason": "Verified at head: the config is read at lines 17-20, and the claim request (line 413-416) and the redirect-following accounts request (line 502-506) both pass `dispatcher`. The SSRF helper is in packages/sync-server/src/util/ssrf.ts. This is implementation behaviour, scoped to the application's configuration key.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-005", "op": "ADD", "text": "| BANKSYNC-005 | SimpleFIN follows redirects by hand on its accounts request instead of using fetch's automatic follow, so the credentials are not sent after a redirect leaves the original origin. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 492, "quote": "fetch's automatic 'follow' would let a 3xx response redirect to a"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 502, "quote": "response = await fetch(currentUrl, {"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 36, "quote": "req.url?.startsWith('/simplefin/moved/accounts')"}], "reason": "The code comment at lines 492-494 states the intent, and the loop at line 502 implements it. The integration test covers a same-origin 302 (lines 36-37). It does not cover a cross-origin redirect; the developer did not ask for one. The fact describes intent verified by the code, scoped to this provider.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-006", "op": "ADD", "text": "| BANKSYNC-006 | SimpleFIN requests set no request timeout of their own, so a bridge that never answers holds the sync request until the runtime default applies. Enable Banking requests use an AbortController. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "a48fd694-1203-40d3-9213-a24461ec1c11", "quote": "`app-simplefin.js` sets no request timeout of its own"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "2c0ff959-c6c0-45f2-8c86-41040b54c3bf", "quote": "The SimpleFIN timeout is a separate thing and I'd rather not widen this change."}, {"kind": "source", "path": "packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts", "line": 154, "quote": "const controller = new AbortController();"}], "reason": "Checked at head: a text search of app-simplefin.js for timeout, AbortController and signal returned no matches. The Enable Banking controller at line 154 is the contrast. The developer chose to defer a SimpleFIN timeout and said they may mention it to the team, so this is a known gap, not a planned behaviour. The runtime default value was not verified, so the fact does not state it. Records of a deliberate deferral should be revisited if a timeout is added.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-007", "op": "ADD", "text": "| BANKSYNC-007 | The SimpleFIN integration test runs the real undici `fetch` and SSRF dispatcher against a local HTTP server on 127.0.0.1. It mocks only the config, and it allows the local range through `simplefinAllowedNetworks` (127.0.0.0/8). | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 12, "quote": "Nothing is mocked except the config: SimpleFIN talks to a real local HTTP"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 31, "quote": "allowedNetworks.push('127.0.0.0/8');"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "a48fd694-1203-40d3-9213-a24461ec1c11", "quote": "Both tests failed with \"Test timed out in 5000ms\""}], "reason": "The integration test file exists at head and matches the description (lines 12, 31). The 5 s timeout claim comes from the session's temporary-copy experiment, which is agent-reported; the record keeps it out of the fact. Useful as a test pattern for bank-sync changes; scope is this application.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-002", "op": "UPDATE", "text": "Custom report intervals, their label formats, and the per-preset date-range flags that enable each interval are defined in `components/reports/ReportOptions.ts`. The default date range selected when an interval is chosen is defined per interval in `components/reports/disabledList.ts`.", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/disabledList.ts", "line": 21, "quote": "description: t('Quarterly'),"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/disabledList.ts", "line": 23, "quote": "defaultRange: 'Last 12 months',"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportOptions.ts", "line": 286, "quote": "key: 'Quarterly',"}], "reason": "The old text said interval defaults live in ReportOptions.ts. At head, the default range per interval is in disabledList.ts (defaultRange entries), while ReportOptions.ts holds the interval list, formats, and dateRangeOptions flags. Keeps the ID and the still-valid part of the fact.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-003", "op": "ADD", "text": "The donut graph's active shapes, color helpers, dimension helper and label are split into sibling modules in `packages/desktop-client/src/components/reports/graphs/`: `ActiveShapeDesktop.tsx` and `ActiveShapeMobile.tsx` (one component per file), `activeShapeProps.ts` (the shared props type, so neither shape imports from the other), `donutColors.ts`, `donutDimensions.ts` and `donutLabel.ts`. `DonutGraph.tsx` imports them and keeps the graph component.", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx", "line": 27, "quote": "import { customLabel } from './donutLabel';"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "6d99f24a-b085-4a98-9ccf-2d2c5690d126", "quote": "each of those shapes is a component, own file please, mobile and desktop separate"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/graphs/ActiveShapeMobile.tsx", "quote": "+export const ActiveShapeMobile = ({"}], "reason": "Developer decision (one component per file, shared props in their own file) confirmed by the source imports at head. Recorded as an app-specific structure, not a Recharts requirement. A future Recharts-facing change may need the props type updated, which the file layout makes clear.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-004", "op": "ADD", "text": "Custom report intervals are Daily, Weekly, Monthly, Quarterly and Yearly. Quarterly reports query by month and roll the months up to quarters on the client, with no AQL change. A quarter is keyed by its first month (Q3 2026 is `2026-07`) and labelled with the `QQQ ''yy` format (for example Q3 '26).", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/spreadsheets/makeQuery.ts", "line": 15, "quote": "// Quarters are queried by month and rolled up client-side (like weeks are"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/spreadsheets/fetchSpreadsheetQueryData.ts", "line": 87, "quote": "// Monthly rows are keyed to the first month of their quarter. The consumers"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportOptions.ts", "line": 329, "quote": "// Monthly (\"MMM ''yy\"), Quarterly (\"QQQ ''yy\") and Yearly (\"yyyy\") are"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "for the quarter key, use the first month so q3 2026 is 2026-07, and label it Q3 '26"}], "reason": "Verified at head: makeQuery and fetchSpreadsheetQueryData implement the rollup, and ReportOptions defines the label format. The developer confirmed the key and label. The core term (TERM-106 Quarterly) is handed off to core/terminology.md.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-005", "op": "ADD", "text": "Budgeted balance-type custom reports support Monthly, Quarterly and Yearly intervals. The sidebar resets Daily and Weekly under Budgeted. Budgeted values are flows (the amount budgeted in each month), so a quarter's Budgeted value is the sum of its three monthly rows, not a balance.", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportSidebar.tsx", "line": 213, "quote": "// Budgeted only supports Monthly, Quarterly and Yearly intervals"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "15ba8e06-fc9d-45fa-8ddd-1f1dc3627dd0", "quote": "Summing is right for Budgeted, because what it reads is an amount, not a balance."}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "ad148268-d740-4ec9-a1b3-9e4d9fc7e309", "quote": "it's a flow so summing is fine"}], "reason": "The sidebar comment and Daily/Weekly check match head. The summing rule is the developer's accepted decision (flow, not balance). The Budgeted test for the quarter total is in a test file not read here, so only the decision and the code path are cited.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-006", "op": "ADD", "text": "Custom report date pickers handle a reversed From/To with a Quarterly fallback of four whole quarters. When From is after To, the range runs from the picked quarter through the end of the third quarter after it. When To is before From, it runs from the start of the quarter three quarters before the picked quarter through the end of the picked quarter. The end date is capped at the end of the current month. The To comparison uses the normalized end date (a full date), not the raw period key.", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 5, "quote": "// The last day of the third quarter after the one containing `month`."}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 99, "quote": "// Compare against the normalized end: `start` is a full date while `end` may"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 186, "quote": "case 'Quarterly':"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "ecfa9690-f9a0-44e2-99be-a83e8377dbfa", "quote": "i'd rather it span four whole quarters"}], "reason": "Verified in reportRanges.ts at head (fallback helper, validateEnd comment, cap by current month). The developer asked for four whole quarters. The same-period comparison fix is shared with Monthly and Yearly; the pitfall is handed off to core/pitfalls.md.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-007", "op": "ADD", "text": "Clicking a Quarterly bar opens transactions from the first day of the quarter's first month through the end of its last month. For the current quarter the end is the end of the current month, not today and not the quarter end, because the report's end date is snapped to month end. This matches the bar, which is built from whole months.", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/showActivity.ts", "line": 70, "quote": "// The query behind a quarterly report works in whole months."}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "247d5885-dcd8-4a43-a38c-6820fb74ec65", "quote": "matching the bar is better than clamping to today"}], "reason": "Verified showActivity.ts uses the month-snapped end for Quarterly. The developer chose to keep this behaviour rather than clamp to today. The click-through was not run in an app.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-008", "op": "ADD", "text": "'Download Snapshot' on reports uses `@zumer/snapdom`, which is a desktop-client devDependency. `snapdom.toPng(reportElement)` returns an image element, so the download link takes its URL from `image.src`, not from the element. This replaced html-to-image, which the developer reports failed silently in Firefox.", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportTopbar.tsx", "line": 77, "quote": "link.href = image.src;"}, {"kind": "source", "path": "packages/desktop-client/package.json", "line": 180, "quote": "\"@zumer/snapdom\": \"^3.7.0\","}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "1968406d-8b38-42a1-a4f2-f3631e7f9995", "quote": "snapdom's toPng gives you an img element, not a data url"}], "reason": "Verified at head in ReportTopbar.tsx and package.json. The Firefox cause is the developer's diagnosis and has not been reproduced in a browser. Unresolved: packages/desktop-client/package.json at head still lists html-to-image (line 190), so the removal claim in the session is not supported by the source, and this record does not say html-to-image was removed from package.json.", "agent": "tool-maintainer:recharts"}], "deferred": [{"target": "core/terminology.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Flow: a budgeted amount assigned to a category in one period, which sums across periods. Balance: a point-in-time amount such as leftover or carryover, which does not sum across periods.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "ad148268-d740-4ec9-a1b3-9e4d9fc7e309", "quote": "it's a flow so summing is fine"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "15ba8e06-fc9d-45fa-8ddd-1f1dc3627dd0", "quote": "what it reads is an amount, not a balance"}], "reason": "The developer used 'flow' once in passing and accepted summing. The formal definitions above are the assistant's inference from budgetDataQuery.ts, not a developer definition. Add only after the developer confirms the wording. Ownership of the term is unresolved, so it is not a record yet.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Open question: must every sync-server module import `fetch` from `undici` explicitly, never using the global `fetch`?", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "fe370a12-46b9-470c-8115-39752c432913", "quote": "the rule is that server code imports fetch from undici explicitly"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "be2af540-6678-4141-aaad-1ff9103a384b", "quote": "I can't confirm the rule you describe"}, {"kind": "source", "path": "packages/sync-server/src/app-cors-proxy.js", "line": 4, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/app-gocardless/services/gocardless-api.ts", "line": 2, "quote": "import { fetch } from 'undici';"}], "reason": "The developer asked the assistant to confirm this rule, and the assistant said no entry exists and that it cannot be enforced by lint. The developer then only asked to keep undici and never explicitly accepted the import rule. Source at head follows it in the SimpleFIN, CORS proxy, GoCardless and Enable Banking modules. Needs the developer's explicit decision before it becomes a standard.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Open question: which Node version should developers and CI use to run tests and tooling (Vitest, oxfmt, lage), and which constraint is the standard?", "scope": "app:actual", "evidence": [{"kind": "source", "path": ".nvmrc", "line": 1, "quote": "v24.22.1"}, {"kind": "source", "path": "package.json", "line": 130, "quote": "\"node\": \">=22.18.0\","}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "870bdb8d-a3b3-480a-a3a7-1aa7b77b9522", "quote": "The shell is on Node 18 and the repo needs 22 or newer, so Vitest won't start."}], "reason": "Three values exist: .nvmrc pins v24.22.1, the root engines say >=22.18.0, and the sync server says >=22.19.0. The sessions ran tests on Node 22.20 after the default shell's Node 18 failed. No developer decision on a team standard for development Node versions was found, so the record is left for review rather than choosing one.", "agent": "stack-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-103", "op": "NEEDS_REVIEW", "text": "| NAME-103 | React components are exported named functions in PascalCase files, for example `export function DonutGraph` in `DonutGraph.tsx`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx", "line": 50, "quote": "export function DonutGraph({"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/ActiveShapeDesktop.tsx", "line": 13, "quote": "export const ActiveShapeDesktop = ({"}, {"kind": "source", "path": "packages/desktop-client/src/components/budget/goals/editor/AmountAdjustment.tsx", "line": 37, "quote": "export const AmountAdjustment = ({"}], "reason": "The rule says 'exported named functions', and the example is `export function`. At head, the donut split's new components (ActiveShapeDesktop, and the moved ActiveShapeMobile) and AmountAdjustment are exported as `export const X = (...) =>`. This is a mixed form in the code, not a developer decision. No developer message addresses the export form, so the rule is not changed. Whether to keep the rule, widen it to cover both forms, or enforce one form is a decision for the developer. Only the three files above were checked; no repo-wide search was possible in this run, so the prevalence of each form is unknown.", "agent": "conventions-maintainer"}, {"target": "core/pitfalls.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Deferred candidate, not admitted: | Assigning the result of snapdom.toPng(element) directly to link.href | The download link is broken without an error, because toPng returns an img element, not a data URL | Use the returned image's src property as the href. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "1968406d-8b38-42a1-a4f2-f3631e7f9995", "quote": "snapdom's toPng gives you an img element, not a data url, and if you assign it straight to link.href"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/ReportTopbar.tsx", "quote": "link.href = image.src;"}], "reason": "Deferred: the remedy is at head, but the failure was stated by the developer and not reproduced by the session. Admit after a browser run or a check of the snapdom return type confirms the failure.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Deferred candidate, not admitted: | Sharing a vi.fn fetch mock across sync-server tests with mockImplementation | Recorded calls from earlier tests remain, so toHaveBeenCalledWith can pass on a call from another test | Call the mock's mockClear() in beforeEach. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "66a5de03-cd93-45da-a677-4b50369b0dea", "quote": "that doesn't clear recorded calls"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "66a5de03-cd93-45da-a677-4b50369b0dea", "quote": "I didn't check whether any assertion actually passed because of leftover calls"}], "reason": "Deferred: the mechanism is supported, but no false pass was shown, and the agent said it did not check whether any assertion relied on leftover calls. Admit only if a test failure or a false pass is shown. It is also general Vitest behavior, so it may belong in a test convention rather than a pitfall.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Deferred candidate, not admitted: | Using AmountInput with autoDecimals for a currency with no decimal places | Typed digits are read as cents, so the field shows the wrong value for yen | Skip autoDecimals when the currency has no decimals. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "a61b750f-6e91-4e01-bab3-d4130ee36301", "quote": "It reads typed digits as cents"}, {"kind": "source", "path": "packages/desktop-client/src/components/util/AmountInput.tsx", "line": 135, "quote": "if (autoDecimals && format.currency.decimalPlaces > 0) {"}], "reason": "Deferred: the session states two different wrong results (15.00 in the explanation, 0 in the guard test run). The consequence has to be pinned down first. The guard is present at head (line 135).", "agent": "pitfalls-maintainer"}], "rejected": [{"target": "core/terminology.md", "fact_id": "TERM-102", "op": "UPDATE", "text": "A currency amount stored as an integer scaled by 100, for every currency. For example, 1,500 yen is stored as 150000. A currency's decimal places affect only how an amount is displayed, never the stored value.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included"}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display"}, {"kind": "diff", "path": "diff/commits.txt", "quote": "Amounts are now always stored x100; a currency's decimal places only"}, {"kind": "source", "path": "packages/loot-core/src/shared/util.ts", "line": 540, "quote": "return Math.round(amount * 100);"}], "reason": "The developer decided storage is always x100 and decimals are display only. Commit fe186513 implements it: amountToInteger and integerToAmount take no decimal-places argument and always scale by 100. The current text ('the multiplier depends on the currency's decimal places') is contradicted by the source and the developer, so it is replaced. The ID is kept.", "agent": "terminology-maintainer", "rejected_because": "diff/commits.txt is not part of the diff"}, {"target": "tools/recharts/README.md", "fact_id": null, "op": "UPDATE", "text": "Use [tool maintenance guidance](../../maintenance/tools.md). Shared definitions belong in [core](../../core/terminology.md) when their scope warrants it.", "scope": "tool:recharts", "evidence": [{"kind": "source", "path": "kb/maintenance/tools.md", "quote": "# Maintaining Tool Knowledge"}], "reason": "The navigation link points to ../../maintenance/products.md, which does not exist in the baseline KB (maintenance/ holds core.md and tools.md only). The tool guidance is maintenance/tools.md. Navigation only; no fact changes. Frontmatter is untouched.", "agent": "tool-maintainer:recharts", "rejected_because": "kb/maintenance/tools.md does not exist at da724d4"}], "no_change": 1, "failures": [], "forks_share_prefix": true}, "b-haiku": {"wall_seconds": 255.1, "exit_code": 0, "ok": true, "cost": 0.47251130999999996, "duration_s": 540.239, "agents": [{"label": "terminology-maintainer", "status": "success", "cost": 0.1028673, "turns": 21, "ms": 53292, "inputTokens": 2176, "outputTokens": 10581, "cacheReadInputTokens": 445636, "cacheCreationInputTokens": 105198}, {"label": "stack-maintainer", "status": "success", "cost": 0.01767233, "turns": 23, "ms": 53752, "inputTokens": 2145, "outputTokens": 11462, "cacheReadInputTokens": 173863, "cacheCreationInputTokens": 49941}, {"label": "conventions-maintainer", "status": "success", "cost": 0.14924768, "turns": 21, "ms": 69847, "inputTokens": 2118, "outputTokens": 14690, "cacheReadInputTokens": 377928, "cacheCreationInputTokens": 107761}, {"label": "tool-maintainer:recharts", "status": "success", "cost": 0.015939130000000003, "turns": 33, "ms": 63734, "inputTokens": 2253, "outputTokens": 14118, "cacheReadInputTokens": 260863, "cacheCreationInputTokens": 30231}, {"label": "pitfalls-maintainer", "status": "success", "cost": 0.13164246, "turns": 27, "ms": 109146, "inputTokens": 2023, "outputTokens": 23141, "cacheReadInputTokens": 816766, "cacheCreationInputTokens": 116297}, {"label": "tool-maintainer:bank-sync", "status": "success", "cost": 0.03589684, "turns": 37, "ms": 127883, "inputTokens": 2263, "outputTokens": 27968, "cacheReadInputTokens": 584134, "cacheCreationInputTokens": 79226}, {"label": "cartographer", "status": "success", "cost": 0.0028727500000000003, "turns": 5, "ms": 6298, "inputTokens": 1443, "outputTokens": 1487, "cacheReadInputTokens": 12855, "cacheCreationInputTokens": 9282}, {"label": "writer", "status": "success", "cost": 0.016372820000000003, "turns": 25, "ms": 56287, "inputTokens": 1380, "outputTokens": 13184, "cacheReadInputTokens": 345102, "cacheCreationInputTokens": 30959}], "tokens": {"inputTokens": 15801, "outputTokens": 116631, "cacheReadInputTokens": 3017147, "cacheCreationInputTokens": 528895}, "accepted": [{"target": "core/terminology.md", "fact_id": "TERM-102", "op": "UPDATE", "text": "| TERM-102 | Amount | A currency amount stored as an integer scaled by 100 (the value times 100), for every currency. A currency's decimal places affect display only and never the stored scale, so 1,500 yen is stored as 150000. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included. 1500 yen is 150000 in the db. the currency decimals are display only."}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display."}, {"kind": "source", "path": "packages/loot-core/src/shared/util.ts", "line": 537, "quote": "Amounts are always stored multiplied by 100, for every currency."}], "reason": "The current TERM-102 says the multiplier depends on the currency's decimal places. The developer explicitly reversed that in session de720aee (the later message overrides the earlier proposal to store currency-scaled values). Head source shows amountToInteger always multiplies by 100 with no decimalPlaces argument, so the old definition is obsolete. Scope stays app:actual.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-106", "op": "UPDATE", "text": "| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, Quarterly, or Yearly. Monthly is the default. A Quarterly period is keyed by its first month (see TERM-107). | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportOptions.ts", "line": 286, "quote": "key: 'Quarterly',"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "use the first month so q3 2026 is 2026-07, and label it Q3 '26"}], "reason": "A Quarterly interval was added at head (ReportOptions.ts defines key 'Quarterly'), and the developer accepted it in session f57650bf. The existing list of Daily, Weekly, Monthly, Yearly is now incomplete. Monthly remains the default; I did not find a change to that default in the evidence.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-107", "op": "ADD", "text": "| TERM-107 | Quarter key | The identifier of a calendar quarter in custom reports: the quarter's first month in YYYY-MM form, so Q3 2026 is 2026-07. The UI labels it Q3 '26. Quarterly reports query by month and roll the months up into quarters on the client, with no AQL change. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "use the first month so q3 2026 is 2026-07, and label it Q3 '26"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "client-side rollup sounds right, same as weekly. no aql changes."}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "ad39eae0-2f88-47a4-80ed-611998cf7da6", "quote": "glad you went with the first month key"}], "reason": "The developer gave an explicit definition of the quarter key and confirmed it after the implementation. No existing term covers quarter identifiers. The concept is application-scoped (custom reports in Actual), so it is recorded as app:actual rather than shared vocabulary.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-104", "op": "UPDATE", "text": "| STACK-104 | The sync server runs on Express 5 and Node 22.19.0 or newer (`\"node\": \">=22.19.0\"` in its package manifest). It is mostly JavaScript and moving to TypeScript. | requirement | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/package.json", "line": 132, "quote": "\"node\": \">=22.19.0\""}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "56238ec1-3d78-4ec3-9516-6ffe31efe243", "quote": "please keep it at >=22.19.0 and don't revert it"}], "reason": "The sync-server engines floor is now >=22.19.0 at head, replacing >=22. The developer explicitly asked to keep 22.19.0 and to leave the root floor (>=22.18.0) alone, so the two floors differ by design. The developer could not recall the exact reason for 22.19.0 and the agent found no dependency or Node bug that requires it; the rationale is unverified, so the scope stays app:actual sync-server. Express 5 and the TypeScript migration note are unchanged.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-107", "op": "ADD", "text": "| STACK-107 | Sync server HTTP requests use `fetch` imported from `undici` in every module, so the dispatcher and fetch come from the same undici version. Do not add another HTTP client library (such as axios or node-fetch) to the sync server. | requirement | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "I don't want another HTTP library on the server, and undici is what Node ships anyway. Please keep it on undici."}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/package.json", "line": 109, "quote": "\"undici\": \"^8.12.3\""}], "reason": "The developer gave an explicit directive to keep sync server HTTP on undici and to add no other HTTP library. The source at head imports fetch from undici in SimpleFIN, and undici ^8.12.3 is a sync-server dependency. Scope is app:actual, limited to the sync server, because the developer's statement is about the server; the desktop client is not covered. The developer's rationale that undici is what Node ships is partly inaccurate (the code uses the installed undici package, not Node's built-in fetch), which is noted but does not change the rule. The no-bare-fetch rule is not enforced by lint and is only a convention.", "agent": "stack-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-001", "op": "ADD", "text": "| PIT-001 | Custom report date picker: the From date and a To date fall in the same month, quarter or year (Monthly, Quarterly or Yearly). | validateEnd compares the stored From date (a full YYYY-MM-DD date) with the bare period key of To as strings. The bare key sorts before the full date, so the range looks reversed, and From is replaced by the fallback range. | Compare against the normalized end date that validateEnd computes (month end, quarter end or Dec 31), as reportRanges.ts does. Keep same-period cases in reportRanges.test.ts. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "e54dbbc6-f221-45f3-ac39-b0a483796e71", "quote": "compared the stored From date ('2026-07-01') with the raw To pick ('2026-07')"}, {"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "388f0e98-3ec0-4040-9ec8-5ce1a29631e4", "quote": "all failed on the old code and passed again once I restored the fix"}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "d4160a62-17f6-440a-832f-776fe4ed33a7", "quote": "Monthly does the same: From and To both July 2016 became 2016-02-02 to 2016-07-31."}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 101, "quote": "if (start > dateEnd) {"}], "reason": "Trigger, consequence and remedy are supported: the developer traced the cause, the new same-period tests fail on the old code (stash check in the session), and head source compares against dateEnd (lines 99-101). The same flaw existed for Monthly before the Quarterly work, so the entry is not Quarterly-specific. Scope is app:actual because it is this app's picker logic.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-002", "op": "ADD", "text": "| PIT-002 | Amount storage or conversion uses a currency's decimalPlaces as the scale, for example through useFormat, or by passing currency.decimalPlaces to amountToInteger or integerToAmount, for a zero-decimal currency such as JPY. | Stored amounts end up on different scales. A 1,500 yen budget showed as 15 on one screen and 150,000 on another. | Store every amount at x100 with amountToInteger and integerToAmount, which take no scale argument. Use the currency's decimal places only for display formatting. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included"}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display"}, {"kind": "source", "path": "packages/loot-core/src/shared/util.ts", "line": 540, "quote": "return Math.round(amount * 100);"}], "reason": "The user-reported symptom (1,500 yen shows as 15 and 150,000) and the developer's rule are both in the session. Head source shows amountToInteger fixed at x100 with no decimal argument. The developer stated the rule as a standard for this app, so scope is app:actual. Not generalized to other apps.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-003", "op": "ADD", "text": "| PIT-003 | On the account page, a search is active and the user toggles 'show reconciled transactions'. | The toggle refetches with only the filter conditions. The refetch replaces the search query, so the search text stays in the box but the list shows unfiltered transactions. | After any refetch that rebuilds the query, call this.onSearch(this.state.search) when search text is non-empty, as the toggle-reconciled case in Account.tsx does. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "6866729d-4758-475d-ab89-f59a2f88a398", "message": "90d6562c-d472-46b7-b8e1-fe790d9fbb6f", "quote": "the list stops being filtered by it, so you see everything again"}, {"kind": "conversation", "session": "6866729d-4758-475d-ab89-f59a2f88a398", "message": "feec3946-1748-42bf-8af9-1402ff7fae8a", "quote": "The refetch replaces the query that `onSearch` had set, so the list went back to unfiltered while `state.search` still held the text."}, {"kind": "source", "path": "packages/desktop-client/src/components/accounts/Account.tsx", "line": 970, "quote": "this.onSearch(this.state.search);"}], "reason": "Symptom comes from the reporter via the developer. Cause and remedy are supported by head source: toggle-reconciled re-runs onSearch when search is set (lines 962-976), and other refetch handlers call onSearch too. Not verified in a running app; the developer planned a manual check, so the entry describes the code-level remedy only. Sort and filter survival after the toggle is only read from code and is not admitted here.", "agent": "pitfalls-maintainer"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-003", "op": "ADD", "text": "| BANKSYNC-003 | SimpleFIN calls import `fetch` from `undici` and pass the SSRF dispatcher from `createSsrfDispatcher` on every request. The dispatcher is an undici `Agent`, so it must be used with undici's `fetch`, not Node's global `fetch`, which bundles a different undici version. Keep bank sync HTTP calls on undici; the developer decided not to add another HTTP client. The link between this change and the reported SimpleFIN failure is unconfirmed. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 20, "quote": "const dispatcher = createSsrfDispatcher(networkOptions);"}, {"kind": "diff", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "quote": "+import { fetch } from 'undici';"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "46e121ba-3093-4147-8d95-0e5f5dd8bf49", "quote": "SimpleFIN passed an undici v8 Agent as the dispatcher to Node's built-in"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "I don't want another HTTP library on the server, and undici is what Node ships anyway."}], "reason": "Session 70de19bb: the developer asked for SimpleFIN and the sync server to move to undici, and the commit 567f1496 gives the dispatcher mismatch as the reason. Source at head confirms the undici import and the dispatcher passed to every SimpleFIN fetch. The assistant's cause was a hypothesis the developer accepted without reproduction, so the text marks the link as unconfirmed. Scope app:actual because the dispatcher is this application's SSRF guard.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-004", "op": "ADD", "text": "| BANKSYNC-004 | SimpleFIN account requests set `redirect: 'manual'` and follow redirects themselves. Each hop is checked with `assertUrlAllowed`, at most 5 redirects are followed, and the `Authorization` header is removed when a redirect leaves the original origin. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 505, "quote": "redirect: 'manual',"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 519, "quote": "delete headers.Authorization;"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 500, "quote": "await assertUrlAllowed(currentUrl, networkOptions);"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "Please keep it on undici."}], "reason": "Implemented behaviour verified in app-simplefin.js accountsRequest loop (lines 491-522). The same-origin redirect case is covered by packages/sync-server/src/app-simplefin/integration.test.ts, which the developer asked for in session 70de19bb. The conversation quote is only supporting context for the test addition; the behaviour itself is from source.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-005", "op": "ADD", "text": "| BANKSYNC-005 | A SimpleFIN setup token is a base64-encoded claim URL that must use `http:` or `https:`. The claim `POST` does not follow redirects. A claim response of 403 is treated as an invalid token; other non-OK claim responses are reported as `SERVER_DOWN`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 412, "quote": "// don't auto-follow redirects for SSRF safety"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 419, "quote": "if (!response.ok && response.status !== 403) {"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 402, "quote": "if (url.protocol !== 'https:' && url.protocol !== 'http:') {"}], "reason": "Behaviour verified in decodeClaimUrl (lines 392-407) and claimAccessKey (lines 409-424). Not discussed in the conversation; recorded because it is a supported usage constraint of the SimpleFIN setup flow in this application.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-006", "op": "ADD", "text": "| BANKSYNC-006 | SimpleFIN requests have no timeout in the sync server. A bridge that never answers can hold a sync until undici's default header timeout (300 seconds). Enable Banking aborts its requests after 30 seconds (`REQUEST_TIMEOUT_MS`). A SimpleFIN timeout is not yet added; the developer chose to keep it out of the undici change. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "a48fd694-1203-40d3-9213-a24461ec1c11", "quote": "sets no request timeout of its own, and undici's default header timeout is 300 seconds"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "2c0ff959-c6c0-45f2-8c86-41040b54c3bf", "quote": "The SimpleFIN timeout is a separate thing and I'd rather not widen this change."}, {"kind": "source", "path": "packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts", "line": 125, "quote": "const REQUEST_TIMEOUT_MS = 30_000; // 30 seconds"}], "reason": "Absence of a timeout in app-simplefin.js was confirmed by reading the whole file at head. The 300-second figure is the assistant's statement about undici's default and was not checked against the undici package in this run, so the text attributes it to undici's default. The developer explicitly deferred the timeout, so it is recorded as an open gap, not a requirement.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-007", "op": "ADD", "text": "| BANKSYNC-007 | `app-simplefin/integration.test.ts` mocks only the config. It starts a local HTTP server on 127.0.0.1 with port 0 and allows `127.0.0.0/8` through `simplefinAllowedNetworks`, so it runs the real undici `fetch` and SSRF dispatcher. The mocked SimpleFIN tests do not exercise the dispatcher, so keep this test when changing SimpleFIN request code. Vitest's 5-second test timeout bounds a server that never answers. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 45, "quote": "server.listen(0, '127.0.0.1');"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 31, "quote": "allowedNetworks.push('127.0.0.0/8');"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "a48fd694-1203-40d3-9213-a24461ec1c11", "quote": "What bounds the test is Vitest's default 5-second test timeout."}], "reason": "The test exists at head and matches the developer's request in session 70de19bb. The 5-second bound was observed by the assistant in a temporary copy, not rerun in this maintenance pass. Recorded as a test pattern for SimpleFIN request changes.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-003", "op": "ADD", "text": "| RECHARTS-003 | The donut report graph is split across files in `components/reports/graphs/`: `DonutGraph.tsx` holds the graph component, `donutColors.ts` exports `buildColorMap`, `donutDimensions.ts` exports `getDonutDimensions`, `donutLabel.ts` exports `customLabel` (the Recharts pie label renderer), `activeShapeProps.ts` defines the `ActiveShapeProps` type, and `ActiveShapeDesktop.tsx` and `ActiveShapeMobile.tsx` render the active slice. Put new donut helpers in these files rather than back in `DonutGraph.tsx`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx", "line": 20, "quote": "import { customLabel } from './donutLabel';"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/donutLabel.ts", "line": 20, "quote": "export const customLabel = (labelProps: PieLabelRenderProps) => {"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "021a25d8-4026-46d1-88de-70cd454e0209", "quote": "can you split it up so the file is basically just the graph and the rest lives elsewhere?"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/graphs/donutLabel.ts", "quote": "+export const customLabel = (labelProps: PieLabelRenderProps) => {"}], "reason": "Split was requested by the developer and is implemented at head: the new files exist in graphs/ and DonutGraph.tsx imports from them. The file list is verified from source. Application scope only, since this is one app's report layout.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-004", "op": "ADD", "text": "| RECHARTS-004 | Recharts types pie label and sector props with many fields optional, although it always supplies them for pie slices. In `donutLabel.ts`, `customLabel` casts `PieLabelRenderProps` to a local type with those fields required, and a comment explains why. The team chose this over null checks, which would change runtime behaviour. Use the same pattern for new pie label code. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/donutLabel.ts", "line": 9, "quote": "// Recharts types these as optional, but always supplies them for pie sectors."}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/donutLabel.ts", "line": 21, "quote": "const props = labelProps as DonutLabelProps;"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "9515ef78-5349-40d5-b411-3de7d6d8c1d2", "quote": "I chose that over null-handling inside the function, which would have changed runtime behaviour."}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "8ca78605-2cd9-458c-9869-21b53e313a9e", "quote": "ok good, release notes are fine"}], "reason": "The pattern is implemented at head in donutLabel.ts. The assistant proposed it with that rationale, and the developer reviewed the result without requesting a change to the types. The developer did not explicitly approve the typing approach in those words, so this rests on review plus implementation. Scope kept to this app. Unrelated to the Recharts version, so it is a usage convention rather than a tool-wide rule.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-005", "op": "ADD", "text": "| RECHARTS-005 | Known weak spot: `DonutGraph.tsx` passes Recharts sector props into `ActiveShapeProps` through six `props as unknown as ActiveShapeProps` casts. The compiler does not check these props, so a change in Recharts' sector props would not be caught there. This was left unchanged on purpose as a follow-up. A stricter option is to build the props explicitly from Recharts' `PieSectorShapeProps`. `DonutGraph.tsx` still has `// @ts-strict-ignore`; the new donut files do not. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx", "line": 169, "quote": "{...(props as unknown as ActiveShapeProps)}"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/DonutGraph.tsx", "line": 1, "quote": "// @ts-strict-ignore"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "ed08aa42-5143-4a2f-ac62-fa3b279a10cd", "quote": "leave the six `as unknown as` casts alone, that's a follow-up for another day"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "0b508cf3-3aeb-4817-ba3e-56ba5ed6837f", "quote": "Only `donutLabel.ts` ever had it, and it's gone now."}], "reason": "Verified six casts at head (lines 169, 178, 251, 260, 346, 355) and the file-level ts-strict-ignore. The developer explicitly deferred the cast cleanup. Recorded as a known pitfall with scope app:actual.", "agent": "tool-maintainer:recharts"}], "deferred": [{"target": "core/naming-conventions.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "In `packages/desktop-client/src/components/reports/graphs`, React component modules are PascalCase files (`ActiveShapeMobile.tsx`, `ActiveShapeDesktop.tsx`) and non-component helper modules are camelCase files (`donutColors.ts`, `donutDimensions.ts`, `donutLabel.ts`, `activeShapeProps.ts`).", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "6d99f24a-b085-4a98-9ccf-2d2c5690d126", "quote": "the label, colors and dimensions files are fine as you have them"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "3890051c-0d5e-4ba9-9216-972258463e80", "quote": "`DonutActiveShapes.tsx` is PascalCase because it exports components (per the team's naming note). The other three are camelCase because they export plain functions"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/graphs/renderCustomLabel.tsx", "quote": "renderCustomLabel.tsx"}], "reason": "The developer accepted these specific file names in the donut split, but did not state a general file-naming rule. The assistant's basis was a team naming note outside this bundle, which this run cannot verify. The graphs folder has a camelCase .tsx file that returns JSX (renderCustomLabel.tsx), so the pattern is not clean. The developer should confirm whether this is a rule for app:actual before any entry is added. Not added as a convention yet.", "agent": "conventions-maintainer"}, {"target": "core/pitfalls.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Candidate, not admitted: SimpleFIN bank sync stopped working for some users on a recent nightly . They include the budget templates, rules, transaction sync, CSV export/import, the YNAB4 importer, the goal editors, the transaction tables and the bank-sync modules.\n\nFor a JPY user, a value saved as `1500` through the `useFormat` path displays as `15` through a default-2 path (1500/100). A value saved through a default-2 path as `150000` shows up as `150,000` in `useFormat`. That matches the report.\n\n**Direction**\n\n- **A. Always store \u00d7100.** This is simple and leaves 2-decimal currencies untouched. It would remove the currency-aware logic in `useFormat`. Existing JPY and KRW data written through the currency-aware path would need a migration, and it contradicts TERM-102 in the knowledge base.\n- **B. Always store \u00d710^decimalPlaces.** This matches TERM-102 and what `useFormat` already does. It means threading the currency through the ~150 call sites and removing the silent `= 2` defaults. Existing data written through the default-2 path would need a migration, and all zero-decimal currencies would be affected. Data for 2-decimal currencies stays valid.\n\nI recommend B, but only if the currency-aware path is what most existing JPY users' data went through. If it's mostly default-2 data, then A causes less breakage. Which do you want, and do you know which scale the affected users' stored data is in? A budget or two from the reporter would settle it.\n\nOnce you pick, I'll make the defaults throw or require a currency, and I'll add tests for JPY and KRW.", "tools": ["[Read] <workspace>/kb/actual/dev/index.md", "[Read] <workspace>/kb/actual/dev/core/pitfalls.md", "[Read] <workspace>/kb/actual/dev/core/terminology.md", "[Read] <workspace>/kb/actual/dev/core/tech-stack-standards.md", "[Read] <workspace>/kb/actual/dev/core/naming-conventions.md", "[Grep] <workspace>/apps/actual/packages/loot-core/src/shared", "[Grep] <workspace>/apps/actual/packages/loot-core/src/shared/util.ts", "[Grep] <workspace>/apps/actual/packages/loot-core/src/shared/currencies.ts", "[Read] <workspace>/apps/actual/packages/loot-core/src/shared/util.ts", "[Grep] <workspace>/apps/actual/packages", "[Grep] <workspace>/apps/actual/packages", "[Read] <workspace>/apps/actual/packages/desktop-client/src/hooks/useFormat.ts", "[Grep] <workspace>/apps/actual/packages"], "user": null}, {"role": "dev", "text": "hm no, it's A. storage is always x100, yen included. 1500 yen is 150000 in the db. the currency decimals are display only. so useFormat and the currency-aware bits in util are the buggy ones, not the default-2 callers. no migration needed, the real data is already x100. (i briefly wondered about storing yen with zero implied decimals and special casing display, but no, one stored scale for everyone)", "turn": 2, "at": "2026-11-05T17:42:02.619432+00:00", "marks": ["P1-E1"]}, {"role": "agent", "at": "2026-11-05T17:53:30.161304+00:00", "text": "Understood: storage is always \u00d7100 and `decimalPlaces` only affects display. I'll find every place that uses it as a storage scale.\n\nUpdating the tests to the new storage contract (JPY 150000 displays as \u00a51,500).\n\nCore callers are fixed. Next I'm checking the user-facing `INTEGER_TO_AMOUNT` formula, which exposes a second `decimalPlaces` argument, before moving on to the desktop-client callers.\n\n`normalizeIntegerValue` and its callers pass `decimalPlaces` as a scale too, so I'm removing it there as well.\n\nThe only remaining type error is a missing `html-to-image` module in `ReportTopbar.tsx`, which I haven't touched. Now the tests and lint.\n\nThe shell is on Node 18 and the repo needs 22 or newer, so Vitest won't start. I'll look for a newer Node.\n\nThe remaining failures are all in `category-template-context.test.ts`, which encodes the old currency-scaled behaviour for JPY. I'll look at them.\n\nMy earlier `prettier --write` calls did nothing because that script doesn't exist, so the files are unformatted. I'll find the repo's actual formatter and linter.\n\nLint found leftovers where the currency is no longer needed. I'll clean those up.\n\n`currencyCode` threads through three public handlers (`coverOverspending` and two others) and their client callers. I'll count the callers before deciding how far to cascade the removal.\n\nThe remaining `decimalPlaces` uses are all display formatting. I'll check that the two `parse-file` charset failures are not caused by my change.\n\nAmounts are now stored \u00d7100 for every currency, and `decimalPlaces` only controls display. \u00a51,500 is `150000` in storage and shows as `\u00a51,500`. Tests pass in `desktop-client` (1403) and `loot-core` (1367). Lint is clean. Typecheck has one error, a missing `html-to-image` module in `ReportTopbar.tsx`, which I didn't touch.\n\n## What changed\n\n- **`loot-core/src/shared/util.ts`:**\n  - `amountToInteger`, `integerToAmount` and `integerToCurrency` no longer take a `decimalPlaces` argument and always use 100.\n  - `integerToCurrencyWithDecimal(amount, code)` divides by 100 and uses the currency's decimals only for the fraction digits.\n  - I removed `amountToCurrencyInteger`, which duplicated `amountToInteger` once the scale was fixed.\n- **`useFormat`:** `toAmount`, `fromAmount`, `forEdit` and `fromEdit` use \u00d7100.\n- **Other callers:** I removed `currency.decimalPlaces` from about 30 call sites. They were in the goal editors, the budget goal helpers (`getGoalDifference`, `makeBalanceAmountStyle`, `normalizeIntegerValue`) and the `useFormulaExecution` hook. The server side was `category-template-context`, `schedule-template` and the movement notes in `actions.ts`.\n- **Tests:** I rewrote the JPY and IRR cases around \u00d7100 storage, including `150000` showing as `1,500`. That covered `util.test.ts`, `components/budget/util.test.ts` and the JPY block in `category-template-context.test.ts`.\n\n## Left as is\n\n- **`INTEGER_TO_AMOUNT` formula:** its optional second argument is still accepted so saved formulas keep working, but it's now ignored (commented in the global fetch the sync server uses in a few places. Could we get the server code onto undici instead? I'm not totally sure where all the fetch calls live, sorry, could you have a look around?", "turn": 1, "at": "2026-11-05T18:01:24.843838+00:00", "marks": ["P2-E2"]}, {"role": "agent", "at": "2026-11-05T18:05:05.792210+00:00", "text": "Undici is already a dependency. Let me look at the actual call sites.\n\nSource edits are done; now I'm updating the tests that mocked global `fetch` so they mock `undici`'s `fetch` instead.\n\nFixing the remaining Enable Banking tests and the type errors now.\n\nUse undici's own `Response`/`RequestInit` types and constructor so everything matches.\n\nThe sync server now uses undici's `fetch` everywhere. I haven't confirmed this fixes the SimpleFIN report, and nothing is committed. The sync-server tests pass (764/764) and lint is clean. `yarn typecheck` fails on one error: `html-to-image` can't be found in `ReportTopbar.tsx`, which is in `desktop-client`, not in anything I changed.\n\n**Likely cause:** SimpleFIN is the only code that passes a `dispatcher` to `fetch`. That dispatcher is an `Agent` from the installed `undici@8.12.3`, but the call was to Node's built-in global `fetch`, which bundles its own, different undici version. Mixing the two is fragile, and the SSRF guard in `util/ssrf.ts` depends on that dispatcher, so a Node or undici version change can break the sync. This is my best guess. I haven't reproduced the user's failure.\n\n**Where the fetch calls were** (all under `packages/sync-server/src`):\n- `app-simplefin/app-simplefin.js` has two calls, the claim `POST` and the redirect-following accounts `GET`. Both pass the dispatcher.\n- `app-cors-proxy.js` has two calls, the plugin allowlist and the proxy request.\n- `app-enablebanking/services/enablebanking-service.ts` and `app-gocardless/services/gocardless-api.ts` have one call each.\n- `scripts/health-check.ts` has one call.\n\nEach file now has `import { fetch } from 'undici'`, and I didn't change any other source logic. In `enablebanking-service.ts` I also import undici's `RequestInit` and `Response` types so they match.\n\n**Tests:** they were stubbing `global.fetch`, which no longer affects the code, so I changed them to mock `undici`'s `fetch` instead. That touched seven test files across SimpleFIN, the CORS proxy, Enable Banking and sensitive-logging.\n\n**Environment:** the default shell here uses Node 18, which can't run Vitest. I ran everything on Node 22.20 from nvm, and the server requires Node 22 or newer. If the user reporting the problem is on an older Node, that could also explain the breakage.\n\nI didn't add a release-notes entry. If this repo needs one, I can add it.", "tools": ["[Read] <workspace>/kb/actual/dev/index.md", "[Grep] <workspace>/apps/actual/packages/sync-server", "[Read] <workspace>/kb/actual/dev/core/tech-stack-standards.md", "[Read] <workspace>/kb/actual/dev/core/pitfalls.md", "[Read] <workspace>/kb/actual/dev/products/bank-sync/README.md", "[Read] <workspace>/apps/actual/packages/sync-server/src/util/ssrf.ts", "[Bash] cd <workspace>/apps/actual/packages/sync-server/src && sed -n 1,20p app-simplefin/app-simplefin.js && sed -n 395,560p app-simplefi", "[Bash] cd <workspace>/apps/actual/packages/sync-server && grep -rnE \"dispatcher|from 'undici'|fetch\" src --include=*.js --include=*.ts | ", "[Bash] grep -rnE \"stubGlobal|global\\.fetch|globalThis\\.fetch|vi\\.mock\\('undici|spyOn\\(.*fetch|fetch\" src --include=\"*.test.*\" -l; sed -n 1,30p src/scripts/health-check", "[Bash] grep -nE \"fetch\" src/util/sensitive-logging.test.ts src/app-simplefin/app-simplefin.test.js src/app-simplefin/ssrf.test.ts src/app-cors-proxy.test.js | head -50", "[Bash] cd <workspace>/apps/actual/packages/sync-server/src && python3 - <<'EOF' import re def sub(path, old, new):     s=open(path).read(", "[Bash] sed -n 1,19p app-simplefin/app-simplefin.test.js; grep -n \"global\\|beforeEach\\|afterEach\\|restoreAllMocks\\|resetAl
