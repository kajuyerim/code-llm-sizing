te": "The key is looked up, not trusted."}, {"kind": "source", "path": "config/initializers/rack_attack.rb", "line": 13, "quote": "ApiKey.find_by_value(request.get_header(\"HTTP_X_API_KEY\")).present?"}], "reason": "The developer asked about header-only, the agent analysed the routes and explained the hole, and the developer accepted it explicitly. Source implements the lookup. The claim that the auth routes sit under /api/ and skip authentication came from the agent's route inspection, which is not visible in the pack.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-003", "op": "ADD", "text": "| PIT-003 | Running the migration `20261105130000_add_components_to_balances` without then running `data_migration:migrate_balance_components`, while `Account::DailyActivity` already reads the stored columns | The new component columns default to 0, so existing `balances` rows show zero components (and the generated `end_*` columns show 0) until backfilled. The activity feed would show zeros. Adding stored generated columns also rewrites the whole `balances` table under an exclusive lock. | Run the migration, then the `data_migration:migrate_balance_components` rake task, before shipping the `DailyActivity` change. The task skips rows whose recalculated balance differs from the stored one, and the next sync of that account fixes those. Check the table size before migrating in production. Do not hand-edit the `schema.rb` version. Regenerate it with `db:migrate`. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "34a28aa6-e09d-4913-bf7f-c55ee6c14bd3", "quote": "Existing balances will all be zero after the migration, so that task is what fixes them."}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "0322360d-1799-41a6-8fe1-7af0e660ac5d", "quote": "Between the migration and the task finishing, the feed shows zeros"}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 167, "quote": "task migrate_balance_components: :environment do"}], "reason": "The developer stated the zero-state themselves and said they will handle deploy order. The task exists at head. The failure is predicted from the design and has not been observed, since nothing was run. The lock claim is the agent's, not confirmed by the developer, so it is hedged.", "agent": "pitfalls-maintainer"}, {"target": "tools/viewcomponent/README.md", "fact_id": "VIEWCOMPONENT-004", "op": "ADD", "text": "| VIEWCOMPONENT-004 | Components are split by namespace: generic design system pieces live in `app/components/DS/` as `DS::Button`, `DS::Menu`, `DS::Tooltip` (no `Component` suffix; files `button.rb` and `button.html.erb`), and app-specific components live in `app/components/UI/` (for example `UI::Account::ActivityFeed`). `DS` classes inherit `DesignSystemComponent`, which inherits `ApplicationComponent < ViewComponent::Base`; `UI` classes inherit `ApplicationComponent`. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "db86541d-a11e-4972-872f-0ad2053e948c", "quote": "lets drop the Component suffix, DS::Button reads way better"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "3fdab1f5-ea1f-4c8a-b9dd-15b136f74270", "quote": "give them their own base, DesignSystemComponent, and the UI stuff keeps ApplicationComponent"}, {"kind": "conversation", "session": "25a4eecd-b0f6-4c33-9b3b-727281d68e17", "message": "62bf1951-934a-4d5d-a950-beb04edeb7d0", "quote": "UI::Account::ActivityFeed for the list and UI::Account::ActivityDate for one day"}, {"kind": "source", "path": "app/components/design_system_component.rb", "line": 1, "quote": "class DesignSystemComponent < ApplicationComponent"}], "reason": "Developer decided the namespace split, suffix drop and base classes; source at head matches. Supersedes the flat *Component convention that core NAME-101 states (see handoff).", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": "VIEWCOMPONENT-005", "op": "ADD", "text": "| VIEWCOMPONENT-005 | The `DS` and `UI` folders map to Zeitwerk modules through `inflect.acronym \"DS\"` and `inflect.acronym \"UI\"` in `config/initializers/inflections.rb`. Lookbook preview folders stay lowercase (`test/components/previews/ds/`). | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/initializers/inflections.rb", "line": 19, "quote": "inflect.acronym \"DS\""}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "108fa345-7272-4f98-b1ca-c6165408f28a", "quote": "fine on previews, lowercase is ok, leave them and the inflection"}], "reason": "Developer accepted lowercase previews and keeping the inflection; both acronyms present in source.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": "VIEWCOMPONENT-006", "op": "ADD", "text": "| VIEWCOMPONENT-006 | Component Stimulus controllers in `app/components/DS/` are pinned with `pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\"`. `under:` sets the Stimulus identifier (so `dialog_controller.js` stays `dialog`); `to:` is the asset path under the `app/components` asset root and must include `DS`, otherwise the controllers 404 silently. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/importmap.rb", "line": 8, "quote": "pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\""}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "0871bd83-9d58-4e9d-b0df-4867c1ebfd26", "quote": "would point at `dialog_controller.js` where nothing exists"}], "reason": "Pitfall found and fixed in session, developer confirmed it lines up; source matches. Not browser-verified by the agent.", "agent": "tool-maintainer:viewcomponent"}], "deferred": [], "rejected": [], "no_change": 1, "failures": []}, "a-haiku": {"wall_seconds": 778.6, "exit_code": 0, "ok": true, "cost": 1.3189729700000001, "duration_s": 1034.138, "agents": [{"label": "sweeper", "status": "success", "cost": 0.4444203, "turns": 75, "ms": 418122, "inputTokens": 2234, "outputTokens": 94964, "cacheReadInputTokens": 1973458, "cacheCreationInputTokens": 199167}, {"label": "stack-maintainer", "status": "success", "cost": 0.09008695, "turns": 5, "ms": 53028, "inputTokens": 4, "outputTokens": 11591, "cacheReadInputTokens": 441889, "cacheCreationInputTokens": 39013}, {"label": "terminology-maintainer", "status": "success", "cost": 0.09122430000000004, "turns": 5, "ms": 57028, "inputTokens": 4, "outputTokens": 13041, "cacheReadInputTokens": 441916, "cacheCreationInputTokens": 36524}, {"label": "conventions-maintainer", "status": "success", "cost": 0.11887895000000004, "turns": 7, "ms": 64326, "inputTokens": 6, "outputTokens": 15408, "cacheReadInputTokens": 684219, "cacheCreationInputTokens": 46145}, {"label": "tool-maintainer:plaid", "status": "success", "cost": 0.17123355000000007, "turns": 12, "ms": 69426, "inputTokens": 14, "outputTokens": 14488, "cacheReadInputTokens": 1672391, "cacheCreationInputTokens": 51387}, {"label": "tool-maintainer:viewcomponent", "status": "success", "cost": 0.11790120000000004, "turns": 7, "ms": 76331, "inputTokens": 6, "outputTokens": 17585, "cacheReadInputTokens": 682734, "cacheCreationInputTokens": 39799}, {"label": "pitfalls-maintainer", "status": "success", "cost": 0.25632685, "turns": 13, "ms": 194991, "inputTokens": 12, "outputTokens": 46534, "cacheReadInputTokens": 1441717, "cacheCreationInputTokens": 67900}, {"label": "writer", "status": "success", "cost": 0.02890087, "turns": 25, "ms": 100886, "inputTokens": 1384, "outputTokens": 25158, "cacheReadInputTokens": 539447, "cacheCreationInputTokens": 53945}], "tokens": {"inputTokens": 3664, "outputTokens": 238769, "cacheReadInputTokens": 7877771, "cacheCreationInputTokens": 533880}, "accepted": [{"target": "core/terminology.md", "fact_id": "TERM-106", "op": "UPDATE", "text": "| TERM-106 | Balance | A daily balance record for an account, computed by the forward or reverse balance calculator. It stores the day's components: start cash and non-cash balances, cash and non-cash inflows and outflows, net market flows, cash and non-cash adjustments, and flows_factor. The end_cash_balance, end_non_cash_balance and end_balance columns are generated by the database from these components and must never be written directly. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/balance.rb", "line": 4, "quote": "Written by the calculators. The end_cash_balance, end_non_cash_balance and end_balance columns are"}, {"kind": "source", "path": "db/migrate/20261105130000_add_components_to_balances.rb", "line": 24, "quote": "stored: true,"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "64dd9fc7-4695-4e74-8e0a-48e0539347d1", "quote": "The end balances should be generated columns so the db keeps them consistent."}], "reason": "The existing TERM-106 wording predates the stored components and generated end columns. The source (balance.rb, the migration) and the developer's request confirm the new meaning. ID kept.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-109", "op": "ADD", "text": "| TERM-109 | Linked account | An account whose plaid_account_id is set, so its transactions and balances come from a data provider such as Plaid. Its balances are calculated in reverse from the provider's data. Accounts without a plaid_account_id are called unlinked or manual accounts; they are calculated forward from their entries and anchors. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account/linkable.rb", "line": 8, "quote": "A \"linked\" account gets transaction and balance data from a third party like Plaid"}, {"kind": "source", "path": "app/models/account/linkable.rb", "line": 10, "quote": "plaid_account_id.present?"}, {"kind": "source", "path": "app/models/account.rb", "line": 25, "quote": "scope :manual, -> { where(plaid_account_id: nil) }"}, {"kind": "source", "path": "app/models/account/syncer.rb", "line": 20, "quote": "strategy = account.linked? ? :reverse : :forward"}], "reason": "linked? and the manual scope define the term in source, and the syncer ties linked accounts to the reverse strategy. The term is absent from the KB. Entry#linked? uses plaid_id and is a different concept, so the definition is limited to accounts.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-110", "op": "ADD", "text": "| TERM-110 | Balance type | The classification of an account's balance as cash (Depository, CreditCard), non-cash (Property, Vehicle, OtherAsset, Loan, OtherLiability) or investment (Investment, Crypto), from Account#balance_type. Cash is liquid and non-cash is illiquid. Investment is a mix of brokerage cash and holdings. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account.rb", "line": 150, "quote": "\"Investment\" = A mix of both, including brokerage cash (liquid) and holdings (illiquid)"}], "reason": "The source comment and balance_type method define the term. It is used by the calculators and by DailyActivity. The term is absent from the KB.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-111", "op": "ADD", "text": "| TERM-111 | Opening anchor | The valuation of kind opening_anchor that starts an account's history. Its balance is the account's opening anchor balance (opening_anchor_balance), and the calculators start from it on opening_anchor_date. Manual accounts get their oldest valuation marked as the opening anchor. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account/anchorable.rb", "line": 18, "quote": "def opening_anchor_date"}, {"kind": "source", "path": "app/models/valuation.rb", "line": 6, "quote": "opening_anchor: \"opening_anchor\""}, {"kind": "source", "path": "app/models/balance/forward_calculator.rb", "line": 5, "quote": "total_balance: account.opening_anchor_balance,"}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 117, "quote": "# Manual accounts get their oldest valuation marked as opening_anchor, which acts as the"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "d4dd9c5e-d89e-416f-88f7-031f1c7041c5", "quote": "or from the opening anchor on day one"}], "reason": "The term is used across source and by the developer, but has no KB entry. The definition follows the valuation kind and the calculator usage.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-112", "op": "ADD", "text": "| TERM-112 | Reconciliation | A valuation of kind reconciliation, the default kind. It sets the account's total balance on its date, and the calculator uses its amount instead of that day's flows. The change from the previous day therefore lands in the adjustment bucket (TERM-115). See TERM-104 for valuations in general. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/valuation.rb", "line": 5, "quote": "reconciliation: \"reconciliation\""}, {"kind": "source", "path": "app/models/balance/sync_cache.rb", "line": 7, "quote": "e.valuation.reconciliation?"}, {"kind": "conversation", "session": "cbd5d4bc-7d5d-46f5-9419-10dba5f8c210", "message": "a176ad32-1c01-4be8-9722-cea4f471a3ef", "quote": "For a reconciliation valuation, the calculator sets the day's total balance to the valuation amount and ignores that day's trade flows."}], "reason": "Reconciliation is a valuation kind with its own calculator path and a defined effect. The developer accepted the adjustment outcome in the same-day case. Kept as a separate term that refers to TERM-104.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-113", "op": "ADD", "text": "| TERM-113 | Inflow and outflow | Entry amounts split by sign. An inflow is a negative amount and an outflow is a positive amount, both in the account currency. The flows_factor on a balance (1 for assets, -1 for liabilities) converts them into effects on the balance, so a payment into a loan is an inflow that lowers the debt. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/balance/base_calculator.rb", "line": 103, "quote": "Inflows are negative entry amounts and outflows positive ones, as magnitudes in the account currency."}, {"kind": "source", "path": "db/migrate/20261105130000_add_components_to_balances.rb", "line": 16, "quote": "1 for assets, -1 for liabilities: inflows raise an asset and lower a liability (e.g. a loan payment)"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "d4dd9c5e-d89e-416f-88f7-031f1c7041c5", "quote": "Inflows and outflows are defined by entry sign, not by effect on the balance."}], "reason": "The developer defined inflows and outflows by entry sign, and the source applies that rule in the calculator and migration. The term is absent from the KB.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-114", "op": "ADD", "text": "| TERM-114 | Market flows | The change in the value of holdings from price moves, excluding trades. Stored as net_market_flows. Market flows apply only to the non-cash side of investment accounts and are folded into the adjustment bucket (TERM-115) in the activity breakdown. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/balance/base_calculator.rb", "line": 75, "quote": "Holdings move with the market, so on investment accounts the non-cash remainder is market flows."}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "d4dd9c5e-d89e-416f-88f7-031f1c7041c5", "quote": "Change in holdings value from price moves, excluding trades"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "34a28aa6-e09d-4913-bf7f-c55ee6c14bd3", "quote": "Market flows stay non-cash only"}], "reason": "The developer defined the term, the source uses it, and the UI mapping was agreed. Adds the term used in the breakdown.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-115", "op": "ADD", "text": "| TERM-115 | Breakdown bucket | One of the five parts that explain an account's change on a day: income, expense, trades, holdings and adjustment. They always sum to the day's change. Adjustment is the residual, covering reconciliations, market flows and anything without an entry. On investment accounts trades and holdings offset each other. The holdings bucket is the value of shares bought or sold at the trade price and is not a Holding (TERM-105). | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account/daily_activity.rb", "line": 12, "quote": "#   holdings:   the offsetting value of shares bought or sold, at the trade price. A trade moves value between"}, {"kind": "conversation", "session": "cbd5d4bc-7d5d-46f5-9419-10dba5f8c210", "message": "1702d0eb-2612-49f1-97ee-c4cf65e9ab1c", "quote": "`holdings` is the offsetting value of shares bought or sold at the trade price"}], "reason": "The five buckets are a defined vocabulary in DailyActivity, and the developer accepted their meanings. The holdings bucket name collides with TERM-105, so the entry states the difference.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-105", "op": "UPDATE", "text": "| TERM-105 | Holding | An investment account's position in a Security on a date, derived from Trades. Not the same as the holdings breakdown bucket (TERM-115), which is a flow measure in an activity breakdown. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account/daily_activity.rb", "line": 12, "quote": "#   holdings:   the offsetting value of shares bought or sold, at the trade price. A trade moves value between"}], "reason": "The same word now names a record and a breakdown bucket. This disambiguation keeps the existing definition and adds a pointer to TERM-115.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-116", "op": "ADD", "text": "| TERM-116 | Favorable direction | Whether an increase in an account's balance is good for it. Assets are favorable when up and liabilities when down (Account#favorable_direction). Used for the colour of activity breakdown rows and of the day's change. Trades and holdings rows are neutral. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account/chartable.rb", "line": 5, "quote": "classification == \"asset\" ? \"up\" : \"down\""}, {"kind": "source", "path": "app/models/account/daily_activity.rb", "line": 86, "quote": "amount.amount.positive? == (account.favorable_direction == \"up\")"}, {"kind": "source", "path": "app/models/account/daily_activity.rb", "line": 21, "quote": "NEUTRAL_BUCKETS = %i[trades holdings].freeze"}], "reason": "The term has a clear source definition used across the chart and activity code. It is absent from the KB.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-117", "op": "ADD", "text": "| TERM-117 | Activity tab | The account page tab that lists an account's entries grouped by day. Each day (Account::DailyActivity::Day) shows the start and end balance, the change and the breakdown (TERM-115). The list shows only the entries on the current page, and the day's figures cover the whole day. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "cbd5d4bc-7d5d-46f5-9419-10dba5f8c210", "message": "e6d209b4-08c1-4755-a987-182e188e7ac4", "quote": "by activity feed i mean the activity tab on an account page, grouped by day"}, {"kind": "conversation", "session": "cbd5d4bc-7d5d-46f5-9419-10dba5f8c210", "message": "e6d209b4-08c1-4755-a987-182e188e7ac4", "quote": "naming wise Account::DailyActivity is fine i guess, go ahead"}, {"kind": "source", "path": "app/models/account/daily_activity.rb", "line": 1, "quote": "Groups an account's entries by day for the activity tab."}], "reason": "The developer defined activity tab and feed, and accepted the Account::DailyActivity name. The source comment uses the same meaning. Avoids using the word activity feed for the tab, which the developer used for both.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-105", "op": "UPDATE", "text": "| STACK-105 | The external API lives under `/api/v1`, authenticates with Doorkeeper OAuth or API keys, and is rate limited by Rack::Attack. On hosted instances the limits are 100 requests per hour per access token and 200 requests per hour per IP. On self-hosted instances the limits are 10,000 per hour per access token and 20,000 per hour per IP, and API key requests are not limited: `ApiRateLimiter.for` returns `NoopApiRateLimiter` on self-hosted instances, and requests with a valid `X-Api-Key` are safelisted from the throttles after the key is looked up. | requirement | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/initializers/rack_attack.rb", "line": 22, "quote": "api_token_limit = Rails.application.config.app_mode.self_hosted? ? 10_000 : 100"}, {"kind": "source", "path": "config/initializers/rack_attack.rb", "line": 23, "quote": "api_ip_limit = Rails.application.config.app_mode.self_hosted? ? 20_000 : 200"}, {"kind": "source", "path": "config/initializers/rack_attack.rb", "line": 13, "quote": "ApiKey.find_by_value(request.get_header(\"HTTP_X_API_KEY\")).present?"}, {"kind": "source", "path": "app/services/api_rate_limiter.rb", "line": 14, "quote": "if Rails.application.config.app_mode.self_hosted?"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "4705012f-2dc2-450d-8a23-70c385a41b2f", "quote": "For self hosted, bump Rack::Attack to 10k an hour per token and 20k per IP. Hosted stays at 100 and 200."}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "6ae51835-c470-46ab-8502-8f5051bc13e9", "quote": "have it hand off to a NoopApiRateLimiter when self-hosted"}, {"kind": "diff", "path": "config/initializers/rack_attack.rb", "quote": "config/initializers/rack_attack.rb"}], "reason": "The developer stated the self-hosted numbers, the hosted numbers and that API key usage should not be limited on self-hosted, and approved the Noop limiter and safelist. Source at head implements all of it: the limits are set by app_mode, the Noop limiter is chosen by ApiRateLimiter.for, and the safelist looks the key up. The hosted requirement (100 and 200) is kept unchanged. Scope is app:maybe because the rule is this application's policy. The existing text only describes hosted behaviour, so the update adds the self-hosted scope without changing the hosted requirement. The safelist's key lookup is recorded as a requirement of the safelist in pitfalls, not here.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-101", "op": "UPDATE", "text": "| STACK-101 | Ruby on Rails 7.2 with PostgreSQL and Redis. Background work runs on Sidekiq, with sidekiq-cron for scheduled jobs. One-time data migrations and backfills run as rake tasks under the `data_migration` namespace in `lib/tasks/data_migration.rake`, not as Sidekiq jobs. | requirement | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "34a28aa6-e09d-4913-bf7f-c55ee6c14bd3", "quote": "For the backfill, no sidekiq job please. We do those as a data_migration rake task"}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 158, "quote": "desc \"Migrate balance components\""}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 2, "quote": "desc \"Migrate EU Plaid webhooks\""}], "reason": "The developer stated the team practice for backfills and asked for a rake task rather than a Sidekiq job. The source at head shows a data_migration rake file with several earlier one-off tasks (for example the EU Plaid webhook migration), so the practice is implemented and not one-off. The Sidekiq statement is kept as is because background work still runs on Sidekiq. Scope is app:maybe because the developer described this application's practice.", "agent": "stack-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-101", "op": "UPDATE", "text": "| NAME-101 | Design-system components live in `app/components/DS/`, and app-specific components live in `app/components/UI/<area>/`. Classes are namespaced and have no `Component` suffix: `DS::Button` in `DS/button.rb` with `DS/button.html.erb`, and `UI::Account::ActivityFeed` in `UI/account/activity_feed.rb`. A component's Stimulus controller sits next to it as `<name>_controller.js`. The controller identifier is the file name without the folder, so `DS/dialog_controller.js` registers as `dialog` and is used as `data-controller=\"dialog\"`. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/components/DS/button.rb", "line": 5, "quote": "class DS::Button < DS::Buttonish"}, {"kind": "source", "path": "app/components/UI/account/activity_feed.rb", "line": 3, "quote": "class UI::Account::ActivityFeed < ApplicationComponent"}, {"kind": "source", "path": "app/components/DS/dialog_controller.js", "line": 3, "quote": "// Connects to data-controller=\"dialog\""}, {"kind": "diff", "path": "app/components/DS/dialog_controller.js", "quote": "app/components/DS/dialog_controller.js"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "db86541d-a11e-4972-872f-0ad2053e948c", "quote": "actually lets drop the Component suffix, DS::Button reads way better. sorry."}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "05490d68-11b4-4243-aa12-ece9debf7656", "quote": "DS namespace for the design system pieces and UI for the app specific ones"}], "reason": "The current rule (flat app/components, Component suffix) no longer matches head. The developer asked for the suffix to be dropped and for DS and UI namespaces, and head matches. The Stimulus identifier rule is kept and clarified because the developer confirmed identifiers stay plain after the move to DS/. The team checkout that states the old rule was not edited.", "agent": "conventions-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-103", "op": "UPDATE", "text": "| NAME-103 | Lookbook previews for design-system components live in `test/components/previews/ds/` and are named `<name>_preview.rb`, with class `DS::<Name>Preview`, for example `DS::ButtonPreview` in `ds/button_preview.rb`. The `ds` folder name is lowercase. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "test/components/previews/ds/button_preview.rb", "line": 1, "quote": "class DS::ButtonPreview < ViewComponent::Preview"}, {"kind": "diff", "path": "test/components/previews/ds/alert_preview.rb", "quote": "test/components/previews/ds/alert_preview.rb"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "0e9c52ab-96df-49a7-becf-76271416eeaa", "quote": "They are now `DS::ButtonPreview` in `test/components/previews/ds/button_preview.rb`"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "108fa345-7272-4f98-b1ca-c6165408f28a", "quote": "fine on previews, lowercase is ok, leave them and the inflection."}], "reason": "NAME-103 names the old location and file pattern (<name>_component_preview.rb directly under previews/). Head uses previews/ds/<name>_preview.rb with DS::<Name>Preview. The developer accepted the lowercase ds folder for previews. Only design-system previews exist at head, so the scope stays app:maybe.", "agent": "conventions-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": null, "op": "ADD", "text": "| NAME-104 | The acronyms `DS` and `UI` are registered in `config/initializers/inflections.rb`, so folder names match module names: `app/components/DS` maps to `DS` and `app/components/UI` maps to `UI`. The design-system folder is capitalised. Preview folders are the accepted exception and stay lowercase (`test/components/previews/ds`). | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/initializers/inflections.rb", "line": 20, "quote": "inflect.acronym \"UI\""}, {"kind": "source", "path": "app/components/DS/button.rb", "line": 5, "quote": "class DS::Button < DS::Buttonish"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "0e8d197a-6ddc-445a-938c-992ef4bbb323", "quote": "the folder should be app/components/DS not ds, caps. can you fix that and the inflection stuff that goes with it"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "108fa345-7272-4f98-b1ca-c6165408f28a", "quote": "leave them and the inflection"}], "reason": "The developer asked for the capitalised DS folder and the inflection that goes with it, and head registers both DS and UI. This is an explicit, scoped folder and acronym rule for the app. The lowercase preview exception is recorded so a reader does not treat it as a violation. The case-sensitivity risk on Linux CI is unverified and is not stated as fact.", "agent": "conventions-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": null, "op": "ADD", "text": "| NAME-105 | Data migration rake tasks are defined in `lib/tasks/data_migration.rake` under the `data_migration` namespace. Task names are snake_case verbs that name the action, for example `data_migration:migrate_duplicate_securities` and `data_migration:migrate_balance_components`. | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 1, "quote": "namespace :data_migration do"}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 32, "quote": "task migrate_duplicate_securities: :environment do"}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 167, "quote": "task migrate_balance_components: :environment do"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "34a28aa6-e09d-4913-bf7f-c55ee6c14bd3", "quote": "We do those as a data_migration rake task, so data_migration:migrate_balance_components."}], "reason": "Four tasks in the file share the namespace and verb_noun style, and the developer named the new task using it. This is a repeated pattern plus an explicit instruction, so it is admitted for app:maybe. It does not state that backfills must never be Sidekiq jobs; that is a stack question for another owner.", "agent": "conventions-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-101", "op": "ADD", "text": "| PIT-101 | On self-hosted instances, a Rack::Attack safelist that exempts /api/ requests because an X-Api-Key header is present, without looking the key up | Any request carrying a made-up X-Api-Key header skips every throttle, including the unauthenticated /api/v1/auth/signup, login and refresh routes, which are otherwise limited only by the per-IP throttle | Safelist only when ApiKey.find_by_value returns a key, as config/initializers/rack_attack.rb does. Unknown or revoked keys stay under the normal limits | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/initializers/rack_attack.rb", "line": 13, "quote": "ApiKey.find_by_value(request.get_header(\"HTTP_X_API_KEY\")).present?"}, {"kind": "source", "path": "config/routes.rb", "line": 198, "quote": "post \"auth/signup\", to: \"auth#signup\""}, {"kind": "source", "path": "app/controllers/api/v1/auth_controller.rb", "line": 6, "quote": "skip_before_action :authenticate_request!"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "ea5d94de-d151-4559-8276-4fe033266171", "quote": "what would happen if we only checked the header exists and let the controller reject bad keys?"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "65740d7b-9736-44eb-837b-e95fdd144012", "quote": "ah yeah login not being throttled is a no, keep the lookup."}], "reason": "Trigger, failure and remedy are visible in source: the safelist, the auth routes, and the controller skipping authentication. The developer rejected the header-only variant and kept the lookup. The consequence is reasoned from code, not observed in production, so the trigger is stated as a design condition. The claim that Rack::Attack safelists also skip the blocklist is not verified against the gem source and is left out.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-102", "op": "ADD", "text": "| PIT-102 | Writing the generated end_cash_balance, end_non_cash_balance or end_balance columns on balances, for example by including every column in an upsert_all, or defining a generated column that references another generated column | PostgreSQL rejects writes to generated columns, and a generated column cannot reference another generated column, so the insert, upsert or migration fails | Write only the columns in Balance::COMPONENT_ATTRIBUTES plus the non-generated columns the caller sets, and repeat the underlying expressions in end_balance | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/balance.rb", "line": 5, "quote": "so they must never be part of an insert or upsert."}, {"kind": "source", "path": "db/migrate/20261105130000_add_components_to_balances.rb", "line": 37, "quote": "# A generated column cannot reference another generated column, so this repeats both expressions"}, {"kind": "source", "path": "app/models/balance/materializer.rb", "line": 51, "quote": ".slice(\"date\", \"balance\", \"cash_balance\", \"currency\", *Balance::COMPONENT_ATTRIBUTES)"}], "reason": "The rule that generated columns must not be written is stated in the model, and the upsert slices follow it. The restriction on referencing generated columns is stated in the migration. The PostgreSQL behaviour is standard and the source comments rely on it. The table-rewrite lock is left out because it belongs to the migration-deploy notes.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-103", "op": "ADD", "text": "| PIT-103 | Backfilling balance components by calling Balance::Materializer on existing accounts | For forward (unlinked) accounts the materializer also updates account.balance and account.cash_balance, rematerializes holdings and purges stale balances, so existing values can change | Run the calculator directly and upsert only Balance::COMPONENT_ATTRIBUTES, as data_migration:migrate_balance_components does | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/balance/materializer.rb", "line": 11, "quote": "materialize_holdings"}, {"kind": "source", "path": "app/models/balance/materializer.rb", "line": 19, "quote": "if strategy == :forward"}, {"kind": "source", "path": "app/models/balance/materializer.rb", "line": 37, "quote": "account.update!("}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 162, "quote": "This task recalculates each account with its normal strategy (reverse for linked accounts, forward"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "d4dd9c5e-d89e-416f-88f7-031f1c7041c5", "quote": "Don't call the full `Materializer`, which would also rematerialize holdings and overwrite `account.balance`."}], "reason": "The mechanism is visible in the materializer: holdings are rematerialized, account info is updated only for the forward strategy, and stale balances are purged. The rake task implements the alternative. The developer-agent's plan states the same risk. No backfill run was observed, so the entry describes a design trap rather than a reported incident.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-104", "op": "ADD", "text": "| PIT-104 | Hand-editing the version in db/schema.rb to a newer migration timestamp instead of regenerating it | Rails treats every migration up to the stated version as already applied, so the migrations skipped this way, such as the 2026-11-05 index migration, are never run and their indexes are never created | Run bin/rails db:migrate so Rails regenerates db/schema.rb, and commit that file. At head db/schema.rb still has version 2025_07_10_225721 | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "db/schema.rb", "line": 13, "quote": "ActiveRecord::Schema[7.2].define(version: 2025_07_10_225721) do"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "0322360d-1799-41a6-8fe1-7af0e660ac5d", "quote": "Don't hand-edit the version, or `schema:load` would mark the index migration as applied without creating the indexes."}], "reason": "The developer-agent gave this guidance and the schema header confirms the stale version. The Rails schema-load behaviour is standard. The trigger is stated as hand-editing the version, because a stale file alone leaves newer migrations pending and they still run.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-105", "op": "ADD", "text": "| PIT-105 | A migration that builds indexes with algorithm: :concurrently without disabling the DDL transaction | PostgreSQL refuses CREATE INDEX CONCURRENTLY inside a transaction, so the migration fails, and a partial build is not safe to re-run without if_not_exists | Declare disable_ddl_transaction! and use if_not_exists: true, as db/migrate/20261105120000_add_missing_indexes_to_accounts_and_entries.rb does | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "db/migrate/20261105120000_add_missing_indexes_to_accounts_and_entries.rb", "line": 2, "quote": "disable_ddl_transaction!"}, {"kind": "source", "path": "db/migrate/20261105120000_add_missing_indexes_to_accounts_and_entries.rb", "line": 6, "quote": "add_index :accounts, :status, algorithm: :concurrently, if_not_exists: true"}, {"kind": "conversation", "session": "05853ed8-31c6-4144-a27a-1d3fbc93da15", "message": "adf7bca8-af53-4125-98b7-90585bedf147", "quote": "The migration uses `disable_ddl_transaction!`, `algorithm: :concurrently` and `if_not_exists: true`."}], "reason": "The PostgreSQL restriction is standard and is the reason the migration declares disable_ddl_transaction!. The migration uses the remedy, and the developer accepted it. No failed run was observed in the transcripts, so the failure is stated as the general condition.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-106", "op": "ADD", "text": "| PIT-106 | Expecting index_entries_on_lower_name (a btree index on lower(name)) to speed up entry name search | EntrySearch matches with entries.name ILIKE, which a btree index on lower(name) cannot serve, so the search still scans the table | Only queries that compare lower(entries.name) directly can use this index. Substring search (ILIKE with a leading %) needs a pg_trgm index, which the app does not enable | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/entry_search.rb", "line": 19, "quote": "entries.name ILIKE :search"}, {"kind": "source", "path": "db/migrate/20261105120000_add_missing_indexes_to_accounts_and_entries.rb", "line": 19, "quote": "add_index :entries, \"lower(name)\""}, {"kind": "conversation", "session": "05853ed8-31c6-4144-a27a-1d3fbc93da15", "message": "c7f3b34c-1af6-4cdd-8938-df3103f93312", "quote": "An index on `lower(name)` doesn't match an `ILIKE` predicate"}], "reason": "The query and the index are both in source. The developer-agent reached this conclusion, and the developer chose to keep the plain index anyway. The entry records the limit so nobody expects a speed-up. The pg_trgm remedy is stated only as an option the developer declined, not as a fix.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-107", "op": "ADD", "text": "| PIT-107 | Running data_migration:migrate_balance_components on an account whose recalculated balance or cash balance differs from the stored row | The row is skipped and keeps zero components, so DailyActivity shows a zero end balance for that day until the account next syncs | Read the skipped account ids the task prints, then sync those accounts so the calculator rewrites their rows | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 189, "quote": "if stored.balance == calculated.balance && stored.cash_balance.to_d == calculated.cash_balance"}, {"kind": "source", "path": "lib/tasks/data_migration.rake", "line": 164, "quote": "adjustments are derived against the recalculated balance, a row is only written when that balance matches"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "0322360d-1799-41a6-8fe1-7af0e660ac5d", "quote": "Rows that differ are skipped, counted, and listed by account id"}], "reason": "The skip rule and the printed account list are in the task. The next sync rewriting the components follows from the materializer's upsert, which includes the component columns. The developer-agent described the sync remedy. The zero end balance follows from the generated columns and the zero default. No run against real data was observed.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-108", "op": "ADD", "text": "| PIT-108 | Listing the entries on the account activity page from Account::DailyActivity day objects (Day#entries) | Day#entries holds every entry for that date, so each page that a day spans repeats the same entries | List only the entries on the current page, and take the day's balances, breakdown and total count from the Day object, as UI::Account::ActivityFeed does | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/components/UI/account/activity_feed.rb", "line": 15, "quote": "# Only the entries on the current page (and matching the current search) are listed, but each day's"}, {"kind": "source", "path": "app/components/UI/account/activity_feed.rb", "line": 27, "quote": "@entries_by_date ||= entries.group_by(&:date)"}, {"kind": "conversation", "session": "25a4eecd-b0f6-4c33-9b3b-727281d68e17", "message": "478106a7-7af9-47b2-994d-8d6390de5b80", "quote": "`DailyActivity.days[].entries` returns every entry for the day, so listing from it would have shown a day's entries on every page it spans."}], "reason": "The developer-agent identified the duplication while building the feed, and the feed's source code lists only page entries, which confirms the remedy. The failure is a design hazard for future callers rather than a reported bug.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-109", "op": "ADD", "text": "| PIT-109 | Linking to the account show page with a tab value that is not one of its tab keys, for example tab: \"transactions\" | The tabs partial falls back to the first tab without any warning, so the link looks as if it opens the wrong tab | Use a key from account_show_tabs (activity, holdings or overview). The transactions link was changed to activity | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/views/accounts/show/_tabs.html.erb", "line": 3, "quote": "|| tabs.first"}, {"kind": "source", "path": "app/helpers/accounts_helper.rb", "line": 10, "quote": "tabs = [ { key: \"activity\""}, {"kind": "conversation", "session": "05853ed8-31c6-4144-a27a-1d3fbc93da15", "message": "0fef5626-76c3-4102-9362-f931f8816d2b", "quote": "change that tab: \"transactions\" link to \"activity\""}], "reason": "The fallback is visible in the partial, and the developer-agent noted that the stale link landed on Activity by accident. The developer asked for the link to be fixed. The entry records the general trap.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-110", "op": "ADD", "text": "| PIT-110 | Linking to or redirecting to the per-type show URLs, such as /loans/:id, /vehicles/:id or /depositories/:id | Those resources exclude show and destroy, so the request returns 404. No redirects were added | Link with account_path(account), which points to /accounts/:id. Edit and update remain on the type resources | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/routes.rb", "line": 153, "quote": "resources :accounts, only: %i[index show new destroy], shallow: true do"}, {"kind": "source", "path": "config/routes.rb", "line": 168, "quote": "resources :depositories, except: %i[index show destroy]"}, {"kind": "conversation", "session": "05853ed8-31c6-4144-a27a-1d3fbc93da15", "message": "60aa478f-4074-4c2f-bb4e-3079e6c28587", "quote": "404 on the old /loans/123 urls is fine, no redirects needed."}], "reason": "Routes show the exclusion and the accounts route. The developer accepted the 404 behaviour explicitly, so the entry records a current constraint, not a defect.", "agent": "pitfalls-maintainer"}, {"target": "tools/viewcomponent/README.md", "fact_id": "VIEWCOMPONENT-002", "op": "UPDATE", "text": "Components are developed and reviewed in Lookbook, which is mounted at `/design-system` in `config/routes.rb`.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/routes.rb", "line": 13, "quote": "mount Lookbook::Engine, at: \"/design-system\""}], "reason": "The existing fact says Lookbook is served at /lookbook. The source mounts it at /design-system. The sweeper's /lookbook wording came from conversation text and the route file contradicts it. The route line shows no environment condition, but lookbook configuration was not checked for gating, so the development-only wording is dropped rather than kept.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "Base classes: `ApplicationComponent` inherits `ViewComponent::Base`, and `DesignSystemComponent` inherits `ApplicationComponent`. Design-system components (`DS::`) inherit `DesignSystemComponent`, as checked for `DS::Buttonish`, `DS::Tab`, `DS::Menu` and `DS::Tooltip`. App-specific components (`UI::`) inherit `ApplicationComponent`.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/components/application_component.rb", "line": 1, "quote": "class ApplicationComponent < ViewComponent::Base"}, {"kind": "source", "path": "app/components/design_system_component.rb", "line": 1, "quote": "class DesignSystemComponent < ApplicationComponent"}, {"kind": "source", "path": "app/components/DS/buttonish.rb", "line": 1, "quote": "class DS::Buttonish < DesignSystemComponent"}, {"kind": "source", "path": "app/components/UI/account/activity_date.rb", "line": 3, "quote": "class UI::Account::ActivityDate < ApplicationComponent"}], "reason": "Source at head shows the three base-class relationships. The developer asked for a separate design-system base in the conversation (session 0a43fbc5, message 3fdab1f5-ea1f-4c8a-b9dd-15b136f74270). Only the DS classes listed were checked; the remaining DS classes were not each opened.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "Namespaces and folders: design-system components use the `DS::` namespace in the capitalised `app/components/DS/` folder, for example `DS::Tooltip` in `DS/tooltip.rb` and `DS/tooltip.html.erb`. App-specific components use the `UI::` namespace under `app/components/UI/<area>/`, for example `UI::Account::ActivityFeed`. `DS` and `UI` are inflection acronyms in `config/initializers/inflections.rb`.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/initializers/inflections.rb", "line": 20, "quote": "inflect.acronym \"UI\""}, {"kind": "source", "path": "app/components/UI/account/activity_feed.rb", "line": 3, "quote": "class UI::Account::ActivityFeed < ApplicationComponent"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "0e8d197a-6ddc-445a-938c-992ef4bbb323", "quote": "the folder should be app/components/DS not ds, caps."}], "reason": "Developer decisions in sessions 0a43fbc5 and 25a4eecd, confirmed by source. The flat-file rule in NAME-101 is shared core and is owned by the conventions maintainer, so it is not edited here.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "`DS::Tooltip` wraps the shared `tooltip` Stimulus controller (in `app/javascript/controllers/tooltip_controller.js`). The trigger is the block content, the tooltip body is set with `with_body`, and `placement` and `offset` are options. The tooltip element has `role=\"tooltip\"`, and its body uses the `bg-inverse` and `fg-inverse` tokens.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/components/DS/tooltip.rb", "line": 1, "quote": "class DS::Tooltip < DesignSystemComponent"}, {"kind": "source", "path": "app/components/DS/tooltip.html.erb", "line": 4, "quote": "role=\"tooltip\""}, {"kind": "conversation", "session": "25a4eecd-b0f6-4c33-9b3b-727281d68e17", "message": "62bf1951-934a-4d5d-a950-beb04edeb7d0", "quote": "make the tooltip a small DS::Tooltip that wraps the existing stimulus controller"}], "reason": "Source confirms the wrapper, slot and token use. The developer asked for the wrapper design in session 25a4eecd. Its browser behaviour was not run here.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "`DS::Tooltip` takes `focusable:`, which defaults to `false`. When it is `true`, the wrapper gets `tabindex=\"0\"` and `aria-describedby` pointing at the tooltip. Turn it on only when the trigger is plain text. Leave it off for a button or link trigger, which would otherwise get two tab stops.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/components/DS/tooltip.rb", "line": 6, "quote": "focusable makes the wrapper a tab stop so keyboard users can reach the tooltip. Leave it off when the"}, {"kind": "source", "path": "app/components/DS/tooltip.rb", "line": 25, "quote": "merged.merge!(tabindex: 0, aria: { describedby: tooltip_id }) if focusable"}, {"kind": "source", "path": "app/components/UI/account/activity_date.html.erb", "line": 11, "quote": "focusable: true"}, {"kind": "conversation", "session": "25a4eecd-b0f6-4c33-9b3b-727281d68e17", "message": "f82ff788-ad9c-412b-9d1d-ef15a388c238", "quote": "I don't want double tab stops on buttons."}], "reason": "Default-off behaviour and its purpose are confirmed in source and the developer's decision. The date trigger in ActivityDate is the only caller that turns it on.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "The shared `tooltip` controller shows the tooltip on `mouseenter` and `focusin`, hides it on `mouseleave` and `focusout`, and hides it when Escape is pressed. Existing tooltips that use the controller gain keyboard behaviour. `focusout` also fires when focus moves between elements inside the tooltip wrapper, which hides it; this matters only if a focusable element sits inside a tooltip.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/javascript/controllers/tooltip_controller.js", "line": 34, "quote": "this.element.addEventListener(\"focusin\", this.show);"}, {"kind": "source", "path": "app/javascript/controllers/tooltip_controller.js", "line": 57, "quote": "if (event.key === \"Escape\") this.hide();"}], "reason": "Behaviour read from the controller at head. The developer said they would test it in a browser on another machine, so the behaviour is not yet confirmed in a running app.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "Stimulus controllers for design-system components sit beside their component files in `app/components/DS/` (for example `dialog_controller.js`, `menu_controller.js`, `tabs_controller.js`). `config/importmap.rb` pins them with `pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\"`. `under:` sets the Stimulus identifier, so the identifier stays `dialog`, `menu` and `tabs`, and `to:` sets the asset path, so it must match the folder.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/importmap.rb", "line": 8, "quote": "pin_all_from \"app/components/DS\", under: \"controllers\", to: \"DS\""}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "0871bd83-9d58-4e9d-b0df-4867c1ebfd26", "quote": "`to:` is the asset path Propshaft serves the file from."}], "reason": "The pin line is verified at head. The conversation records the reasoning and the fix for an earlier to: \"\" mistake. Controllers loading in the browser were not run here.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "Lookbook previews for design-system components are `<name>_preview.rb` files in `test/components/previews/ds/`. Each defines a class `DS::<Name>Preview` that subclasses `ViewComponent::Preview`, for example `DS::TooltipPreview`. A preview with several templates uses a `<name>_preview/` folder, for example `tabs_preview/`. The lowercase `ds` folder is kept on purpose.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "test/components/previews/ds/tooltip_preview.rb", "line": 1, "quote": "class DS::TooltipPreview < ViewComponent::Preview"}, {"kind": "conversation", "session": "0a43fbc5-a71d-4248-8a48-c6d537d0eb80", "message": "108fa345-7272-4f98-b1ca-c6165408f28a", "quote": "fine on previews, lowercase is ok, leave them and the inflection."}], "reason": "Confirmed in source for the tooltip preview and the developer's decision for the lowercase folder. Core NAME-103 still states the older path and class naming and is owned by the conventions maintainer. Whether Lookbook finds lowercase preview paths on a case-sensitive filesystem was not verified.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "Components render data prepared by `Account::DailyActivity`, such as `day.breakdown_rows`, each row's `favorable` value and `day.change_favorable`, and they do not calculate balances or breakdowns. Presentation code in a component may pick colour classes and labels, and may count entries listed on the current page.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/components/UI/account/activity_date.rb", "line": 19, "quote": "def favorable_color_class(favorable)"}, {"kind": "source", "path": "app/components/UI/account/activity_date.rb", "line": 29, "quote": "total = day.entries.size"}, {"kind": "conversation", "session": "cbd5d4bc-7d5d-46f5-9419-10dba5f8c210", "message": "5daffd13-be68-49ba-9556-5ce81e586496", "quote": "The math stays out of the component and it just renders what this gives it."}], "reason": "The developer's rule is in session cbd5d4bc. The component's formatting and count helpers are presentation code, so the rule is about calculations, not every line of Ruby in a component. The stack rule that calculations belong in models is core and is handed off.", "agent": "tool-maintainer:viewcomponent"}, {"target": "tools/viewcomponent/README.md", "fact_id": null, "op": "ADD", "text": "Component unit tests live under `test/components/` and subclass `ViewComponent::TestCase`. They use `render_inline` and page assertions such as `assert_selector`. The only component unit test in the repository is `UI::Account::ActivityFeedTest`, and design-system components are covered by previews only.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "test/components/ui/account/activity_feed_test.rb", "line": 3, "quote": "class UI::Account::ActivityFeedTest < ViewComponent::TestCase"}, {"kind": "source", "path": "test/components/ui/account/activity_feed_test.rb", "line": 23, "quote": "render_inline UI::Account::ActivityFeed.new(account: @account, entries: entries)"}], "reason": "Verified in the test file and the test directory listing. Whether design-system components should also get unit tests, and whether the lowercase test/components/ui folder matches the UI namespace, is not settled in any document and is left as an open question rather than a rule.", "agent": "tool-maintainer:viewcomponent"}], "deferred": [{"target": "core/terminology.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Pending: the valuation kind current_anchor (Valuation enum, Account::CurrentBalanceManager) has no written definition in the pack. Confirm its meaning before adding a term.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/valuation.rb", "line": 7, "quote": "current_anchor: \"current_anchor\""}, {"kind": "source", "path": "app/models/account/anchorable.rb", "line": 30, "quote": "def set_current_balance(balance)"}], "reason": "The code defines the kind and a manager, but neither the developer nor the source documents what a current anchor means, so a definition would be a guess.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-102", "op": "NEEDS_REVIEW", "text": "Account page tabs are server-rendered. The active tab is chosen by a `tab` query parameter, with the first tab as fallback, and there is no per-tab Stimulus controller or lazy-loaded frame.", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "05853ed8-31c6-4144-a27a-1d3fbc93da15", "message": "20c9b999-c22d-4f64-8f4d-a60c7fe7e8b2", "quote": "tabs stay server-rendered and we just use a ?tab= query param for which one is active, that's how we do state anyway."}, {"kind": "source", "path": "app/views/accounts/show/_tabs.html.erb", "line": 5, "quote": "url_param_key: \"tab\""}], "reason": "The source confirms the server-side tab param (DS::Tabs with url_param_key tab). The developer's phrase 'that's how we do state anyway' hints at a general practice, but the statement was made about one page, and no decision says it applies across the application. It also sits under STACK-102, which is about frontend tooling rather than state handling. A developer should confirm whether this is a general standard before it is recorded.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "The application's Ruby runtime is 3.4.4, pinned in `.ruby-version`, alongside Rails 7.2 on PostgreSQL and Redis.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": ".ruby-version", "line": 1, "quote": "3.4.4"}], "reason": "The pin is real configuration at head, and the developer's sessions describe the project as needing Ruby 3.4.4 with Bundler 2.6.9. The standards document does not mention a Ruby version. Whether the pin is a shared standard or only this repository's setting is not stated, so a developer should decide whether to add it as a new STACK ID. The Bundler version was mentioned in conversation only and was not verified in source, so it is not proposed here.", "agent": "stack-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-111", "op": "NEEDS_REVIEW", "text": "| PIT-111 | Shipping the change that makes DailyActivity read the stored balance components before data_migration:migrate_balance_components has run | Until the task runs, existing balance rows hold zeros, so the activity tab shows zero balances for those days | Run the migration, then the task, then deploy the read change | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "db/migrate/20261105130000_add_components_to_balances.rb", "line": 2, "quote": "Existing rows get zeros for every component, so their end_* columns read 0 until"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "0322360d-1799-41a6-8fe1-7af0e660ac5d", "quote": "Between the migration and the task finishing, the feed shows zeros"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "4705012f-2dc2-450d-8a23-70c385a41b2f", "quote": "The deploy order thing is fine, I'll sort that out when we ship."}], "reason": "Deferred. The hazard is real and documented in source, but it is tied to one release sequence. The developer said they would handle the order at ship time, and that sequence may have changed. Admit it only after the release is confirmed, or retire it once the backfill has run in every environment.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-112", "op": "NEEDS_REVIEW", "text": "| PIT-112 | Account selection lists in the transfer form (and the import account mapping, not checked here) | They list manual accounts without filtering by status, so disabled, draft and pending-deletion accounts can be chosen | Filter with active, as the new transaction form does. Decide whether the transfer form should follow | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/views/transfers/_form.html.erb", "line": 14, "quote": "Current.family.accounts.manual.alphabetically"}, {"kind": "source", "path": "app/views/transactions/_form.html.erb", "line": 21, "quote": "Current.family.accounts.manual.active.alphabetically"}, {"kind": "conversation", "session": "fb49f968-c3c5-40ff-8ba1-0ef42a9ddb6c", "message": "f273605b-d22b-4a79-8a57-595ffce90637", "quote": "leave the transfer form and import alone for now."}], "reason": "Deferred. The inconsistency is visible in source, but the developer explicitly left the transfer form and import alone, so the remedy is not decided. The import mapping was not opened in this review.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-113", "op": "NEEDS_REVIEW", "text": "| PIT-113 | Expecting the enabled variable in config/initializers/rack_attack.rb to turn Rack::Attack on or off | The variable is never assigned to Rack::Attack, and the middleware is added unconditionally, so throttles and the safelist apply in development and test as well | Decide which environments should throttle, then set Rack::Attack.enabled explicitly | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "config/initializers/rack_attack.rb", "line": 5, "quote": "enabled = Rails.env.production? || Rails.env.staging?"}, {"kind": "source", "path": "config/application.rb", "line": 43, "quote": "config.middleware.use Rack::Attack"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "1b852dd8-83f5-452c-a490-a91375da69d7", "quote": "The `enabled` flag does nothing."}], "reason": "Deferred. The unused local and the unconditional middleware are visible in source, and no Rack::Attack.enabled assignment was found in the test, production, or development environment files. The intended behaviour is a team decision, and the integration tests rely on the throttles being configured, so no remedy is proposed as settled. Retire the entry if the team confirms it is intended.", "agent": "pitfalls-maintainer"}], "rejected": [{"target": "core/tech-stack-standards.md", "fact_id": "STACK-103", "op": "UPDATE", "text": "| STACK-103 | Business logic belongs in `app/models/`, organized with concerns and plain Ruby objects. Avoid service objects in `app/services/`. Scoped exception (app:maybe): `ApiRateLimiter` and `NoopApiRateLimiter` stay in `app/services/` until a separate cleanup moves them; the developer stated that this pair is not a new habit. View components render values that model objects provide (for example `Account::DailyActivity`) and do not compute balances, groupings or breakdowns themselves. | preference | app:maybe |", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "6ae51835-c470-46ab-8502-8f5051bc13e9", "quote": "I know we normally keep this stuff in models, but that file already lives in services and moving it is a separate cleanup, so just this pair for now, not a new habit."}, {"kind": "conversation", "session": "cbd5d4bc-7d5d-46f5-9419-10dba5f8c210", "message": "5daffd13-be68-49ba-9556-5ce81e586496", "quote": "The math stays out of the component and it just renders what this gives it."}, {"kind": "source", "path": "app/services/noop_api_rate_limiter.rb", "line": 1, "quote": "# Stands in for ApiRateLimiter on self-hosted instances, where API keys are not limited. It has the same"}, {"kind": "source", "path": "app/app/components/UI/account/activity_date.rb", "line": 1, "quote": "# One day in the activity feed: the date with a tooltip showing what moved the balance, the day's end balance"}], "reason": "The developer explicitly scoped the services exception to one pair for this application, so it is recorded as a scoped exception and the standard's wording is kept. The model-versus-component split is an explicit developer requirement for the activity UI and matches the source: UI::Account::ActivityDate renders Account::DailyActivity output. The level stays preference because the existing STACK-103 is a preference, and the developer's statement was about this feature. Note: the evidence path for the activity component is root-relative to the application, which is app/components/UI/account/activity_date.rb.", "agent": "stack-maintainer", "rejected_because": "app/app/components/UI/account/activity_date.rb does not exist at 6db0b67"}, {"target": "tools/plaid/", "fact_id": "PLAID-003", "op": "ADD", "text": "Plaid investment transactions are routed by their type. Types cash, fee and transfer become Transaction entries on the investment account. Every other type is processed as a trade and becomes a Trade entry linked to the security resolved from the Plaid security id. If no security resolves, the trade is skipped (see PLAID-005).", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 27, "quote": "transaction[\"type\"] == \"cash\" || transaction[\"type\"] == \"fee\" || transaction[\"type\"] == \"transfer\""}, {"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 11, "quote": "if cash_transaction?(transaction)"}], "reason": "Verified in the processor at head. The sweeper candidate was accurate. The routing is implemented directly and is not a developer decision, so it is recorded as implementation behaviour for this application.", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}, {"target": "tools/plaid/", "fact_id": "PLAID-004", "op": "ADD", "text": "A trade created from Plaid has the entry amount derived quantity times price, in the transaction currency. The quantity sign is derived rather than taken from Plaid: sell types or negative amounts make it negative, and buy types or positive amounts make it positive. Plaid's reported quantity sign is not trusted, because Plaid returns incorrect signs on some sells.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 46, "quote": "amount: derived_qty(transaction) * transaction[\"price\"],"}, {"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 91, "quote": "Plaid unfortunately returns incorrect signage on some `quantity` values."}, {"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 99, "quote": "if transaction[\"type\"] == \"sell\" || transaction[\"amount\"] < 0"}], "reason": "Read from derived_qty and the amount assignment at head. The comment in the source explains why the sign is recomputed. The sweeper candidate's description matches the code. Whether derived amounts ever differ from the cash Plaid settles is unknown (see unresolved notes).", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}, {"target": "tools/plaid/", "fact_id": "PLAID-005", "op": "ADD", "text": "When a Plaid investment transaction that would become a trade has no resolvable security, no entry is created for it. The case is reported to Sentry as 'Could not find security for plaid trade', tagged with the Plaid account id, and the remaining transactions are still processed.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 34, "quote": "Could not find security for plaid trade"}, {"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 38, "quote": "return # We can't process a non-cash transaction without a security"}], "reason": "Verified in find_or_create_trade_entry at head. The early return skips only that transaction, and the loop in process continues.", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}, {"target": "tools/plaid/", "fact_id": "PLAID-006", "op": "ADD", "text": "Plaid fee transactions are cash transactions, so a fee is never part of a trade. On an investment account a fee becomes a cash outflow and shows as expense in the day breakdown, and the trade bucket does not include it.", "scope": "app:maybe", "evidence": [{"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "60a871f5-dd2c-4664-987d-7967e0e1eeab", "quote": "fees being a separate cash outflow is fine, that matches how i remember it."}, {"kind": "source", "path": "app/models/plaid_account/investments/transactions_processor.rb", "line": 27, "quote": "transaction[\"type\"] == \"fee\""}, {"kind": "source", "path": "app/models/balance/base_calculator.rb", "line": 119, "quote": "elsif account.balance_type == :investment"}, {"kind": "source", "path": "app/models/account/daily_activity.rb", "line": 111, "quote": "expense: money(-outflows * factor)"}], "reason": "The developer accepted the fee treatment in the 10f5 session. The code confirms that fee entries are Transaction entries (cash flows), which the investment branch counts as cash outflows and the daily breakdown reports as expense. The routing was inferred from processor code and was not checked against real Plaid fee data, so the fact is recorded as implementation behaviour with that limit.", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}, {"target": "tools/plaid/", "fact_id": "PLAID-007", "op": "ADD", "text": "Processing one Plaid account runs in order: the account record first, then transactions, investments (transactions, then holdings) and liabilities. If the account step fails, processing halts. Each later step rescues its own errors and reports them to Sentry, tagged with the Plaid account id, so one failing step does not stop the others.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/plaid_account/processor.rb", "line": 12, "quote": "Processing the account is the first step and if it fails, we halt the entire processor"}, {"kind": "source", "path": "app/models/plaid_account/processor.rb", "line": 73, "quote": "rescue => e"}, {"kind": "source", "path": "app/models/plaid_account/processor.rb", "line": 104, "quote": "def report_exception(error)"}], "reason": "Verified in PlaidAccount::Processor at head. The per-step rescue is the only error isolation between steps, and the account step is not rescued.", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}, {"target": "tools/plaid/", "fact_id": "PLAID-008", "op": "ADD", "text": "For Plaid investment accounts the balance is the Plaid current balance (falling back to available balance), which Plaid reports as total account value. The application stores brokerage cash separately from holdings. Brokerage cash is total value minus the value of holdings, and Plaid's cash-equivalent pseudo-securities (such as CUR:USD) are counted as brokerage cash, not as holdings.", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/plaid_account/investments/balance_calculator.rb", "line": 27, "quote": "Internally, we DO NOT."}, {"kind": "source", "path": "app/models/plaid_account/investments/balance_calculator.rb", "line": 58, "quote": "plaid_account.current_balance || plaid_account.available_balance"}, {"kind": "source", "path": "app/models/plaid_account/investments/balance_calculator.rb", "line": 63, "quote": "# True holdings are holdings *less* Plaid's \"pseudo-securities\" (e.g. `CUR:USD` brokerage cash \"holding\")"}], "reason": "Read from BalanceCalculator at head. The comments state the intent, and the code implements the total minus true holdings rule. The brokerage_cash? predicate on Security was not opened, so the classification of pseudo-securities relies on that method's name and the comment.", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}, {"target": "tools/plaid/", "fact_id": "PLAID-009", "op": "ADD", "text": "An account with a plaid_account_id is linked. Account::Syncer rebuilds linked accounts' balances with the reverse calculator and all other accounts with the forward calculator. Accounts created from Plaid are linked by construction (see PLAID-001).", "scope": "app:maybe", "evidence": [{"kind": "source", "path": "app/models/account/syncer.rb", "line": 20, "quote": "strategy = account.linked? ? :reverse : :forward"}, {"kind": "source", "path": "app/models/account/linkable.rb", "line": 10, "quote": "plaid_account_id.present?"}], "reason": "Verified in Account::Syncer and Account::Linkable at head. The rule is shared with the data_migration task, so it is a stable implementation fact. The term 'linked' also belongs in core terminology, which I did not propose here because core is not my target.", "agent": "tool-maintainer:plaid", "rejected_because": "target is not a permitted knowledge Markdown path"}], "no_change": 5, "failures": [], "forks_share_prefix": true}, "b-haiku": {"wall_seconds": 502.7, "exit_code": 0, "ok": true, "cost": 0.47384244000000003, "duration_s": 899.337, "agents": [{"label": "stack-maintainer", "status": "success", "cost": 0.01615929, "turns": 22, "ms": 54125, "inputTokens": 2143, "outputTokens": 11473, "cacheReadInputTokens": 233769, "cacheCreationInputTokens": 39354}, {"label": "conventions-maintainer", "status": "success", "cost": 0.03464303, "turns": 40, "ms": 135296, "inputTokens": 2126, "outputTokens": 29969, "cacheReadInputTokens": 587853, "cacheCreationInputTokens": 67837}, {"label": "terminology-maintainer", "status": "success", "cost": 0.12841538000000002, "turns": 24, "ms": 139990, "inputTokens": 2172, "outputTokens": 31210, "cacheReadInputTokens": 554538, "cacheCreationInputTokens": 116755}, {"label": "pitfalls-maintainer", "status": "success", "cost": 0.08592569, "turns": 22, "ms": 122936, "inputTokens": 2011, "outputTokens": 25230, "cacheReadInputTokens": 436727, "cacheCreationInputTokens": 102889}, {"label": "tool-maintainer:plaid", "status": "success", "cost": 0.025899770000000003, "turns": 43, "ms": 94929, "inputTokens": 2257, "outputTokens": 20239, "cacheReadInputTokens": 566437, "cacheCreationInputTokens": 49451}, {"label": "tool-maintainer:viewcomponent", "status": "success", "cost": 0.15524267, "turns": 54, "ms": 249731, "inputTokens": 2274, "outputTokens": 55565, "cacheReadInputTokens": 1350961, "cacheCreationInputTokens": 109579}, {"label": "cartographer", "status": "success", "cost": 0.0026384800000000003, "turns": 5, "ms": 6267, "inputTokens": 1446, "outputTokens": 1147, "cacheReadInputTokens": 12858, "cacheCreationInputTokens": 8959}, {"label": "writer", "status": "success", "cost": 0.02491813, "turns": 26, "ms": 96063, "inputTokens": 1375, "outputTokens": 24083, "cacheReadInputTokens": 305073, "cacheCreationInputTokens": 48442}], "tokens": {"inputTokens": 15804, "outputTokens": 198916, "cacheReadInputTokens": 4048216, "cacheCreationInputTokens": 543266}, "accepted": [{"target": "core/terminology.md", "fact_id": "TERM-109", "op": "ADD", "scope": "app:maybe", "text": "| TERM-109 | Balance type | How an account's balance is tracked: `cash` (Depository, CreditCard; liquid), `non_cash` (Property, Vehicle, OtherAsset, Loan, OtherLiability) or `investment` (Investment, Crypto; a mix of brokerage cash and holdings). Returned by `Account#balance_type`. | app:maybe |", "reason": "Source comment at app/models/account.rb:145 defines the balance type and its mapping from accountable types is in the same method. The term is used throughout the balance calculators and the activity breakdown but is not in the document yet. Not a tool-only meaning.", "evidence": [{"kind": "source", "path": "app/models/account.rb", "line": 145, "quote": "The balance type determines which \"component\" of balance is being tracked."}, {"kind": "source", "path": "app/models/account.rb", "line": 148, "quote": "\"Cash\" = \"Liquid\""}], "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-110", "op": "ADD", "scope": "app:maybe", "text": "| TERM-110 | Balance components | The raw per-day parts of a Balance, stored as columns: start cash and non-cash balances, cash and non-cash inflows and outflows, net market flows, cash and non-cash adjustments, and `flows_factor`. The end cash, end non-cash and end total balances are generated by the database from these, so they must not be written directly. | app:maybe |", "reason": "The developer asked for raw components rather than income/expense/trades buckets and accepted the layout. The source at head confirms the component list and the generated end columns.", "evidence": [{"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "64dd9fc7-4695-4e74-8e0a-48e0539347d1", "quote": "Start balances split cash and non-cash, then inflows and outflows"}, {"kind": "conversation", "session": "10f5e393-9e77-4e2a-9267-c86a0efa999f", "message": "34a28aa6-e09d-4913-bf7f-c55ee6c14bd3", "quote": "yep go ahead on that"}, {"kind": "source", "path": "app/models/balance.rb", "line": 4, "quote": "The end_cash_balance, end_non_cash_balance and end_balance columns are"}], "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-111", "op": "ADD", "scope": "app:maybe", "text": "| TERM-111 | Inflow and outflow | Flows on a Balance, split by the sign of the entry amount. An inflow is a negative entry amount (money into the account); an outflow is a positive entry amount. Direction follows the entry sign, not the effect on the balance. `flows_factor` (1 for assets, -1 for liabilities) converts flows to balance effects, so a loan payment is an inflow that lowers debt. A fee on a sale is a separate cash outflow, not part of the trade. | app:maybe |", "reason": "The developer stated the sign convention and accepted the entry-sign definition. Source comment in the daily activity object matches the negative-amount rule. Fee treatment was confirmed by the developer in the same session.", "evidence": [{"kind": "conve
