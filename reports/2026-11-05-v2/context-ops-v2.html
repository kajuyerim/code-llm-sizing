eriod range pitfall and the snapdom image.src detail, so coverage of P3 and P5 is thin."}, "b-haiku": {"expected": {"P1-E1": {"verdict": "hit", "records": [0]}, "P1-E2": {"verdict": "hit", "records": [6]}, "P1-E3": {"verdict": "miss", "records": []}, "P2-E1": {"verdict": "hit", "records": [3, 4, 8]}, "P2-E2": {"verdict": "hit", "records": [8]}, "P2-E3": {"verdict": "miss", "records": []}, "P3-E1": {"verdict": "hit", "records": [13]}, "P3-E2": {"verdict": "miss", "records": []}, "P3-E3": {"verdict": "miss", "records": []}, "P5-E1": {"verdict": "hit", "records": [1, 2]}, "P5-E2": {"verdict": "hit", "records": [5]}, "P5-E3": {"verdict": "miss", "records": []}}, "forbidden": {"P1-F1": false, "P2-F1": false, "P3-F1": false, "P4-F1": true}, "extras": [{"record": 7, "verdict": "noise", "note": "Describes the one-off reconciled-toggle search fix from the NO_CHANGE task as a pitfall."}, {"record": 9, "verdict": "supported", "note": "Manual redirects with assertUrlAllowed per hop, a limit of 5 and Authorization dropped cross-origin match app-simplefin.js."}, {"record": 10, "verdict": "supported", "note": "Setup token protocol check, no-follow claim POST and 403 versus other errors match the claim code."}, {"record": 11, "verdict": "supported", "note": "SimpleFIN has no timeout while Enable Banking aborts after REQUEST_TIMEOUT_MS of 30 seconds, as in source."}, {"record": 12, "verdict": "supported", "note": "The integration test runs real undici fetch and dispatcher against 127.0.0.1 port 0 with only config mocked."}, {"record": 14, "verdict": "supported", "note": "customLabel casts PieLabelRenderProps to a local required-field type with an explanatory comment."}, {"record": 15, "verdict": "supported", "note": "DonutGraph.tsx has six props as unknown as ActiveShapeProps casts and keeps ts-strict-ignore, as recorded."}], "notes": "M is accurate and well hedged on currency, undici, donut split and Quarterly facts, with useful verified SimpleFIN detail. It omits the snapdom switch entirely, leaving STACK-105 naming html-to-image, and it turns the P4 reconciled-toggle fix into a pitfall."}, "a-sonnet": {"expected": {"P1-E1": {"verdict": "hit", "records": [0]}, "P1-E2": {"verdict": "hit", "records": [9]}, "P1-E3": {"verdict": "miss", "records": []}, "P2-E1": {"verdict": "hit", "records": [4, 5, 11]}, "P2-E2": {"verdict": "hit", "records": [5, 11]}, "P2-E3": {"verdict": "hit", "records": [8]}, "P3-E1": {"verdict": "hit", "records": [7, 14]}, "P3-E2": {"verdict": "hit", "records": [3]}, "P3-E3": {"verdict": "partial", "records": [3]}, "P5-E1": {"verdict": "hit", "records": [1, 2, 13]}, "P5-E2": {"verdict": "hit", "records": [10, 15]}, "P5-E3": {"verdict": "miss", "records": []}}, "forbidden": {"P1-F1": false, "P2-F1": false, "P3-F1": false, "P4-F1": false}, "extras": [{"record": 6, "verdict": "supported", "note": "Developer stated that new files must not carry ts-strict-ignore and only old files are grandfathered."}, {"record": 12, "verdict": "supported", "note": "Integration test setup and the deferred SimpleFIN timeout match source and the developer's choice."}], "notes": "N has the broadest coverage of required facts, including the component-per-file rule and the [AI] prefix, with no trap violations. Its snapdom record omits the Firefox cause, and PIT-102 contains a confusing 2026-Q key example, but the records are otherwise accurate."}}}, "notes": {"eyebrow": "CMPE 492 \u00b7 Context Ops \u00b7 experiment v2 \u00b7 5 November 2026", "title": "Sweeper-first vs fresh specialists on long, multi-developer conversations", "meta": [["repositories", "3"], ["tasks", "15"], ["developer personas", "9"], ["dev sessions", "18"], ["conditions", "A and B \u00d7 Sonnet 5.5 and Haiku 5.5"], ["runtime", "code-llm-sizing bd65b28"]], "notice": "Each repository is one long push: all five pilot tasks replayed in order by three teammate personas, then frozen and given to every condition with the same base, head, sessions and cutoff. One run per condition. Costs are client-side list-price estimates, not subscription invoices.", "findings": ["<b>With Sonnet, A found 17 of 21 required facts and B found 10.<\/b> A matched or beat B in every repository: maybe 5/5 vs 4/5, actual 8/9 vs 6/9, linkwarden 4/7 vs 0/7. A fell into one of 19 traps, B into none.", "<b>The cost gap shrank from +118% to +28%.<\/b> In the pilot an A run cost $1.22 and a B run $0.56. Here A-Sonnet averages $1.40 and B-Sonnet $1.09 per run, on conversations two to three times longer. Per required fact found, A is now cheaper: $0.25 against $0.33.", "<b>A still costs more because of the sweeper, not the forks.<\/b> The sweeper averages $0.54 per run. The forked specialists are cheaper than fresh ones ($0.11 against $0.16 each): they read the inherited history from the prompt cache and finish in 3 to 6 turns, where a fresh specialist needs 12 to 15.", "<b>A finds more because fresh specialists skim long evidence.<\/b> Every A sweeper read all 6 sessions. B-Sonnet specialists read 2.2 of 6 on average, and 6 of 18 read none; several wrote that they only keyword-searched. A sweeper reads once on behalf of everyone.", "<b>A takes about twice as long.<\/b> 3m 53s against 1m 55s per Sonnet run, because the sweeper has to finish before the forks start.", "<b>Haiku is cheaper but looser.<\/b> B-Haiku is the cheapest condition ($0.37 per run, 11 of 21). A-Haiku reaches 13 of 21 but with 6 partials and 4 traps, and costs 2.7 times B-Haiku: its sweeper reads raw for 40 to 75 turns, and every fork re-reads that large history on each turn. Haiku also proposes far more records, so a reviewer has more to check."], "changes": ["<b>The fork cache fix.<\/b> The pilot's A forks wrote the whole inherited sweeper history to the prompt cache instead of reading it. Two things broke the cache prefix. Each fork received a role-specific system prompt and output schema; now all agents share one role-free system prompt and one schema, and the role arrives as the first user message. Second, the Claude login attached claude.ai MCP connectors to every maintenance agent; they connected asynchronously and changed the tool list between calls. Maintenance agents now run with no MCP servers. A check run confirmed that every fork call reads the full inherited history from the cache.", "<b>The developer persona.<\/b> The pilot persona saw the full acceptance list, the target outline and up to 40k characters of diff, and dictated the solution in its first message. In v2 each task belongs to one of three named teammates with their own seniority and voice. The persona sees only a skim of the diff, describes goals instead of solutions, asks questions, changes its mind, iterates for a few turns before committing, and brings up every planted fact in its own words before it commits.", "<b>Longer, multi-author evidence.<\/b> Instead of five small pushes per repository, the five tasks run back to back as one push of six sessions, so each maintenance run reads 53k to 96k characters of conversation and a large combined diff."], "repos": {"maybe": {"about": "Maybe, a personal finance Rails app. Rewind replay of five real upstream changes: account page consolidation and indexes, design system namespacing, the activity feed balance breakdown, an active-accounts filter, and balance cache columns with self-hosted rate limits.", "commentary": "All conditions found the DS/UI naming change and the balance components. The activity feed term separated them: A-Sonnet and A-Haiku defined it, B-Sonnet missed it. B-Haiku missed the backfill pitfall and the self-hosted rate limits, and turned a one-off form filter into knowledge."}, "actual": {"about": "Actual Budget, a TypeScript budgeting monorepo. Rewind replay: fixed x100 amount scale, undici for the sync server, a DonutGraph split with snapdom export, a search-reset fix, and a Quarterly report interval.", "commentary": "The largest spread on required facts. A-Sonnet found 8 of 9; B-Sonnet missed the one-component-per-file rule, the full-date versus short-key distinction and part of the Firefox export cause. B-Haiku did unusually well here, 7 of 9."}, "linkwarden": {"about": "Linkwarden, a self-hosted bookmark and archive manager. Build-on-top tasks: a link check endpoint, its web UI action, a configurable timeout, a temporary admin requeue button, and a tag chip CSS fix.", "commentary": "B-Sonnet accepted only two records and found none of the required facts; its specialists mostly keyword-searched the six sessions and returned NO_CHANGE. A-Sonnet found 4 of 7. No condition captured the thin route/controller rule or the shared-packages rule."}}, "cost": ["Totals over the three runs per condition. The A sweeper column is the price of reading the evidence once; the specialist column shows that forks are now the cheaper way to give six specialists that context. Writer cost grows with the number of accepted records.", "Wall time is the time of the whole run, including the writer. A runs the sweeper first, so its wall time is roughly sweeper time plus the slowest fork."], "caveats": ["One run per condition and three repositories. Differences of one or two facts per repository are within run-to-run variation; the Sonnet A-versus-B gap (17 against 10) is large enough to report, not to call settled.", "Scores come from one blind reviewer model per repository that saw the four conditions as shuffled labels. It is not a human judgment, and some verdicts are judgment calls (for example strict trap scoring for component rules that restate STACK-103).", "Facts whose planted moment never came up in a conversation are excluded (2 in maybe). Expected facts were written for the pilot's five separate pushes; a combined push can make some of them easier or harder to separate.", "Costs are the SDK's list-price estimates; the runs used a subscription login. Generating the conversations is not included in the maintenance cost.", "The runtime used here (bd65b28) differs from the pilot's prompts and from the archived configurations, so pilot scores and v2 scores are not directly comparable beyond the cost per run.", "The verification run for the cache fix used Haiku on the pilot's maybe P4 push; the v2 runs then confirmed the shared prefix for every fork (shares_cache_prefix true in all six A runs)."], "footer": "Built from ~/Desktop/contextops-eval/sim: archive-v2 (conversations, runs), report-v2 (collect.py, blind.py, scores.json, notes.json, build.py).", "analysis": {"intro": "What the numbers say about the two designs, where the difference comes from, how to bring A's cost down without touching what makes it better, and what to test next. Savings below are estimates from this experiment's per-agent figures; none of the proposed changes has been run yet.", "why": ["<b>Coverage, not cleverness.<\/b> All 11 required facts that B-Sonnet missed or only partly caught were said by a developer in the conversation. A-Sonnet caught 7 of them, and there is no required fact that B caught and A missed. Every A sweeper read all six sessions; B-Sonnet specialists read 2.2 of six on average and six of 18 read none.", "<b>The tool guard hurts fresh specialists most.<\/b> Directory-wide Grep is blocked so that a search cannot sweep up credential files. Fresh specialists tried to grep the six session files, were blocked, and fell back to keyword spot checks or stopped (\"A recursive grep over the conversations was blocked by a hook, and I did not retry\"). Forks never need that search: the conversation is already in their context.", "<b>Turns go to finding, not deciding.<\/b> A fresh Sonnet specialist spends 12 to 15 turns locating evidence and still reads less of it. A fork starts with the sweeper's reading in context and spends 3 to 6 turns judging its own document.", "<b>The writer follows the findings.<\/b> A accepted 47 records over three runs and B 22, so A's writer does more work: $0.20 per run against $0.13. Part of A's extra cost is the cost of writing down more correct knowledge."], "split": [["A \u00b7 Sonnet", [["Sweeper", 0.54], ["6 forked specialists", 0.65], ["Writer", 0.2]], 1.4], ["B \u00b7 Sonnet", [["6 fresh specialists", 0.95], ["Writer", 0.13], ["Cartographer", 0.01]], 1.09]], "split_note": "Average cost per run over the three repositories. A's sweeper takes 97 to 138 seconds before any fork starts; the six forks then run three at a time (27 seconds on average, 52 at most), and the writer adds 30 to 57 seconds.", "levers": [["Writer on Haiku", "The writer only applies records review already accepted. Haiku writers cost $0.01 to $0.03 here against $0.16 to $0.24 for Sonnet.", "about $0.18 per run (13%)", "Write fidelity was not measured; a weaker writer may drop or reword records.", "Run A-Sonnet with a Haiku writer on the same pushes and diff knowledge.patch against the accepted records."], ["Preloaded evidence for the sweeper", "Put the frozen conversation and the diff summary in the sweeper's first message and ask for parallel reads, instead of 20 to 25 turns of one-file-at-a-time reading.", "about $0.15 to $0.25 per run, 30 to 60 s", "The sweeper may explore less application source.", "Compare sweeper turns, cost, handoffs and required facts on the same pushes."], ["All forks at once", "Raise max_parallel from 3 to 6 so the six forks run in one wave.", "no cost change, about 30 to 50 s", "Rate limits on a subscription login.", "Wall time on the same pushes."], ["Fork only on handoff", "Skip owners the sweeper hands nothing to.", "about $0.08 per run at most", "Here the sweeper handed work to every owner and only 3 of 18 forks returned NO_CHANGE, so the gain is small.", "Low priority."], ["Cheaper sweeper, Sonnet forks", "A Haiku sweeper with Sonnet forks.", "not recommended", "The prompt cache is per model, so a cross-model fork re-writes the whole history; A-Haiku's sweeper also reads unselectively for 40 to 75 turns.", "Skip."]], "combined": "Writer on Haiku plus preloaded evidence would bring A-Sonnet from $1.40 to about $1.00 to $1.10 per run, B-Sonnet's level, while keeping the sweeper's full reading and the forks that carry it. Running all forks at once and the shorter sweeper would bring a run from about 3m 53s to roughly 2m 30s to 3m.", "middle": ["<b>C: a shared evidence prefix, no sweeper.<\/b> A's advantage comes from every specialist having the whole conversation in context, and the cache fix makes a shared context cheap. C gives every fresh specialist the same opening: the frozen conversation, the diff summary and the changed-file list, followed by its role. The first specialist writes that prefix to the cache and the others read it, like A's forks, but without the sweeper's 20 to 25 turns. Expected cost is at or below B-Sonnet's $1.09; expected quality is between B and A, because it fixes coverage but loses the sweeper's cross-cutting handoffs and contradictions.", "<b>A smaller fix for B.<\/b> Allow directory Grep inside the evidence pack only (conversation and diff), where there are no credential files, and tell specialists to read every session file. This targets the exact failure seen here at almost no cost."], "when": [["Best knowledge per push", "A \u00b7 Sonnet, with the writer and sweeper levers", "Highest required-fact score (17 of 21), cheapest per fact found ($0.25)."], ["Fast feedback, for example a pre-push hook", "B \u00b7 Sonnet now; C once tested", "About half of A's wall time; misses facts that only appear in long conversations."], ["Lowest spend, drafts for a human", "B \u00b7 Haiku", "$0.37 per run and 11 of 21, but 3 traps and more noise, so every record needs review."], ["Avoid", "A \u00b7 Haiku", "Costs 2.7 times B-Haiku and adds partials and traps; its sweeper reads without selecting."]], "next": ["<b>Repeat before concluding.<\/b> Run A-Sonnet and B-Sonnet three times each on these three pushes to see how much of the 17 against 10 is run-to-run variation (about $22 at this experiment's rates).", "<b>Test the A levers.<\/b> Haiku writer, preloaded evidence and six parallel forks on the same pushes; success means at least 17 of 21 at about B-Sonnet's cost.", "<b>Build and test C and the B Grep fix<\/b> on the same frozen inputs, with the same blind scoring.", "<b>Check the writer.<\/b> Compare each knowledge.patch with its accepted records, for Sonnet and Haiku writers.", "<b>Let knowledge accumulate.<\/b> Apply each push's accepted changes before the next push, instead of resetting to the baseline, to test merging, retirement and duplicates over time.", "<b>Have a person check the scores.<\/b> Spot-check a sample of the blind reviewer's verdicts, especially the trap calls."]}}, "persona": {"pilot": {"n": 65, "median_words": 38, "code_per_msg": 1.7076923076923076, "code_heavy": 0.24615384615384617, "questions": 0.09230769230769231, "short": 0.1076923076923077}, "v2": {"n": 149, "median_words": 44, "code_per_msg": 0.5906040268456376, "code_heavy": 0.06711409395973154, "questions": 0.5771812080536913, "short": 0.026845637583892617}, "examples": [{"pilot_who": "pilot \u00b7 maybe P2 \u00b7 opening", "pilot": "lets split app/components into two namespaces. design system pieces (alert, button, buttonish, dialog, disclosure, filled icon, link, menu, menu item, tab, tabs, toggle) go under DS, app-specific stuff goes under UI. name them like DS::ButtonComponent, DS::LinkComponent and so on. update the render calls, previews and component tests too.", "v2_who": "v2 \u00b7 maybe P2 \u00b7 Zach \u00b7 opening", "v2": "app/components is a mess, design system stuff (buttons, links, menus, dialogs) is mixed in with app specific components. can we split it, DS namespace for the design system pieces and UI for the app specific ones? name them like DS::ButtonComponent, DS::LinkComponent and so on"}, {"pilot_who": "pilot \u00b7 actual P2 \u00b7 opening", "pilot": "got a user report: simplefin bank sync fails on the latest nightly, it was fine before. i suspect the global fetch in the sync server. can you look into it and get server code onto undici?", "v2_who": "v2 \u00b7 actual P2 \u00b7 Omar \u00b7 opening", "v2": "Hi! So a user reported on Discord that SimpleFIN bank sync stopped working for them on the latest nightly build. It was fine before, so I'm suspicious of the global fetch the sync server uses in a few places. Could we get the server code onto undici instead? I'm not totally sure where all the fetch calls live, sorry, could you have a look around?"}, {"pilot_who": "pilot \u00b7 linkwarden P1 \u00b7 opening", "pilot": "hey, i want an endpoint to check if a saved link is still alive. POST /api/v1/links/[id]/check, it requests the link's url and returns { status, ok, checkedAt }. api only, no ui yet. add unit tests for it too", "v2_who": "v2 \u00b7 linkwarden P1 \u00b7 Sam \u00b7 opening", "v2": "people keep asking if a saved link is still alive or dead. can we add an endpoint that checks a link's url and tells you? api only for now, ui comes later"}]}, "cache_check": [{"title": "Tokens per specialist, Sonnet (average)", "caption": "Pilot A forks (73) re-wrote the inherited sweeper history to the prompt cache. v2 A forks (18) read it instead. v2 B specialists (18) for comparison.", "rows": [{"group": "Pilot A forks", "cond": "a-sonnet", "label": "cache write", "value": 42327.479452054795}, {"group": "Pilot A forks", "cond": "a-haiku", "label": "cache read", "value": 24289.657534246577}, {"group": "v2 A forks", "cond": "a-sonnet", "label": "cache write", "value": 14040.0}, {"group": "v2 A forks", "cond": "a-haiku", "label": "cache read", "value": 206962.16666666666}, {"group": "v2 B specialists", "cond": "b-sonnet", "label": "cache write", "value": 26530.222222222223}, {"group": "v2 B specialists", "cond": "b-haiku", "label": "cache read", "value": 119780.11111111111}]}], "generation": "Generating the conversations (persona plus development agent, list-price estimate, not part of the maintenance cost above): maybe $7.48, actual $8.18, linkwarden $3.15."}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = ['a-sonnet', 'b-sonnet', 'a-haiku', 'b-haiku'];
const CN = {'a-sonnet': 'A · Sonnet', 'b-sonnet': 'B · Sonnet', 'a-haiku': 'A · Haiku', 'b-haiku': 'B · Haiku'};
const VERDICT = {hit: 'Caught', partial: 'Partly caught', miss: 'Did not catch'};
const HEADERS = {
  'core/naming-conventions.md': ['ID', 'Convention', 'Scope'],
  'core/pitfalls.md': ['ID', 'Trigger', 'What goes wrong', 'Do instead', 'Scope'],
  'core/tech-stack-standards.md': ['ID', 'Standard', 'Level', 'Scope'],
  'core/terminology.md': ['ID', 'Term', 'Meaning', 'Scope'],
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const usd = v => v == null ? '–' : '$' + v.toFixed(v < 1 ? 3 : 2);
const secs = v => v == null ? '–' : (v >= 60 ? Math.floor(v / 60) + 'm ' + String(Math.round(v % 60)).padStart(2, '0') + 's' : Math.round(v) + 's');
const ktok = v => v == null ? '–' : (v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : Math.round(v / 1e3) + 'k');
const condTag = c => `<span class="cond"><span class="sw c-${c}"></span>${CN[c]}</span>`;
const scoreOf = (repo, c) => ((D.scores || {})[repo] || {})[c];
const hhmm = iso => { try { return new Date(iso).toISOString().slice(11, 16) + ' UTC'; } catch (e) { return ''; } };

// Markdown: raw HTML in agent text is shown as text, never interpreted.
let md = s => `<p>${esc(s).replace(/\n/g, '<br>')}</p>`;
if (window.marked) {
  const renderer = new marked.Renderer();
  renderer.html = h => esc(h);
  marked.setOptions({gfm: true, breaks: true, mangle: false, headerIds: false, renderer});
  md = s => marked.parse(String(s ?? ''));
}
const fileOf = t => String(t || '').replace(/^products\//, 'tools/');
function headerFor(file, cols) {
  const h = HEADERS[file] || (/^tools\/[^/]+\/README\.md$/.test(file) ? ['ID', 'Fact', 'Scope'] : null);
  const hh = h && h.length === cols ? h : ['ID', ...Array(Math.max(cols - 1, 0)).fill(' ')];
  return '| ' + hh.join(' | ') + ' |\n|' + hh.map(() => ' --- ').join('|') + '|\n';
}
function asFileMd(file, text) {
  const t = String(text || '').trim();
  if (t.startsWith('|') && !/^\|\s*ID\s*\|/.test(t)) {
    const first = t.split('\n')[0];
    const cols = (first.match(/(?<!\\)\|/g) || []).length - 1;
    return headerFor(fileOf(file), cols) + t;
  }
  return t;
}
const mdBox = (file, text, cls = '') => `<div class="mdcard"><span class="file">${esc(fileOf(file))}</span><div class="mdbox md ${cls}">${md(asFileMd(file, text))}</div></div>`;

function mateIndex(repo, key) { return Object.keys(repo.mates).indexOf(key); }
function initials(name) { return String(name || '?').slice(0, 1).toUpperCase(); }

function tally(c) {
  const t = {req: 0, reqHit: 0, reqPartial: 0, opt: 0, optHit: 0, traps: 0, trapsHit: 0, supported: 0, noise: 0, unsupported: 0, cost: 0, wall: 0};
  for (const r of D.repos) {
    const s = scoreOf(r.repo, c), cond = r.conditions[c];
    if (cond && cond.ok) { t.cost += cond.cost || 0; t.wall += cond.wall_seconds || 0; }
    if (!s) continue;
    for (const f of r.facts.filter(f => f.delivered)) {
      const v = (s.expected[f.id] || {}).verdict;
      if (f.required) { t.req++; if (v === 'hit') t.reqHit++; if (v === 'partial') t.reqPartial++; }
      else { t.opt++; if (v === 'hit') t.optHit++; }
    }
    for (const tr of r.traps) { t.traps++; if (s.forbidden[tr.id]) t.trapsHit++; }
    for (const e of s.extras || []) t[e.verdict] = (t[e.verdict] || 0) + 1;
  }
  return t;
}

function barChart(rows, valueFmt) {
  const W = 640, L = 150, R = 76, H = 20, gap = 6, groupGap = 14;
  let y = 4, last = null; const parts = [];
  const m = Math.max(...rows.map(r => r.value || 0), 1e-9);
  for (const r of rows) {
    if (r.group !== last) { if (last !== null) y += groupGap; parts.push(`<text class="lbl" x="0" y="${y + 13}">${esc(r.group)}</text>`); y += 20; last = r.group; }
    const w = Math.max(1, (W - L - R) * (r.value || 0) / m);
    parts.push(`<text class="axis" x="${L - 8}" y="${y + H / 2 + 4}" text-anchor="end">${esc(r.label || CN[r.cond])}</text>`);
    parts.push(`<rect class="f-${r.cond}" x="${L}" y="${y}" width="${w}" height="${H}" rx="3"><title>${esc(r.label || CN[r.cond])}: ${valueFmt(r.value)}</title></rect>`);
    parts.push(`<text class="val" x="${L + w + 6}" y="${y + H / 2 + 4}">${valueFmt(r.value)}</text>`);
    y += H + gap;
  }
  return `<svg viewBox="0 0 ${W} ${y + 4}" role="img">${parts.join('')}</svg>`;
}

function factCard(r, f) {
  const src = f.source, exp = f.expected_md;
  const head = `<div class="fact-head" id="fact-${r.repo}-${f.id}"><span class="fid">${f.id}</span>${f.required ? '<span class="tag req">required</span>' : '<span class="tag">optional</span>'}<span class="small muted">task ${f.task} · ${esc(f.mate)}</span></div>`;
  let left = '';
  if (src) {
    left += `<div class="said"><span class="who">Said by ${esc(f.mate)} · session ${src.session}, turn ${src.turn}</span>
      <div class="bubble dev"><div class="md">${md(src.message)}</div></div>
      <a class="jump" href="#conversations" data-open="${r.repo}|${f.task}|${src.session}|${src.turn}">Open in the conversation →</a></div>`;
  } else if (f.delivered) {
    left += `<p class="small muted">Comes from the code change itself (the existing entry is stale after this push), not from one message.</p>`;
  } else {
    left += `<p class="small muted">This planted fact never came up in the conversation, so it is excluded from scoring.</p>`;
  }
  left += exp ? `<div class="mdcard"><span class="who">Expected change · ${esc(f.op || '')}</span>${mdBox(exp.file, exp.row, 'expected')}</div>`
             : `<div class="mdcard"><span class="who">Expected change</span><p>${esc(f.gist)}</p></div>`;
  if (!f.delivered) return `<article class="fact excluded">${head}<div class="fact-body"><div class="fact-left">${left}</div></div></article>`;
  let right = '';
  for (const c of C) {
    const s = scoreOf(r.repo, c), cond = r.conditions[c];
    const v = (s && s.expected[f.id]) || {};
    const verdict = v.verdict || 'miss';
    const recs = (v.records || []).map(i => cond && cond.accepted[i]).filter(Boolean);
    right += `<div class="verdict"><div class="vh">${condTag(c)}<span class="pill ${verdict}">${VERDICT[verdict] || verdict}</span></div>
      ${recs.length ? `<span class="proposed">Proposed this:</span>${recs.map(x => mdBox(x.target, x.text)).join('')}` : `<span class="nocatch">No accepted record carries this fact.</span>`}</div>`;
  }
  return `<article class="fact">${head}<div class="fact-body"><div class="fact-left">${left}</div><div class="fact-right">${right}</div></div></article>`;
}

function renderThread(repoName, taskId) {
  const r = D.repos.find(x => x.repo === repoName); const th = r.conversations.find(t => t.task === taskId);
  const mi = mateIndex(r, th.mate_key);
  document.querySelectorAll('.thread').forEach(b => b.setAttribute('aria-current', b.dataset.key === repoName + '|' + taskId ? 'true' : 'false'));
  const sel = document.getElementById('thread-select'); if (sel) sel.value = repoName + '|' + taskId;
  document.getElementById('pane-head').innerHTML = `<span class="av m${mi}">${initials(th.mate)}</span><div class="pt"><b>${esc(th.mate)} · ${esc(repoName)} ${th.task}</b><span>${esc(th.title)}</span></div>`;
  let h = '';
  for (const s of th.sessions) {
    h += `<div class="sep">Session ${s.n}${s.n > 1 ? ' · fresh agent session' : ''}</div>`;
    for (const m of s.messages) {
      if (m.role === 'dev') {
        const chips = (m.marks || []).map(id => `<a class="mark-chip${/-F\d/.test(id) ? ' trapc' : ''}" href="#fact-${repoName}-${id}">${/-F\d/.test(id) ? 'trap ' : 'plants '}${id}</a>`).join('');
        h += `<div class="row dev" id="msg-${repoName}-${th.task}-${s.n}-${m.turn}"><span class="av sm m${mi}">${initials(th.mate)}</span><div class="col"><span class="stamp">${esc(th.mate)} · ${hhmm(m.at)}</span><div class="bubble dev"><div class="md">${md(m.text)}</div></div>${chips ? `<div class="marks">${chips}</div>` : ''}</div></div>`;
      } else {
        const tools = m.tools && m.tools.length ? `<details class="tools"><summary>Used ${m.tools.length} tool${m.tools.length > 1 ? 's' : ''}</summary><ol>${m.tools.map(t => `<li>${esc(t)}</li>`).join('')}</ol></details>` : '';
        const body = m.text ? `<div class="bubble ${m.role === 'stop' ? 'stop' : 'agent'}">${m.role === 'stop' ? `<div class="small"><b>Driver:</b> ${esc(m.user || '')}</div>` : ''}<div class="md">${md(m.text)}</div></div>` : '';
        h += `<div class="row ${m.role === 'stop' ? 'stop' : 'agent'}"><span class="av sm agentav">C</span><div class="col"><span class="stamp">Claude Code · ${hhmm(m.at)}</span>${body}${tools}</div></div>`;
      }
    }
  }
  const feed = document.getElementById('feed'); feed.innerHTML = h; feed.scrollTop = 0;
}

function openMessage(repoName, task, session, turn) {
  renderThread(repoName, task);
  document.getElementById('conversations').scrollIntoView();
  const el = document.getElementById(`msg-${repoName}-${task}-${session}-${turn}`);
  if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2400); }
}

function render() {
  const N = D.notes || {};
  const nav = [['overview', 'Overview'], ['changes', 'What changed'], ['analysis', 'Analysis'], ...D.repos.map(r => [r.repo, r.repo]), ['conversations', 'Conversations'], ['cost', 'Cost and time'], ['caveats', 'Caveats']];
  document.getElementById('nav').innerHTML = nav.map(([id, l]) => `<a href="#${id}" data-sec="${id}">${esc(l)}</a>`).join('');
  const T = Object.fromEntries(C.map(c => [c, tally(c)]));
  const totalFacts = D.repos.reduce((n, r) => n + r.facts.filter(f => f.delivered).length, 0);
  let h = '';

  h += `<section id="overview"><div class="prose" style="max-width:none;gap:18px">
    <div class="eyebrow">${esc(N.eyebrow || '')}</div><h1>${esc(N.title || '')}</h1>
    <div class="meta">${(N.meta || []).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('')}</div>
    <p class="notice">${N.notice || ''}</p><div class="legend">${C.map(condTag).join('')}</div></div>
    <ol class="findings">${(N.findings || []).map(f => `<li>${f}</li>`).join('')}</ol>
    <div class="table-wrap"><table class="data"><thead><tr><th>Condition</th><th class="r">Required facts</th><th class="r">Partly</th><th class="r">Optional</th><th class="r">Traps</th><th class="r">Supported extras</th><th class="r">Noise or unsupported</th><th class="r">Cost, 3 runs</th><th class="r">Wall time, 3 runs</th></tr></thead><tbody>
    ${C.map(c => { const t = T[c]; return `<tr><td>${condTag(c)}</td><td class="r"><span class="big">${t.reqHit}</span> / ${t.req}</td><td class="r">${t.reqPartial}</td><td class="r">${t.optHit} / ${t.opt}</td><td class="r">${t.trapsHit} / ${t.traps}</td><td class="r">${t.supported || 0}</td><td class="r">${(t.noise || 0) + (t.unsupported || 0)}</td><td class="r">${usd(t.cost)}</td><td class="r">${secs(t.wall)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="small muted">${totalFacts} expected facts actually came up in the conversations. A fact counts once per condition: caught means an accepted knowledge record states it with the right meaning. A blind reviewer saw the four conditions as anonymous labels.</p></section>`;

  const P = D.persona || {};
  h += `<section id="changes"><div class="prose"><div class="eyebrow">Since the pilot</div><h2>What changed</h2>${(N.changes || []).map(p => `<p>${p}</p>`).join('')}</div>
    <div class="cols">${(D.cache_check || []).map(cc => `<div class="panel chart"><h4>${esc(cc.title)}</h4><p class="small muted">${esc(cc.caption)}</p>${barChart(cc.rows, ktok)}</div>`).join('')}</div>
    ${P.pilot ? `<h3>The developer persona</h3><div class="table-wrap"><table class="data"><thead><tr><th>Developer messages</th><th class="r">Words, median</th><th class="r">Code names per message</th><th class="r">Messages with 3+ code names</th><th class="r">Ask a question</th></tr></thead><tbody>
      ${[['Pilot, one spec-like developer', P.pilot], ['v2, three teammates per repository', P.v2]].map(([l, s]) => `<tr><td>${l}<br><span class="small muted">${s.n} messages</span></td><td class="r">${s.median_words}</td><td class="r">${s.code_per_msg.toFixed(1)}</td><td class="r">${Math.round(s.code_heavy * 100)}%</td><td class="r">${Math.round(s.questions * 100)}%</td></tr>`).join('')}</tbody></table></div>
      <div class="compare">${(P.examples || []).map(e => `<div class="pair"><span class="who">${esc(e.pilot_who)}</span><div class="bubble dev" style="opacity:.8"><div class="md">${md(e.pilot)}</div></div><span class="who">${esc(e.v2_who)}</span><div class="bubble dev"><div class="md">${md(e.v2)}</div></div></div>`).join('')}</div>` : ''}</section>`;

  const A = N.analysis || {};
  if (A.why) {
    const shade = ['var(--a)', 'var(--a-lt)', '#c9b8a6', 'var(--b)', 'var(--b-lt)', '#a9c7bd'];
    const maxTot = Math.max(...A.split.map(([, parts]) => parts.reduce((n, [, v]) => n + v, 0)));
    h += `<section id="analysis"><div class="prose"><div class="eyebrow">Conclusions for the project</div><h2>Analysis and next steps</h2><p class="muted">${A.intro}</p></div>
      <h3>Where the difference comes from</h3><div class="why">${A.why.map(w => `<div class="panel"><p>${w}</p></div>`).join('')}</div>
      <h3>Where A's money goes</h3><div class="panel split">${A.split.map(([label, parts, measured], gi) => { const tot = parts.reduce((n, [, v]) => n + v, 0);
        return `<div class="split-row"><span class="cond"><span class="sw c-${gi ? 'b' : 'a'}-sonnet"></span>${esc(label)}</span><div class="split-bar" style="width:${(tot / maxTot * 100).toFixed(1)}%">${parts.map(([n, v], i) => `<span style="width:${(v / tot * 100).toFixed(1)}%;background:${shade[gi * 3 + i]}" title="${esc(n)}: $${v.toFixed(2)}">${esc(n)} $${v.toFixed(2)}</span>`).join('')}</div><span class="split-tot">$${(measured ?? tot).toFixed(2)}</span></div>`; }).join('')}<p class="small muted">${esc(A.split_note)}</p></div>
      <h3>Making A cheaper without changing what makes it better</h3>
      <div class="table-wrap"><table class="data levers"><thead><tr><th>Lever</th><th>What changes</th><th>Estimated saving</th><th>Risk</th><th>How to test</th></tr></thead><tbody>${A.levers.map(([l, w, sv, r, t]) => `<tr><td>${esc(l)}</td><td>${esc(w)}</td><td class="save">${esc(sv)}</td><td>${esc(r)}</td><td>${esc(t)}</td></tr>`).join('')}</tbody></table></div>
      <p class="callout">${esc(A.combined)}</p>
      <h3>A middle way</h3><div class="prose">${A.middle.map(m => `<p>${m}</p>`).join('')}</div>
      <h3>Which to use when</h3><div class="table-wrap"><table class="data"><thead><tr><th>Goal</th><th>Choose</th><th>Why</th></tr></thead><tbody>${A.when.map(([g, c, w]) => `<tr><td>${esc(g)}</td><td><b>${esc(c)}</b></td><td>${esc(w)}</td></tr>`).join('')}</tbody></table></div>
      <h3>Next experiments</h3><ol class="next">${A.next.map(x => `<li>${x}</li>`).join('')}</ol></section>`;
  }

  for (const r of D.repos) {
    const RN = (N.repos || {})[r.repo] || {};
    h += `<section id="${r.repo}"><div class="prose"><div class="eyebrow">Repository</div><h2>${esc(r.repo)}</h2><p>${RN.about || ''}</p>
      <div class="meta"><span>tasks <b>${r.tasks.length}</b></span><span>dev sessions <b>${r.sessions}</b></span><span>developer turns <b>${r.persona_turns}</b></span><span>conversation <b>${(r.chars / 1000).toFixed(0)}k chars</b></span><span>commits <b>${r.commits}</b></span></div>
      ${RN.commentary ? `<p class="muted">${RN.commentary}</p>` : ''}</div>
      <div class="mates">${Object.entries(r.mates).map(([k, m], i) => `<div class="mate"><span class="av m${i}">${initials(m.name)}</span><b>${esc(m.name)}</b><span>${esc(m.identity)}</span><span class="muted">${esc(m.style)}</span></div>`).join('')}</div>
      <ul class="tasks">${r.tasks.map(t => `<li><span class="tid">${t.id}</span><span class="tm">${esc(t.mate)}</span><span class="tt">${esc(t.task)} <span class="small muted">${t.sessions} session${t.sessions > 1 ? 's' : ''}, ${t.persona_turns} turns · <a href="#conversations" data-open="${r.repo}|${t.id}">read the conversation</a></span></span></li>`).join('')}</ul>
      <h3>What should have been learned, and what each condition proposed</h3><div>${r.facts.map(f => factCard(r, f)).join('')}</div>`;
    if (r.traps.length) {
      h += `<h3>Traps</h3><div class="table-wrap">${r.traps.map(tr => `<div class="trap" id="fact-${r.repo}-${tr.id}"><div><b class="fid">${tr.id}</b> ${esc(tr.gist)}${tr.source ? `<div class="small muted">“${esc(tr.source.message)}”</div>` : ''}</div><div class="trapmarks">${C.map(c => { const s = scoreOf(r.repo, c); if (!s) return ''; const bad = s.forbidden[tr.id]; return `<span class="${bad ? 'tm-bad' : 'tm-ok'}"><span class="sw c-${c}"></span>${bad ? 'fell in' : 'avoided'}</span>`; }).join('')}</div></div>`).join('')}</div>`;
    }
    h += `<details class="more"><summary>Other records each condition proposed</summary><div class="cols">${C.map(c => {
      const s = scoreOf(r.repo, c), cond = r.conditions[c]; if (!s || !cond) return '';
      return `<div class="panel"><h4>${condTag(c)}</h4>${(s.extras || []).map(e => { const x = cond.accepted[e.record]; return x ? `<div style="display:grid;gap:6px"><span class="pill ${e.verdict === 'supported' ? 'hit' : e.verdict === 'noise' ? 'partial' : 'miss'}" style="justify-self:start">${e.verdict}</span>${mdBox(x.target, x.text)}<span class="small muted">${esc(e.note)}</span></div>` : ''; }).join('') || '<span class="nocatch">None.</span>'}<p class="small muted">${esc(s.notes || '')}</p></div>`;
    }).join('')}</div></details></section>`;
  }

  const options = D.repos.map(r => `<optgroup label="${r.repo}">${r.conversations.map(t => `<option value="${r.repo}|${t.task}">${t.task} · ${esc(t.mate)} · ${esc(t.title.slice(0, 60))}</option>`).join('')}</optgroup>`).join('');
  h += `<section id="conversations"><div class="prose"><div class="eyebrow">Evidence</div><h2>Conversations</h2><p class="muted">Every developer and agent message the maintenance runs read, one thread per task. Gold chips mark the message that planted an expected fact; rust chips mark a trap. Tool calls are folded; tool output and thinking are not part of the evidence.</p></div>
    <div class="chat-app"><aside class="threads">${D.repos.map(r => `<h4>${r.repo}</h4>${r.conversations.map(t => { const mi = mateIndex(r, t.mate_key); const n = t.sessions.reduce((a, s) => a + s.messages.length, 0); return `<button class="thread" data-key="${r.repo}|${t.task}"><span class="av m${mi}">${initials(t.mate)}</span><span class="tn">${esc(t.mate)} <span>${t.task} · ${n}</span></span><span class="tp">${esc(t.title)}</span></button>`; }).join('')}`).join('')}</aside>
    <div class="pane"><div><select class="thread-select" id="thread-select" aria-label="Conversation">${options}</select><div class="pane-head" id="pane-head"></div></div><div class="feed" id="feed"></div></div></div></section>`;

  const rows = key => D.repos.flatMap(r => C.map(c => ({group: r.repo, cond: c, value: (r.conditions[c] || {})[key]})));
  h += `<section id="cost"><div class="prose"><div class="eyebrow">Resources</div><h2>Cost and time</h2>${(N.cost || []).map(p => `<p>${p}</p>`).join('')}</div>
    <div class="cols"><div class="panel chart"><h4>Cost per run, list-price estimate</h4>${barChart(rows('cost'), usd)}</div><div class="panel chart"><h4>Wall time per run</h4>${barChart(rows('wall_seconds'), secs)}</div></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Repository</th><th>Condition</th><th class="r">Cost</th><th class="r">Wall time</th><th class="r">Sweeper</th><th class="r">Specialists</th><th class="r">Writer</th><th class="r">Cache read</th><th class="r">Cache write</th><th class="r">Output</th><th class="r">Agent turns</th><th class="r">Accepted</th></tr></thead><tbody>
    ${D.repos.map(r => C.map(c => { const x = r.conditions[c]; if (!x || !x.agents) return `<tr><td>${r.repo}</td><td>${condTag(c)}</td><td colspan="10" class="muted">not run</td></tr>`;
      const part = re => x.agents.filter(a => re.test(a.label)).reduce((n, a) => n + a.cost, 0);
      return `<tr><td>${r.repo}</td><td>${condTag(c)}</td><td class="r">${usd(x.cost)}</td><td class="r">${secs(x.wall_seconds)}</td><td class="r">${c.startsWith('a') ? usd(part(/^sweeper$/)) : '–'}</td><td class="r">${usd(part(/maintainer/))}</td><td class="r">${usd(part(/^writer$/))}</td><td class="r">${ktok(x.tokens.cacheReadInputTokens)}</td><td class="r">${ktok(x.tokens.cacheCreationInputTokens)}</td><td class="r">${ktok(x.tokens.outputTokens)}</td><td class="r">${x.agents.reduce((n, a) => n + a.turns, 0)}</td><td class="r">${x.accepted.length}</td></tr>`; }).join('')).join('')}
    ${C.map(c => `<tr class="total"><td>All three</td><td>${condTag(c)}</td><td class="r">${usd(T[c].cost)}</td><td class="r">${secs(T[c].wall)}</td><td colspan="8"></td></tr>`).join('')}
    </tbody></table></div>${D.generation ? `<p class="small muted">${D.generation}</p>` : ''}</section>`;

  h += `<section id="caveats"><div class="prose"><div class="eyebrow">Read with care</div><h2>Caveats</h2></div><ul class="caveats">${(N.caveats || []).map(c => `<li>${c}</li>`).join('')}</ul><footer>${N.footer || ''}</footer></section>`;
  document.getElementById('app').innerHTML = h;

  document.querySelectorAll('.thread').forEach(b => b.addEventListener('click', () => { const [rp, t] = b.dataset.key.split('|'); renderThread(rp, t); }));
  document.getElementById('thread-select').addEventListener('change', e => { const [rp, t] = e.target.value.split('|'); renderThread(rp, t); });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-open]'); if (!a) return;
    e.preventDefault(); const [rp, t, s, turn] = a.dataset.open.split('|');
    if (s) openMessage(rp, t, s, turn); else { renderThread(rp, t); document.getElementById('conversations').scrollIntoView(); }
  });
  renderThread(D.repos[0].repo, D.repos[0].conversations[0].task);
  const links = [...document.querySelectorAll('.nav a[data-sec]')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) links.forEach(a => a.setAttribute('aria-current', a.dataset.sec === e.target.id ? 'true' : 'false'));
    }, {rootMargin: '-45% 0px -50% 0px'});
    document.querySelectorAll('#app > section').forEach(sec => io.observe(sec));
  }
}
render();
// The sections exist only after rendering, so honour a #section link once they do.
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView({behavior: 'auto'}); }
</script>
</body>
</html>
