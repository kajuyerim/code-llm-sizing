ng during web font embedding, so it makes sense that snapdom fixes it. Glad html-to-image is out of the package.json too.\n\nOne gripe: the ts-strict-ignore you put back on donutLabel.ts. New files shouldn't carry that, we only grandfather the old ones. Can you give customLabel proper types instead? It's one function, shouldn't be bad.\n\nThen can you add release notes for both changes, the donut split and the snapshot fix? Keep them short.", "reply": "`customLabel` now has real types and `donutLabel.ts` no longer has `ts-strict-ignore`. I also added the two release notes. Strict typecheck passes, `yarn lint` is clean, and the reports tests still pass (34 files, 462 tests). Nothing is committed.\n\n**`customLabel` types**\n- The parameter is `PieLabelRenderProps` from recharts. Recharts types `cx`, `midAngle` and the other fields as optional, even though it always supplies them for pie slices. So the function casts to a small local type with those fields required, and a comment says why. I chose that over null-handling inside the function, which would have changed runtime behaviour.\n- `display` can be `false` when a slice's value is 0, and ..."}, "expected_md": {"file": "core/pitfalls.md", "row": "| PIT-103 | Exporting a report snapshot as an image | html-to-image aborts in Firefox while embedding fonts, and snapdom's `toPng` resolves to an `HTMLImageElement`, not a data URL | Use snapdom and read `image.src` for the download link | app:actual |"}}, {"id": "P5-E1", "task": "P5", "mate": "Lena", "gist": "Custom report intervals include Quarterly; a quarter is keyed by its first month (2026-07 for Q3 2026) and labelled Q3 '26; data is queried by month and rolled up", "target": "core/terminology.md", "op": "UPDATE", "owner": "terminology", "required": true, "from": "M1", "delivered": true, "source": {"session": 1, "turn": 2, "message": "client-side rollup sounds right, same as weekly. no aql changes. for the quarter key, use the first month so q3 2026 is 2026-07, and label it Q3 '26. go ahead, skip networth/forecast/spending for now", "reply": "Core logic is in: the `months.ts` helpers, the month-level query, and the client-side rollup. Now I'm wiring Quarterly into `ReportOptions` and the hardcoded branches.\n\nNext I'm checking the remaining interval switches (`reportRanges`, `ReportLegend`, the table header), then typecheck and tests.\n\nTypecheck passes. `oxfmt` won't run on this Node 18, so I'll fix the long line by hand and add tests.\n\nVitest needs a newer Node than the 18 on PATH. Checking for another install.\n\nQuarterly is now an interval option for custom reports. Typecheck, oxlint, and the tests pass (465 in `desktop-client/reports`, plus the `months` tests). I haven't run the app and checked the chart, so that's still to ..."}, "expected_md": {"file": "core/terminology.md", "row": "| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, Quarterly, or Yearly. Monthly is the default. A quarter is keyed by its first month (`2026-07` for Q3 2026), labelled `Q3 '26`, and rolled up from monthly data. | app:actual |"}}, {"id": "P5-E2", "task": "P5", "mate": "Lena", "gist": "Comparing a full date against a shorter period key treats same-period From/To ranges as reversed; compare computed full dates", "target": "core/pitfalls.md", "op": "ADD", "owner": "pitfalls", "required": true, "from": "M2", "delivered": true, "source": {"session": 2, "turn": 2, "message": "ah nice, so it was comparing the full From date against the short period key, which sorts wrong. comparing real computed dates is the right call. does the fallback still give four whole quarters when one end actually passes the other?", "reply": "Yes. The fallback still gives four whole quarters when one end passes the other, and the existing tests cover it.\n\n- **To moved before From:** the fallback sets From to the first day of the quarter nine months before the picked quarter. With From at `2016-07-01` and To picked ession": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "skip networth/forecast/spending for now"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportOptions.ts", "line": 286, "quote": "key: 'Quarterly',"}], "reason": "Quarterly was added as an interval and accepted by the developer. The Net Worth/Forecast/Spending exclusion is described as 'for now', so it is kept as a current-state note.", "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-107", "op": "ADD", "text": "| TERM-107 | Quarter key | The identifier of a quarter in custom reports: the first month of the quarter in `yyyy-MM` form, so Q3 2026 is `2026-07`. It is displayed as `Q3 '26`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "use the first month so q3 2026 is 2026-07, and label it Q3 '26"}, {"kind": "source", "path": "packages/loot-core/src/shared/months.ts", "line": 94, "quote": "export function quarterFromDate(date: DateLike): string {"}], "reason": "Developer-stated definition that is not obvious from code and is needed to interpret quarter values.", "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-105", "op": "UPDATE", "text": "| STACK-105 | Report graphs are built with Recharts. The \"Download Snapshot\" action on reports captures the report with snapdom (`@zumer/snapdom`): `snapdom.toPng(element)` returns an image element, so use its `src` as the download link href. html-to-image is no longer used. | requirement | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportTopbar.tsx", "line": 75, "quote": "await snapdom.toPng(reportElement)"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "e72d768a-19f3-48f7-841b-fbefcd49a705", "quote": "i want to swap it for snapdom"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "1968406d-8b38-42a1-a4f2-f3631e7f9995", "quote": "snapdom's toPng gives you an img element, not a data url"}], "reason": "Developer decided the swap and source at head imports snapdom in ReportTopbar. The baseline text naming html-to-image's toPng is stale. Caveat: packages/desktop-client/package.json at head still lists html-to-image (line 190) although no source import was found in ReportTopbar and yarn.lock drops it, so the wording says it is no longer used by the code and makes no claim about the manifest. The Firefox fix is untested and is not stated as fact.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-104", "op": "UPDATE", "text": "| STACK-104 | The sync server runs on Express 5 and Node 22.19.0 or newer (`\"node\": \">=22.19.0\"` in its package manifest; the root manifest floor is lower and the two are allowed to differ). It is mostly JavaScript and moving to TypeScript. | requirement | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/package.json", "line": 132, "quote": "\"node\": \">=22.19.0\""}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "56238ec1-3d78-4ec3-9516-6ffe31efe243", "quote": "keep it at >=22.19.0 and don't revert it"}], "reason": "The developer explicitly kept the higher floor for the sync server and said different floors are fine. No rationale was given, so none is recorded. The Express 5 claim is preserved from the baseline and was not re-verified.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-107", "op": "ADD", "text": "| STACK-107 | Sync server code imports `fetch` explicitly from `undici` and never uses Node's global `fetch`; tests mock `undici`'s `fetch` rather than stubbing the global. Do not add another HTTP client library (such as axios or node-fetch) to the server. SimpleFIN passes an undici `Agent` as `dispatcher` (the SSRF guard), and Node's built-in fetch bundles a different undici version. | requirement | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "fe370a12-46b9-470c-8115-39752c432913", "quote": "server code imports fetch from undici explicitly and never relies on the global one"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "I don't want another HTTP library on the server"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}], "reason": "The developer stated the rule and declined other HTTP libraries, and the code adopted it across the sync server call sites. The suspicion that the mixed versions broke SimpleFIN was never reproduced, so it is left out as a cause. The rule is not lint-enforced.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-108", "op": "ADD", "text": "| STACK-108 | New TypeScript files must not carry `// @ts-strict-ignore`; only existing files are grandfathered (for example `DonutGraph.tsx`). Give new code real types instead. | requirement | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "1968406d-8b38-42a1-a4f2-f3631e7f9995", "quote": "New files shouldn't carry that, we only grandfather the old ones"}], "reason": "Explicit developer statement, and the agent removed the directive from the new donutLabel.ts accordingly. This is app-scoped; the sweeper's candidates for oxfmt and oxlint tooling were not recorded because no decision supports them as standards.", "agent": "stack-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-104", "op": "ADD", "text": "| NAME-104 | Put each React component in its own file. Do not export two components from one file. A type shared by sibling components goes in its own small file so neither component imports from the other (for example `ActiveShapeMobile.tsx`, `ActiveShapeDesktop.tsx` and `activeShapeProps.ts`). Files that export plain functions or types use camelCase names (for example `donutColors.ts`, `donutLabel.ts`), matching `adjustTextSize.ts`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "6d99f24a-b085-4a98-9ccf-2d2c5690d126", "quote": "that's two components in one file and I really don't want that"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "6d99f24a-b085-4a98-9ccf-2d2c5690d126", "quote": "the shared props type can sit in its own small file too"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/graphs/activeShapeProps.ts", "quote": "ActiveShapeProps"}], "reason": "The developer rejected a two-component file and asked for one file per component plus a separate shared props type file. This is a general rule, not a one-off rename, and extends NAME-103. The camelCase rule for non-component files was the agent's proposal, accepted by the developer ('the label, colors and dimensions files are fine as you have them') and consistent with existing helper files. Scoped to app:actual because only this application's repo is evidenced.", "agent": "conventions-maintainer"}, {"target": "core/naming-conventions.md", "fact_id": "NAME-105", "op": "ADD", "text": "| NAME-105 | Start every commit message and pull request title with the `[AI]` prefix, for example `[AI] Add a Quarterly interval to custom reports`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "239b2ae3-2fd0-484e-bb19-ebebe1e5f8ef", "quote": "the message needs the [AI] prefix, since we do that for every commit and PR title here"}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "2b41817d-fb42-420b-8b99-81c980a94517", "quote": "start the message with [AI] like the rest of the history"}], "reason": "The developer stated this rule explicitly in two separate sessions and said it applies to every commit and PR title. No configuration enforcing it was inspected, so it rests on developer statements only. It is a naming rule for commit and PR titles, so it fits this document; scoped to app:actual.", "agent": "conventions-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-101", "op": "ADD", "text": "| PIT-101 | Scaling a stored amount by the currency's `decimalPlaces` (for example in `useFormat`, `amountToInteger`, or a goal or template helper), or passing `decimalPlaces` as a storage scale. | Zero-decimal currencies such as yen are read at different scales on different screens: a 1,500 yen budget showed as 15 on one screen and 150,000 on another. | Stored amounts are always the value times 100 for every currency, yen included (1,500 yen is `150000`). Use `amountToInteger` and `integerToAmount` (fixed 100) and use `decimalPlaces` only for display, such as fraction digits and input formatting. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included. 1500 yen is 150000 in the db"}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display"}, {"kind": "source", "path": "packages/loot-core/src/shared/util.ts", "line": 539, "quote": "return Math.round(amount * 100);"}], "reason": "The developer stated the failure (the yen report), the decision (option A, display-only decimals), and the rule. Source at head has fixed-100 helpers with no decimalPlaces parameter. The remedy is adopted by the code, not just claimed by the agent. This also contradicts baseline TERM-102, which is the terminology maintainer's handoff.", "agent": "pitfalls-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-102", "op": "ADD", "text": "| PIT-102 | Editing a report range with `validateEnd` in `reportRanges.ts` (or similar code) by comparing the stored full-date From (`2026-07-01`) with the raw To pick key (`2026-07`, `2026-Q`-style month key, or a bare year) as strings. | The longer string sorts later, so a To in the same month, quarter or year as From was treated as a reversed range and the From was replaced by the fallback. This affected Monthly, Quarterly and Yearly. | Compare against the normalized end date of the picked period (`dateEnd`, such as `2026-09-30`) before deciding the range is reversed. The Yearly branch builds its end by appending `-12-31` and assumes To is a bare four-digit year. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "e54dbbc6-f221-45f3-ac39-b0a483796e71", "quote": "compared the stored From date (`'2026-07-01'`) with the raw To pick (`'2026-07'`)"}, {"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "388f0e98-3ec0-4040-9ec8-5ce1a29631e4", "quote": "all failed on the old code and passed again once I restored the fix"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 99, "quote": "Compare against the normalized end: `start` is a full date while `end` may"}], "reason": "The failure was reported by the developer, explained, and shown by stash-reverting the fix. Source at head compares `start > dateEnd` with a comment explaining why. Wording was tightened: the sweeper's '2026-Q' example is not a real key, so I removed it. I should fix the text on write: use 'a bare month or year key'.  Same-quarter picks were previously left alone for Monthly in session f57650bf but the developer later asked for the fix (session b44d114c), so the later message wins.", "agent": "pitfalls-maintainer"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-003", "op": "ADD", "text": "| BANKSYNC-003 | Bank sync provider modules and the sync server's other outbound HTTP code (SimpleFIN, GoCardless, Enable Banking, the CORS proxy, and `scripts/health-check.ts`) import `fetch` from `undici` and do not use Node's global `fetch`. SimpleFIN passes an undici `Agent` built by `createSsrfDispatcher` (`util/ssrf.ts`) as the `dispatcher`, and Node's built-in fetch bundles a different undici version, so mixing the two is fragile. This is a developer-stated rule that lint does not enforce, and the developer did not want another HTTP library such as axios or node-fetch. Tests mock the `undici` module (`vi.mock('undici', ...)`) instead of stubbing global `fetch`. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "fe370a12-46b9-470c-8115-39752c432913", "quote": "server code imports fetch from undici explicitly and never relies on the global one"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "I don't want another HTTP library on the server"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/app-gocardless/services/gocardless-api.ts", "line": 2, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/app-enablebanking/services/enablebanking-service.ts", "line": 2, "quote": "import { fetch } from 'undici';"}], "reason": "The developer stated the rule and the code adopted it at every call site I checked. I read the simplefin, gocardless and enablebanking imports at head; the CORS proxy and health-check imports are from the agent's grep and the file list. The suspected link to the SimpleFIN outage was never reproduced, so it is not stated as the cause.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-004", "op": "ADD", "text": "| BANKSYNC-004 | `app-simplefin/integration.test.ts` runs the real SimpleFIN module through the real undici `fetch` and the real SSRF dispatcher against a local HTTP server bound with `listen(0, '127.0.0.1')`, so the port is OS-assigned and never hard-coded. The server is allowed through the `simplefinAllowedNetworks` setting, and teardown calls `closeAllConnections()`. SimpleFIN requests have no timeout of their own (undici's default header timeout is 300 seconds), and the developer deferred adding one. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 45, "quote": "server.listen(0, '127.0.0.1');"}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "line": 19, "quote": "name === 'simplefinAllowedNetworks' ? allowedNetworks : get(name)"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "2c0ff959-c6c0-45f2-8c86-41040b54c3bf", "quote": "The SimpleFIN timeout is a separate thing and I'd rather not widen this change"}], "reason": "The test setup is confirmed in source. The no-timeout fact comes from the agent's reading, and the developer accepted deferring it, so it is recorded as a known gap and not as a decision to omit timeouts.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-002", "op": "UPDATE", "text": "| RECHARTS-002 | Custom report settings such as the interval and its defaults are defined in `components/reports/ReportOptions.ts`. The intervals are Daily, Weekly, Monthly, Quarterly and Yearly. Quarterly is rolled up client-side: `makeQuery.ts` queries by month and `spreadsheets/fetchSpreadsheetQueryData.ts` re-keys monthly rows to the quarter's first month (Q3 2026 is `2026-07`, labelled `Q3 '26`), so there is no AQL `$quarter`. Each date range preset has a `Quarterly` flag, off for presets shorter than a quarter. NetWorth, BalanceForecast and Spending do not support Quarterly. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "client-side rollup sounds right, same as weekly. no aql changes."}, {"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "use the first month so q3 2026 is 2026-07, and label it Q3 '26"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/ReportOptions.ts", "line": 285, "quote": "key: 'Quarterly',"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/spreadsheets/fetchSpreadsheetQueryData.ts", "line": 93, "quote": "if (interval !== 'Quarterly') {"}], "reason": "The existing row lists the interval settings but not Quarterly. Developer-accepted decision, verified in source at head. Also extends core TERM-106, which is owned by the terminology maintainer; this row stays tool-scoped.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-003", "op": "ADD", "text": "| RECHARTS-003 | The donut graph is split by responsibility. `DonutGraph.tsx` keeps `ClickablePieItem`, the props type and the component. `ActiveShapeMobile.tsx` and `ActiveShapeDesktop.tsx` are one component per file, sharing the `ActiveShapeProps` type from `activeShapeProps.ts`. `donutColors.ts` exports `buildColorMap`, `donutDimensions.ts` holds `getDonutDimensions` and `donutLabel.ts` holds `customLabel`. Each of the files that needs `RADIAN` defines it locally rather than in a shared constants file. Recharts' `PieLabelRenderProps` has optional fields, so `customLabel` casts it to a local type with those fields required. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "6d99f24a-b085-4a98-9ccf-2d2c5690d126", "quote": "each of those shapes is a component, own file please, mobile and desktop separate"}, {"kind": "conversation", "session": "d34fc234-ffeb-4f49-b9b7-9037b2a87b69", "message": "6d99f24a-b085-4a98-9ccf-2d2c5690d126", "quote": "keeping RADIAN local is fine"}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/graphs/donutLabel.ts", "line": 20, "quote": "export const customLabel = (labelProps: PieLabelRenderProps) => {"}], "reason": "Developer-accepted structure, and all files exist at head. Naming parts (one component per file) overlap with core NAME-103, which belongs to the conventions maintainer; this row records only the donut layout.", "agent": "tool-maintainer:recharts"}, {"target": "tools/recharts/README.md", "fact_id": "RECHARTS-004", "op": "ADD", "text": "| RECHARTS-004 | Report range validators in `reportRanges.ts` (`validateStart`, `validateEnd`) must compare normalized end dates, not raw picker keys. Comparing a stored full From date (`2026-07-01`) with a short To key (`2026-07`) as strings made a To in the same month, quarter or year as From look reversed and replaced the range with the fallback. `validateEnd` now builds the end date first (month end, quarter end or `yyyy-12-31`) and then compares. The validators are called only from the From/To selects in `ReportSidebar.tsx`; loading a saved report does not call them. For Quarterly, an invalid range falls back to four whole quarters. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "e54dbbc6-f221-45f3-ac39-b0a483796e71", "quote": "compared the stored From date (`'2026-07-01'`) with the raw To pick (`'2026-07'`)"}, {"kind": "conversation", "session": "b44d114c-d4b7-4694-95b1-228bb7dd60bd", "message": "97cd165a-eaff-4a8b-a75b-6a6b78ef066e", "quote": "Saved reports can't hand that branch a full date."}, {"kind": "source", "path": "packages/desktop-client/src/components/reports/reportRanges.ts", "line": 101, "quote": "if (start > dateEnd) {"}], "reason": "Confirmed bug with regression tests, accepted fix (the developer agreed that comparing real computed dates is right). Verified in source at head. The pitfall wording itself is a candidate for core pitfalls owned by the pitfalls maintainer.", "agent": "tool-maintainer:recharts"}], "deferred": [], "rejected": [{"target": "core/pitfalls.md", "fact_id": null, "op": "NEEDS_REVIEW", "text": "Candidate (not admitted): In `packages/sync-server`, passing an undici `Agent` as `dispatcher` to Node's global `fetch` mixes two undici versions and may break SimpleFIN sync; import `fetch` from `undici` instead.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "be2af540-6678-4141-aaad-179bc8c5f7a6", "quote": "This is my best guess. I haven't reproduced the user's failure."}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}], "reason": "The remedy is adopted in source (all call sites import fetch from undici) and the developer stated the rule. The failure itself is an unreproduced hypothesis from the agent, and the user's SimpleFIN breakage has no confirmed cause. A pitfall needs an observed consequence, so defer it. It may fit better as a stack standard or a bank-sync fact.", "agent": "pitfalls-maintainer", "rejected_because": "message be2af540-6678-4141-aaad-179bc8c5f7a6 is not in session 70d ns": 892526, "cacheCreationInputTokens": 167262}, "accepted": [{"target": "core/terminology.md", "fact_id": "TERM-102", "op": "UPDATE", "text": "| TERM-102 | Amount | A currency amount stored as an integer without decimal places. It is always the value times 100 for every currency, including zero-decimal currencies: 1,500 yen is stored as 150000. A currency's `decimalPlaces` affects display and input only, never the stored scale. | app:actual |", "scope": "app:actual", "reason": "The developer decided the stored scale is always x100 and decimals are display only. This contradicts the current wording that the multiplier depends on the currency's decimal places. The diff removes decimalPlaces scale arguments from the amount helpers and their callers, and an updated test states yen is stored x100.", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included. 1500 yen is 150000 in the db."}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display."}, {"kind": "diff", "path": "packages/desktop-client/src/components/budget/util.test.ts", "quote": "Yen is stored x100 like every currency: 1,500 yen is 150000."}], "agent": "terminology-maintainer"}, {"target": "core/terminology.md", "fact_id": "TERM-106", "op": "UPDATE", "text": "| TERM-106 | Custom report interval | The grouping period of a custom report: Daily, Weekly, Monthly, Quarterly, or Yearly. Monthly is the default. A quarter is keyed by its first month (Q3 2026 is `2026-07`) and labeled like Q3 '26. Quarterly rolls up monthly data on the client with no AQL change. NetWorth, BalanceForecast and Spending reports do not support it yet. | app:actual |", "scope": "app:actual", "reason": "Quarterly was added as an interval option. The developer approved the client-side rollup and the first-month quarter key with the Q3 '26 label, and told the agent to skip the NetWorth, forecast and spending reports for now. The diff adds the Quarterly option with format QQQ ''yy.", "evidence": [{"kind": "conversation", "session": "f57650bf-521a-4bd3-832c-4da4852a658e", "message": "4cf9a7e0-1937-444a-949e-5894db41ae31", "quote": "use the first month so q3 2026 is 2026-07, and label it Q3 '26"}, {"kind": "diff", "path": "packages/desktop-client/src/components/reports/ReportOptions.ts", "quote": "key: 'Quarterly',"}], "agent": "terminology-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-105", "op": "UPDATE", "text": "Report graphs are built with Recharts. The \"Download Snapshot\" action on reports captures the report with snapdom (`@zumer/snapdom`, `snapdom.toPng`), which replaced html-to-image because the old capture silently failed in Firefox.", "scope": "app:actual", "evidence": [{"kind": "diff", "path": "packages/desktop-client/src/components/reports/reports/CustomReport.tsx", "quote": "const image = await snapdom.toPng(reportElement);"}, {"kind": "diff", "path": "upcoming-release-notes/fix-report-snapshot-firefox.md", "quote": "by replacing html-to-image with snapdom"}, {"kind": "diff", "path": "packages/desktop-client/package.json", "quote": "\"@zumer/snapdom\": \"^3.7.0\""}], "reason": "The pushed diff swaps the import and the toPng call in the snapshot code, so the baseline wording naming html-to-image is stale. Note: the head desktop-client package.json still lists html-to-image at line 190 (the lockfile entry was removed), likely a leftover, but the code no longer uses it.", "agent": "stack-maintainer"}, {"target": "core/tech-stack-standards.md", "fact_id": "STACK-104", "op": "UPDATE", "text": "The sync server runs on Express 5 and Node 22.19.0 or newer (`\"node\": \">=22.19.0\"` in its package manifest). It uses undici's fetch throughout (including SimpleFIN bank sync) rather than mixing Node's built-in fetch with an undici dispatcher. It is mostly JavaScript and moving to TypeScript.", "scope": "app:actual", "evidence": [{"kind": "diff", "path": "packages/sync-server/package.json", "quote": "\"node\": \">=22.19.0\""}, {"kind": "diff", "path": "upcoming-release-notes/sync-server-use-undici-fetch.md", "quote": "Use undici's fetch throughout the sync server"}], "reason": "Engines floor was raised from >=22 to >=22.19.0 in the diff, and the release note records the undici fetch convention. No developer conversation was needed since both are verified in source; the undici statement is implementation, not a stated policy, so it is worded descriptively.", "agent": "stack-maintainer"}, {"target": "core/pitfalls.md", "fact_id": "PIT-001", "op": "ADD", "text": "| PIT-001 | Code scales a stored amount using the active currency's `decimalPlaces` (for example `useFormat` or a currency-aware helper in `loot-core/src/shared/util.ts`), instead of the fixed x100 scale. | Zero-decimal currencies such as JPY and KRW get a different stored scale depending on which code path wrote the value. A value saved as `1500` through one path shows as `15` through a default-2 path, and `150000` from the default path shows as `150,000` through the currency-aware one. | Store every amount at x100 for all currencies (1500 yen is `150000` in the database). Use `decimalPlaces` only for display and input formatting, never to convert to or from stored integers. Use `amountToInteger` and `integerToAmount`. No data migration is needed because existing data is already x100. | app:actual |", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "d208a293-ba9d-4d21-bb27-8001a9983cc5", "quote": "storage is always x100, yen included. 1500 yen is 150000 in the db."}, {"kind": "conversation", "session": "de720aee-7716-4ecb-ba17-3a38c00ee07e", "message": "eb04ddcb-065d-465b-b2c5-93cc1726eaf9", "quote": "we should never use the currency decimals to scale what we store, only for display."}, {"kind": "source", "path": "packages/desktop-client/src/hooks/useFormat.ts", "line": 216, "quote": "const fromAmount = useCallback((value: number) => amountToInteger(value), []);"}], "reason": "Developer stated the rule and the failure (mixed scales for JPY users) was diagnosed in session. Head source uses amountToInteger in useFormat, so the remedy is implemented. Both failure and remedy are supported.", "agent": "pitfalls-maintainer"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-003", "op": "ADD", "text": "Bank sync provider modules and other sync server code import `fetch` explicitly from `undici` and never rely on Node's global `fetch`. SimpleFIN passes an undici `Agent` (the SSRF dispatcher from `util/ssrf.ts`) as `dispatcher`, and that Agent only works reliably with the same installed undici's `fetch`, not Node's bundled one. Tests therefore mock `undici` (`vi.mock('undici', ...)` with `fetch: vi.fn()`) instead of stubbing `global.fetch`. No other HTTP library (axios, node-fetch) is to be added to the server. The convention is not lint-enforced.", "scope": "app:actual", "evidence": [{"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "aeb3ca2c-cd97-49d0-8c21-cb2687b48a96", "quote": "I don't want another HTTP library on the server, and undici is what Node ships anyway."}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "827edee9-1e22-4b8f-91c3-3d5fa1037f9b", "quote": "I can't enforce it either, since a new bare `fetch(` would still lint clean."}, {"kind": "source", "path": "packages/sync-server/src/app-simplefin/app-simplefin.js", "line": 3, "quote": "import { fetch } from 'undici';"}, {"kind": "source", "path": "packages/sync-server/src/util/ssrf.ts", "line": 5, "quote": "import { Agent } from 'undici';"}, {"kind": "diff", "path": "packages/sync-server/src/app-gocardless/services/gocardless-api.ts", "quote": "+import { fetch } from 'undici';"}], "reason": "Developer decided to move all sync server fetch calls to undici and rejected other HTTP libraries; source at head confirms imports in SimpleFIN, GoCardless, Enable Banking, cors proxy and health-check. The developer asked whether it is 'the rule' and the agent noted it was not written down; the developer proceeded and kept it, so it is recorded as an app-scoped convention. Root cause of the user's SimpleFIN failure is unconfirmed (agent's best guess), so no causal claim is stored.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-004", "op": "ADD", "text": "SimpleFIN has a no-mock integration test (`app-simplefin/integration.test.ts`) that runs the real handlers against a local HTTP server on `127.0.0.1` with a port chosen by the OS (`listen(0)`), real undici `fetch` and the real SSRF dispatcher. Only `#load-config` is mocked, to allow `127.0.0.0/8` through `simplefinAllowedNetworks`. Teardown calls `server.closeAllConnections()` before `close()` so a stalled request cannot hang `afterAll`. SimpleFIN requests have no timeout of their own, so a bridge that never replies is bounded only by undici's default (about 300 seconds); in tests Vitest's 5 second default applies. The developer chose not to add a SimpleFIN timeout in this change.", "scope": "app:actual", "evidence": [{"kind": "diff", "path": "packages/sync-server/src/app-simplefin/integration.test.ts", "quote": "server.listen(0, '127.0.0.1');"}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "2c0ff959-c6c0-45f2-8c86-41040b54c3bf", "quote": "5 seconds is fine, I won't ask for an extra timeout."}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "a48fd694-1203-40d3-9213-a24461ec1c11", "quote": "`app-simplefin.js` sets no request timeout of its own"}], "reason": "Reusable testing pattern and a known accepted limitation (no SimpleFIN timeout) confirmed by the developer and present in the diff.", "agent": "tool-maintainer:bank-sync"}, {"target": "tools/bank-sync/README.md", "fact_id": "BANKSYNC-005", "op": "ADD", "text": "The sync server package declares `engines.node` as `>=22.19.0`, deliberately higher than the root `package.json` (`>=22.18.0`) and than `packages/api` and `packages/cli` (`>=22`). The developer chose to keep different floors and the specific reason for 22.19.0 was not recorded.", "scope": "app:actual", "evidence": [{"kind": "diff", "path": "packages/sync-server/package.json", "quote": "+    \"node\": \">=22.19.0\""}, {"kind": "conversation", "session": "70de19bb-341e-4ca0-a42f-f4262eb59326", "message": "56238ec1-3d78-4ec3-9516-6ffe31efe243", "quote": "please keep it at >=22.19.0 and don't revert it"}], "reason": "Developer explicitly overrode the agent's suggestion to revert. Rationale unknown, so the entry states only the decision. Lower confidence on relevance to bank-sync specifically.", "agent": "tool-maintainer:bank-sync"}], "deferred": [], "rejected": [], "no_change": 2, "failures": []}, "a-haiku": {"wall_seconds": 470.0, "exit_code": 0, "ok": true, "cost": 0.9050412400000001, "duration_s": 675.883, "agents": [{"label": "sweeper", "status": "success", "cost": 0.29393603, "turns": 40, "ms": 249851, "inputTokens": 2227, "outputTokens": 51195, "cacheReadInputTokens": 1399971, "cacheCreationInputTokens": 166159}, {"label": "terminology-maintainer", "status": "success", "cost": 0.06591854999999996, "turns": 4, "ms": 25313, "inputTokens": 4, "outputTokens": 5259, "cacheReadInputTokens": 373641, "cacheCreationInputTokens": 34087}, {"label": "conventions-maintainer", "status": "success", "cost": 0.07685375000000005, "turns": 6, "ms": 39995, "inputTokens": 4, "outputTokens": 8459, "cacheReadInputTokens": 373585, "cacheCreationInputTokens": 37025}, {"label": "stack-maintainer", "status": "success", "cost": 0.07739170000000001, "turns": 6, "ms": 44250, "inputTokens": 4, "output
