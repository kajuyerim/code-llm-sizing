[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextops"
version = "0.1.0"
description = "Local sweeper-first maintenance of an external shared-knowledge checkout"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk==0.2.170", "PyYAML>=6,<7", "jsonschema>=4.20,<5"]

[project.scripts]
contextops = "contextops.cli:main"

[tool.setuptools]
packages = ["contextops"]
