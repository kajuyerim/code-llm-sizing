[project]
name = "contextops"
version = "0.1.0"
description = "Pre-push knowledge maintenance: sweeps the pushed diff, the developer-agent conversation and memory, and proposes shared-knowledge updates."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1",
    "pyyaml>=6",
]

[project.scripts]
contextops = "contextops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contextops"]
